name: Deploy rp10
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy rp10
        run: |
          unzip -o site-rp10.zip
          rm site-rp10.zip
          rm .github/workflows/deploy-rp10.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy rp10: remove pink text, neutral text with pink/purple fills (build 20261024-rp10)"
          git push
