name: Deploy rp12
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy rp12
        run: |
          unzip -o site-rp12.zip
          rm site-rp12.zip
          rm .github/workflows/deploy-rp12.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy rp12: photo frames black/white matte, no purple fill (build 20261024-rp12)"
          git push
