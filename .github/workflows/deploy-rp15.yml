name: deploy-rp15
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy rp15 site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          unzip -o site-rp15.zip -d .
          rm site-rp15.zip
          git add -A
          git commit -m "Deploy rp15: Sommère bottle photo"
          git push
      - name: Remove one-off deploy workflow
        run: |
          rm .github/workflows/deploy-rp15.yml
          git add -A
          git commit -m "Remove one-off deploy workflow"
          git push
