name: Deploy rp16

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Unzip site
        run: |
          unzip -o site-dist-rp16.zip
          rm site-dist-rp16.zip
          rm .github/workflows/deploy-rp16.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy rp16" || echo "Nothing to commit"
          git push
