name: Deploy rp18

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Unzip the site archive
        run: |
          unzip -o site-rp18.zip
          rm site-rp18.zip
          rm .github/workflows/deploy-rp18.yml

      - name: Commit and push the deployed site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy rp18 (20261117-rp18)" || echo "No changes to commit"
          git push
