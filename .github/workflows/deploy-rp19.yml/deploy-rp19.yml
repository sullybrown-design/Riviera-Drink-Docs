name: Deploy rp19
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Unzip rp19 site and commit
        run: |
          unzip -o site-rp19.zip
          rm -f site-rp19.zip
          rm -f .github/workflows/deploy-rp19.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy rp19 (20261118-rp19)"
          git push
