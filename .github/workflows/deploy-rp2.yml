name: deploy-rp2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip build and commit
        run: |
          unzip -o site-rp2.zip -d .
          rm site-rp2.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Deploy rp2 follow-up build" || echo "no changes to commit"
          rm -f .github/workflows/deploy-rp2.yml
          git add -A
          git commit -m "Remove one-off deploy workflow" || echo "nothing to remove"
          git push
