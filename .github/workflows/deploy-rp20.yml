name: Deploy rp20

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site and deploy
        run: |
          unzip -o site-rp20.zip
          rm site-rp20.zip
          rm .github/workflows/deploy-rp20.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy rp20 (20261118-rp20)"
          git push
