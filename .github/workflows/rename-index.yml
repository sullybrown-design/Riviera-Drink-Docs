name: Rename index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm index.html
          mv index-inlined.html index.html
          rm .github/workflows/rename-index.yml
          git add -A
          git commit -m "Riviera rename + logo, wine sync, cognacs & grappas, global search"
          git push
