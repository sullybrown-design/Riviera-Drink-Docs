name: Rename index-inlined.html to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Rename file and commit
        run: |
          git mv index-inlined.html index.html
          git config user.name "sullybrown-design"
          git config user.email "sullybrown-design@users.noreply.github.com"
          git commit -m "Rename index-inlined.html to index.html"
          git push origin main
