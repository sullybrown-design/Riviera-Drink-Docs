name: Rename inlined to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv -f index-inlined.html index.html
          git commit -m "Riviera update: quiz removed, By the Glass first, Chenin BTG fix + 12 new photos, wine numbering corrected"
          git push
