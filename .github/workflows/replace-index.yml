name: Replace index.html
on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL of the replacement index.html'
        required: true
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download replacement index.html
        run: |
          curl -sSL "${{ inputs.file_url }}" -o index.html
          ls -la index.html
          SIZE=$(stat -c%s index.html)
          echo "Downloaded size: $SIZE"
          test "$SIZE" -gt 10000000
      - name: Commit replacement
        run: |
          git config user.name "sullybrown-design"
          git config user.email "sullybrown-design@users.noreply.github.com"
          git add index.html
          git commit -m "Wine and digestif pairings for food dishes"
          git push
