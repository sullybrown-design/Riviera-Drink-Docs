akes a separate 'Isola del Giglio' bottling under the same Casamatta Bianco name. The fruit is hand-harvested with bunch selection in the vineyard and again in the cellar, soft-pressed with dry ice to protect the aromatics, then fermented in stainless steel for about two weeks at low temperatures to preserve freshness. A short steel ageing follows, then bottling — no oak, no artifice, a deliberately easy-drinking white the winemaker says carries the sea breeze of the Maremma.","pairings":"Grilled fish, shrimp scampi, seafood pasta, antipasti, soups, salads and soft cheeses.","producer_note":"Bibi Graetz is one of Tuscany's most distinctive winemakers — a graduate of Florence's Academy of Fine Arts and a working abstract artist who began making wine in the late 1990s with no formal training, from the family home, a medieval castle above Florence in Fiesole. He paints every label himself. Focusing on native Tuscan varieties, he built a cult reputation with Testamatta and Colore; Casamatta ('crazy house') is the playful entry tier: joyful, affordable wines from younger vineyards.","photo_credit":"Photo: Beccafico (pictured label is the Isola del Giglio 2023 bottling, not the coastal Maremma cuvée)","has_photo":true,"also_in":[]},{"id":36,"number":"08","section":"White — Italy & Spain","subsection":null,"title":"Fiano 'Kratos' — Luigi Maffini, Campania 2024","price":"Bottle $120 (Riviera)","menu_note":"","region":"Cilento DOC, Campania, Italy","grape":"100% Fiano","producer":"Luigi Maffini","style":"Textured coastal white, organic, aged in steel","alcohol":"13%","body":4,"body_label":"Medium-full","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"exotic fruit, kiwi, honey, almonds, hazelnuts, linden, starfruit, saline limestone minerality, long savoury finish","story":"The Maffini vineyards sit on the coastal hills of Cilento, sloping toward the Tyrrhenian Sea, on alkaline sea-derived soils of clay, marl and limestone. To keep freshness in this warm climate the grapes are hand-picked early — from late August — which is unusual for the late-ripening Fiano. They are soft-pressed and fermented in stainless steel, then aged four months in steel with no oak. The estate is certified organic, and the result is pure and textured: ripe orchard fruit over a saline, limestone minerality with the nutty note Fiano is known for.","pairings":"Smoked salmon, shellfish, fried fish, grilled sea bass, seafood risotto, burrata with olive oil and sea salt, hard cheeses.","producer_note":"Luigi Maffini and his wife Raffaella run a family estate on the hills of Cilento; they met at enology school and set out to build a sustainable winery working only with Campania's indigenous grapes. Luigi's father planted the family's first vineyard in 1970; the couple expanded it to about 15 hectares and bottled the first Kratos — from the Greek word for 'strength' — in 1996 with the noted Campanian oenologist Luigi Moio.","photo_credit":"Photo: Vinodalproduttore (source photo from an earlier vintage listing)","has_photo":true,"also_in":[]},{"id":37,"number":"09","section":"White — Italy & Spain","subsection":null,"title":"Pinot Grigio 'Katari' — Cordero San Giorgio, Oltrepò Pavese 2024","price":"As printed on the menu: PINOT GRIGIO, 'KATARI' CORDERO SAN GIORGIO, OLTREPO-PAVESE, ITALY (2024)","menu_note":"Bottle $120 (Riviera)","region":"Oltrepò Pavese DOC, Lombardy, Italy","grape":"100% Pinot Grigio","producer":"Cordero San Giorgio","style":"Precise, floral, steel-only Pinot Grigio; no malolactic","alcohol":"around 12%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"pear, apple, jasmine, fresh florals, crisp dry palate, marked acidity, pleasant lingering finish","story":"The Oltrepò Pavese is one of the few Italian zones where Pinot Grigio is taken seriously as a quality grape; at about 400 metres above sea level in Rocca de' Giorgi it keeps the acidity and aromatics the variety needs. After hand harvest the grapes are softly pressed and fermented at low, controlled temperatures in stainless steel. The estate deliberately skips malolactic fermentation — the second fermentation that would soften the wine's acidity — so the freshness is protected. It then rests six months on its fine lees and two more months in bottle before release. No oak, organic practices, a pure modern Pinot Grigio.","pairings":"As an aperitivo; with fish appetizers, poultry and white meats, salads, light and pureed soups, fish-based first courses.","producer_note":"Cordero San Giorgio is a new beginning in the Oltrepò Pavese for three siblings — Francesco, Lorenzo and Caterina Cordero — who grew up around the vines of the legendary Vietti estate in Barolo. They are the grandchildren of Luciana Vietti and Alfredo Currado, pioneers of Barolo's single-vineyard crus, and their father Mario Cordero co-owned Vietti until 2016. 'Katari' is the name of a mythological dragon in the Aymara tradition — the dragon to the estate's St George.","photo_credit":"Photo: Baetens Vinopolis","has_photo":true,"also_in":[]},{"id":38,"number":"10","section":"White — Italy & Spain","subsection":null,"title":"Arneis — Vietti, Roero 2024","price":"Bottle $120 (Riviera)","menu_note":"","region":"Roero Arneis DOCG, Piedmont, Italy","grape":"100% Arneis","producer":"Vietti","style":"Dry, floral, medium-bodied white, steel-fermented and lees-aged","alcohol":"13.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"fresh floral notes, citrus, melon, white peach, tarragon, almond edge, mineral, saline finish","story":"Vietti picks the Arneis by hand from vineyards in Santo Stefano Roero where the vines average about 31 years old. The fruit is destemmed and gently pressed, then fermented very slowly in stainless steel. Halfway through fermentation the tank is sealed so a little of the fermentation's own natural CO2 stays in the wine, and the wine skips malolactic fermentation entirely — that second fermentation would soften the acidity, which the estate deliberately keeps bright. It then rests on its fine lees in steel until bottling, adding texture without any oak flavour.","pairings":"As an aperitif, with raw fish and simply prepared seafood, salads, light meats and creamy cheeses.","producer_note":"Vietti was founded in the late 1800s by Carlo Vietti at Castiglione Falletto in the Langhe. In 1967 Alfredo Currado made one of the first single-varietal Arneis bottlings, a turning point that helped rescue the grape — sometimes called 'Barolo bianco' — from near disappearance. The Krause family bought the winery in 2016, and Vinous named Vietti its Winery of the Year in 2022.","photo_credit":"Photo: Licata","has_photo":true,"also_in":[]},{"id":39,"number":"11","section":"White — Italy & Spain","subsection":null,"title":"Malvasia de Sitges 'Blau Cru' — Celler Pardas, Penedès 2021","price":"Bottle $125 (Riviera)","menu_note":"","region":"Penedès DO, Catalonia, Spain","grape":"100% Malvasia de Sitges","producer":"Celler Pardas","style":"Floral, saline Mediterranean white; steel, lees-aged, never clarified","alcohol":"13%","body":3,"body_label":"Medium","acidity":5,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"white flowers, peach, citrus, ripe stone fruit, marked salinity, firm acidity, long finish","story":"Malvasia de Sitges is an ancient, fiercely acidic Mediterranean variety — the winery calls it the 'Riesling of the Mediterranean' — that traditionally grew on the Garraf coast. In 2007 Pardas took cuttings from Garraf vines and grafted them at its inland Can Comas estate, to see if this coastal grape could carry the estate's mineral soils. The first monovarietal Blau Cru followed in 2014. For the 2021, the destemmed grapes got a brief 6–7-hour soak on their skins before pressing, then fermented at a cool 16°C with their own wild yeasts in stainless steel. The wine rested nine months on its lees, stirred every 15 days, with no oak, no clarifying and nothing added to correct it. 2021 was a hot vintage and only 7,533 bottles were made.","pairings":"Sushi, crudo, Mediterranean raw fish and shellfish, grilled white fish with citrus, blue cheese, risottos and vegetable antipasti.","producer_note":"Celler Pardas was founded in 1996 by oenologist Ramon Parera and agronomist Jordi Arnan, who bought the abandoned Can Comas estate and rebuilt it around the native grapes of the Penedès. Their rule: 'We only produce what we have personally grown at our vineyard.' Farming is organic and biodynamic with no herbicides or tilling, and the estate is cited as a leader of the Penedès native-variety revival.","photo_credit":"Photo: Per Tu (Vinspertu)","has_photo":true,"also_in":[]},{"id":40,"number":"12","section":"White — Italy & Spain","subsection":null,"title":"Timorasso 'Derthona' — Viberti, Colli Tortonesi 2023","price":"Bottle $130 (Riviera)","menu_note":"","region":"Colli Tortonesi DOC, Piedmont, Italy","grape":"100% Timorasso","producer":"Viberti Giovanni","style":"Structured, lees-aged white built for the table and the cellar","alcohol":"13%","body":4,"body_label":"Medium-full","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"peach, acacia and hawthorn blossom, mineral, savoury structured palate, flinty development with age","story":"Timorasso was the leading white grape of the Tortona hills in the Middle Ages, nearly extinct by the 1980s, and brought back by growers Walter Massa and Andrea Mutti — the trade nickname is 'White Barolo.' 'Derthona' is the ancient Roman name for Tortona, and producers use it to signal the wine's territorial identity. Viberti's fruit comes from the Monleale vineyard at 420 metres on the blue 'Tortonian' marls. The hand-harvested grapes are pressed as whole clusters; the free-run juice ferments in steel, goes through full malolactic fermentation — the second fermentation that turns sharp apple-like acidity into a creamier texture — and ages on its lees for 10–12 months with weekly stirring. No new oak.","pairings":"Rich fish dishes, guinea fowl or rabbit tagliatelle, mushroom risotto, roast poultry with herbs, aged cheeses, even steak tartare.","producer_note":"Viberti Giovanni is a Barolo-based family estate, today in the hands of third-generation owner Claudio Viberti. While the family's reputation was built on Nebbiolo, it has joined the wave of Piedmont producers investing in Timorasso at Derthona, farming the Monleale vineyard sustainably at high elevation and treating the white with the same lees-ageing seriousness it gives its reds.","photo_credit":"Photo: Vinmonopolet (label shows the 2022 vintage)","has_photo":true,"also_in":[]},{"id":41,"number":"13","section":"White — Italy & Spain","subsection":null,"title":"Trebbiano+ 'Coenobium' — Monastero Suore Cistercensi, Lazio 2024","price":"As printed on the menu: TREBBIANO+ 'CISTERCENSI' COENOBIUM, LAZIO, ITALY (2024)","menu_note":"Bottle $130 (Riviera)","region":"Lazio IGT, Vitorchiano, Lazio, Italy","grape":"Trebbiano-led blend with Malvasia del Lazio and Verdicchio","producer":"Monastero Suore Cistercensi (Trappist nuns)","style":"Skin-contact orange wine; organic, fresh and approachable","alcohol":"around 11.5%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":1,"tannins_label":"Low","tasting_notes":"amber tint, citrus pith, white flowers, apple, pear, gentle tannic grip, savoury, dry appetising finish","story":"The menu's '+' denotes skin contact: this is an orange wine — a white wine fermented on its grape skins, like a red, which gives it the amber tint and a gentle tannic grip. Coenobium gets a shorter skin soak than its sibling Ruscum, making it the friendlier entry point to the style. The grapes are farmed organically and vinified traditionally under the direction of Giampiero Bea, one of central Italy's leading natural-wine voices. Menu note: the cuvée name 'Cistercensi' could not be verified — the bottle on the shelf will almost certainly read 'Coenobium.'","pairings":"Charcuterie, aged pecorino, roast chicken with herbs, mushroom dishes, anything with olive oil and garlic, pizza margherita.","producer_note":"The producer is a community of Cistercian nuns of the Strict Observance — the Trappist order — at Vitorchiano, Lazio: roughly eighty women who, following the Rule of St Benedict, work vineyards, orchards and gardens largely by hand. The monastery dates to 1957 and produces around 20,000 bottles a year across the range; Giampiero Bea has been the winemaking consultant since the early 2000s.","photo_credit":"Photo: Champion Wine Cellars","has_photo":true,"also_in":[]},{"id":42,"number":"14","section":"White — Italy & Spain","subsection":null,"title":"Zibibbo+ 'SP68' Bianco — Arianna Occhipinti, Sicily 2024","price":"Bottle $130 (Riviera)","menu_note":"","region":"Terre Siciliane IGT (Vittoria), Sicily, Italy","grape":"Zibibbo + Albanello blend (2024 proportions not published)","producer":"Arianna Occhipinti","style":"Skin-contact orange wine; concrete, unfiltered, organic/biodynamic","alcohol":"11–12%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":1,"tannins_label":"Low","tasting_notes":"Mediterranean herbs, white flowers, pink grapefruit, lychee, white peach, wet concrete, salty minerals, hint of ginger","story":"SP68 is named for the Strada Provinciale 68 — 'the name of a road, for a wine that is a journey' — the country road through Occhipinti's home vineyards. The menu's '+' denotes skin contact: the hand-harvested bunches are destemmed and left to ferment with their skins for about two weeks in concrete tanks, using only the grapes' own wild yeasts — that skin time is what makes it an orange wine, giving it colour, a touch of tannin and a savoury depth. It then ages six months in concrete plus a month in bottle, bottled unfiltered, with no temperature control, no fining and minimal sulphur. Deeply aromatic yet surprisingly light on the palate — the house tension of this wine.","pairings":"As an aperitif, with hors d'oeuvres, fresh cheeses, Sicilian-style seafood pasta, grilled prawns, crudo, herb-driven vegetable dishes and shrimp in tomato-based sauces.","producer_note":"Arianna Occhipinti, born 1982, studied viticulture and oenology in Milan and worked from age sixteen with her uncle Giusto Occhipinti at the celebrated COS estate; in 2004 she returned to Vittoria to start her own project from scratch. She works only native Sicilian varieties under biodynamic principles, ferments only with native yeasts in concrete, and never filters — widely described as one of the leading figures of Italy's natural-wine movement.","photo_credit":"Photo: Saporidoc (label shows 2024, as listed)","has_photo":true,"also_in":[]},{"id":43,"number":"15","section":"White — Italy & Spain","subsection":null,"title":"Palomino 'UBE Miraflores' — Bodegas Cota 45, Andalusia 2022","price":"As printed on the menu: PALOMINO, 'UBE MIRAFLORES' BODEGAS COTA 45, ANDALOUSIA, SPAIN (2022)","menu_note":"Bottle $130 (Riviera)","region":"Sanlúcar de Barrameda, Andalusia, Spain (Vino de España)","grape":"100% Palomino","producer":"Bodegas Cota 45","style":"Unfortified, flor-influenced table wine; saline and savoury","alcohol":"around 13%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"apricot, quince, baked apple, walnut, citrus, smoky savouriness, chalky minerality, super-saline finish","story":"This is a table wine made the way dry wines were made in Jerez in the 1800s — before the export trade demanded stronger, sweeter sherry. The Palomino comes from 35-to-110-year-old vines on albariza, the brilliant white chalk soil of the Jerez region, a few kilometres from the Atlantic. The hand-picked grapes are pressed as whole clusters straight into barrels as old as 150 years, where the juice ferments with wild yeasts and no temperature control. It then rests about nine months in those barrels while a thin veil of flor — a naturally occurring yeast layer — forms on the surface, lending a gentle, sherry-like savouriness at only 13% alcohol, with no fortification. It is bottled with just a soft filtration and a little sulphur, and the farming is organic. It is sold as Vino de España because the Jerez rules don't accommodate this low-alcohol, terroir-driven style.","pairings":"Jamón ibérico, boquerones, grilled prawns, ceviche, sushi, fried calamari and croquetas, aged Manchego, cheddar and Gruyère.","producer_note":"Bodegas Cota 45 was founded in 2012 by Ramiro Ibáñez, a Sanlúcar native, trained oenologist and former consultant to several major sherry houses, in a former boat repair shop in Sanlúcar de Barrameda. Steeped in the history books, he resolved to recreate the dry, lower-alcohol wines locals drank in the 19th century. The name refers to the 45-metre contour line where the best albariza soils are found.","photo_credit":"Photo: France44 (label shows the 2023 vintage)","has_photo":true,"also_in":[]},{"id":44,"number":"16","section":"White — Italy & Spain","subsection":null,"title":"Sauvignon Blanc 'Arbè' — Piero Busso, Langhe 2022","price":"As printed on the menu: SAUVIGNON BLANC, 'ARBE' PIERO BUSSO, LANGHE, ITALY (2022)","menu_note":"Bottle $150 (Riviera)","region":"Langhe DOC, Piedmont, Italy","grape":"100% Sauvignon Blanc","producer":"Piero Busso","style":"Unoaked, lees-aged; Piedmontese restraint over tropical exuberance","alcohol":"13–14%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"white peach, citrus pith, light herbs, white fruit, racy freshness, lively ripe flavour","story":"The grapes come from the estate's own 25-to-50-year-old vines at Neive, in the Barbaresco zone: northeast-facing, on limestone and clay, at an altitude that keeps the acidity bright in a region famous for reds. They are hand-harvested, pressed as whole clusters, and fermented with wild yeasts in stainless steel — no oak anywhere. The wine then ages a full year on its fine lees in tank, then six months in bottle, which gives it texture while the flavour stays clean. Menu note: the estate's spelling is 'Arbè' with the accent; the bottle on the shelf is the estate's one and only white in an otherwise all-red cellar.","pairings":"As an aperitif; with fresh ricotta and young cheeses, oysters, crudo, goat's cheese salads, lean fish, shellfish and asparagus.","producer_note":"Azienda Agricola Piero Busso was established in 1953 at Neive and remains a small family estate — Piero Busso with his wife Lucia and their children Emanuela and Pierguido follow every stage from vineyard to cellar. It is regarded as one of Barbaresco's most terroir-transparent producers, bottling single-cru Nebbiolos from Mondino, San Stunet, Gallina and Albesani.","photo_credit":"Photo: Il Quadrifoglio (source page lists the 2024 vintage)","has_photo":true,"also_in":[]},{"id":45,"number":"17","section":"White — Italy & Spain","subsection":null,"title":"Viura '5Y' — Abel Mendoza, Rioja 2022","price":"Bottle $150 (Riviera)","menu_note":"","region":"Rioja DOCa (San Vicente de la Sonsierra, Rioja Alta/Alavesa), Spain","grape":"100% Viura","producer":"Abel Mendoza","style":"Serious, barrel-fermented Viura; modern style against Rioja tradition","alcohol":"14–14.5%","body":4,"body_label":"Medium-full","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"floral, fruit, aniseed, white pepper, chalky minerality, stylish oak sweetness, balsamic, wild herbs, lingering finish","story":"Most Viura in Rioja goes into high-volume, neutral white wine; Mendoza's project is the opposite — a serious, ageworthy varietal expression. Each plot is harvested by hand at optimum ripeness; the fruit is sorted, pressed in a pneumatic press, settled a day in tank, then racked into new French oak barrels for fermentation — fermenting all his whites in new French oak is Mendoza's signature. After fermentation the wine stays in barrel 5–6 months on its lees, stirred every two to three days, before blending to tank and bottling. The estate farms organically with biodynamic preparations. Fun fact: around 1993 the Consejo Regulador refused Abel permission to plant more Viura, so he grafted Viura cuttings onto red rootstocks instead — and they simply let him keep the vines.","pairings":"Roast turbot, lobster with butter, mushroom risotto, aged Comté, complex salads, braised seafood and soft cheese.","producer_note":"Abel Mendoza Monge and his wife Maite Fernández have been making wine at San Vicente de la Sonsierra since 1988. Mendoza describes himself first as a farmer: every plot is tended and harvested independently and entirely by hand, and only indigenous Rioja varieties are planted. His style is deliberately modern — new French oak rather than old American oak, shorter élevage — so the wines express fruit and soil rather than cooperage.","photo_credit":"Photo: Vila Viniteca (label shows the 2019 vintage)","has_photo":true,"also_in":[]},{"id":46,"number":"18","section":"White — Italy & Spain","subsection":null,"title":"Chenin Blanc ‘Tor Solis’ — Villa Calcinaia (Conti Capponi), Toscana 2023","price":"As printed on the menu: CHENIN BLANC, ‘TOR SOLIS’ VILLA CALCINAIA, TOSCANA, ITALY (2023). Note: the bottle label reads ‘CONTI CAPPONI’ — it’s the family’s new ‘1524’ line, same estate.","menu_note":"Bottle $170 (Riviera)","region":"Toscana IGT, Greve in Chianti, Italy","grape":"100% Chenin Blanc (Podere Le Refie)","producer":"Villa Calcinaia / Conti Capponi (Greve in Chianti)","style":"Unoaked white — stainless-steel fermented, 3 months on lees, organic","alcohol":"~11.5%","body":2,"body_label":"Light","acidity":5,"acidity_label":"Very high","tannins":0,"tannins_label":"None","tasting_notes":"lime and citrus, white flowers, fine herbs, wet stone; firm, bright and savoury, with peach, almond and a touch of honey; long mineral finish. Give it some air.","story":"Chenin Blanc in Tuscany is genuinely unusual — this grape belongs to the Loire. But Villa Calcinaia, the Capponi family’s estate since 1524, planted international varieties on a high plot called Le Refie, and in 2025 they launched a whole new label for these experiments: ‘1524’, after the year the family arrived. ‘Tor Solis’ is their Chenin: picked by hand in early October up at 700 metres, fermented cool in steel, rested on its lees, no oak at all. As one Italian writer put it, it looks like it came from the Loire but speaks with a Tuscan accent — all citrus and stone, firm and savoury, the kind of white that makes raw fish sing.","pairings":"Grilled sea bass, sushi and sashimi, fritto misto, vegetable risotto, oysters and clams.","producer_note":"Historic estate near Greve in Chianti, home of the Counts Capponi since 1524 (37th generation today). ~200-hectare property with ~30 ha of certified-organic vineyard; Chianti Classico is the core, while the new ‘1524’ line explores international varieties outside the Chianti rules.","photo_credit":"Photo: Il Gusto / Conti Capponi press image.","has_photo":true,"also_in":[]},{"id":47,"number":"19","section":"White — Italy & Spain","subsection":null,"title":"Viña Tondonia Gran Reserva Blanco — R. López de Heredia, Rioja 2004","price":"As printed on the menu: VIURA+, 'VINA TONDONIA' R. LOPEZ DE HEREDIA, RIOJA GRAN RESERVA, SPAIN (2004)","menu_note":"Bottle $700 (Riviera)","region":"Rioja DOCa (Viña Tondonia, Rioja Alta), Spain","grape":"about 90% Viura, 10% Malvasía (the menu's 'Viura+' is imprecise)","producer":"R. López de Heredia Viña Tondonia","style":"Traditionally aged white: ten years in neutral American oak, then bottle age; made only in exceptional vintages","alcohol":"12.5%","body":5,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"butterscotch, waxed lemons, macadamia, saffron, honey, beeswax, white pepper, salty twist, finish of nearly a minute","story":"This is white Rioja made the 19th-century way. The wine fermented naturally in very old foudres (huge old oak casks), then spent ten full years in venerable, neutral American oak barrels — old enough that they impart no wood flavour, just slow oxygen — with additional time in oak vats before and after. It was bottled in November 2014 and held in the bodega's cellars until release, so this 2004 spent roughly a decade in wood and a further decade in bottle. The 2004 vintage was officially rated VERY GOOD, and the critics are unusually unanimous: 100 points from The Wine Advocate, 100 from Tim Atkin, 99 from James Suckling, 96 from Vinous.","pairings":"Aged Comté or Manchego, jamón ibérico, roasted nuts, wild mushroom risotto or truffle dishes, foie gras, lobster or turbot in beurre blanc. Serve cool rather than cold (12–14°C) and decant if possible.","producer_note":"R. López de Heredia Viña Tondonia is one of Rioja's historic family bodegas, still run by the family and still vinifying and ageing exactly as it did a century ago: very old oak, very long élevage, release only when the bodega judges the wine ready. Its Gran Reserva Blanco — made only in exceptional vintages — is arguably the world's most famous traditionally aged white wine.","photo_credit":"Photo: Saitta Vini (label shows Cosecha de 2004, as listed)","has_photo":true,"also_in":[]},{"id":48,"number":"20","section":"White — Italy & Spain","subsection":null,"title":"Ribolla Gialla+ 'Ribella' — Venchiarezza, Friuli 2024","price":"As printed on the menu: RIBOLLA GIALLA+, 'RIBELLA' VENCHIAREZZA, FRIULI VENEZIA GIULIA, ITALY (2024). The '+' signals the blend with Chardonnay.","menu_note":"By the glass · $20  /  Bottle $100 (Riviera)","region":"Friuli Venezia Giulia, Italy (IGT Venezia Giulia)","grape":"50/50 Ribolla Gialla + Chardonnay","producer":"Azienda Agricola Venchiarezza","style":"Stainless-steel blend, aged on lees","alcohol":"12%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"white flowers, white peach, citrus, mineral, savory, delicate","story":"'Ribella' is the estate's 'Glocal Blend': Ribolla Gialla, Friuli's own grape documented since the 1200s, married to Chardonnay for body. Each variety is harvested and fermented separately in stainless steel with native yeasts, then the wine rests on its fine lees until spring with weekly stirring — that's what gives this 12%-alcohol white its texture and savoury depth. Not to be confused with 'Ribella & la Bestia', the estate's separate sparkling wine.","pairings":"Sushi, seafood, shellfish, crudo, light pasta, vegetable dishes, fresh cheeses.","producer_note":"Azienda Agricola Venchiarezza is a Friulian estate working in an organic, low-intervention register — indigenous yeasts, minimal additives — and part of the generation reviving Ribolla Gialla from near-extinction.","photo_credit":"Photo: LQRS.","has_photo":true,"also_in":[32,156]},{"id":49,"number":"01","section":"White — Canada & Rest of World","subsection":null,"title":"'0 Ohm' White — Moritz Kissinger, Rheinhessen 2022","price":"As printed on the menu: PINOT BLANC+, 'OHM WHITE' MORITZ KISSINGER, RHEINHESSEN, GERMANY (2022) 90 — the wine is correctly spelled '0 Ohm'.","menu_note":"Bottle $90 (Riviera)","region":"Rheinhessen, Germany","grape":"Pinot Blanc + Chardonnay (brief skin contact)","producer":"Moritz Kissinger","style":"Natural-leaning, unfiltered, minimal sulfur","alcohol":"~11.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"saline, lemon pith, waxy citrus, herbs, yellow plum, flint, yeasty lees character","story":"'0 Ohm' is an electrical joke: zero resistance — the wine should meet no resistance on the palate. It's electric, high-acid and alive. The wine is a Pinot Blanc and Chardonnay blend with a few days of skin contact, fermented wild, aged ten months in old barrels then a month in steel, bottled unfiltered with barely any sulfur. The family farms organically with regenerative methods — cover crops, homemade compost, no tilling. Serve well chilled; it benefits from a little air.","pairings":"Fresh seafood, poultry, cheeses, fondue or hot-pot, pretzels with Spundekäs, asparagus with beurre blanc.","producer_note":"Moritz Kissinger is a leading light of the new Rheinhessen generation, breaking with the region's staid classic style. Praised by Klaus-Peter Keller — the 'wunderkind' tag made his early vintages famously hard to find. He farms with his father Jürgen and wife Jasmin (listed as Kissinger-Bähr).","photo_credit":"Photo: Woodland Wine Merchant (label shown is the 2022 vintage).","has_photo":true,"also_in":[]},{"id":50,"number":"02","section":"White — Canada & Rest of World","subsection":null,"title":"Roditis Blend 'Mosaic White' — Chatzivaritis Estate, Goumenissa 2023","price":"As printed on the menu: RODITIS+, 'MOSAIC WHITE' CHATZIVARITIS ESTATE, GOUMENISSA, GREECE (2023) 90 — bottled under PGI Slopes of Paiko.","menu_note":"Bottle $90 (Riviera)","region":"PGI Slopes of Paiko, northern Greece","grape":"~50% Xinomavro (as white), ~25% Roditis, ~25% Assyrtiko","producer":"Chatzivaritis Estate","style":"Lively everyday Greek white, organic & biodynamic","alcohol":"12–13.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"citrus, grapefruit, peach, apricot, spice, anise, saline","story":"The unusual trick here: Xinomavro is Greece's great red grape, but pressed immediately off its skins it stays white — a 'blanc de noir' — adding savory depth and structure rather than colour. Combined with Roditis's lifted citrus and Assyrtiko's mineral spine, you get a white with more savory complexity than its light body suggests. 'Mosaic' refers to both the blend and the patchwork of Goumenissa vineyard parcels. Each variety is fermented separately at low temperature, then rested three months on the lees.","pairings":"Greek mezze, salads, grilled fish, fava bean salad, stuffed grape leaves (dolmades), Brie and Camembert.","producer_note":"Chatzivaritis Estate is a small, 20-hectare family winery in Goumenissa, focused on indigenous varieties. Chloi Chatzivaritis took over winemaking from her father; the 'Mosaic' range is the estate's signature blend series.","photo_credit":"Photo: Vinseshop (vinseshop.gr).","has_photo":true,"also_in":[]},{"id":51,"number":"03","section":"White — Canada & Rest of World","subsection":null,"title":"Pinot Gris+ 'Bohem' — Robert Gilvesy, Lake Balaton 2024","price":"As printed on the menu: Pinot Gris+, 'Bohem' Robert Gilvesy, Lake Balaton, Hungary (2024). The '+' is menu shorthand: Bohem is a four-variety blend, not a single-varietal Pinot Gris.","menu_note":"By the glass · $18  /  Bottle $90 (Riviera)","region":"Badacsony, Lake Balaton, Hungary","grape":"Olaszrizling, Riesling, Pinot Gris, Sauvignon Blanc","producer":"Róbert Gilvesy, Szent György Hill","style":"Volcanic white blend, spontaneous ferment","alcohol":"","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"lemon, green apple, white peach, mint, cucumber, caraway, tonic-like edge, sea salt","story":"Despite the menu shorthand, this isn't a single-varietal Pinot Gris — it's a blend of four white grapes grown on Szent György Hill, an ancient dormant volcano with six-million-year-old basalt soils. Fermentation starts spontaneously with native yeasts, then the wine rests six months on its lees in stainless steel — no oak. Light, zesty and a little saline, with a faint spritz and a pleasant bitter edge.","pairings":"Grilled white fish with lemon and herbs, zesty ceviche, fresh garden salads, creamy goat cheese. Serve well chilled.","producer_note":"Róbert Gilvesy founded the winery in 2012 after returning from Canada to his ancestral homeland, building it around the former Esterházy estate on Szent György Hill. Organic cultivation and minimal intervention, aiming to express volcanic soils and native varieties.","photo_credit":"Photo: Gilvesy winery (label shown is the 2024 vintage).","has_photo":true,"also_in":[154]},{"id":52,"number":"04","section":"White — Canada & Rest of World","subsection":null,"title":"Grüner Veltliner 'Platter' — Rudolf Fidesser, Weinviertel 2024","price":"As printed on the menu: GRUNER VELTLINER, 'PLATTER' RUDOLF FIDESSER, NIEDEROSTERREICH (2024)","menu_note":"Bottle $90 (Riviera)","region":"Weinviertel DAC, Lower Austria","grape":"100% Grüner Veltliner","producer":"Weingut Rudolf Fidesser","style":"Dry, light, crisp — biodynamic","alcohol":"12%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"apple, quince, nashi pear, green pepper, gingerbread spice, cocoa bean, long mineral finish","story":"'Platter' is the Platt vineyards — the winery sits in the village of Platt in the western Weinviertel, where loess, clay and gravel soils give the wine warm spice and lively freshness. The estate farms biodynamically: no synthetic pesticides, careful selection after harvest, fermentation at controlled temperature. It's dry, light and precise — sealed under screw cap. Note: the detailed research was done on the 2023 (poured by the glass); the bottle list carries the 2024.","pairings":"Asparagus salad with quinoa, yogurt–mint pasta, vegetable salads with beetroot — the classic Grüner vegetable match.","producer_note":"Weingut Rudolf Fidesser is a traditional family estate in Platt. Its philosophy is to step back so the vineyard can speak — biodynamic farming, minimal cellar interference. The younger generation also runs an experimental natural-wine line called Orbis.","photo_credit":"Photo: Vinello.","has_photo":true,"also_in":[]},{"id":53,"number":"05","section":"White — Canada & Rest of World","subsection":null,"title":"Grüner Veltliner 'vom Löss' — Diwald, Wagram 2024","price":"As printed on the menu: GRUNER VELTLINER, DIWALD, WAGRAM, AUSTRIA (2024) 95 — the cuvée is 'vom Löss', which the menu omits.","menu_note":"Bottle $95 (Riviera)","region":"Wagram, Lower Austria","grape":"100% Grüner Veltliner","producer":"Weingut Martin & Ulli Diwald","style":"Dry organic Wagram Grüner — a classic restaurant white","alcohol":"12.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"white pepper, apricot, peach, passion fruit, creamy mouthfeel, dark loess minerality","story":"'Vom Löss' means 'from the loess' — the wind-blown silt soils of the Wagram terraces, which give Grüner its spiciness and a dark, stony depth. The Diwalds describe their approach as old-school in the best sense: freshness over fatigue, a wine made for the table. They've farmed organically since 1976 — pioneers in Austria — and added biodynamic methods in 2023.","pairings":"Trout and other light fish, sushi and stir-fried vegetables, fresh salads, asparagus, tender chicken breast.","producer_note":"Weingut Martin & Ulli Diwald is a family estate in Großriedenthal, the village they call the origin and home of their wines. Members of the ÖTW and Respekt-BIODYN — the top tier of quality-focused Austrian growers.","photo_credit":"Photo: Vinifika (vinifika.be).","has_photo":true,"also_in":[]},{"id":54,"number":"06","section":"White — Canada & Rest of World","subsection":null,"title":"Riesling Trocken (Estate) — Hermann Dönnhoff, Nahe 2022","price":"As printed on the menu: RIESLING TROCKEN, WEINGUT DONNHOFF, NAHE, GERMANY (2022) 100","menu_note":"Bottle $100 (Riviera)","region":"Nahe, Germany (Oberhausen an der Nahe)","grape":"100% Riesling, fully dry","producer":"Weingut Hermann Dönnhoff","style":"Estate dry Riesling — the house calling card","alcohol":"~12%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"white peach, Amalfi lemon, citrus, floral lift, slate minerality","story":"'Trocken' simply means dry. The idea, in the importer's words, is 'to make a village wine' — the estate's two main soils, volcanic rock and slate, in one bottle, so drinkers get 'a look into what Dönnhoff is all about.' Fermented and raised in stainless steel and old, neutral German oak, organically grown, under screw cap. The 2022 was a classic dry-Riesling year in the Nahe and scored 93 from James Suckling. Drink now or hold a few years.","pairings":"Sushi and sashimi, oysters, grilled white fish, salads, fresh goat cheese, lightly spiced Asian dishes.","producer_note":"Weingut Hermann Dönnhoff is the Nahe's most famous estate and one of the benchmark Riesling producers in the world — 'to some, the best white wine producer in the world'. Run in recent decades by Helmut Dönnhoff and now his son Cornelius; a leading member of the VDP, Germany's top-estates association.","photo_credit":"Photo: Magnumweine (label shown is the 2022 vintage).","has_photo":true,"also_in":[]},{"id":55,"number":"07","section":"White — Canada & Rest of World","subsection":null,"title":"Grüner Veltliner — Matthias Hager, Kamptal 2024","price":"As printed on the menu: GRUNER VELTLINER, MATTHIAS HAGER, KAMPTAL, AUSTRIA (2024). The correct spelling is Grüner Veltliner.","menu_note":"By the glass · $20  /  Bottle $100 (Riviera)","region":"Kamptal DAC, Lower Austria","grape":"100% Grüner Veltliner","producer":"Weingut Doris und Matthias Hager, Mollands","style":"Dry, biodynamic, stainless-steel","alcohol":"12.5%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"Granny Smith apple, lime, citrus, white pepper, stone fruit, mineral","story":"This comes from the natural-wine corner of the Kamptal: 30- to 50-year-old vines around the village of Mollands, farmed organically and biodynamically. Fermentation starts on its own with the yeasts that came in from the vineyard, the wine rests in stainless-steel tanks, and no oak touches it. The result is a light, dry, peppery white — best drunk young with food.","pairings":"Freshwater and sea fish, seafood, salads, schnitzel, roast pork, sushi — or on its own as an aperitif.","producer_note":"Weingut Doris und Matthias Hager is a small family estate in Mollands. Where many Kamptal estates keep to tradition, Matthias Hager's mark is biodynamics, hand work and spontaneous fermentations — certified organic and Demeter.","photo_credit":"Photo: Wine-At Japan (label shown is the 2024 vintage).","has_photo":true,"also_in":[155]},{"id":56,"number":"08","section":"White — Canada & Rest of World","subsection":null,"title":"Chardonnay 'High Road' — Langmeil, Eden Valley 2024","price":"Bottle $100 (Riviera)","menu_note":"","region":"Eden Valley (Flaxman Valley), South Australia","grape":"100% Chardonnay","producer":"Langmeil Winery","style":"Barrel-fermented cool-climate Chardonnay, restrained oak","alcohol":"13.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"citrus, peach, melon, tropical fruit, marzipan, creamy nutty barrel character, flint","story":"Eden Valley sits 400–600 metres above the Barossa Valley floor — the winery literally 'takes the High Road' up from the warm valley to capture Chardonnay freshness. The 2024 was fermented in French oak — 30% new, the rest older or no oak at all — just enough to add texture and nutty creaminess without burying the Flaxman Valley fruit. The winery calls 2024 'another cracking, cooler vintage' with terrific natural acidity.","pairings":"Grilled prawns, lemon-butter fish, creamy pasta, roast chicken, soft cheeses.","producer_note":"Langmeil is in Tanunda, Barossa, where the Lindner family has farmed for six generations. The estate dates to 1842, when Prussian blacksmith Christian Auricht settled the village of Langmeil, and holds the Barossa's oldest surviving vineyard.","photo_credit":"Photo: Nick's Wine Merchants (label shown is the 2012 vintage).","has_photo":true,"also_in":[]},{"id":57,"number":"09","section":"White — Canada & Rest of World","subsection":null,"title":"Sauvignon Blanc — Shaw & Smith, Adelaide Hills 2024","price":"As printed on the menu: SAUVIGNON BLANC, SHAW & SMITH, ADELAIDE HILLS, AUSTRALIA (2024) 105","menu_note":"Bottle $105 (Riviera)","region":"Adelaide Hills, South Australia","grape":"100% Sauvignon Blanc","producer":"Shaw & Smith (styled Shaw + Smith)","style":"The benchmark restrained Australian Sauvignon Blanc — no oak","alcohol":"12%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"passionfruit, pineapple, lime, cut grass, green apple, chalky mineral","story":"Widely considered the benchmark Australian Sauvignon Blanc. From high-altitude estate vineyards at Balhannah and Lenswood — the coolest part of the Hills — it's handpicked, cool-fermented in stainless steel, rested briefly on the lees, and bottled early: no oak, no heaviness, just site and season. Restrained by New Zealand standards — more citrus and cut grass than passionfruit bombast — and famously consistent year to year ('it tastes the same every year, which is impressive,' wrote the Wine Advocate). Made to drink young, within about two years.","pairings":"Oysters, fresh seafood, salads, goat cheese, sushi, lightly spiced Asian dishes — an ideal aperitif white.","producer_note":"Shaw + Smith was founded in the Adelaide Hills by Martin Shaw and Michael Hill Smith MW — Australia's first Master of Wine. An independent, family-held estate, and the Sauvignon Blanc has been its calling card from the start: precision and restraint rather than overt fruitiness.","photo_credit":"Photo: Nick's Wine Merchants (label shown is the 2017 vintage).","has_photo":true,"also_in":[]},{"id":58,"number":"10","section":"White — Canada & Rest of World","subsection":null,"title":"Furmint 'Váradi' — Gilvesy, Badacsony, Hungary 2021","price":"As printed on the menu: FURMINT, 'VARADI' GILVESY, BADACSONY, HUNGARY (2021) 110","menu_note":"Bottle $110 (Riviera)","region":"Badacsony, Lake Balaton, Hungary","grape":"100% Furmint","producer":"Gilvesy (Robert Gilvesy)","style":"Lean volcanic dry Furmint, organic, low-intervention","alcohol":"~12%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"honey, beeswax, apricot, green apple, pear, preserved lemon, savoury mineral","story":"Furmint is Hungary's great white grape — famous in sweet Tokaji, but here made dry on the volcanic slopes of Lake Balaton. The lake reflects sunlight onto the vines, and the basalt soils give a smoky, flinty edge. Owner Robert Gilvesy, a Canadian architect of Hungarian parentage, farms organically and ferments with wild yeasts, keeping the wine lean and spicy rather than rich or oaky. Also on our by-the-glass list: his Pinot Gris 'Bohem'.","pairings":"Roast chicken and pork, mushroom dishes, freshwater fish, hard cheeses, simply prepared vegetable dishes.","producer_note":"Robert Gilvesy worked as an architect in Paris before returning to his ancestral land, founding the winery in 2012 on volcanic slopes north of Lake Balaton. Now fully organic, it's known for lean, mineral whites praised in the UK press.","photo_credit":"Photo: Vivino.","has_photo":true,"also_in":[]},{"id":59,"number":"11","section":"White — Canada & Rest of World","subsection":null,"title":"Gouveio 'Gouveio by Joaninha' — Maçanita, Douro 2024","price":"As printed on the menu: GOUVEIO+, 'MACANITA', DOURO, PORTUGAL (2024) 115 — the producer is Maçanita, and the wine is labelled 'Gouveio by Joaninha'.","menu_note":"Bottle $115 (Riviera)","region":"Douro, Portugal (old vines at altitude)","grape":"100% Gouveio (known as Godello in Spain)","producer":"Maçanita Vinhos — Joana 'Joaninha' Maçanita","style":"Stainless-steel high-altitude Douro white, no oak","alcohol":"12.5%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"citrus, peach, mango, green nuances, high-altitude minerality","story":"The Douro is famous for Port, but its cool high-altitude sites make sharp, mineral dry whites. This one comes from old vines, fermented cool in stainless steel with wild yeasts and aged six months in steel — no oak at all — to keep the fruit pure and tense. It's Joana Maçanita's personal single-varietal project: 'Joaninha' is her nickname, and the menu's 'Macanita' drops her name's cedilla. Drink young, while its freshness is at its peak.","pairings":"Grilled fish, composed salads, white meats, oysters, ceviche.","producer_note":"Maçanita Vinhos was founded in the Douro in 2011 by siblings Joana and António Maçanita, who had made wine together at more than 14 wineries across Portugal. Their project explores the Douro's diversity through indigenous grapes and a hands-off approach; Joana leads the white-wine programme.","photo_credit":"Photo: Black Pepper and Basil (label shown is the 2019 vintage).","has_photo":true,"also_in":[]},{"id":60,"number":"12","section":"White — Canada & Rest of World","subsection":null,"title":"Semillon 'Equinoxe' — BLANKbottle, Elgin 2022","price":"Bottle $120 (Riviera)","menu_note":"","region":"Elgin, Western Cape, South Africa","grape":"Semillon-led blend (exact composition unpublished — the producer leaves varieties off its labels)","producer":"BLANKbottle — Pieter Walser","style":"Low-intervention, layered and savory","alcohol":"","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"lemon, lime, lemongrass, green apple, waxy texture — inferred from region and house style; taste the bottle","story":"BLANKbottle deliberately leaves grape varieties off its labels — each wine is 'an individual narrative'. 'Equinoxe' is the Semillon-led white from cool-climate Elgin, a high inland valley where long, slow ripening gives elegant, high-acid whites. No published tasting note or tech sheet exists for the 2022, so service notes should come from the glass. The house style is low-intervention: wild fermentations, minimal additions, and up to 90 separate small fermentations blended by taste.","pairings":"Creamy seafood pastas, roast chicken, herb-infused risotto, oysters and scallops.","producer_note":"BLANKbottle was founded in 2004 by Pieter Walser as a garage project and is now one of South Africa's most celebrated independent producers. He owns no vineyards — he works with 66 growers across the Western Cape — making up to 47 different wines a year, each with a story and a hand-designed label.","photo_credit":"","has_photo":true,"also_in":[]},{"id":61,"number":"13","section":"White — Canada & Rest of World","subsection":null,"title":"Riesling 'Black Cap' — Dobbin Estates, Twenty Mile Bench 2019","price":"Bottle $120 (Riviera)","menu_note":"","region":"Twenty Mile Bench / Four Mile Creek, Niagara Peninsula","grape":"100% Riesling, off-dry","producer":"Dobbin Estates","style":"Multi-vineyard off-dry Riesling, hand-picked in passes","alcohol":"12.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"lime, apricot, white peach, jasmine, honey, beeswax, flint, saline mineral","story":"'Black Cap' is the capsule colour — the house's multi-vineyard dry/off-dry Riesling, as distinct from the estate 'White Cap'. Dobbin picks in several passes across different dates so the final blend mixes lots of different ripeness — for the 2021, up to 20% of the fruit was botrytised. Then the wine spends 18 months on its lees. The result is off-dry (8.7 g/L sugar in 2019) but racy, with the sweetness balanced by acidity — soft, layered, built to age into the 2030s. The winery only opened in 2024 and immediately pitched at the top of Niagara's price ladder.","pairings":"Indian butter chicken, roast pork loin with apple sauce, sushi and sashimi, Thai and Vietnamese dishes with heat, creamy cheeses, roast poultry.","producer_note":"Dobbin Estates is a new winery on Dobbin Road in the Twenty Mile Bench, opened to the public in 2024 and immediately noticed for top-of-the-market pricing and terroir-driven wines — several bottlings have scored 93–95 from Canadian critics.","photo_credit":"Photo: Natalie MacLean (label pictured: Dobbin Dry Riesling 2019 — the 'Black Cap' bottling).","has_photo":true,"also_in":[]},{"id":62,"number":"14","section":"White — Canada & Rest of World","subsection":null,"title":"Sauvignon Blanc 'Klasika' — Milan Nestarec, Moravia 2023","price":"As printed on the menu: SAUVIGNON BLANC, MIRA NESTAREC, MORAVIA, CZECHIA (2023) — the menu names no cuvée; 'Klasika' is our identification, to be confirmed against the bottle.","menu_note":"Bottle $125 (Riviera)","region":"Velké Bílovice, Moravia, Czechia","grape":"100% Sauvignon Blanc","producer":"Milan Nestarec","style":"Natural, unfined and unfiltered, minimal sulfur, organic","alcohol":"","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"citrus, herbs, fresh, aromatic, energetic — no published tasting note; taste the bottle","story":"'Klasika' is the widely listed varietal Sauvignon Blanc bottling from this producer — but the menu names no cuvée, and no 2023 vintage listing was published, so both the cuvée and the vintage should be confirmed against the physical bottle. Milan Nestarec took over his family's vineyards in 2008 and became a shooting star of Czech natural wine: organic farming, wild-yeast fermentations, unfined and unfiltered, minimal or no added sulfur.","pairings":"Goat cheese, asparagus, green salads, grilled fish, lighter vegetable dishes.","producer_note":"Milan Nestarec is one of the leading figures of the young Central European natural-wine scene, farming around 30 hectares across some 13 sites in southern Moravia. His style drew international attention from about 2015.","photo_credit":"","has_photo":false,"also_in":[]},{"id":63,"number":"15","section":"White — Canada & Rest of World","subsection":null,"title":"White Blend 'Himmel auf Erden' — Christian Tschida, Burgenland 2023","price":"As printed on the menu: GRUNER VELTLINER, 'HIMMEL AUF ERDEN' CHRISTIAN TSCHIDA, AUSTRIA (2023) — it is a white blend, not a varietal Grüner Veltliner.","menu_note":"Bottle $140 (Riviera)","region":"Burgenland, Austria (Lake Neusiedl / Leithaberg)","grape":"Grüner Veltliner-led blend with Sauvignon Blanc and Furmint","producer":"Christian Tschida","style":"Natural white blend — unfined, unfiltered, no added sulfur","alcohol":"11.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"peach, apricot, grapefruit, apple, honey, seaside salinity, savoury herbs","story":"'Himmel auf Erden' means 'Heaven on Earth'. One important note: despite where it sits on our list, this is not a single-variety Grüner Veltliner — it's a blend, led by Grüner with Sauvignon Blanc and Furmint, from limestone and schist soils around Lake Neusiedl. Tschida is a cult figure in natural wine: hand-harvested fruit, foot-crushed, fermented with wild yeasts in big barrels, bottled without fining, filtering or added sulfur. The result is bright and textured, with a gentle savoury grip from being unfiltered.","pairings":"Aperitif, larger fish dishes, risottos and stuffed pasta, meaty fish, fried food, roasted white meats.","producer_note":"Christian Tschida, based in Illmitz, is a pioneer of the international natural-wine scene, tending about 10 hectares of old vines — some up to 60 years old — by hand and horse. His methods are radically hands-off, and his wines have cult status in wine bars and restaurants worldwide.","photo_credit":"Photo: wine-amazing.com.","has_photo":true,"also_in":[]},{"id":64,"number":"16","section":"White — Canada & Rest of World","subsection":null,"title":"Grüner Veltliner Alte Reben 'Vulkan' — Kolfok, Mittelburgenland 2020","price":"Bottle $150 (Riviera)","menu_note":"","region":"Neckenmarkt, Mittelburgenland, Burgenland, Austria","grape":"100% Grüner Veltliner, old vines (planted 1951)","producer":"Kolfok — Stefan Wellanschitz","style":"Textured old-vine Grüner from volcanic clay, low-intervention","alcohol":"~12%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"dried apricot, dried apple, yellow fruit, herbs, flowers, spice, stony depth","story":"'Vulkan' means volcano — it's the soil, not the technique. The wine comes from three old vineyards on volcanic clay near the Hungarian border, including vines planted in 1951. In local dialect a 'Kolfok' is an unconventional thinker, and the winemaking matches: whole bunches pressed, aged on the lees in 500- and 600-litre barrels the family made with a local cooper, bottled unfiltered with minimal sulfur. Stefan Wellanschitz's motto: 'wine that has become, not been made.' The 2020 vintage could not be confirmed online — check the bottle.","pairings":"Shellfish, oysters, grilled prawns, ceviche, richer fish dishes, hard cheeses.","producer_note":"Kolfok is Stefan Wellanschitz's project in Neckenmarkt, reviving the area's white-wine history by working its few remaining old Welschriesling, Grüner Veltliner and Weissburgunder vines. Certified organic.","photo_credit":"Photo: Transgourmet (label shown is the 2020 vintage).","has_photo":true,"also_in":[]},{"id":65,"number":"17","section":"White — Canada & Rest of World","subsection":null,"title":"Riesling Gimmeldinger Kapellenberg Erste Lage — A. Christmann, Pfalz 2021","price":"As printed on the menu: RIESLING, GIMMELDINGER KAPELLENBERG ER LAGE, A. CHRISTMANN, PFALZ, GERMANY (2021) — the classification is 'Erste Lage'.","menu_note":"Bottle $150 (Riviera)","region":"Gimmeldingen, Mittelhaardt, Pfalz, Germany","grape":"100% Riesling","producer":"Weingut A. Christmann","style":"Dry VDP first growth, organic & biodynamic","alcohol":"12%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"apricot, honeysuckle, green apple, pear, herbs, crushed rock, salty mineral","story":"The Kapellenberg — named for the chapel below it — sits high in the Haardt foothills on sandstone and limestone, catching cooling forest breezes. 'Erste Lage' is the VDP's first-growth tier, one step below grand cru. Christmann has farmed organically and biodynamically for 16+ years; winemaker Sophie Christmann's own word for this wine is 'cool, salty, elegant'. Approachable now, and it will keep developing for several years.","pairings":"Oysters, ceviche, sushi, goat-cheese salads, simply prepared white fish.","producer_note":"Weingut A. Christmann in Gimmeldingen is one of the Pfalz's leading estates, now led by Sophie Christmann. In 2022 the family shrank the estate to concentrate only on wines they fully stand behind; the top Grosse Lage bottlings (Idig, Vogelsang) are among the hardest German Rieslings to get.","photo_credit":"Photo: wein-und-mehr.de.","has_photo":true,"also_in":[]},{"id":66,"number":"18","section":"White — Canada & Rest of World","subsection":null,"title":"'Redoma' Reserva Branco — Niepoort, Douro 2023","price":"As printed on the menu: RABIGATO+, 'REDOMA' NIEPOORT, DOURO RESERVA, PORTUGAL (2023) — the wine is 'Redoma' Reserva Branco, a field blend led by Rabigato.","menu_note":"Bottle $165 (Riviera)","region":"Douro DOC, Portugal (Murça & Poiares, old vines)","grape":"Old-vine field blend led by Rabigato","producer":"Niepoort","style":"Barrel-fermented Reserva, Burgundian in profile","alcohol":"12%","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"white fruit, lemon curd, dried mango, pineapple, flowers, spice, smoke, mineral","story":"Redoma Reserva is Niepoort's old-vine white flagship: a field blend — many grape varieties picked together from the same vineyard — dominated by Rabigato, from vines 65 to 85 years old on mica-schist at 400–600 metres. It ferments with wild yeasts in French oak barrels and ages about nine months on the lees, giving it a dense, textured, Burgundian feel. The 2023 Reserva scored 96 from JamesSuckling.com. Don't confuse it with the entry-level Redoma Branco, a separate, less expensive wine.","pairings":"Oysters, oven-baked fish, poultry and white meats, root vegetables, Caesar salad, cheese.","producer_note":"Niepoort was founded in 1842 and is led today by fifth-generation Dirk Niepoort — a pillar of the Douro, first for Port and increasingly for dry wines. Dirk was inducted into the Decanter Hall of Fame in 2023; the estate favours biodynamic practices in its top vineyards.","photo_credit":"Photo: wine-at.jp. The pictured label shows the 2023 vintage, matching Riviera's list.","has_photo":true,"also_in":[]},{"id":67,"number":"19","section":"White — Canada & Rest of World","subsection":null,"title":"Chardonnay 'Di Loro' — Di Loro Wines, Niagara 2022","price":"As printed on the menu: CHARDONNAY, DI LORO, TWENTY MILE BENCH, NIAGARA, CANADA (2022)","menu_note":"Bottle $175 (Riviera)","region":"Twenty Mile Bench, Niagara, Ontario","grape":"100% Chardonnay (Clone 95)","producer":"Di Loro Wines — Dr. Gianluca Di Loro","style":"Precision cool-climate Chardonnay, Burgundian clone","alcohol":"","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"no published tasting note — taste the bottle; house style is citrus, orchard fruit, mineral precision","story":"A few flags to know. The menu names no producer — research identifies this as the Chardonnay of Niagara winemaker Gianluca Di Loro, whose own site says the fruit comes from Twenty Mile Bench, not Twenty Mile Bench as the menu prints. No 2022 bottling was published either, so check the bottle. His 2023 Chardonnay won Bronze at the 2025 Decanter World Wine Awards, and the house style is precise, site-driven Niagara Chardonnay from Burgundian Clone 95.","pairings":"Roast chicken, lobster and crab, creamy pastas, mushroom dishes, soft cheeses.","producer_note":"Dr. Gianluca Di Loro is a Niagara winemaker, sommelier and educator — voted Italy's best wine taster in 2017. Di Loro Wines is his small, precision-focused label and consulting practice.","photo_credit":"Photo: dilorowines.com. The pictured label is Di Loro's Chardonnay from Twenty Mile Bench (Niagara); Riviera lists the Twenty Mile Bench cuvée.","has_photo":true,"also_in":[]},{"id":68,"number":"20","section":"White — Canada & Rest of World","subsection":null,"title":"Chardonnay 'Poetica' — Southbrook, Four Mile Creek, Niagara 2011","price":"As printed on the menu: CHARDONNAY, 'POETICA' SOUTHBOOK, FOUR MILE CREEK, NIAGARA, CANADA (2011) — the producer is Southbrook, not 'Southbook'.","menu_note":"Bottle $200 (Riviera)","region":"Four Mile Creek, Niagara-on-the-Lake, Ontario","grape":"100% Chardonnay","producer":"Southbrook Vineyards","style":"Rich barrel-fermented flagship Chardonnay, organic & biodynamic","alcohol":"","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"butter, lemon curd, baked apple, nectarine, vanilla, honey, floral, long mineral finish","story":"Poetica is Southbrook's flagship Chardonnay — and at 15 years old, this is a mature library bottle, well past its youthful fruit and into a rich, developed phase. It's a barrel-fermented, buttery style with cool-climate freshness underneath, from one of Canada's leading biodynamic wineries. Each Poetica label carries a poem — the 2011 featured 'Held Still'. Decant for sediment and serve not over-chilled.","pairings":"Pork tenderloin, butternut squash risotto, roast chicken with cream sauces, lobster, seared scallops, aged cheeses.","producer_note":"Southbrook Vineyards in Niagara-on-the-Lake is a certified organic and biodynamic estate. Winemaker Ann Sperling comes from a BC vineyard family (farming since the 1930s) and builds Chardonnays meant to age.","photo_credit":"Photo: WineAlign.","has_photo":true,"also_in":[]},{"id":69,"number":"21","section":"White — Canada & Rest of World","subsection":null,"title":"Grüner Veltliner ‘Schütt’ Smaragd — Weingut Emmerich Knoll, Wachau 2022","price":"As printed on the menu: GRUNER VELTLINER, ‘SCHUTT’ SMARAGD, WEINGUT EMMERICH KNOLL, KAMPTAL, AUSTRIA (2022). The correct spellings are Grüner Veltliner and Schütt; the wine is from the Wachau (Knoll’s home), not Kamptal.","menu_note":"Bottle $225 (Riviera)","region":"Ried Schütt, Wachau, Lower Austria","grape":"100% Grüner Veltliner (single vineyard)","producer":"Weingut Emmerich Knoll (Unterloiben)","style":"Smaragd — the Wachau’s ripest dry-wine category; fermented dry, aged on lees","alcohol":"~13–13.5%","body":4,"body_label":"Full","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"green apple, white peach and citrus, the classic Grüner white-pepper spice and dill, stony flinty minerality; long, savoury, slightly salty finish.","story":"The Wachau ranks its dry white wines in three ripeness levels, and Smaragd — named after the emerald-green lizard that suns itself on the region’s stone terraces — is the top one: the ripest grapes, the richest wines, never released before the May after harvest. The Knoll family has grown wine in Unterloiben since 1825 and is one of Austria’s most famous white-wine addresses; their baroque St. Urban label hasn’t changed since 1962. ‘Schütt’ is one of their top terraced vineyards, a steep south-facing slope of bare gneiss rock above the Danube. This is Grüner Veltliner with its foot flat on the floor — powerful, peppery, mineral — built for the table, not for sipping alone.","pairings":"Wiener Schnitzel, roast pork belly with crackling, seared scallops with brown butter, spicy Thai green curry, aged Gruyère.","producer_note":"Family estate in Unterloiben, Wachau, growing wine since 1825 — run by Emmerich Knoll Sr., his wife Monika, and their sons. A member of Vinea Wachau and one of Austria’s benchmark producers of age-worthy Grüner Veltliner and Riesling.","photo_credit":"Photo: U’wine (pictured bottle; listed vintage is 2022).","has_photo":true,"also_in":[]},{"id":70,"number":"22","section":"White — Canada & Rest of World","subsection":null,"title":"Riesling Felsenberg GG 'Felsentürmchen' — Dönnhoff, Nahe 2022","price":"As printed on the menu: RIESLING, 'FELSENBURG' GG WEINGUT DONNHOFF, NAHE, GERMANY (2022) — the vineyard is 'Felsenberg', the parcel 'Felsentürmchen'.","menu_note":"Bottle $280 (Riviera)","region":"Schlossböckelheim, Nahe, Germany","grape":"100% Riesling, bone dry","producer":"Weingut Hermann Dönnhoff","style":"VDP Grosses Gewächs — Germany's dry grand-cru tier","alcohol":"13%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"lemon, white blossom, orchard fruit, smoky flint, crushed rock, quinine","story":"'GG' stands for Grosses Gewächs — the VDP's dry grand-cru designation. The Felsenberg is a steep, south-facing slope of red volcanic rock, and this wine comes from the best steep parcels around the Felsentürmchen — the 'little rock tower' in the heart of the site. Fermented and matured in stainless steel and large traditional oak, it's concentrated yet light on its feet: stony saltiness, tingling lemon, a long crushed-rock finish. Austere and tightly wound in youth — the critics say drink 2027–2050. 95–97 from Vinous, 95 from James Suckling.","pairings":"Oysters, sashimi and sushi, ceviche, shellfish, goat cheese, game terrine. Serve at 10–12°C.","producer_note":"Weingut Hermann Dönnhoff — see the Estate Riesling Trocken brief for the estate story. Its Grosse Lage Rieslings (Hermannshöhle, Felsenberg, Dellchen) are benchmarks for dry German Riesling; the 2021 Felsenberg GG earned 96 from the Wine Advocate.","photo_credit":"","has_photo":true,"also_in":[]},{"id":71,"number":"23","section":"White — Canada & Rest of World","subsection":null,"title":"Riesling Hermannshöhle GG — Dönnhoff, Nahe 2022","price":"As printed on the menu: RIESLING, 'HERMANSHOHLE' GG WEINGUT DONNHOFF, NAHE, GERMANY (2022)","menu_note":"Bottle $280 (Riviera)","region":"Niederhausen, Nahe, Germany","grape":"100% Riesling, bone dry","producer":"Weingut Hermann Dönnhoff","style":"Flagship dry grand cru","alcohol":"13%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"pink grapefruit, apricot, wet stone, shale, salt, pure lemon","story":"The Hermannshöhle — 'Hermann's hollow' — has been recognised for over a century as the highest-quality vineyard in the entire Nahe: a steep, south-facing site of grey-black slate with volcanic elements, some vines up to 70 years old. This is the estate's flagship dry wine and one of the most collected German Rieslings in the world. Stuart Pigott gave the 2022 99 points, calling its beauty 'breathtaking'. It's deep, dense and currently far too young — built for the long cellar (2028–2050).","pairings":"Oysters, sashimi and sushi, ceviche, shellfish, richer fish preparations, goat cheese, game terrine. Serve at 10–12°C.","producer_note":"Weingut Hermann Dönnhoff — see the Estate Riesling Trocken brief for the estate story. Justerini & Brooks calls the Hermannshöhle 'one of Germany's great vineyards, delivering wines of depth and power, year in year out'.","photo_credit":"Photo: Applejack Wine & Spirits.","has_photo":true,"also_in":[]},{"id":72,"number":"01","section":"Red — France","subsection":null,"title":"‘Mar i Muntanya’ — Domaine de l’Horizon, Côtes Catalanes (Roussillon) 2023","price":"As printed on the menu: SYRAH, ‘MAR I MUNTANYA’ DOMAINE DE L’HORIZON (2023) — the menu lists it as ‘Syrah’, but every source describes a Syrah-dominant blend.","menu_note":"Bottle $100 (Riviera)","region":"Côtes Catalanes IGP, Roussillon (French Catalonia)","grape":"Syrah-dominant blend (with Carignan, Grenache)","producer":"Domaine de l’Horizon (Thomas Teibert)","style":"Juicy, glou-glou Mediterranean red","alcohol":"≈ 12%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":2,"tannins_label":"Low","tasting_notes":"red cherry, wild strawberry, black raspberry, thyme, black olive, crushed rock, silky texture","story":"‘Mar i Muntanya’ is Catalan for ‘sea and mountains’ — the domaine sits in Calce, between the Mediterranean and the Pyrenean foothills near Perpignan. It farms organically and biodynamically, all by hand. The grapes go into the vat as whole bunches for a short, gentle maceration — the unbroken grapes start fermenting inside their own skins, which gives juicy fruit and a silky texture rather than heavy extraction. Aged in cement vats and large old oak. Closer in spirit to a glou-glou Beaujolais than to the heavy, sun-baked reds the wider region is known for.","pairings":"Grilled lamb, roasted vegetables, anything kissed by fire and smoke; mushroom pasta; an easygoing dinner-with-friends red.","producer_note":"Founded in 2006 in Calce by German-born Thomas Teibert, who had managed exports for the Austrian cooper Stockinger before being drawn by Calce’s very old vines and the example of local pioneer Gérard Gauby. From 2.5 to around 15 hectares of certified-organic vines — widely regarded as a benchmark of the new Roussillon.","photo_credit":"Photo: Golden Age Wine (label shown is the 2019 vintage).","has_photo":true,"also_in":[]},{"id":73,"number":"02","section":"Red — France","subsection":null,"title":"Carignan+ ‘Elodie Balme’ — Domaine Élodie Balme, Côtes du Rhône 2025","price":"As printed on the menu: CARIGNAN+, ELODIE BALME, CÔTES DU RHÔNE (2025). Note: her Côtes du Rhône is actually a Grenache-led blend — the label itself just reads ‘Côtes du Rhône’.","menu_note":"Bottle $110 (Riviera)","region":"Côtes du Rhône AOC, southern Rhône Valley, France","grape":"~70% Grenache, 20% Carignan, 10% Syrah (blend varies by vintage)","producer":"Domaine Élodie Balme (Rasteau)","style":"Red blend, fermented with native yeasts, aged in concrete — organic","alcohol":"~14.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"cherry, plum and strawberry, violet, dried Provençal herbs, black-pepper spice; fresh acidity, silky tannins, generous and easy-drinking.","story":"Élodie Balme started her own domaine in Rasteau at twenty-three, with four hectares of her father’s vines and a winemaking education plus a stint with one of the region’s natural-wine pioneers. Twenty years on she farms about fourteen hectares organically, ferments with the yeasts that come in on the grapes, and ages everything in concrete tanks — no oak, very little added sulfur. The result is southern Rhône wine with its sleeves rolled up: fruit-first, fresh, and honest. This is her everyday red, and at this price it over-delivers.","pairings":"Duck confit salad, duck à l’orange, bison tartare, homemade spaghetti carbonara, smoked meat sandwiches.","producer_note":"Élodie Balme founded her domaine in Rasteau in 2006 at age 23. Certified organic since 2023, she farms ~14 ha across Rasteau, Roaix and Buisson with native yeasts and concrete tanks — counted among the southern Rhône’s rising stars. The 2025 earned 91/100 from Bettane & Desseauve.","photo_credit":"Photo: SAQ (Société des alcools du Québec).","has_photo":true,"also_in":[]},{"id":74,"number":"03","section":"Red — France","subsection":null,"title":"Cabernet Sauvignon+ — Château Laubarit, Bordeaux 2023","price":"As printed on the menu: CABERNET SAUVIGNON+, CHATEAU LAUBARIT, BORDEAUX (2023).","menu_note":"Bottle $110 (Riviera)","region":"Bordeaux AOC (Haut-Benauge, Entre-Deux-Mers), France","grape":"50% Cabernet Sauvignon, 50% Merlot","producer":"Château Laubarit (Simonneau family, Saint-Pierre-de-Bat)","style":"Red Bordeaux — native yeasts, aged ~12 months in tank; organic & biodynamic","alcohol":"~12%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":3,"tannins_label":"Medium","tasting_notes":"cherry and raspberry, prunes, floral notes, sweet spice; supple tannins, fresh and drinkable.","story":"Château Laubarit sits in the Haut-Benauge, the quiet back corner of the Entre-Deux-Mers, and the Simonneau family has farmed it since 1780 — they were organic before organic was a word anyone used, and biodynamic since the early 2000s. Pierre-Abel Simonneau literally teaches oenology at Bordeaux University. The wine is half Cabernet Sauvignon, half Merlot, fermented with the yeasts from the vineyard and aged mostly in tank, so what you taste is the fruit and the place, not oak. It’s the easy-going side of Bordeaux: supple, fresh, honest — the bottle you open on a Wednesday and wonder why you don’t do it more often.","pairings":"Steak frites, roast leg of lamb with herbs, boeuf bourguignon, duck confit, charcuterie, aged Comté.","producer_note":"Family-owned since 1780 in Saint-Pierre-de-Bat (today Florent Simonneau and his wife Isabelle). One of Bordeaux’s earliest organic estates, Demeter-certified biodynamic; tiny production of ~2,000 cases of the red.","photo_credit":"Photo: retailer product image via web image search (pictured bottle shows the 2021 vintage; listed vintage is 2023).","has_photo":true,"also_in":[]},{"id":75,"number":"04","section":"Red — France","subsection":null,"title":"Grenache — Domaine du Séminaire, Côtes du Rhône 2024","price":"As printed on the menu: GRENACHE, DOMAINE DU SÉMINAIRE, CÔTES DU RHONE, FRANCE (2024). The appellation is spelled Côtes du Rhône.","menu_note":"By the glass · $22  /  Bottle $110 (Riviera)","region":"Côtes du Rhône AOC, southern Rhône, France (Valréas)","grape":"80% Grenache, 10% Syrah, 10% Carignan","producer":"Domaine du Séminaire (Hervé and Mathilde Pouizin)","style":"Organic, unoaked, concrete-aged red","alcohol":"14%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":2,"tannins_label":"Low","tasting_notes":"raspberry, juicy plum, damson, black pepper, bramble, spice","story":"A deliberately old-fashioned red from Valréas, on the northern edge of the southern Rhône. No oak is used: the wine ferments in the big concrete tanks installed by the family's forebears in 1938, ages 6–9 months in concrete, and is bottled early and unfined with minimal sulfur. The Grenache vines are old, the farming is certified organic — the result is a juicy, peppery, everyday red from a fresher-than-usual vintage.","pairings":"Roast lamb, tagine, lentils with chorizo, charcuterie, barbecued meats, pizza. Serve at 15–17°C.","producer_note":"Domaine du Séminaire is owned by Hervé and Mathilde Pouizin, the fourth generation to farm the slopes above Valréas. The 100-hectare property mixes vines with olive and truffle-oak trees, lavender and forest; Hervé converted the vineyards to organic while keeping the winemaking traditional.","photo_credit":"","has_photo":false,"also_in":[160]},{"id":76,"number":"05","section":"Red — France","subsection":null,"title":"Merlot Blend — Château du Moulin Noir, Lussac-Saint-Émilion 2014","price":"Bottle $125 (Riviera)","menu_note":"","region":"Lussac-Saint-Émilion (a ‘satellite’ of Saint-Émilion, right bank)","grape":"60% Merlot, 40% Cabernet Franc","producer":"Château du Moulin Noir","style":"Mature, softly textured, at or near peak","alcohol":"13.5%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":2,"tannins_label":"Low","tasting_notes":"blackberry, red cherry, dark plum, liquorice, mineral iron, chocolate, silky tannins, long finish","story":"At eleven years past the vintage, this is at or near its peak — the oak is fully integrated, and the fruit has taken on savoury, mineral notes. The satellite appellations share Saint-Émilion’s limestone-and-clay geology but mature earlier, so this drinks now rather than in decades. Château du Moulin Noir means ‘the black mill’: per the importer’s telling, two brothers quarrelled over their father’s legacy and the jealous younger brother burned the château’s mill to the ground.","pairings":"Roast lamb, duck terrines, mushroom dishes, fatty cheeses like Comté — the Merlot even suits spicy Asian dishes.","producer_note":"The importer calls Moulin Noir one of the most famous châteaux of Lussac-Saint-Émilion and a consistent producer of high-value, elegant, Merlot-dominant wines. In Ontario it is brought in by Nicholas Pearce Wines.","photo_credit":"Photo: vinotecacollado.com. The pictured label shows the 2023 vintage; Riviera lists 2014.","has_photo":true,"also_in":[]},{"id":77,"number":"06","section":"Red — France","subsection":null,"title":"Pinot Noir ‘Aux Concises’ — Clos de Sommeré, Bourgogne 2023","price":"As printed on the menu: PINOT NOIR, ‘AUX CONCISES’ SOMMERE, BOURGOGNE (2023) — ‘Sommere’ shortens the producer’s correct name, Clos de Sommeré.","menu_note":"Bottle $130 (Riviera)","region":"Bourgogne AOC, Burgundy","grape":"100% Pinot Noir","producer":"Clos de Sommeré (Régis & Sylvain)","style":"Juicy, early-drinking natural red Burgundy","alcohol":"13.5%","body":2,"body_label":"Light to medium","acidity":3,"acidity_label":"Medium","tannins":2,"tannins_label":"Low","tasting_notes":"strawberry, raspberry, cherry, black and white pepper, light floral notes, silky texture, juicy and unassertive","story":"Clos de Sommeré is a tiny natural-wine project in Burgundy, made with minimal intervention — fermented with the wild yeasts already on the grapes and handled as little as possible in the cellar. This is bistro-style Bourgogne rouge: honest, juicy and built to be drunk young, not cellared. Community tasters call it quite dark in the berry department for a Pinot, smooth, and best enjoyed now.","pairings":"Roast chicken, charcuterie, mushroom dishes, soft cheeses — simple bistro cooking is the sweet spot.","producer_note":"A small natural-wine producer in Burgundy, the project of Régis & Sylvain, known to the trade mainly through specialist importers like The Living Vine (BC). No estate website; the wines circulate through restaurant lists rather than the mainstream trade.","photo_credit":"Photo: Trésors de Bacchus.","has_photo":true,"also_in":[]},{"id":78,"number":"07","section":"Red — France","subsection":null,"title":"Syrah ‘Petit Ours’ — Matthieu Barret, Côtes du Rhône 2024","price":"As printed on the menu: SYRAH, ‘PETIT OURS’ MATTHIEU BARRET, COTES DU RHONE (2024) — correctly spelled ‘Côtes du Rhône’.","menu_note":"Bottle $130 (Riviera)","region":"Côtes du Rhône (northern, near Visan)","grape":"100% Syrah","producer":"Matthieu Barret (négociant bottling)","style":"Punchy, peppery, fruit-forward Syrah","alcohol":"≈ 13.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"blackberry, black cherry, black pepper, spice, vibrant acidity, grippy tannins, clean finish","story":"‘Petit Ours’ means ‘little bear’ — Barret’s own nickname. It’s a négociant bottling: he buys organic Syrah from his friend Rémi Pouzin in Visan and picks younger vines for a brighter, more fruit-forward expression. 100% Syrah is unusual for a southern-Rhône Côtes du Rhône, where Grenache normally leads — and that’s exactly what gives it the peppery, dark-fruited northern character. Hand-harvested, fermented with wild yeasts in concrete tanks, aged in concrete with no oak at all, and only a tiny addition of sulphur at bottling.","pairings":"Barbecued lamb chops, sausages, smoky beef skewers, merguez, grilled vegetables. Chill it slightly in warm weather.","producer_note":"Matthieu Barret comes from a long line of vignerons and is based at his family estate, Domaine du Coulet, in Cornas. Organic from his earliest days, biodynamic since 2002, with minimal-intervention cellar work aimed at expressing each site; ‘Petit Ours’ is the calling card of his wider négociant range.","photo_credit":"Photo: Mon Vin Français (label shown is the 2023 vintage).","has_photo":true,"also_in":[]},{"id":79,"number":"08","section":"Red — France","subsection":null,"title":"Gamay ‘Vieilles Vignes’ — Domaine Marcel Lapierre, Morgon 2024","price":"Menu prints simply ‘Lapierre’ — the correct full name is Domaine Marcel Lapierre.","menu_note":"Bottle $140 (Riviera)","region":"Morgon, Beaujolais","grape":"100% Gamay (old vines)","producer":"Domaine Marcel Lapierre — Mathieu & Camille Lapierre","style":"Natural icon, transparent and perfumed","alcohol":"13.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"peonies, purple florals, blood orange, red cherry, black plum, tilled earth, stony minerality","story":"Marcel Lapierre took over the family domaine in 1973 and, from 1981, helped found the natural-wine movement in Beaujolais: old vines, no synthetic chemicals, natural ferments, minimal or no added sulphur — part of the ‘Gang of Four’ immortalised by importer Kermit Lynch. The wines are prized for perfume, freshness and a mineral drive, and Morgon famously ‘morgonne’ — develops Burgundian, Pinot-like depth with age. This old-vine bottling is certified organic and biodynamic. Serve at 14–16°C.","pairings":"Roast chicken, duck, charcuterie, mushroom dishes, washed-rind cheeses, steak-frites.","producer_note":"Marcel Lapierre died at the end of the 2010 harvest; the domaine is now run by his children Mathieu and Camille, who have continued and extended the work, including biodynamic vineyard practices. The estate is a worldwide touchstone of natural wine, its reputation resting on four decades of sommelier and merchant devotion rather than points.","photo_credit":"Photo: Sành Rượu","has_photo":true,"also_in":[]},{"id":80,"number":"09","section":"Red — France","subsection":null,"titl
