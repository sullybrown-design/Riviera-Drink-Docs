"30%","tasting_notes":"Candied orange, licorice, herbs, and clove with floral, fruity notes. Rich and bittersweet on the palate with a long finish.","producer_note":"Made by Rossa Sicily, founded in 2014 by Edoardo Strano on his family's citrus estate on the slopes of Mount Etna. Built on hand-peeled IGP Sicilian blood oranges in small batches.","has_photo":false,"photo_credit":""},{"id":6004,"name":"AMARO CHIOT","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"Moncalieri (Piedmont), Italy","abv":"","tasting_notes":"Full and enveloping, with balsamic notes, roots and citrus peel; bitter up front with a slightly sweet, spicy finish.","producer_note":"Bordiga, a historic Piedmontese distillery near Turin.","has_photo":true,"photo_credit":"https://bottleofitaly.com/en/products/amaro-chiot-montamaro-70cl-bordiga"},{"id":6005,"name":"AMARO ROSSI D'ANGERA","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"Angera, Lombardy, Italy","abv":"","tasting_notes":"","producer_note":"Rossi d'Angera, a historic family distillery on Lake Maggiore founded in 1847.","has_photo":true,"photo_credit":"https://milanovino.it/vini/?regione=friuli-venezia-giulia"},{"id":6006,"name":"AMARO DILEI","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"Piedmont, Italy","abv":"30%","tasting_notes":"A strong nose of roots and bitter herbs alongside the fresh scent of peppermint. The palate is sweet but balanced by alpine herb aromas, and the aftertaste is mentholated and almost balsamic — long and persistent.","producer_note":"Made by Distilleria Bordiga in Piedmont, a distillery known for being scrupulous about raw materials — from the wine used as the base to the herbs to the mountain water. The idea is to bottle a specific sense of place: the flowers and herbs of the Piedmontese valleys.","has_photo":false,"photo_credit":""},{"id":6007,"name":"AMARO LUCANO","category":"AMARI & HERBAL SPIRITS","price":"9","origin":"Basilicata, Italy","abv":"28%","tasting_notes":"medium sweetness with herbal bitterness and notes of cinnamon, licorice and caramel","producer_note":"Made by Amaro Lucano in Basilicata since 1894. One of the few amari that reveals almost all of its ingredients.","has_photo":false,"photo_credit":""},{"id":6008,"name":"AMARO MAZZETTI FORTE","category":"AMARI & HERBAL SPIRITS","price":"13","origin":"Piedmont (Monferrato), Italy","abv":"35%","tasting_notes":"Intensely bitter and dry — rhubarb and gentian root at its core, with medicinal herbs and bitter orange. Minimal sugar; an uncompromising digestif.","producer_note":"Mazzetti d'Altavilla, a distillery in the Monferrato hills of Piedmont.","has_photo":true,"photo_credit":"https://mazzetti.it"},{"id":6009,"name":"AMARO MAZZETTI GENTILE","category":"AMARI & HERBAL SPIRITS","price":"13","origin":"Piedmont (Monferrato), Italy","abv":"30%","tasting_notes":"Softer and rounder than the Forte: fresh citrus (sweet orange, lemon), wild herbs and hay, with a clean, gentle bitter finish.","producer_note":"Mazzetti d'Altavilla, a distillery in the Monferrato hills of Piedmont.","has_photo":true,"photo_credit":"https://mazzetti.it/prodotto/amaro-gentile-mazzetti/"},{"id":6010,"name":"AMARO MELETTI","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"Marche, Italy","abv":"32%","tasting_notes":"floral with hints of rose, lavender and citrus fruits. The taste is simultaneously creamy with hits of bitter orange. And the aftertaste has just the right amount of lingering bitterness to bite and remind you you're drinking an amaro.","producer_note":"Made by Meletti in Ascoli Piceno, Marche, since 1871, in a river valley between the Apennine mountains and the Adriatic Sea.","has_photo":false,"photo_credit":""},{"id":6011,"name":"AMARO MONTENEGRO","category":"AMARI & HERBAL SPIRITS","price":"9","origin":"Emilia-Romagna, Italy","abv":"23%","tasting_notes":"floral, with notes of bitter orange, mint and licorice. Warming spice notes from clove, cinnamon and nutmeg bring up the rear of the palate, in a super welcoming way.","producer_note":"Named after Princess Elena of Montenegro, later Queen of Italy. The best-selling amaro in Italy — lighter and sweeter than most, and very versatile in cocktails.","has_photo":false,"photo_credit":""},{"id":6012,"name":"AMARO NARDINI","category":"AMARI & HERBAL SPIRITS","price":"13","origin":"Bassano del Grappa, Veneto, Italy","abv":"29%","tasting_notes":"Cocoa, espresso and sarsaparilla up front with a cooling peppermint bite; licorice and bitter orange on the finish. Rich but balanced, never harshly bitter.","producer_note":"Distilleria Nardini — founded 1779 by Bortolo Nardini, Italy's oldest distillery.","has_photo":true,"photo_credit":"https://www.masterofmalt.com/liqueurs/nardini/amaro-nardini-liqueurs/"},{"id":6013,"name":"AMARO NONINO","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Friuli-Venezia Giulia, Italy","abv":"35%","tasting_notes":"subtle, herbal bitterness and gentle spice with dominant notes of orange peel and caramel sweetness.","producer_note":"Made by the Nonino family distillers in Friuli. One of the gentlest, mellowest amari — it can stand in for sweet vermouth in cocktails like a Manhattan.","has_photo":false,"photo_credit":""},{"id":6014,"name":"AMARO EROICO","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"Calabria, Italy","abv":"28%","tasting_notes":"Soft and balanced, with a spicy, fresh opening and a balsamic finish carried by a lingering citrus note.","producer_note":"Made by Essentia Mediterranea in Calabria. Every botanical is gathered through the year and cold-infused separately to keep the flavors fresh.","has_photo":false,"photo_credit":""},{"id":6015,"name":"AMARO VIRGILIO","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"Lazio, Italy","abv":"30%","tasting_notes":"Intense and complex — china bark, sweet orange, rhubarb, and Calabrian licorice, with the traditional bitter-sweet amaro balance.","producer_note":"Made by Pallini, the historic Roman distillery (founded 1875 — the only working distillery in Rome). Dedicated to Virgilio Pallini; the recipe comes from an old family formula re-proposed in 2016.","has_photo":false,"photo_credit":""},{"id":6016,"name":"AMARO DEL' ETNA","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"Sicily, Italy","abv":"29%","tasting_notes":"Cinnamon and cloves up front with vanilla, cocoa and orange peel; moderately bitter at first, finishing sweeter with licorice and a hint of volcanic smoke.","producer_note":"Made near Mt. Etna since 1901 from 26+ native Sicilian herbs and plants.","has_photo":true,"photo_credit":"https://lastchancenashville.com/products/amaro-del-etna"},{"id":6017,"name":"AMARO SIBONA","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"Piedmont, Italy","abv":"28%","tasting_notes":"Intense aromas of rhubarb and cinchona, in a Barolo Chinato style — typically Piedmontese. Dense and spicy on the palate with mentholated, balsamic hints of rosemary and Mediterranean scrub. Good persistence, penetrating and spiced just enough to never be banal.","producer_note":"Distilleria Sibona, a Piedmontese distillery best known for its grappas (including Grappa di Barolo). Their amaro follows an ancient Piedmontese recipe handed down for generations.","has_photo":false,"photo_credit":""},{"id":6018,"name":"AMARO SAN SIMONE","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"Turin, Italy","abv":"26%","tasting_notes":"Assertively bitter but balanced — earthy herbs, gentian and rhubarb with a delicate sweetness; peppermint and marjoram in the mix.","producer_note":"Antica Officina Farmaceutica San Simone, Turin — recipe traces to 16th-century Turin monks; the modern amaro dates to around 1960.","has_photo":true,"photo_credit":"https://amarosansimone.com (producer site)"},{"id":6019,"name":"AMARO SALVANO DLI AMIS","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"Sicily, Italy","abv":"26%","tasting_notes":"Specific tasting notes weren't available for this lesser-known label. Expect a balanced, warming profile in line with the rest of this camp.","producer_note":"Made by Salvano in Italy. A lesser-known label with little published information — it sits at the gentler end of this camp at 26% ABV.","has_photo":false,"photo_credit":""},{"id":6020,"name":"CICCHETTO AMARO YORK","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Toronto, Canada","abv":"28%","tasting_notes":"Made in the brand's natural, balanced style — citrus-forward and not too sweet. Works well in a Negroni with sweet vermouth and gin.","producer_note":"Made in Toronto by Cicchetto Liquori, founded by local bartender Murru with Pasquini. Family recipes made with natural ingredients at a certified distillery — 'cicchetto' is Italian for a shot glass.","has_photo":false,"photo_credit":""},{"id":6021,"name":"GIOCONDO CAFFE CABARET","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"https://www.vinovinomilano.it/prodotto/amaro-caffe-cabaret-giocondo/"},{"id":6022,"name":"INTERVALLO AMARO DA SALOTTO","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"Calabria, Italy","abv":"28%","tasting_notes":"Herb-forward and citrus-free: gentian, galangal, bay leaf, marjoram, mint and sage give a velvety, smooth bitterness — made to sip slowly in the living room.","producer_note":"Vecchio Magazzino Doganale, a Calabrian liqueur maker in Montalto Uffugo founded by Ivan Trombino.","has_photo":true,"photo_credit":"https://bottleofitaly.com/products/liquore-amaro-da-salotto-50cl-intervallo"},{"id":6023,"name":"CHAMBERTON AMARO DE ERBE","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Piedmont, Italy","abv":"25%","tasting_notes":"An herbal and balsamic amaro with vegetal notes and a gentle, easy bitterness. Made from alpine herbs, it drinks clean and earthy rather than heavy.","producer_note":"Distilleria Erboristica Alpina, a mountain distillery in Susa, Piedmont. One of Italy’s biggest producers of génépy, working with alpine plants grown above 1,500m. (The menu lists this as “Chamberton”; the producer’s amaro is sold as Chaberton Amaro di Erbe.)","has_photo":false,"photo_credit":""},{"id":6024,"name":"BAD SPIRITS AMARO 1904","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Bologna, Italy","abv":"29%","tasting_notes":"Rich amber in the glass. It opens with zesty orange citrus, followed by the warmth of cinnamon and cloves, balanced by refreshing notes of mint and liquorice. Chamomile is the defining element, adding depth and aromatic complexity that elevates the whole profile.","producer_note":"Bad Spirits, Bologna — Andrea & Alessandro De Cinque. Inspired by the family legacy of Ferdinando De Cinque, a scholar and botanist who perfected the recipe after years of refinement. 94 points, International Wine and Spirits Competition 2024.","has_photo":false,"photo_credit":""},{"id":6025,"name":"CYNAR","category":"AMARI & HERBAL SPIRITS","price":"9","origin":"Trentino, Italy","abv":"16.5%","tasting_notes":"Savoury, earthy and vegetal, with a sweetish, almost caramel finish.","producer_note":"Created in 1952 by Venetian entrepreneur Angelo Dalle Molle, now made by the Campari Group. One of the most famous amari in the world.","has_photo":false,"photo_credit":""},{"id":6026,"name":"AMARO LA MISCELA","category":"AMARI & HERBAL SPIRITS","price":"13","origin":"","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"https://www.panerogroup.com/prodotto/la-miscela-al-30/"},{"id":6027,"name":"AMARO IL SEMINATORE","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"https://solocru.com/collections/spirits (bottle labelled \"SEMINATORE AMARO D'ERBE\" by Distillerie Buiese, Toronto retailer listing)"},{"id":6028,"name":"AMARO MARZADRO","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"Trentino, Italy","abv":"","tasting_notes":"","producer_note":"Distilleria Marzadro, a Trentino producer best known for grappa.","has_photo":true,"photo_credit":"https://clusa.ro/amaro-marzadro-0-700-l"},{"id":6029,"name":"AMARO NEPETA","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Sicily, Italy","abv":"28%","tasting_notes":"strikingly fresh and vibrant, due to the prevalence of citrus and bright herb notes. Once those notes from the first sip fades, there is a compelling underlying bitterness. It's slight, but just enough to give this amaro a complexity that makes it quite interesting.","producer_note":"A small-production Sicilian amaro built around nepitella, a wild mint-family herb native to southeastern Sicily, plus Siracusa lemon peels and bitter Sicilian herbs.","has_photo":false,"photo_credit":""},{"id":6030,"name":"JEFFERSON AMARO","category":"AMARI & HERBAL SPIRITS","price":"13","origin":"Calabria, Italy","abv":"30%","tasting_notes":"citrus and vanilla predominately on the nose. Citrusy lemon and grapefruit mingle on the palate, followed by some bitter notes of wormwood and gentian. The aftertaste softens again with a citrusy freshness","producer_note":"Made by Vecchio Magazzino Doganale in Calabria from local herbs, spices, and citrus. The old recipe is named for a Captain Jefferson said to have been shipwrecked on the Calabrian coast.","has_photo":false,"photo_credit":""},{"id":6031,"name":"ROGER AMARO","category":"AMARI & HERBAL SPIRITS","price":"13","origin":"Calabria, Italy","abv":"20%","tasting_notes":"Intense amber with golden reflections. Intense and complex on the nose, with citrus, herbaceous and spicy notes. The taste is decisively bitter, balanced and persistent, with a long and pleasant aftertaste.","producer_note":"Vecchio Magazzino Doganale, Calabria. Named for Roger, the navigator who — with Captain Jefferson — survived the 1871 shipwreck off Tropea and sheltered in the old customs warehouse that gives the distillery its name.","has_photo":false,"photo_credit":""},{"id":6032,"name":"AMARO CIPRIANI 7 PARTI","category":"AMARI & HERBAL SPIRITS","price":"13","origin":"Venice, Italy","abv":"35%","tasting_notes":"Artichoke-forward: crisp, earthy artichoke leaf with bittersweet herbs and floral notes; smooth and full with a long, lingering bitter finish.","producer_note":"Cipriani — the family behind Venice's Harry's Bar (1931); made with purple artichokes grown on their own island in the Venetian lagoon.","has_photo":true,"photo_credit":"https://www.ciprianidrinks.com (producer site)"},{"id":6033,"name":"AMARO NERAVIGLIOSO","category":"AMARI & HERBAL SPIRITS","price":"13","origin":"","abv":"","tasting_notes":"","producer_note":"","has_photo":false,"photo_credit":""},{"id":6034,"name":"GOTHA SETTEMMEZZO","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"Emilia Romagna, Italy","abv":"","tasting_notes":"The violet artichokes are grown in the clay-like soil of the Bologna hills, giving a fresh, herbaceous flavour with notes leaning toward licorice root.","producer_note":"Gotha Spiriti Nobili. The name Settemmezzo comes from a card game long played in Bologna's bars and osterias, and the amaro is an homage to the city — built around the violet artichoke that only grows in the hills around Bologna.","has_photo":false,"photo_credit":""},{"id":6035,"name":"AMARO DENTE DI LEONE","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"Aosta Valley, Italy","abv":"32.6%","tasting_notes":"The nose is delicate and herbaceous. On the palate dandelion and gentian are at the forefront, followed closely by thyme and other herbs. The finish is long, but relatively gentle (likely the influence of elderflower).","producer_note":"The one Aosta Valley amaro in the collection — an alpine region bordering Piedmont. Named for the dandelion (dente di leone), whose roots are a key botanical.","has_photo":false,"photo_credit":""},{"id":6036,"name":"AMARO SCUPPOZ","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"Abruzzo, Italy","abv":"30%","tasting_notes":"The nose is quite vegetal with pronounced hits of gentian. The gentian carries onto a strong palate alongside rhubarb, and the finish is quite bitter and root-driven.","producer_note":"The Scuppoz family of Valle Castellana, Abruzzo. The project started in the late 70s with Benito Cicconi's passion for herbs and infusions; the company was officially founded in 1982 and is now run by his son Adriano. 'Scuppoz' is local dialect for the clinking of glasses in a toast.","has_photo":false,"photo_credit":""},{"id":6037,"name":"AMARO DR. ULRICH","category":"AMARI & HERBAL SPIRITS","price":"13","origin":"Gressoney, Aosta Valley, Italy","abv":"30%","tasting_notes":"Gentian, peppermint and cloves lead, with caramel and a citrus accent; the caramel sweetness and mint freshness balance the herbal bitterness.","producer_note":"Marolo — from an unchanged alpine-herb formula dating to 1854.","has_photo":true,"photo_credit":"https://scrufari.it/categoria-prodotto/liquoristica/amari/"},{"id":6038,"name":"WASHINGTON AMARO","category":"AMARI & HERBAL SPIRITS","price":"13","origin":"Calabria, Italy","abv":"30%","tasting_notes":"Citrus leads the way — orange in several forms — over a bitter backbone of elecampane root and chiretta. An orange-forward amaro with a proper bitter finish.","producer_note":"A Calabrian amaro made for an increasingly demanding audience of bitter drinkers. Sold in Italy as “Amaro di arance ed erbe amaricanti” — a bitter of oranges and bitter herbs.","has_photo":false,"photo_credit":""},{"id":6039,"name":"LAZZARONI AMARO","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Saronno, Italy","abv":"25%","tasting_notes":"Dark chocolate and gentian up front, with cloves, cinnamon, a hint of licorice and a fresh peppermint-chocolate finish. Deftly balanced and very drinkable.","producer_note":"Paolo Lazzaroni & Figli, Saronno — the inventors of amaretto (1851).","has_photo":true,"photo_credit":"cdn.powered-by-nitrosell.com (retailer CDN image; retailer page not identified — label verified as Lazzaroni Amaro Liqueur)"},{"id":6040,"name":"AMARO SIBILLA","category":"AMARI & HERBAL SPIRITS","price":"13","origin":"Marche, Italy","abv":"34%","tasting_notes":"Intense scents of bitter herbs, dried fruits, chestnuts, walnut husks, with hints of coffee and honey. On the palate there is an immediate hit of sweetness from the honey, but that is quickly replaced by a surprisingly intense and persistent bitter-tannic sensation that lasts.","producer_note":"The Sibilla mountains of the Marche give this amaro its name — and its honey, which sweetens the intense bitter-herb base.","has_photo":false,"photo_credit":""},{"id":6041,"name":"AMARO APLOMADO","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"San Francisco, USA","abv":"32%","tasting_notes":"Less sweet than most amari and more herb-forward, with a firm herbal backbone, a lovely herbal-and-orange aroma, full body and a pleasant lingering finish. The low sugar makes it good neat or in drier cocktails.","producer_note":"Lo-Fi Aperitifs is a San Francisco line of vermouths and amaro built on California wines and natural botanicals — the botanical bill is printed right on the label — made for sipping and cocktails alike.","has_photo":false,"photo_credit":""},{"id":6042,"name":"AMARO JOACHIM","category":"AMARI & HERBAL SPIRITS","price":"15","origin":"Calabria, Italy","abv":"30%","tasting_notes":"Distinctly herbal and firmly bitter — bartenders compare it to Cynar, more herbal than anything else, with a strong bitter backbone. It foams a little and drinks well as a bitter modifier, with a solid finish.","producer_note":"Amaro Joachim ('L'Amaro del Profeta') is a small artisanal producer in Celico, Calabria. They exhibited at Vinitaly 2026 showcasing Calabrian amaro, licorice and wine.","has_photo":false,"photo_credit":""},{"id":6043,"name":"AMARO APLOMANDO BARREL AGED","category":"AMARI & HERBAL SPIRITS","price":"15","origin":"California, USA","abv":"32%","tasting_notes":"Less sweet than most amari — herbal and orange-forward with fresh California artichoke; smooth body that lingers. Built for drier cocktails.","producer_note":"","has_photo":true,"photo_credit":"https://uptownspirits.com/products/amaro-aplomado-herbal-liqueur-750ml"},{"id":6044,"name":"FACCIA BRUTTO AMARO GORINI","category":"AMARI & HERBAL SPIRITS","price":"15","origin":"Brooklyn, USA","abv":"22%","tasting_notes":"Sweet orange and fennel on the nose with a subtle bitterness. Smooth and citrusy on the palate with a herbaceous backbone — orange, rhubarb root, cardamom and fennel seed. Lightly sweet finish with lingering gentian, and warming caramel notes from the barrel. Refreshing in hot weather.","producer_note":"Faccia Brutto Spirits, Brooklyn, New York — founded by former fine-dining chef Patrick Miller. Amaro Gorini is named for his grandmother, Lena Pianta, who loved southern Italian spirits. The one American amaro on this list.","has_photo":false,"photo_credit":""},{"id":6045,"name":"FACCIA BRUTTO AMARO ALPINO","category":"AMARI & HERBAL SPIRITS","price":"15","origin":"Brooklyn, USA","abv":"35%","tasting_notes":"Alpine amaros are invigorating and intensely herbal, often with a spicy, savoury character — and this one has all of that in spades.","producer_note":"Faccia Brutto Spirits — the Brooklyn distillery founded by former line cook Patrick Miller (see the Carciofo brief).","has_photo":false,"photo_credit":""},{"id":6046,"name":"FACCIA BRUTTO AMARO CARCIOFO","category":"AMARI & HERBAL SPIRITS","price":"15","origin":"Brooklyn, USA","abv":"25%","tasting_notes":"Earthy artichoke at its core with cinnamon and dandelion root; spiced, slightly bitter and savory with a bright, clean finish — like a savory artichoke dish in a glass.","producer_note":"Faccia Brutto, a Brooklyn maker of Italian-style bitters.","has_photo":true,"photo_credit":"https://shop.slopecellars.com/products/faccia-brutto-carciofo"},{"id":6047,"name":"AMARO DI ANGOSTURA","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Trinidad & Tobago","abv":"35%","tasting_notes":"Unmistakably Angostura on the nose — nutmeg, cardamom, bitter orange peel, licorice, black pepper, and cinnamon, rooty like a handcrafted root beer. The palate starts sweet with caramel and crème brûlée, then the spice and bitterness build through the middle to a very long, warm finish.","producer_note":"Made by the House of Angostura in Trinidad & Tobago — the same company behind the famous aromatic bitters. The amaro is built on that bitters base, macerated for about three months.","has_photo":false,"photo_credit":""},{"id":6048,"name":"AMARO DI CHIANCIANO","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Chianciano Terme, Tuscany, Italy","abv":"","tasting_notes":"","producer_note":"Famiglia Santoni, a Tuscan producer of aperitifs, vermouths and bitters since 1960.","has_photo":true,"photo_credit":"https://www.santonitoscana.it/shop/ (Santoni producer)"},{"id":6049,"name":"DILLONS BLACK WALNUT","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Beamsville, Ontario, Canada","abv":"","tasting_notes":"Smoky, herbal and bittersweet — walnut pith steeped in spirit for two years, blended on a vermouth base; unlike anything else in the category.","producer_note":"Dillon's Small Batch Distillers, an artisan distillery in Beamsville, Ontario making spirits from local Niagara ingredients.","has_photo":true,"photo_credit":"https://shop.dillons.ca/spirits/specialty/ (Dillon's producer)"},{"id":6050,"name":"AMARO GRAN SASSO","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"Abruzzo, Italy","abv":"30%","tasting_notes":"Delicate aroma with hints of spices and roots. Full bodied with bitter notes of rhubarb and gentian, tipping the balance from sweet to bitter. The finish picks up the faint trails of citrus and vanilla.","producer_note":"Named for the Gran Sasso massif of Abruzzo. An elegant, complex amaro that also works well in stirred cocktails like a Negroni or Manhattan.","has_photo":false,"photo_credit":""},{"id":6051,"name":"AMARO SETA","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"Lombardy, Italy","abv":"30%","tasting_notes":"Soft and gentle — saffron, vanilla, mulberry, rose petal, and cardamom, with candied orange and white peach. Full and slightly syrupy, with a mild herbal bitterness on the finish. Very easygoing — a good first amaro.","producer_note":"Made by Seteria Bellieni 1954 of Como — a historic silk company from the Lake Como area ('seta' means silk) that also makes this amaro.","has_photo":false,"photo_credit":""},{"id":6052,"name":"AMARO STORICA","category":"AMARI & HERBAL SPIRITS","price":"13","origin":"Cividale del Friuli, Italy","abv":"","tasting_notes":"","producer_note":"Domenis 1898 — a Friulian distillery founded by Pietro Domenis in 1898, known for grappas and liqueurs.","has_photo":true,"photo_credit":"spirituosenwelt.at product photo (Domenis 1898 Storica Amaro)"},{"id":6053,"name":"AMARO DI TOSCANA","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Tuscany, Italy","abv":"30%","tasting_notes":"Full-bodied and balanced with Mediterranean herbs and a gentle bitterness; long, mild, slightly bitter finish.","producer_note":"","has_photo":true,"photo_credit":"https://www.culinarium.to/product/amaro-di-toscana/"},{"id":6054,"name":"AMARO VACA MORA","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Veneto, Italy","abv":"32%","tasting_notes":"Minty and properly bitter: fresh garden herbs and mint over earthy roots, with bitter peel, gentian and cinchona gripping the finish. Alpine in style, closer to Braulio than to Averna.","producer_note":"Poli Distillerie — family-run Veneto distillery founded 1898 in Schiavon.","has_photo":true,"photo_credit":"enotecagadi.it (Poli Vaca Mora Amaro)"},{"id":6055,"name":"AMARO VECCHIO DEL CAPO","category":"AMARI & HERBAL SPIRITS","price":"8","origin":"Calabria, Italy","abv":"35%","tasting_notes":"Bright and sweet-leaning: mandarin orange, mint, anise and chamomile with honeyed notes and a bitter-herbal finish. Best served ice cold.","producer_note":"Fratelli Caffo (Gruppo Caffo 1915), Limbadi, Calabria.","has_photo":true,"photo_credit":"https://carwyncellars.com.au/products/caffo-vecchio-amaro-del-capo-700ml"},{"id":6056,"name":"CASTAGNER AMARO LEON","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"https://lataverna.shop/products/castagner-amaro-leon"},{"id":6057,"name":"DORAGROSSA AMARO DI TORINO","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"Piedmont, Italy","abv":"23%","tasting_notes":"The nose already shows distinct bitter tones: gentian roots, juniper, dark honey, fennel and liquorice. Sweetness and bitterness are well balanced, with bitter gentian root notes dominating, plus caramel, cloves and a hint of fennel and liquorice.","producer_note":"Doragrossa, a Turin liqueur maker. Their Amaro di Torino is a tribute to the city’s long tradition of producing high-quality spirits — wormwood, rhubarb and gentian macerated in the traditional manner.","has_photo":false,"photo_credit":""},{"id":6058,"name":"RABITT RADICCHIO AMARO","category":"AMARI & HERBAL SPIRITS","price":"13","origin":"Treviso, Italy","abv":"26%","tasting_notes":"Rich and savoury with a sharp bitterness from raw Treviso radicchio; allspice, angostura bark and Sicilian orange round it out.","producer_note":"","has_photo":true,"photo_credit":"zerocentodistribuzione.it (RobyMarton Rabitt)"},{"id":6059,"name":"AMARO PUGLIESE","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Puglia, Italy","abv":"30%","tasting_notes":"Speaks of Apulia in the glass: mint, fennel, sage, artichoke and citrus fruits, all raw materials from the area. An amaro of customs and collective memory — fresh, herbal and distinctly southern.","producer_note":"Fiume, the Apulian brand from Putignano founded by Vittorio Fiume in the 1960s. Their liqueurs are built around the link with the territory, starting with the raw materials — Amaro Pugliese is the contemporary of their famous Elisir dei Trulli.","has_photo":false,"photo_credit":""},{"id":6060,"name":"DOLIN SUEDOIS","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Chambéry, France","abv":"","tasting_notes":"","producer_note":"Maison Dolin — the Chambéry producer behind Vermouth de Chambéry since 1821.","has_photo":true,"photo_credit":"https://www.whiskysite.nl/en/dolin-suedois-050-ltr-30.html"},{"id":6061,"name":"BERTA AMARO D'ERBE","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Piedmont, Italy","abv":"30%","tasting_notes":"Softer and sweeter than most amari — red berry fruit and a touch of anise, thick in the glass, with a smooth, rounded finish.","producer_note":"Distillerie Berta, a Piedmont grappa producer.","has_photo":true,"photo_credit":"https://www.glenfahrn.com/shop/bit015-berta-il-28-di-via-san-nicolao-amaro-d-erbe-70cl-1551"},{"id":6062,"name":"FRACK AMARO SERALE","category":"AMARI & HERBAL SPIRITS","price":"13","origin":"Calabria, Italy","abv":"30%","tasting_notes":"Citrus-led and bitter: bitter and sweet oranges, bergamot and lemon over rosemary, oregano, gentian and rhubarb — rounded by a base of fortified Calabrian wine.","producer_note":"Vecchio Magazzino Doganale, a Calabrian liqueur maker in Montalto Uffugo.","has_photo":true,"photo_credit":"https://www.magnanibruno.com/prodotto/frack-amaro-serale-cl-50/"},{"id":6063,"name":"NARDINI RABARBARO","category":"AMARI & HERBAL SPIRITS","price":"13","origin":"Veneto, Italy","abv":"19%","tasting_notes":"Rhubarb-root driven with a slightly smoky, caramelised-fruit character; vegetal on the nose, turning sweeter with a bitter, aromatic finish.","producer_note":"Distilleria Nardini — founded 1779, Italy's oldest distillery (same house as Amaro Nardini).","has_photo":true,"photo_credit":"https://www.thewhiskyexchange.com/p/18376/nardini-rabarbaro-liqueur"},{"id":6064,"name":"SFUMATO RABARBARO","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Trentino-Alto Adige, Italy","abv":"20%","tasting_notes":"Smoky, woodsy rhubarb amaro — smells like campfire and alpine herbs, with a bittersweet finish of dark berries and licorice. Lovely with whiskey or neat after dinner.","producer_note":"Antica Erboristeria Cappelletti — family-owned Trentino herbal house founded 1906, still run by the fourth generation.","has_photo":true,"photo_credit":"artisanwineshop.com"},{"id":6065,"name":"QUAGLIA RABARBARO","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Piedmont, Italy","abv":"","tasting_notes":"","producer_note":"Antica Distilleria Quaglia, Castelnuovo Don Bosco — four generations making liqueurs, grappas and vermouth since 1890; their rhubarb liqueur won IWSC Gold 2025.","has_photo":true,"photo_credit":"distilleriaquaglia.it"},{"id":6066,"name":"AMARO ALPINO","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Italy","abv":"18.5%","tasting_notes":"Alpine amaro from 22 mountain herbs, roots and berries — gentian, juniper, sage and elderflower. Fresh mountain-scented and gently bitter, a classic digestif.","producer_note":"Distilleria Alpino — made to a secret 1930 recipe by founder Agostino Pontillo.","has_photo":true,"photo_credit":"trentiner.it"},{"id":6067,"name":"AMARO ALPINO RISERVA","category":"AMARI & HERBAL SPIRITS","price":"13","origin":"","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"amaroalpino.it (producer)"},{"id":6068,"name":"ARGALA ALPINO","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"Piedmont, Italy","abv":"28%","tasting_notes":"Full-bodied, warm and citrusy — orange peel, pine needles, mountain chamomile and lavender with a persistent bitter, balsamic finish.","producer_note":"Argalà, Boves (Cuneo) — small producer blending alpine botanicals with Maritime Alps water.","has_photo":true,"photo_credit":"blackheartsandsparrows.com.au"},{"id":6069,"name":"PASUBIO VINO AMARO","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Trentino-Alto Adige, Italy","abv":"17%","tasting_notes":"A wine-based alpine amaro — wild blueberries, pine and a hint of smoke over rich, lush aged wine. Bitter herbs but smooth and sippable.","producer_note":"Antica Erboristeria Cappelletti — one of the house's first amari, from founder Giuseppe Cappelletti's early-20th-century recipe.","has_photo":true,"photo_credit":"labat.ch"},{"id":6070,"name":"AMARO ST. HUBERTUS","category":"AMARI & HERBAL SPIRITS","price":"13","origin":"Piedmont, Italy","abv":"38%","tasting_notes":"Bold and bracing — big licorice and mint over earthy alpine herbs, very bitter. A fernet-lover's amaro, not for the faint of heart.","producer_note":"Distilleria Bordiga, Cuneo — founded 1888; wild botanicals foraged in the Alps around Cuneo.","has_photo":true,"photo_credit":"vino.com"},{"id":6071,"name":"AMARO PUNICO","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"Sicily, Italy","abv":"30%","tasting_notes":"citrus notes are the first things that leap out of the glass. That taste is super balanced and mellow. The aftertaste is slightly bitter and vegetal.","producer_note":"A Sicilian amaro built on wild Mediterranean herbs — fennel, mint, sage, laurel, rosemary, and oregano. A good small step up for drinkers ready to move past the basics.","has_photo":false,"photo_credit":""},{"id":6072,"name":"VENTI AMARO","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Italy","abv":"","tasting_notes":"Orange and rhubarb up front, then fresh Mediterranean herbs, earthy warm botanicals and gentian — a round, gentle bittersweet finish.","producer_note":"Magi Spirits, Lake Como — a mother-and-son project (Gianna and Marco) blending 20 Italian botanicals; a non-alcoholic version of the same recipe also exists.","has_photo":true,"photo_credit":"drinks.ch"},{"id":6073,"name":"AMARO TREVISANO","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"Veneto, Italy","abv":"27%","tasting_notes":"Made with red radicchio and grappa — intense ruby red, dry and herbaceous with a bitter radicchio bite and a touch of sweetness.","producer_note":"Antica Distilleria Negroni, Treviso — made to an old Treviso recipe built on Radicchio Rosso di Treviso and grappa.","has_photo":true,"photo_credit":"oltrevino.it"},{"id":6074,"name":"AMARO FORMIDABILE","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"Rome, Italy","abv":"33%","tasting_notes":"Warm and silky with citrus peels, roasted cocoa, anise, rose and spice — intense and mouth-coating, with a long bitter finish.","producer_note":"Created by Armando Bomba in Rome — small-batch artisanal amaro of about 10,000 bottles a year, no colorings or flavorings.","has_photo":true,"photo_credit":"dialabottle.com"},{"id":6075,"name":"AMARO DELL 'ERBORISTA","category":"AMARI & HERBAL SPIRITS","price":"15","origin":"Marche, Italy","abv":"21%","tasting_notes":"Cloudy and unfiltered — honey-sweetened but dry and lastingly bitter, with gentian, rhubarb, stewed fruit and a whisper of smoke.","producer_note":"Distilleria Varnelli — family distilling since 1868 in the Sibillini mountains, now run by the fourth generation of women.","has_photo":true,"photo_credit":"delmesaliquor.com"},{"id":6076,"name":"FORTHAVE MARSEILLE AMARO","category":"AMARI & HERBAL SPIRITS","price":"15","origin":"Brooklyn, NY, USA","abv":"36%","tasting_notes":"Moderately bitter and warming — eucalyptus, cinnamon, rhubarb and honey with a pine-like depth. Made to the old 'four thieves' legend of Marseille.","producer_note":"Forthave Spirits, Brooklyn — founded by painter Aaron Sing Fox and writer Daniel de la Nuez; plant-based, mostly organic botanicals.","has_photo":true,"photo_credit":"astorwines.com"},{"id":6077,"name":"AMARO QUAGLIA BALSAMICO","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"Piedmont, Italy","abv":"25%","tasting_notes":"Mint-forward and balsamic up front, gently sweet, deep and spicy — rhubarb and cocoa melt into a cool, lingering peppermint finish.","producer_note":"Antica Distilleria Quaglia, Castelnuovo Don Bosco — 1890 family distillery; Balsamico 1890 won IWSC Silver 2025.","has_photo":true,"photo_credit":"dialabottle.com"},{"id":6078,"name":"AMARO LIMONIO","category":"AMARI & HERBAL SPIRITS","price":"14","origin":"","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"spiritsoffrance.com.au"},{"id":6079,"name":"AMARO LUSOR","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"Friuli-Venezia Giulia, Italy","abv":"26%","tasting_notes":"The nose is intoxicating and fresh with herbs & roots. On the palate it is distinctly bitter, with the gentian and cloves taking centre stage. The aftertaste is long, bitter and fresh, with persistent hits of cloves.","producer_note":"","has_photo":false,"photo_credit":""},{"id":6080,"name":"AMARO TIMOUS","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Sicily, Italy","abv":"28%","tasting_notes":"Light amber and slightly opalescent, with a green, vegetal character. Wild thyme and bergamot lead on the nose with a balsamic edge, rounded by vanilla notes from the chestnut honey. No added sugar or colouring — only a little natural chestnut honey — so it drinks drier and more bitter than most amari. Best neat or with a cigar.","producer_note":"Made in Sicily by the small artisan liqueur maker Nepèta. Timous is handcrafted by natural infusion of organically farmed botanicals, with no distillation, ageing or filtration.","has_photo":false,"photo_credit":""},{"id":6081,"name":"GOTHA BLU AMARO","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"Emilia Romagna, Italy","abv":"30%","tasting_notes":"It opens with aromas traditionally associated with whiskey, then notes of licorice, mint & mandarin sweep in. On the palate it is strong, but balanced in flavour, and showing some balsamic notes.","producer_note":"The goal behind this one: an amaro that is whiskey with a bitter interpretation — three-year-aged whiskey plus an absinthe infusion. It even covers both the whiskey and amaro halves of a Paper Plane riff.","has_photo":false,"photo_credit":""},{"id":6082,"name":"ELISIR NOVASALLUS","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"Trentino-Alto Adige, Italy","abv":"16%","tasting_notes":"A wine-based amaro built on dry Marsala — bold, intensely bitter and layered, with alpine herbs, resin, pine and earth. Famously comforting after a big meal.","producer_note":"Antica Erboristeria Cappelletti — a six-month process with 30+ botanicals; the house's flagship since the early 1900s.","has_photo":true,"photo_credit":"amaroaficionado.com"},{"id":6083,"name":"FERNET BRANCA","category":"AMARI & HERBAL SPIRITS","price":"9","origin":"Lombardy, Italy","abv":"39%","tasting_notes":"Strong and medicinal, with top notes of eucalyptus and elements of candy cane, mint toothpaste and mentholated cough drop. Extremely bitter — this is not the bottle to hand a fernet newcomer first; it usually takes a few tries to get past that initial bitterness.","producer_note":"Fratelli Branca Distillerie, Milan. Founded in 1845 and still family-owned, it is the fernet that defined the category — the benchmark every other fernet gets measured against.","has_photo":false,"photo_credit":""},{"id":6084,"name":"FERNET BRANCA MENTA","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Lombardy, Italy","abv":"39%","tasting_notes":"Strong and medicinal, with top notes of eucalyptus and elements of candy cane, mint toothpaste and mentholated cough drop. Extremely bitter — this is not the bottle to hand a fernet newcomer first; it usually takes a few tries to get past that initial bitterness.","producer_note":"Fratelli Branca Distillerie, Milan. Founded in 1845 and still family-owned, it is the fernet that defined the category — the benchmark every other fernet gets measured against.","has_photo":false,"photo_credit":""},{"id":6085,"name":"FACCIA BRUTTO FERNET PIANTA","category":"AMARI & HERBAL SPIRITS","price":"15","origin":"Brooklyn, USA","abv":"35%","tasting_notes":"A more nuanced fernet than many on the market — lighter in both colour and flavour, not the dense bitter beast. Powerful but not a bully.","producer_note":"Faccia Brutto (\"ugly face\") is a small Brooklyn distillery making Italian-style spirits; the Fernet Pianta is its take on the category.","has_photo":false,"photo_credit":""},{"id":6086,"name":"FERNET FRANCISCO WILLET RYE BARRELL AGED","category":"AMARI & HERBAL SPIRITS","price":"15","origin":"San Francisco, USA","abv":"40%","tasting_notes":"A Bay Area fernet rested in Willett rye barrels — deeply bitter and minty with grape brandy warmth, a dozen local herbs, and rich oak.","producer_note":"Made by Max Rudsten and Ben Flajnik in San Francisco — the city's first locally-crafted fernet, released in limited cask series.","has_photo":true,"photo_credit":"https://sf.flatiron-wines.com/products/fernet-francisco-cask-aged-in-willett-rye-barrels"},{"id":6087,"name":"FERNET FRANCISCO WILLET BOURBON BARRELL AGED","category":"AMARI & HERBAL SPIRITS","price":"15","origin":"San Francisco, USA","abv":"40%","tasting_notes":"A Bay Area fernet rested in Willett bourbon barrels — deeply bitter and herbal with rhubarb, mint and orange peel rounded by sweet oak.","producer_note":"Made by Max Rudsten and Ben Flajnik in San Francisco — the city's first locally-crafted fernet, released in limited cask series.","has_photo":true,"photo_credit":"https://sf.flatiron-wines.com/products/fernet-francisco-cask-aged-in-willett-rye-barrels"},{"id":6088,"name":"FERNET PAESANI","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"Abruzzo, Italy","abv":"40%","tasting_notes":"Spicy aroma with strong bitter notes. Intensely bitter on the palate, with big hits of rhubarb and cinchona; the bitterness and spice carry through a long, intense finish. Notably drier and less syrupy than Fernet Branca.","producer_note":"An Abruzzo-made fernet whose calling card is dryness — very little of the syrupy weight found in the bigger brands.","has_photo":false,"photo_credit":""},{"id":6089,"name":"LEONARDO SPADONI FERNET","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"Emilia-Romagna, Italy","abv":"51%","tasting_notes":"BIG — big even by fernet standards. A big wallop of mint followed by deep bitterness. Not for the faint of heart, but great for someone looking to move past Fernet Branca.","producer_note":"Leonardo Spadoni's fernet from Emilia-Romagna — a grappa-based, 51% bruiser.","has_photo":false,"photo_credit":""},{"id":6090,"name":"LUXARDO FERNET","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"Trentino, Italy","abv":"40%","tasting_notes":"Drier and more savory than most fernets — intensely bitter, built on gentian root, licorice and saffron, with black coffee and dark chocolate underneath. There is zero sweetness to soften it; the finish is long and herbal.","producer_note":"The Luxardo family — the historic liqueur house famous for its maraschino since 1821 — has been producing this fernet since 1889.","has_photo":false,"photo_credit":""},{"id":6091,"name":"MELETTI FERNET","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Marche, Italy","abv":"40%","tasting_notes":"Herbaceous nose with balsamic notes alongside the expected eucalyptus. Rich spices on the palate evolve into balsamic and mint before finishing on bitter gentian root. Long, persistent, clean and balanced — lighter in colour and more moderate in bitterness than most fernets, with hints of dark chocolate and espresso.","producer_note":"From Meletti, the Marche distillery whose spirits are known for that clean, balanced finish.","has_photo":false,"photo_credit":""},{"id":6092,"name":"QUAGLIA FERNET","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Piedmont, Italy","abv":"40%","tasting_notes":"No published tasting notes found for this bottling.","producer_note":"Antica Distilleria Quaglia — a fourth-generation family distillery at Castelnuovo Don Bosco in Piedmont, operating since 1890. Known for the Bèrto line of vermouths and liqueurs, built on long infusions of local botanicals.","has_photo":false,"photo_credit":""},{"id":6093,"name":"ULRICH FERNET","category":"AMARI & HERBAL SPIRITS","price":"15","origin":"","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"https://www.grappa.lt/product/other-drinks/likeris-fernet-ulrich-marolo/"},{"id":6094,"name":"FORTHAVE GENEPI","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"Brooklyn, NY, USA","abv":"24%","tasting_notes":"Forthave's yellow génépi — wine infused with alpine flowers, then fortified and sweetened. Floral and chamomile-like, a gentler, lower-alcohol alpine digestif.","producer_note":"Forthave Spirits, Brooklyn — a lower-alcohol (48 proof) take on the classic French Alpine digestif.","has_photo":true,"photo_credit":"https://gacraftspirits.com/products/forthave-spirits-yellow-genepi-750ml"},{"id":6095,"name":"GREEN CHARTREUSE","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"French Alps, France","abv":"55%","tasting_notes":"Intensely herbal and warming — pine, mint, anise and citrus over honeyed sweetness, with an exceptionally long, warming finish. Essential in a Last Word.","producer_note":"Carthusian monks (Pères Chartreux) — 130 botanicals from a 1605 manuscript; only two monks know the full recipe.","has_photo":true,"photo_credit":"https://vinearts.ca/products/chartreuse-green-chartreuse"},{"id":6096,"name":"YELLOW CHARTREUSE","category":"AMARI & HERBAL SPIRITS","price":"13","origin":"French Alps, France","abv":"40%","tasting_notes":"Softer and sweeter than green — honey, saffron and chamomile with gentle herbs and spice. A mellow, golden sipping liqueur.","producer_note":"Carthusian monks (Pères Chartreux) — the monks' milder, sweeter expression, introduced in 1838.","has_photo":true,"photo_credit":"https://vinicolamauri.it/tag-prodotto/francia/"},{"id":6097,"name":"FACCIA BRUTTO CENTERBE","category":"AMARI & HERBAL SPIRITS","price":"15","origin":"Brooklyn, NY, USA","abv":"45%","tasting_notes":"Bright and vividly green — fresh herbs like lemon balm, tarragon, parsley and anise hyssop. A bracing, less-sweet stand-in for Chartreuse.","producer_note":"Faccia Brutto Spirits, Brooklyn — founded 2020 by former chef Patrick Miller; the name ('ugly face') is a jab from his Italian grandmother.","has_photo":true,"photo_credit":"https://mercadogama.mx/products/faccia-brutto-spirits-centerbe-750ml"},{"id":6098,"name":"DOLIN GENEPY LE CHAMOIS","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"Savoie, France","abv":"45%","tasting_notes":"Bright alpine herbs — sage, mint, anise and chamomile — sweet up front, cooling and gently bitter behind. A lighter, refined Chartreuse cousin.","producer_note":"Maison Dolin, Chambéry — making spirits since 1821 with its own alembic still and local farmers' herbs.","has_photo":true,"photo_credit":"https://spiritsoffrance.com.au/collections/liqueurs"},{"id":6099,"name":"SCUPPOZ GENZIANA","category":"AMARI & HERBAL SPIRITS","price":"12","origin":"Abruzzo, Italy","abv":"","tasting_notes":"A gentian liqueur from Abruzzo — starts sweet, then a long, clean, very pleasant bitter aftertaste. A classic digestif.","producer_note":"Scuppoz, Campli, Abruzzo — pioneers of Italy's first cultivated gentian plantation at 2,000m in the Gran Sasso national park.","has_photo":true,"photo_credit":"https://www.scuppoz.it/tutti-i-prodotti/delle-pecore-amaro-alle-radici-di-genziana-100cl.html"},{"id":6100,"name":"SALERS GENTIANE","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Auvergne, France","abv":"16%","tasting_notes":"Bright earthiness of gentian — floral, vegetal, a touch of citrus — with firm bitterness softened by oak aging and light sweetness. A rustic Suze-style aperitif.","producer_note":"Distillerie de la Salers, established 1885 — the oldest gentian liqueur of the Massif Central, from wild roots on the volcanic Puy Mary.","has_photo":true,"photo_credit":"https://www.vins-compagnie.fr/achats-alcools/1592-mattei-cap-corse-rouge-3268140000107.html"},{"id":6101,"name":"STREGA","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"Benevento, Italy","abv":"40%","tasting_notes":"Bright golden herbal liqueur — sweet at first with mint, juniper, saffron and fennel, finishing warm and lightly bitter.","producer_note":"Strega Alberti, Benevento — family company making it since 1860 from a secret recipe of ~70 botanicals, aged in ash barrels.","has_photo":true,"photo_credit":"https://winesellersdirect.com.au/products/strega-liqueur-700ml"},{"id":6102,"name":"LUXARDO DEL SANTO","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Veneto, Italy","abv":"40%","tasting_notes":"Bold, bittersweet Italian herbal liqueur — thyme, sage, anise and gentian with warm spice and a floral lift. A more approachable Last Word than green Chartreuse.","producer_note":"Luxardo, Torreglia — founded 1821, famed for Maraschino; over 20 botanicals including the rare alpine flower achillea moscata.","has_photo":true,"photo_credit":"https://shop.hotalingandco.com/products/luxardo-del-santo-liqueur"},{"id":6103,"name":"SKINOS DARK MATIHA & COFFEE BITTER","category":"AMARI & HERBAL SPIRITS","price":"11","origin":"Chios, Greece","abv":"35%","tasting_notes":"Fine Arabica coffee blended with Chios mastiha resin — roasted and resinous, pine-and-anise notes. Best straight from the freezer.","producer_note":"Skinos — Greek distillers specializing in mastiha, the rare resin harvested only on the island of Chios.","has_photo":true,"photo_credit":"https://www.lcbo.com/fr/skinos-dark-mastiha-coffee-bitter-43070"},{"id":6104,"name":"BADEL PELINKOVAC","category":"AMARI & HERBAL SPIRITS","price":"9","origin":"Croatia","abv":"31%","tasting_notes":"Wormwood-driven herbal bitter with 26 medicinal herbs — bittersweet and spicy, with licorice, fig and a whisper of anise. Best chilled.","producer_note":"Badel 1862 — one of Croatia's oldest spirits producers; the flagship wormwood liqueur dates back to the 1862 recipe.","has_photo":true,"photo_credit":"https://www.universalfws.com/product/badel-pelinkovac-gorki-700ml/"},{"id":6105,"name":"CHARTREUSE LIQUEUR D'ELIXIR 1605","category":"AMARI & HERBAL SPIRITS","price":"15","origin":"France","abv":"56%","tasting_notes":"A re-creation of the original 1605 elixir — the ancestor of Green Chartreuse. More potent and concentrated: deep, powerful, intensely herbal.","producer_note":"Carthusian monks — created in 2005 to mark 400 years since the 1605 manuscript, made to the monks' 130-botanical recipe.","has_photo":true,"photo_credit":"https://www.nevejan.eu/fr/catalog/product/view/id/59339"},{"id":7001,"name":"BUSHMILLS MALT 10YR","category":"IRISH WHISKEY","price":"8","origin":"Ireland — County Antrim, Northern Ireland","abv":"40%","tasting_notes":"Honey, vanilla and milk chocolate with fruity apple and tropical notes from the sherry and bourbon casks it aged in for 10 years; smooth and approachable.","producer_note":"The Old Bushmills Distillery in Co. Antrim holds a distilling licence dating to 1608, making it one of the world's oldest licensed distillery sites.","has_photo":true,"photo_credit":"https://www.luekensliquors.com/product/bushmills-single-malt-10yr/"},{"id":7002,"name":"DRUMSHANBO","category":"IRISH WHISKEY","price":"12","origin":"Ireland — Drumshanbo, Co. Leitrim","abv":"43%","tasting_notes":"Creamy and full-bodied with toasted nuts, vanilla, honey and toffee, followed by winter spice, red currant and dark chocolate; a balance of sweet and spicy.","producer_note":"Made by The Shed Distillery of PJ Rigney, a family-run craft distillery on the shores of Lough Allen — the first Irish whiskey from the western province of Connacht in over 105 years.","has_photo":true,"photo_credit":"https://www.thesheddistillery.com/product/drumshanbo-single-pot-still-irish-whis"},{"id":7003,"name":"GREENSPOT","category":"IRISH WHISKEY","price":"13","origin":"Ireland — distilled at Midleton, Co. Cork","abv":"40%","tasting_notes":"Fresh green apple and pear with honey, vanilla and baking spice; creamy and smooth with a crisp, refreshing finish.","producer_note":"A historic single pot still whiskey made for Dublin wine merchants Mitchell & Son, distilled at Midleton Distillery — one of the last 'bonded' whiskeys, named for the painted spots on the merchants' casks.","has_photo":true,"photo_credit":"https://www.remedyliquor.com/products/green-spot-whiskey-single-pot-still-irish-in-bordeaux-wine-casks-ch-leo-barton-92pf-750ml?search=top-products"},{"id":7004,"name":"JAMESON","category":"IRISH WHISKEY","price":"7","origin":"Ireland — Midleton, Co. Cork","abv":"40%","tasting_notes":"Smooth and sweet with vanilla, caramel and honey, a touch of toasted wood and gentle spice; famously easy-drinking.","producer_note":"Founded by John Jameson in Dublin in 1780, now produced at the Midleton Distillery — one of the best-selling Irish whiskeys in the world, made from a blend of pot still and grain whiskeys.","has_photo":true,"photo_credit":"https://page-timekjnibdfdfv.pages.dev/ideas/jameson-irish-whiskey/898271824193/"},{"id":7005,"name":"REDBREAST 12YR","category":"IRISH WHISKEY","price":"15","origin":"Ireland — Midleton, Co. Cork","abv":"40%","tasting_notes":"Rich and full with dried fruit, honey and toasted oak, Christmas-cake warmth and baking spice; creamy and silky smooth.","producer_note":"Produced at Midleton Distillery, Redbreast 12 is the benchmark single pot still whiskey — aged 12 years in bourbon and sherry casks, named Irish Whiskey of the Year in Jim Murray's Whisky Bible 2010.","has_photo":true,"photo_credit":"https://www.kingswineandspirits.com/collections/irish-whiskey"},{"id":7006,"name":"TEELING SINGLE GRAIN","category":"IRISH WHISKEY","price":"13","origin":"Ireland — Dublin","abv":"46%","tasting_notes":"Silky and sweet with ripe red berries, grapes and vanilla over a soft corn base; spice and a dry, wine-like finish from the red wine casks.","producer_note":"From Teeling Distillery in Dublin's Liberties — the first new distillery in Dublin in over 125 years when it opened in 2015, revived by Jack and Stephen Teeling.","has_photo":true,"photo_credit":"https://thaibeveragestore.com/brand/teeling/"},{"id":7007,"name":"WRITER'S TEARS","category":"IRISH WHISKEY","price":"10","origin":"Ireland — Co. Carlow","abv":"40%","tasting_notes":"Soft and smooth with green apple, honey and vanilla, a gentle ginger spice and butterscotch; long, elegant finish with a hint of milk chocolate.","producer_note":"A marriage of single pot still and single malt whiskeys from the Walsh family at Walsh Whiskey Distillery in Co. Carlow, matured in flame-charred bourbon casks.","has_photo":true,"photo_credit":"https://www.thespiritsbusiness.com/2022/05/writers-tears-celebrates-ulysses-with-new-bottle/"},{"id":8001,"name":"ABERLOUR 12YR","category":"SINGLE MALT","price":"13","origin":"Scotland — Speyside","abv":"40%","tasting_notes":"Soft and rounded, with red apple and juicy orchard fruit on the nose. On the palate a rich sherry character — chocolate, toffee and a hint of spice — with a warm, sweet, gently spicy finish.","producer_note":"Founded in 1879 by James Fleming on the banks of the River Spey; the 12 Year Old is double-matured in American oak and seasoned sherry butts.","has_photo":true,"photo_credit":"https://spiritsnetwork.com/aberlour-12-years-86-proof/"},{"id":8002,"name":"ARDBEG 10YR","category":"SINGLE MALT","price":"12","origin":"Scotland — Islay","abv":"46%","tasting_notes":"Big and smoky: a burst of peat smoke with zesty lemon and lime, wrapped in waxy dark chocolate and a salty sea breeze. Long, smoky finish of espresso, pepper and tar.","producer_note":"Founded in 1815 on Islay's south coast and owned by The Glenmorangie Company; revered as the peatiest, smokiest and most complex of the Islay malts.","has_photo":true,"photo_credit":"https://www.themastercellar.com/ardberg-10yr-old-70cl/"},{"id":8003,"name":"ARDBEG 5YR WEE BEASTIE","category":"SINGLE MALT","price":"12","origin":"Scotland — Islay","abv":"47.4%","tasting_notes":"Young, bold and untamed: intense smoke with cracked black pepper and pine resin, then bursts of chocolate, tar, creosote and smoky bacon. Long, salty finish with a cocoa edge.","producer_note":"Ardbeg's youngest core expression at just five years old, matured in ex-bourbon and Oloroso sherry casks and bottled without chill filtration.","has_photo":true,"photo_credit":"cdn.shopify.com"},{"id":8004,"name":"AUCHENTOSHAN 12YR","category":"SINGLE MALT","price":"12","origin":"Scotland — Lowlands","abv":"40%","tasting_notes":"Light, smooth and fruity: poached pears, honey and vanilla with a gentle green-apple sweetness and soft spice. Delicate, easy-drinking and quietly nutty.","producer_note":"Est. 1823 near Glasgow in the Lowlands; the only Scotch distillery to triple-distil every drop, producing an exceptionally smooth, delicate spirit.","has_photo":true,"photo_credit":"https://curiada.com/products/auchentoshan-12-year-old-single-malt-scotch-whisky"},{"id":8005,"name":"BALVENIE 12YR DOUBLEWOOD","category":"SINGLE MALT","price":"19","origin":"Scotland — Speyside","abv":"43%","tasting_notes":"Smooth and sweet: honey, vanilla and ripe stone fruit from American oak, layered with dried fruit, cinnamon and a nutty sherry warmth from the Oloroso cask finish.","producer_note":"Dufftown distillery est. 1892; still floor-malts its own barley and employs coopers and coppersmiths on site — cask finishing pioneered by Malt Master David Stewart.","has_photo":true,"photo_credit":"goodbottleauctions.com"},{"id":8006,"name":"BALVENIE 14YR CARIBBEAN CASK","category":"SINGLE MALT","price":"25","origin":"Scotland — Speyside","abv":"43%","tasting_notes":"Rich and tropical: creamy toffee, vanilla and warm brown sugar, with banana, coconut and ripe fruit from the Caribbean rum cask finish. Long, warm and gently spiced.","producer_note":"Finished in casks seasoned with a special blend of West Indian rums personally chosen by Malt Master David Stewart at The Balvenie, Dufftown.","has_photo":true,"photo_credit":"https://bottle-brothers.de/shop/balvenie-caribbean-cask-14-years/"},{"id":8007,"name":"BENROMACH 10YR","category":"SINGLE MALT","price":"10","origin":"Scotland — Speyside","abv":"43%","tasting_notes":"Classic Speyside with a whisper of smoke: green apple, pear and honey with vanilla, toffee and black cherry, dried fruit from the sherry casks, and a gently smoky, malty finish.","producer_note":"Small Forres distillery est. 1898 and revived by Gordon & MacPhail in 1998; known for traditional hand-crafted methods and a light 'whisper' of peat.","has_photo":true,"photo_credit":"https://www.roosburgfinespirits.be/product/21450903/benromach-10y-single-malt-scotch-whisky"},{"id":8008,"name":"BENROMACH ORGANIC","category":"SINGLE MALT","price":"14","origin":"Scotland — Speyside","abv":"43%","tasting_notes":"Sweet and malty with ripe banana, vanilla and toffee from virgin oak casks, a touch of peppery spice and tropical fruit, with a smooth, long, fruity finish.","producer_note":"The world's first Soil Association-certified organic single malt when launched in 2006 — certified from barley growing through distillation, maturation and bottling.","has_photo":true,"photo_credit":"https://www.whiskytower.se/benromach-organic-2010-43"},{"id":8009,"name":"BOWMORE 12YR","category":"SINGLE MALT","price":"12","origin":"Scotland — Islay","abv":"40%","tasting_notes":"Gently smoky: lemon, heather honey and soft peat smoke with a briny sea-salt note and light oak. Smooth, balanced and approachable, with a mellow smoky finish.","producer_note":"Islay's oldest distillery, founded in 1779 on the shores of Loch Indaal; ages whisky in the No. 1 Vaults, Scotland's oldest maturation warehouse.","has_photo":true,"photo_credit":"https://tastingroom.bg/%D0%B5%D1%82%D0%B8%D0%BA%D0%B5%D1%82%D0%B8/%D0%B0%D0%B9%D0%BB%D0%B0/"},{"id":8010,"name":"DALMORE 12YR","category":"SINGLE MALT","price":"15","origin":"Scotland — Highlands","abv":"40%","tasting_notes":"Rich and sweet: candied Seville orange, dark chocolate and warm aromatic spice, with dried fruit and vanilla from the Oloroso sherry cask finish. Long, smooth and warming.","producer_note":"Highland distillery at Alness on the Cromarty Firth, est. 1839; famous for its exceptional sherry cask finishing under Master Distiller Richard Paterson.","has_photo":true,"photo_credit":"https://www.premierwines.com/products/the-dalmore-aged-12-years-807"},{"id":8011,"name":"HIGHLAND PARK 12YR","category":"SINGLE MALT","price":"13","origin":"Scotland — Orkney","abv":"43%","tasting_notes":"The perfect balance of smoke and sweetness: heather honey, citrus and winter spice with a gentle aromatic peat smoke. Full, rounded and warming, with a soft spiced finish.","producer_note":"Kirkwall, Orkney — one of Scotland's northernmost distilleries, est. 1798; still floor-malts its own barley and uses aromatic peat from Hobbister Moor.","has_photo":true,"photo_credit":"https://fatcatguild.com/index.cfm?module=blog&pagemode=dosearch&topic=highland-park-12yr-old-scotch-whisky&page_id=566840"},{"id":8012,"name":"LAGAVULIN 8YR","category":"SINGLE MALT","price":"16","origin":"Scotland — Islay","abv":"48%","tasting_notes":"Bold, clean peat smoke with fresh citrus, milk chocolate and a salty sea-air note. Sweet and smoky on the palate with charred dark chocolate, mint and a long, dry, ashy finish.","producer_note":"Founded in 1816 on Islay's south coast near Port Ellen and owned by Diageo; this expression launched for the distillery's 200th anniversary.","has_photo":true,"photo_credit":"https://tastersclub.com/products/lagavulin-8-year"},{"id":8013,"name":"LAGAVULIN 16YR","category":"SINGLE MALT","price":"25","origin":"Scotland — Islay","abv":"43%","tasting_notes":"Deep and polished: rich peat smoke, iodine and dried fruit — raisins, figs, dates — with vanilla, sea salt and dark chocolate. Huge, long, warming, peppery finish.","producer_note":"Lagavulin's flagship, known as the 'king of Islay' — slowly distilled and matured for 16 years in oak, and the distillery's principal expression for over 30 years.","has_photo":true,"photo_credit":"http://blog.wineandcheeseplace.com/2014/01/lagavulin-16yr-back-in-stock.html"},{"id":8014,"name":"LAGAVULIN DISTILLERS EDITION PX CASK","category":"SINGLE MALT","price":"29","origin":"Scotland — Islay","abv":"43%","tasting_notes":"The classic Lagavulin 16 with extra sweetness from Pedro Ximenez sherry casks: peat smoke meets raisin, dark chocolate, coffee and vanilla. Rich, malty and long.","producer_note":"Part of Diageo's annual Distillers Edition series — the 16 Year Old double-matured with a finish in sweet Pedro Ximenez sherry casks, a technique Lagavulin pioneered.","has_photo":true,"photo_credit":"https://getabottle.de/fr-lu/products/lagavulin-distillers-edition-px-casks-single-malt-scotch-whisky-0-7l-43"},{"id":8015,"name":"LAPHROAIG 10YR","category":"SINGLE MALT","price":"13","origin":"Scotland — Islay","abv":"43%","tasting_notes":"Big, medicinal peat smoke with seaweed, iodine and salty sea air, balanced by a surprising underlying sweetness. Bold, briny and unmistakable, with a long smoky finish.","producer_note":"Founded in 1815 by the Johnston brothers on Islay's south coast; still floor-malts its own barley over local peat and is now owned by Beam Suntory.","has_photo":true,"photo_credit":"https://www.masterofmalt.com/whiskies/laphroaig-10-year-old-cask-strength-whisky/"},{"id":8016,"name":"LAPHROAIG QUARTER CASK","category":"SINGLE MALT","price":"17","origin":"Scotland — Islay","abv":"48%","tasting_notes":"A stronger, woodier Laphroaig: the signature peat smoke, seaweed and iodine softened with coconut, vanilla and honey from the small quarter casks. Rich, oily and full at 48%.","producer_note":"Rests about five years in ex-bourbon barrels, then finishes in small quarter casks — reviving an old tradition where extra wood contact adds sweetness and depth.","has_photo":true,"photo_credit":"www.maltwhisky.de"},{"id":8017,"name":"MACALLAN DOUBLE CASK 12YR","category":"SINGLE MALT","price":"20","origin":"Scotland — Speyside","abv":"43%","tasting_notes":"Smooth and honeyed: creamy butterscotch, candied orange and vanilla from American oak, with raisins, cinnamon and warm spice from the European sherry casks. Sweet, warming finish.","producer_note":"Founded in 1824 at Craigellachie on the Easter Elchies estate; obsessed with sherry-seasoned oak — every cask is crafted and seasoned in Jerez, Spain.","has_photo":true,"photo_credit":"https://skhemrat.com/shopdetail/8081198885"},{"id":8018,"name":"OBAN 14YR","category":"SINGLE MALT","price":"22","origin":"Scotland — West Highlands","abv":"43%","tasting_notes":"Coastal Highland balance: orange peel, honey and sea salt with a whisper of peat smoke. Full-bodied and silky, finishing long with gentle spice and lingering sea air.","producer_note":"One of Scotland's smallest and oldest distilleries, est. 1794 in the west-coast port of Oban; one of Diageo's Classic Malts, distilled where Highland meets island.","has_photo":true,"photo_credit":"https://ixtri.mt/product/0df9a0b0-a61e-5612-8df4-e5e35ce5d9e3"},{"id":8019,"name":"TALISKER 10YR","category":"SINGLE MALT","price":"17","origin":"Scotland — Isle of Skye","abv":"45.8%","tasting_notes":"Wild and maritime: powerful peat smoke, sea salt and black pepper, with dried-fruit sweetness and citrus beneath. Long, warming, peppery finish with a briny edge.","producer_note":"The Isle of Skye's only distillery, founded in 1830 at Carbost on Loch Harport and owned by Diageo; famous for its stormy, sea-sprayed character.","has_photo":true,"photo_credit":"https://anzacoffsales.co.uk/product/talisker-10yr/?utm_source=rss&utm_medium=rss&utm_campaign=talisker-10yr"},{"id":8020,"name":"TALISKER 11YR CASK STRENGTH","category":"SINGLE MALT","price":"28","origin":"Scotland — Isle of Skye","abv":"55.1%","tasting_notes":"Cask-strength Talisker at full power: briny sea spray, lemon zest and green apple up front, then bold pepper, chilli heat, toffee and dried fruit. Powerful and long.","producer_note":"Diageo's 2022 Special Release — matured in ex-bourbon and wine-seasoned casks and bottled at natural cask strength from the Isle of Skye's Talisker distillery.","has_photo":true,"photo_credit":"https://www.nicks.com.au/products/talisker-11-year-old-special-release-2022-cask-strength-single-malt-scotch-whisky-700ml"},{"id":9001,"name":"NIKKA FROM THE BARREL","category":"JAPANESE WHISKY","price":"17","origin":"Japan","abv":"51.4%","tasting_notes":"Bold and rich with toffee, dark chocolate, dried fruit and warming spice; full-bodied at cask strength with a long, spicy finish.","producer_note":"A blend of malt and grain whiskies from Nikka's Yoichi and Miyagikyo distilleries, married in used barrels and bottled at cask strength; Nikka was founded in 1934 by Masataka Taketsuru.","has_photo":true,"photo_credit":"https://customwhisky.hk/products/nikka-whisky-from-the-barrel"},{"id":10001,"name":"COLLINGWOOD DOUBLE BARRELED","category":"CANADIAN WHISKY","price":"8","origin":"Ontario, Canada — Collingwood","abv":"45%","tasting_notes":"Dry cinnamon spice, toasted oak and lightly dried orchard fruit; smooth and warm with a rye-spiced finish.","producer_note":"Distilled at Brown-Forman's Canadian Mist distillery in Collingwood, Ontario — aged twice in oak and finished with toasted maplewood staves.","has_photo":true,"photo_credit":"https://nlliquor.com/store/bay-roberts/"},{"id":10002,"name":"CROWN ROYAL NORTHERN HARVEST RYE","category":"CANADIAN WHISKY","price":"8","origin":"Manitoba, Canada — Gimli","abv":"45%","tasting_notes":"Rye spice, butterscotch and spiced vanilla with apple and caramel notes; smooth, creamy and well-balanced.","producer_note":"Crown Royal was created in 1939 to honour the visit of King George VI and Queen Elizabeth; distilled in Gimli, Manitoba — the first Canadian whisky named World Whisky of the Year by Jim Murray's Whisky Bible (2016).","has_photo":true,"photo_credit":"http://www.imbibersjournal.com/2021/06/crown-royal-northern-harvest-rye-27-and.html"},{"id":10003,"name":"FORTY CREEK BARREL SELECT","category":"CANADIAN WHISKY","price":"8","origin":"Ontario, Canada — Grimsby (Niagara)","abv":"40%","tasting_notes":"Honey, vanilla and apricot with toasted oak and a gentle rye spice; rich and bold yet smooth.","producer_note":"Forty Creek, in the Niagara region of Ontario, is unusual among Canadian distilleries for distilling its whisky in a copper pot still; Barrel Select is the blend that started it all.","has_photo":true,"photo_credit":"https://www.bswliquor.com/products/forty-creek-barrel-select"},{"id":10004,"name":"GOODERHAM & WORTS","category":"CANADIAN WHISKY","price":"8","origin":"Ontario, Canada — Windsor","abv":"44.4%","tasting_notes":"Red apple, fresh bread, caramel and barley malt with a warm oak and spice finish; full and round, light and heavy at once.","producer_note":"Revives a Toronto distilling name dating to 1832 — once the largest distillery in the world — now blended from corn, wheat, barley and rye at Hiram Walker & Sons in Windsor by master blender Dr. Don Livermore.","has_photo":true,"photo_credit":"https://www.dramgood.ca/gooderham-worts/canadian-whisky"},{"id":10005,"name":"LOT 40","category":"CANADIAN WHISKY","price":"9","origin":"Ontario, Canada — Windsor","abv":"43%","tasting_notes":"Dark rye bread, pear and honey with white pepper, toffee and clove; bold, spicy and drying with a long oak finish.","producer_note":"A 100% rye whisky distilled one small batch at a time in a traditional copper pot still at Hiram Walker & Sons in Windsor — named Canadian Whisky of the Year in 2015.","has_photo":true,"photo_credit":"cdn11.bigcommerce.com"},{"id":11001,"name":"AZULEJOS BLANCO","category":"TEQUILA","price":"18","origin":"Jalisco, Mexico","abv":"40%","tasting_notes":"Sweet and savory, with notes of olive brine, lime citrus, and salt, and a hint of leather. Clean, refreshing, and smooth on the finish.","producer_note":"Los Azulejos is owned by Don Pedro Quintanilla, grandson of an agave grower; produced at Destiladora del Valle de Tequila (NOM 1438), Jalisco.","has_photo":true,"photo_credit":"cdn.shoplightspeed.com"},{"id":11002,"name":"AZULEJOS SKELLY BLANCO","category":"TEQUILA","price":"20","origin":"Jalisco, Mexico","abv":"40%","tasting_notes":"Velvety with a sweet-and-savory mix of olive brine, lime citrus, and salt, finishing with a subtle leathery note. Fresh and zesty with peppery, floral undertones.","producer_note":"Los Azulejos, owned by Don Pedro Quintanilla; the Día de los Muertos skull decanter is hand-painted by Mexican artisans.","has_photo":true,"photo_credit":"https://www.liquoronbroadway.com/products/los-azulejos-skelly-mustache-blanco-tequila"},{"id":11003,"name":"CASA LEGACIA BLANCO","category":"TEQUILA","price":"19","origin":"Amatitán, Jalisco, Mexico","abv":"40%","tasting_notes":"","producer_note":"Brand of Sandra Luquin, a Maestra Tequilera, who also runs a consultancy that helps build new tequila and mezcal brands.","has_photo":true,"photo_credit":"https://www.oldtowntequila.com/casa-legacia/"},{"id":11004,"name":"CASA MAESTRI BLANCO","category":"TEQUILA","price":"18","origin":"Jalisco, Mexico","abv":"40%","tasting_notes":"Fresh cooked agave with lime citrus and white pepper; clean, lively, and smooth with a peppery, herbal finish.","producer_note":"Flagship brand of the Casa Maestri distillery in Jalisco, founded by Celia Maestri; bottled in the brand's signature stainless steel flask.","has_photo":true,"photo_credit":"https://landers.ph/whats-new/casa-maestri-reserva-de-mfm-blanco-agave-tequila-ceramic-1-l-150604-49838"},{"id":11005,"name":"CASAMIGOS BLANCO","category":"TEQUILA","price":"13","origin":"Atotonilco El Alto, Jalisco, Mexico","abv":"40%","tasting_notes":"Crisp and smooth with bright citrus, sweet cooked agave, and a light touch of vanilla.","producer_note":"Founded in 2013 by George Clooney, Rande Gerber, and Mike Meldman as a private house tequila; now owned by Diageo.","has_photo":true,"photo_credit":"https://astonsofmanchester.co.uk/product-category/spirits-liqueurs/tequila/"},{"id":11006,"name":"CASAMIGOS REPOSADO","category":"TEQUILA","price":"16","origin":"Atotonilco El Alto, Jalisco, Mexico","abv":"40%","tasting_notes":"Smooth and sweet with caramel, cocoa, and vanilla over roasted agave; rested 7 months in American oak barrels.","producer_note":"Founded in 2013 by George Clooney, Rande Gerber, and Mike Meldman as a private house tequila; now owned by Diageo.","has_photo":true,"photo_credit":"https://www.excaliburshop.com/item/12206/casamigos-reposado-tequila-40-1-l/?utm_source=heureka.cz&utm_medium=cpc&utm_campaign=feed&ids=59&a_box=smj95jad&a_cha=znackovyalkohol-casamigos-reposado-tequila-1l-40"},{"id":11007,"name":"CASAMIGOS ANEJO","category":"TEQUILA","price":"18","origin":"Atotonilco El Alto, Jalisco, Mexico","abv":"40%","tasting_notes":"Rich and rounded with caramel, vanilla, and gentle oak spice; aged 14 months in American oak.","producer_note":"Founded in 2013 by George Clooney, Rande Gerber, and Mike Meldman as a private house tequila; now owned by Diageo.","has_photo":true,"photo_credit":"https://knoldranken.nl/product-categorie/tequila/?add-to-cart=13510"},{"id":11008,"name":"DON JULIO 1942 ANEJO","category":"TEQUILA","price":"40","origin":"Atotonilco El Alto, Los Altos, Jalisco, Mexico","abv":"40%","tasting_notes":"Silky and sweet with caramel, vanilla, chocolate, and warm cinnamon; aged a minimum of 2.5 years in oak.","producer_note":"Named for founder Don Julio González, who began making tequila in 1942; produced at the La Primavera distillery (NOM 1449).","has_photo":true,"photo_credit":"https://qualityliquorstore.com/collections/sale"},{"id":11009,"name":"EL TEQUILENO REPOSADO GRAN RESERVA","category":"TEQUILA","price":"11","origin":"Tequila, Jalisco, Mexico","abv":"40%","tasting_notes":"Creamy and rich with honey, caramelized agave, vanilla, and soft oak; a silky finish with lingering sweetness.","producer_note":"Family-run distillery in Tequila, Jalisco (NOM 1108) under Master Distiller Tony Salles; the family tradition dates to 1959.","has_photo":true,"photo_credit":"cdn.shopify.com"},{"id":11010,"name":"ELEVACION 1850 BLANCO","category":"TEQUILA","price":"10","origin":"","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"https://www.kensingtonwinemarket.com/products/liqubrandy?page=646"},{"id":11011,"name":"GRAND MAYAN EXTRA ANEJO","category":"TEQUILA","price":"32","origin":"Amatitán, Jalisco, Mexico","abv":"40%","tasting_notes":"Rich and velvety with dark chocolate, caramel, butterscotch, vanilla, toasted oak, and nuts; long, sweet finish.","producer_note":"Founded by tequila industry veteran Carlos Monsalve; aged 3-5 years in ex-bourbon and ex-cognac casks; hand-painted Talavera decanter.","has_photo":true,"photo_credit":"https://binendswine.com/products/grand-mayan-ultra-anejo-tequila"},{"id":11012,"name":"LA GRAN SENORA REPOSADO","category":"TEQUILA","price":"15","origin":"Arandas, Los Altos, Jalisco, Mexico","abv":"40%","tasting_notes":"Bright and youthful with tropical fruit, herbal notes, and a hint of jalapeño heat over cooked agave and green olive; rested 6 months in oak.","producer_note":"Crafted by the Camarena family at Gran Dinastía distillery (NOM 1610) in Arandas, Jalisco; estate-grown highland agave.","has_photo":true,"photo_credit":"https://maisonbrondeau.com/products/la-gran-senora-tequila-reposado"},{"id":11013,"name":"LA GRAN SENORA ANEJO","category":"TEQUILA","price":"17","origin":"Arandas, Los Altos, Jalisco, Mexico","abv":"40%","tasting_notes":"Smooth and elegant with dried apple, almond, peach, cinnamon, vanilla, and soft oak; rested 12 months in oak.","producer_note":"Crafted by the Camarena family at Gran Dinastía distillery (NOM 1610) in Arandas, Jalisco; estate-grown highland agave.","has_photo":true,"photo_credit":"https://www.bestbottlesnyc.com/la-gran-senora-tequila-anejo.html"},{"id":11014,"name":"LOS ARANGO REPOSADO","category":"TEQUILA","price":"9","origin":"Guanajuato, Mexico","abv":"40%","tasting_notes":"Peppery and refreshing with green pepper, fresh-cut grass, walnut, and a squeeze of lemon; punchy, spicy finish.","producer_note":"Small traditional brand from the Corralejo region of Guanajuato; the Reposado rests 6 months in oak barrels.","has_photo":true,"photo_credit":"https://doordash.com/products/los-arango-80-proof-reposado-tequila-bottle-750-ml/urpc_642b1ac3-4015-4a48-97ac-60b459f4a909"},{"id":11015,"name":"PATRON EL CIELO SILVER","category":"TEQUILA","price":"30","origin":"Jalisco, Mexico","abv":"40%","tasting_notes":"Ultra-smooth and silky with sweet agave, bright citrus, and light vanilla; a clean, crisp, fresh finish. Distilled four times.","producer_note":"Patrón's prestige silver tequila, four-times distilled at Hacienda Patrón under Master Distiller David Rodriguez.","has_photo":true,"photo_credit":"https://thestore.mt/products/stp02d?pr_prod_strat=e5_desc&pr_rec_id=75820689f&pr_rec_pid=4701299081348&pr_ref_pid=4701289382020&pr_seq=uniform"},{"id":11016,"name":"TROMBA BLANCO","category":"TEQUILA","price":"9","origin":"Los Altos, Jalisco, Mexico","abv":"40%","tasting_notes":"Bright citrus, sweet cooked agave, and white pepper with fresh herbal notes; clean, crisp, and smooth.","producer_note":"Independent brand created by Master Distiller Marco Cedano, former distiller of Don Julio; small-batch, highland agave tequila.","has_photo":true,"photo_credit":"https://www.nicks.com.au/products/tromba-100-agave-blanco-tequila-750ml"},{"id":11017,"name":"TROMBA REPOSADO","category":"TEQUILA","price":"10","origin":"Los Altos, Jalisco, Mexico","abv":"40%","tasting_notes":"Smooth with chocolate, almonds, and orange; aged 6-8 months in once-used American whiskey barrels.","producer_note":"Independent brand created by Master Distiller Marco Cedano, former distiller of Don Julio; small-batch, highland agave tequila.","has_photo":true,"photo_credit":"https://on.domusone.ca/product/tequila-tromba-tequila-tromba-duty-free-reposado-6x700ml/01t4V000008Wj75QAC"},{"id":11018,"name":"TROMBA ANEJO","category":"TEQUILA","price":"12","origin":"Los Altos, Jalisco, Mexico","abv":"40%","tasting_notes":"Rich and dessert-like with chocolate, caramel, dried red fruits, and a hint of pineapple; aged 20-24 months in oak.","producer_note":"Independent brand created by Master Distiller Marco Cedano, former distiller of Don Julio; small-batch, highland agave tequila.","has_photo":true,"photo_credit":"https://tastersclub.com/pages/tequila"},{"id":11019,"name":"TROMBA CEDANO REPOSADO","category":"TEQUILA","price":"20","origin":"Jalisco, Mexico","abv":"40%","tasting_notes":"Rich and dense with vanilla, aged wood, caramelized agave, cherry, and toasted nuts; fresh citrus lift on the finish. Aged in French Limousin oak casks.","producer_note":"Named for founder and Master Distiller Marco Cedano; crafted with his son Rodrigo using the proprietary 'Cedano process' to mark his 50 years in tequila.","has_photo":true,"photo_credit":"https://sudsandspirits.com/tromba-cedano-50-reposado-tequila-750-ml/"},{"id":11020,"name":"CLASE AZUL","category":"TEQUILA","price":"40","origin":"Los Altos, Jalisco, Mexico","abv":"40%","tasting_notes":"Smooth and sweet with cooked agave, vanilla, candied orange peel, and toasted oak; notes of hazelnut, chocolate, and cinnamon on a long, warm finish. Aged 8 months in oak.","producer_note":"Founded in 1997 by Arturo Lomeli; each cobalt-blue decanter is hand-painted by artisans in Santa María Canchesda, Mexico.","has_photo":true,"photo_credit":"https://essentialsluxurydrinks.com/tienda/"},{"id":12001,"name":"HAMILTON JAMACIAN GOLD POT STILL","category":"RUM","price":"10","origin":"Jamaica","abv":"46.5%","tasting_notes":"Bold and funky, with overripe ban
