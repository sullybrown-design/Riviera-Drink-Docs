ana, pineapple and caramelized sugar up front; a creamy palate of butterscotch and molasses finishes grassy and dry. No added sugar.","producer_note":"Ed Hamilton's Ministry of Rum Collection; distilled from molasses at Worthy Park Estate in St. Catherine, Jamaica — the island's oldest continually operating distillery (est. 1670).","has_photo":true,"photo_credit":"https://kegnbottle.com/products/copy-of-pimento-dram-375-ml"},{"id":12002,"name":"HAMILTON WEST INDIES 1670 BLEND","category":"RUM","price":"10","origin":"Guyana/Jamaica","abv":"42%","tasting_notes":"Honeyed stone fruit and caramelized fruit on the nose; smoky cedar, dark fruit and spice on the palate with a long, faintly briny finish. Built as a daiquiri base.","producer_note":"Ed Hamilton's Ministry of Rum Collection; a blend of aged Jamaican and Guyanese (Demerara) rums, blended and bottled by Five & 20 Distillery in Westfield, NY.","has_photo":true,"photo_credit":"https://vinearts.ca/products/planteray-3-stars-rum"},{"id":12003,"name":"EL DORADO 12YR","category":"RUM","price":"10","origin":"Guyana","abv":"40%","tasting_notes":"Round, mellow and full-bodied: caramel, dried fruit, honey and warm spice with oak and vanilla; an elegant, dry finish with tropical fruit notes.","producer_note":"Demerara Distillers Limited, Diamond Distillery, Guyana; blended from three stills including the Port Mourant double wooden pot still (1732) and the Enmore wooden Coffey still (1880).","has_photo":true,"photo_credit":"https://www.thesolentcellar.co.uk/shop/spirits/el-dorado-12yr-rum/"},{"id":12004,"name":"PLANTERAY STIGGINS FANCY PINEAPPLE RUM","category":"RUM","price":"9","origin":"Barbados/Jamaica/Trinidad","abv":"40%","tasting_notes":"Bright, juicy pineapple from real Queen Victoria pineapples, backed by vanilla, molasses and warm baking spice; silky with a lingering tropical finish.","producer_note":"Planteray (the renamed Plantation), Maison Ferrand; pineapple rind is infused and distilled into Caribbean rums, then blended with pineapple fruit macerated in dark rum.","has_photo":true,"photo_credit":"https://www.northstarspiritsidaho.com/spirits/rum"},{"id":12005,"name":"PLANTERAY CUT & DRY COCONUT RUM","category":"RUM","price":"10","origin":"Barbados","abv":"40%","tasting_notes":"Intense sweet coconut front and center, with vanilla, cinnamon and a hint of sesame; creamy coconut milk and green ginger carry a long, spiced finish.","producer_note":"Planteray (Maison Ferrand); rum from the West Indies Rum Distillery (WIRD), Barbados, infused with hand-cut, sun-dried local coconut — about one coconut per litre, no artificial flavour.","has_photo":true,"photo_credit":"https://www.tasteatlas.com/planteray-cut--dry"},{"id":12006,"name":"NEISSON RHUM BLANC AGRICOLE 50","category":"RUM","price":"12","origin":"Martinique","abv":"50%","tasting_notes":"Fresh-cut sugarcane dominates — bright, grassy and vegetal — with citrus, tropical fruit and floral notes; a long, warm finish with a peppery bite.","producer_note":"Neisson distillery, Le Carbet, Martinique; made from fresh sugarcane juice grown on the estate and distilled in a copper column still, rested three months before bottling.","has_photo":true,"photo_credit":"https://whiskyhaus.de/inhalt/34-0_7l/page/34/"},{"id":12007,"name":"SAINT BENEVOLENCE RUM CLARIRIN","category":"RUM","price":"12","origin":"Haiti","abv":"50%","tasting_notes":"Green banana and wasabi on the nose with earthy smoke and wet gravel; rich texture with toasted white peppercorn, clove and green olive, finishing with an underlying sweetness.","producer_note":"Saint Benevolence; distilled at the multigenerational Dorcinvil family distillery in Saint Michel de l'Attalaye, Haiti, in a hand-built Creole copper still; profits fund medical and educational programs in northern Haiti.","has_photo":true,"photo_credit":"https://vinepair.com/buy-this-booze/best-rums-2024/"},{"id":12008,"name":"COMMUNE DE BARADERES CLAIRIN COMMUNAL","category":"RUM","price":"12","origin":"Haiti","abv":"43%","tasting_notes":"Grassy sugarcane, lime zest, anise and black pepper with a distinctive banana backbone; creamy, peppery and balanced, with notes of vanilla and banoffee pie.","producer_note":"Clairin: The Spirit of Haiti; a blend of four village clairins — Vaval (Cavaillon), Casimir (Baradères), Le Rocher (Pignon) and Sajous (St-Michel de l'Attalaye), all wild-fermented from cane juice.","has_photo":true,"photo_credit":"https://evh.dk/produkt/clairin-communal-batch-8-haiti-43/"},{"id":12009,"name":"SAINT JAMES ROYAL RHUM AGRICOLE","category":"RUM","price":"11","origin":"Martinique","abv":"40%","tasting_notes":"Round and harmonious: dried fruit, wood, caramel and vanilla with spicy notes (cinnamon, nutmeg) and a soft floral lift; gentle and approachable.","producer_note":"Saint James, Martinique; AOC Martinique rhum agricole aged 18–24 months in oak, from a house distilling cane-juice rum since 1765.","has_photo":true,"photo_credit":"https://www.yewel.de/Tekirdag-Rakisi-475-Vol-07l"},{"id":12010,"name":"J.M. BLANC RHUM AGRICOLE","category":"RUM","price":"11","origin":"Martinique","abv":"50%","tasting_notes":"Explosive and tropical: ripe mango, overripe banana and papaya with intense fresh sugarcane, lime and grassy notes; bold and full-flavoured at full proof.","producer_note":"Rhum J.M (Habitation Bellevue), Macouba, Martinique; AOC Martinique agricole from cane grown on volcanic soils below Mount Pelée, rested in stainless steel before bottling. Also sold at 40%.","has_photo":true,"photo_credit":"https://bevingrosso.it/prodotti/distillati/rum/rhum-j-m-blanc-rum-agricole-bianco-cl-100-x-1-bottiglia-vetro/?add-to-cart=39635"},{"id":12011,"name":"COMMUNE DE BARADERES VAVAL CLAIRIN","category":"RUM","price":"13","origin":"Haiti","abv":"53.5%","tasting_notes":"Tropical mango and pineapple meet salty umami, mint and anise; fruity and vegetal on the palate with a distinct ocean-side saltiness and an enjoyably bold finish.","producer_note":"Distillerie Arawaks, Cavaillon, Haiti; owned by Fritz Vaval, whose family has run the farm distillery for nearly 80 years, using wild yeast and fresh Madame Meuze cane juice; bottled by Spirit of Haiti.","has_photo":true,"photo_credit":"cdn.shoplightspeed.com"},{"id":12012,"name":"BARBANCOURT 4YR RHUM AGRICOLE","category":"RUM","price":"9","origin":"Haiti","abv":"43%","tasting_notes":"Fresh sugarcane, caramel and vanilla with light oak; easy-going and gently woody, with green banana and hazelnut on a clean, mild finish.","producer_note":"Société du Rhum Barbancourt, Port-au-Prince, Haiti; founded 1862 by Dupré Barbancourt — fresh cane juice, double-distilled like Cognac and aged in French Limousin oak.","has_photo":true,"photo_credit":"https://www.vinotheque.ch/fr_FR/products/rhum-agricole-barbancourt-4-ans-75cl-2405"},{"id":12013,"name":"BARBANCOURT 8YR RHUM AGRICOLE","category":"RUM","price":"9","origin":"Haiti","abv":"43%","tasting_notes":"Brown sugar and crème caramel, roasted cashews, vanilla oak and spice; exceptionally silky and gently warming, with a long, mildly spicy finish.","producer_note":"Société du Rhum Barbancourt, Port-au-Prince, Haiti (est. 1862); the 5 Star Réserve Spéciale — fresh cane juice, double-distilled and aged 8 years in French Limousin oak.","has_photo":true,"photo_credit":"https://www.luekensliquors.com/product/rhum-barbancourt-8yr-rum-750ml/"},{"id":12014,"name":"TROIS RIVIERES CUVEE DE L'OCEAN","category":"RUM","price":"11","origin":"Martinique","abv":"42%","tasting_notes":"Mineral and maritime: fresh-cut sugarcane, lime and green grass with a distinct salty, sea-spray character; crisp and refreshing.","producer_note":"Trois Rivières distillery, southern Martinique; AOC Martinique rhum agricole made exclusively from cane grown near the coast at Anse Trabaud, giving it its oceanic saline edge.","has_photo":true,"photo_credit":"https://www.napojecerveny.cz/rumy/trois-rivieres-cuvee-de-l-ocean-rum"},{"id":12015,"name":"ISAUTIER 10ANS RHUM AGRICOLE","category":"RUM","price":"15","origin":"Réunion Island","abv":"40%","tasting_notes":"Ripe banana and tropical fruit wrapped in vanilla and caramel; sweet spices, dried fruit and a whisper of iodine and salt lead to a long, gently oaky finish.","producer_note":"Maison Isautier, Réunion Island; founded 1845 and family-run for seven generations — the oldest distillery on Réunion, making both cane-juice agricole and molasses rums.","has_photo":true,"photo_credit":"https://www.lesrhumsdumonde.com/rhum-agricole/441-rhum-isautier-vieux-10-ans-3283770111191.html"},{"id":12016,"name":"EL DESTILADO WILD FERMENT","category":"RUM","price":"13","origin":"Mexico (Oaxaca)","abv":"41.5%","tasting_notes":"Dry, minty and wild: like fresh alcoholic cane juice with spearmint, brine, smoke and tart green fruit; rustic and funky with a mezcal-like character.","producer_note":"El Destilado; cane-juice rum wild-fermented with ambient yeasts and distilled on a homemade column still by the Krassel family in Santa Maria Tlalixtac, Oaxaca.","has_photo":true,"photo_credit":"https://thelonecaner.com/tag/aguardiente/?lang=ru"},{"id":12017,"name":"EL DESTILADO OVERPROOF OAXACAN","category":"RUM","price":"16","origin":"Mexico (Oaxaca)","abv":"52.3%","tasting_notes":"The same wild-fermented Krassel cane juice undiluted: musky, dry and intense with brine, pine, citrus and herbs — a full-strength sipping expression of the same rum.","producer_note":"El Destilado; the full-strength version of the Krassel family's wild-fermented cane-juice rum from Santa Maria Tlalixtac, Oaxaca, bottled for pure tasting rather than cocktails.","has_photo":true,"photo_credit":"cdn.prod.website-files.com"},{"id":12018,"name":"FLOR DE CANA GRAN RESERVA 7YR","category":"RUM","price":"7","origin":"Nicaragua","abv":"40%","tasting_notes":"Toasted oak, vanilla, dark caramel and roasted nuts with dark chocolate and dried fruit; genuinely dry and smooth — no added sugar.","producer_note":"Flor de Caña, founded 1890 at the foot of the       function esc(s) {

          if (state.section !== "all" && state.section !== cat.label) return;

        SPIRIT_CATEGORIES.forEach(function (cat) {
          var n = SPIRITS.filter(function (s) { return s.category === cat; }).length;
          html += tileHTML("spirits", cat, cat, n, n === 1 ? "bottle" : "bottles");
        });
        html += '</div></section>' +
          '<section class="index-group" aria-label="Beer & Cider">' +
          '<div class="section-head"><h2>Beer &amp; Cider</h2><span class="count">' + BEERS.length + ' pours</span></div><div class="tile-list">';
        html += tileHTML("beer", "all", "All Beer & Cider", BEERS.length, "pours");
        html += "</div></section>";
        mainEl.innerHTML = html;
        countEl.textContent = "";
      }

      function renderSearch() {
        var q = state.query.trim().toLowerCase();
        var html = "";
        var total = 0;
        var ws = WINES.filter(function (w) { return matches(w, q); });
        if (ws.length) {
          total += ws.length;
          html += '<section class="wine-section" aria-label="Matching wines">' +
            '<div class="section-head"><h2>Wines</h2><span class="count">' + ws.length + '</span></div><div class="grid">';
          ws.forEach(function (w) { html += cardHTML(w); });
          html += "</div></section>";
        }
        var cs = COCKTAILS.filter(function (c) { return cocktailMatches(c, q); });
        if (cs.length) {
          total += cs.length;
          html += '<section class="wine-section" aria-label="Matching cocktails">' +
            '<div class="section-head"><h2>Cocktails</h2><span class="count">' + cs.length + '</span></div><div class="grid">';
          cs.forEach(function (c) { html += cocktailCardHTML(c); });
          html += "</div></section>";
        }
        var as = AMARI.filter(function (a) { return amaroMatches(a, q); });
        if (as.length) {
          total += as.length;
          html += '<section class="wine-section" aria-label="Matching amari">' +
            '<div class="section-head"><h2>Amari</h2><span class="count">' + as.length + '</span></div><div class="grid">';
          as.forEach(function (a) { html += amaroCardHTML(a); });
          html += "</div></section>";
        }
        var ss = SPIRITS.filter(function (s) { return spiritMatches(s, q); });
        if (ss.length) {
          total += ss.length;
          html += '<section class="wine-section" aria-label="Matching spirits">' +
            '<div class="section-head"><h2>Spirits</h2><span class="count">' + ss.length + '</span></div><div class="grid">';
          ss.forEach(function (s) { html += spiritCardHTML(s); });
          html += "</div></section>";
        }
        var bs = BEERS.filter(function (b) { return beerMatches(b, q); });
        if (bs.length) {
          total += bs.length;
          html += '<section class="wine-section" aria-label="Matching beer & cider">' +
            '<div class="section-head"><h2>Beer &amp; Cider</h2><span class="count">' + bs.length + '</span></div><div class="grid">';
          bs.forEach(function (b) { html += beerCardHTML(b); });
          html += "</div></section>";
        }
        if (!total) html = emptyState("Try a grape, a region, a cocktail, an amaro, a spirit or a beer — or clear the search to browse the index.");
        mainEl.innerHTML = html;
        countEl.textContent = total + (total === 1 ? " result" : " results");
        bindReset();
      }

      /* ---------- cocktails ---------- */
      function cocktailMatches(c, q) {
        if (!q) return true;
        var hay = (c.name + " " + c.note + " " + (c.tagline || "") + " " + c.section + " " +
          c.ingredients.join(" ") + " " + c.method.join(" ")).toLowerCase();
        return q.split(/\s+/).every(function (term) { return hay.indexOf(term) !== -1; });
      }

      function renderCocktails() {
        var q = state.query.trim().toLowerCase();
        var html = "";
        var total = 0;
        COCKTAIL_SECTIONS.forEach(function (sec) {
          if (state.section !== "all" && state.section !== sec) return;
          var list = COCKTAILS.filter(function (c) { return c.section === sec && c.on_menu !== false && cocktailMatches(c, q); });
          if (!list.length) return;
          total += list.length;
          html += '<section class="wine-section" aria-label="' + esc(sec) + '">' +
            '<div class="section-head"><h2>' + esc(sec) + '</h2><span class="count">' +
            list.length + (list.length === 1 ? " cocktail" : " cocktails") + '</span></div><div class="grid">';
          list.forEach(function (c) { html += cocktailCardHTML(c); });
          html += "</div></section>";
        });
        if (state.section === "all") {
          var off = COCKTAILS.filter(function (c) { return c.on_menu === false && cocktailMatches(c, q); });
          if (off.length) {
            total += off.length;
            html += '<section class="wine-section" aria-label="Off the menu">' +
              '<div class="section-head"><h2>Off the menu</h2><span class="count">' +
              off.length + (off.length === 1 ? " cocktail" : " cocktails") + ' · not on the printed menu</span></div><div class="grid">';
            off.forEach(function (c) { html += cocktailCardHTML(c); });
            html += "</div></section>";
          }
        }
        if (!total) html = emptyState("Try a cocktail name or an ingredient — or clear the search to see every recipe.");
        mainEl.innerHTML = backBarHTML() + html;
        countEl.textContent = q || state.section !== "all" ? total + " of " + COCKTAILS.length + " cocktails" : "";
        bindReset();
      }

      /* ---------- spirits: the printed list, by category ---------- */
      function spiritMatches(s, q) {
        if (!q) return true;
        var hay = (s.name + " " + s.category + " " + (s.origin || "") + " " + (s.abv || "") + " " +
          (s.tasting_notes || "") + " " + (s.producer_note || "")).toLowerCase();
        return q.split(/\s+/).every(function (term) { return hay.indexOf(term) !== -1; });
      }

      // Canadian gins are grouped by province, taken from the origin
      // ("Ottawa, Ontario, Canada" -> "Ontario").
      function ginProvince(s) {
        var o = (s.origin || "").replace(/,\s*Canada\s*$/, "");
        var parts = o.split(",");
        var p = parts.length ? parts[parts.length - 1].trim() : "";
        return p || "Canada";
      }

      function renderSpirits() {
        var q = state.query.trim().toLowerCase();
        var html = "";
        var total = 0;
        SPIRIT_CATEGORIES.forEach(function (cat) {
          if (state.section !== "all" && state.section !== cat) return;
          var list = SPIRITS.filter(function (s) { return s.category === cat && spiritMatches(s, q); });
          if (!list.length) return;
          total += list.length;
          html += '<section class="wine-section" aria-label="' + esc(cat) + '">' +
            '<div class="section-head"><h2>' + esc(cat) + '</h2><span class="count">' +
            list.length + (list.length === 1 ? " bottle" : " bottles") + '</span></div>';
          if (cat === "GIN - CANADA") {
            var provinces = [];
            list.forEach(function (s) {
              var p = ginProvince(s);
              if (provinces.indexOf(p) === -1) provinces.push(p);
            });
            provinces.forEach(function (p) {
              var group = list.filter(function (s) { return ginProvince(s) === p; });
              html += '<h3 class="subsection-head">' + esc(p) +
                ' <span class="count">· ' + group.length + (group.length === 1 ? " gin" : " gins") + '</span></h3><div class="grid">';
              group.forEach(function (s) { html += spiritCardHTML(s); });
              html += "</div>";
            });
          } else {
            html += '<div class="grid">';
            list.forEach(function (s) { html += spiritCardHTML(s); });
            html += "</div>";
          }
          html += "</section>";
        });
        if (!total) html = emptyState("Try a bottle name or a category — or clear the search to see the full spirits list.");
        mainEl.innerHTML = backBarHTML() + html;
        countEl.textContent = q || state.section !== "all" ? total + " of " + SPIRITS.length + " spirits" : "";
        bindReset();
      }

      /* ---------- beer & cider ---------- */
      function beerMatches(b, q) {
        if (!q) return true;
        var hay = (b.name + " " + b.brewery + " " + b.style + " " + b.origin + " " +
          b.tasting_notes + " " + b.brewery_note).toLowerCase();
        return q.split(/\s+/).every(function (term) { return hay.indexOf(term) !== -1; });
      }

      function renderBeers() {
        var q = state.query.trim().toLowerCase();
        var list = BEERS.filter(function (b) { return beerMatches(b, q); });
        var html = "";
        if (list.length) {
          html += '<section class="wine-section" aria-label="Beer & Cider">' +
            '<div class="section-head"><h2>Beer &amp; Cider</h2><span class="count">' +
            list.length + (list.length === 1 ? " pour" : " pours") + '</span></div><div class="grid">';
          list.forEach(function (b) { html += beerCardHTML(b); });
          html += "</div></section>";
        } else {
          html = emptyState("Try a beer name, a brewery or a style — or clear the search to see the full list.");
        }
        mainEl.innerHTML = backBarHTML() + html;
        countEl.textContent = q ? list.length + " of " + BEERS.length + " beers & ciders" : "";
        bindReset();
      }

      /* ---------- amaro: one section, by flavour camp ---------- */
      function amaroMatches(a, q) {
        if (!q) return true;
        var hay = (a.name + " " + a.camp + " " + a.region + " " + a.abv + " " +
          a.tasting_notes + " " + a.ingredients + " " + a.notes + " " + a.producer).toLowerCase();
        return q.split(/\s+/).every(function (term) { return hay.indexOf(term) !== -1; });
      }

      function renderAmaro() {
        var q = state.query.trim().toLowerCase();
        var html = "";
        var total = 0;
        if (!q && state.section === "all") {
          var paras = AMARO_INTRO.split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean);
          html += '<section class="wine-section" aria-label="What is amaro?">' +
            '<div class="section-head"><h2>What is amaro?</h2></div><div class="prose">';
          paras.forEach(function (p) { html += "<p>" + esc(p) + "</p>"; });
          html += "</div></section>";
        }
        CAMPS.forEach(function (camp) {
          if (state.section !== "all" && state.section !== camp) return;
          var list = AMARI.filter(function (a) { return a.camp === camp && amaroMatches(a, q); });
          if (!list.length) return;
          total += list.length;
          html += '<section class="wine-section" aria-label="' + esc(camp) + '">' +
            '<div class="section-head"><h2>' + esc(camp) + '</h2><span class="count">' +
            list.length + (list.length === 1 ? " amaro" : " amari") + '</span></div><div class="grid">';
          list.forEach(function (a) { html += amaroCardHTML(a); });
          html += "</div></section>";
        });
        if (!total) html = emptyState("Try an amaro name, a region, or an ingredient — or clear the search to see every amaro.");
        mainEl.innerHTML = backBarHTML() + html;
        countEl.textContent = q || state.section !== "all" ? total + " of " + AMARI.length + " amari" : "";
        bindReset();
      }

      /* ---------- navigation: index <-> section ---------- */
      function applyViewMeta() {
        var meta = VIEW_META[state.view];
        searchEl.placeholder = meta.placeholder;
        searchEl.setAttribute("aria-label", meta.label);
        document.getElementById("footer").textContent = meta.footer;
      }

      function goHome() {
        state.view = "home";
        state.section = "all";
        applyViewMeta();
        render();
        window.scrollTo({ top: 0 });
      }

      function openSection(view, section) {
        state.view = view;
        state.section = section || "all";
        applyViewMeta();
        render();
        window.scrollTo({ top: 0 });
      }

      mainEl.addEventListener("click", function (e) {
        if (e.target.closest("[data-nav-home]")) { goHome(); return; }
        var tile = e.target.closest("[data-nav-view]");
        if (tile) openSection(tile.getAttribute("data-nav-view"), tile.getAttribute("data-nav-section"));
      });

      var debounce = null;
      searchEl.addEventListener("input", function () {
        clearEl.style.display = searchEl.value ? "block" : "none";
        clearTimeout(debounce);
        debounce = setTimeout(function () { state.query = searchEl.value; render(); }, 120);
      });
      clearEl.addEventListener("click", function () {
        searchEl.value = ""; state.query = ""; clearEl.style.display = "none"; render(); searchEl.focus();
      });

      /* ---------- detail sheet ---------- */
      function profileScale(lbl, value, label) {
        return '<div class="profile-scale"><span class="lbl">' + lbl + "</span>" + dots(value) +
          '<span class="val">' + esc(label) + "</span></div>";
      }

      function openWine(id) {
        var w = byId[id];
        if (!w) return;
        lastFocus = document.activeElement;
        var sectionLine = w.section + (w.subsection ? " · " + w.subsection : "") + " · No. " + w.number;
        var html = '<div class="sheet-hero">' +
          '<button type="button" class="close-btn" id="sheet-close" aria-label="Close">×</button>' +
          thumbHTML(w, "photo") +
          '<div class="hero-text"><div class="kicker">' + esc(sectionLine) + "</div>" +
          '<h2 id="sheet-title">' + esc(w.title) + "</h2>" +
          '<div class="price">' + esc(w.price) + "</div>" +
          (w.style ? '<div class="style">' + esc(w.style) + "</div>" : "") +
          "</div></div>" +
          '<div class="sheet-body">';
        if (w.menu_note) html += '<div class="menu-note"><strong>On the printed list:</strong> ' + esc(w.menu_note.replace(/^As printed on the menu:\s*/i, "")) + "</div>";
        html += '<dl class="glance">' +
          '<div><dt>Region</dt><dd>' + esc(w.region) + "</dd></div>" +
          '<div><dt>Alcohol</dt><dd>' + esc(w.alcohol) + "</dd></div>" +
          '<div class="wide"><dt>Grape</dt><dd>' + esc(w.grape) + "</dd></div>" +
          '<div class="wide"><dt>Producer</dt><dd>' + esc(w.producer) + "</dd></div>" +
          "</dl>";
        html += "<h3>The profile</h3>" +
          profileScale("Body", w.body, w.body_label) +
          profileScale("Acidity", w.acidity, w.acidity_label) +
          profileScale("Tannins", w.tannins, w.tannins_label);
        if (w.tasting_notes) html += "<h3>Tasting notes</h3><p class=\"tasting\">" + esc(w.tasting_notes) + "</p>";
        if (w.story) html += "<h3>The story</h3><p>" + esc(w.story) + "</p>";
        if (w.pairings) html += "<h3>On the table</h3><p>" + esc(w.pairings) + "</p>";
        if (w.producer_note) html += "<h3>About the producer</h3><p>" + esc(w.producer_note) + "</p>";
        if (w.also_in && w.also_in.length) {
          html += "<h3>Also on the list</h3><div class=\"also-in\">";
          w.also_in.forEach(function (otherId) {
            var o = byId[otherId];
            if (o) html += '<button type="button" data-open="' + o.id + '">' + esc(o.section) + " · No. " + esc(o.number) + "</button>";
          });
          html += "</div>";
        }
        if (w.photo_credit) html += '<p class="photo-credit">' + esc(w.photo_credit) + "</p>";
        html += "</div>";
        openSheet(html);
      }

      function openSheet(html) {
        sheetContent.innerHTML = html;
        sheetEl.hidden = false;
        requestAnimationFrame(function () {
          sheetEl.classList.add("open"); scrimEl.classList.add("open");
        });
        sheetEl.scrollTop = 0;
        document.body.style.overflow = "hidden";
        document.getElementById("sheet-close").addEventListener("click", closeSheet);
        document.getElementById("sheet-close").focus();
      }

      function openCocktail(id) {
        var c = cocktailsById[id];
        if (!c) return;
        lastFocus = document.activeElement;
        var html = '<div class="sheet-hero">' +
          '<button type="button" class="close-btn" id="sheet-close" aria-label="Close">×</button>' +
          '<div class="hero-text"><div class="kicker">' + esc(c.section) + "</div>" +
          '<h2 id="sheet-title">' + esc(c.name) + "</h2>" +
          (c.price ? '<div class="price">$' + esc(c.price) + "</div>" : "") +
          (c.pour_label ? '<div class="style">' + esc(c.pour_label) + "</div>" : (cocktailAlcoholOz(c) > 0 ? '<div class="style">' + formatOz(cocktailAlcoholOz(c)) + " oz alcohol</div>" : "")) +
          (c.note ? '<div class="style">' + esc(c.note) + "</div>" : "") +
          (c.tagline ? '<div class="style">' + esc(c.tagline) + "</div>" : "") +
          "</div></div>" +
          '<div class="sheet-body">' +
          '<h3 style="margin-top:2px">Ingredients</h3><ul class="spec-list">';
        c.ingredients.forEach(function (ing) { html += "<li>" + esc(ing) + "</li>"; });
        html += "</ul>";
        if (c.method.length) {
          html += '<h3>Method</h3><ol class="step-list">';
          c.method.forEach(function (step) { html += "<li>" + esc(step) + "</li>"; });
          html += "</ol>";
        }
        html += "</div>";
        openSheet(html);
      }

      function openAmaro(idx) {
        var a = AMARI[idx];
        if (!a) return;
        lastFocus = document.activeElement;
        var meta = [a.region, a.abv ? a.abv + " ABV" : ""].filter(Boolean).join(" · ");
        var html = '<div class="sheet-hero">' +
          '<button type="button" class="close-btn" id="sheet-close" aria-label="Close">×</button>' +
          photoThumb(a.has_photo, "assets/images/amari/" + idx + ".jpg", "Bottle of " + a.name, "photo") +
          '<div class="hero-text"><div class="kicker">' + esc(a.camp) + "</div>" +
          '<h2 id="sheet-title">' + esc(a.name) + "</h2>" +
          (a.price ? '<div class="price">$' + esc(a.price) + "</div>" : "") +
          (meta ? '<div class="style">' + esc(meta) + "</div>" : "") +
          "</div></div>" +
          '<div class="sheet-body">';
        var first = true;
        if (a.tasting_notes) {
          html += '<h3 style="margin-top:2px">Tasting notes</h3><p class="tasting">' + esc(a.tasting_notes) + "</p>";
          first = false;
        }
        if (a.ingredients) {
          html += "<h3" + (first ? ' style="margin-top:2px"' : "") + ">Known ingredients</h3><p>" + esc(a.ingredients) + "</p>";
          first = false;
        }
        if (a.notes) {
          html += "<h3" + (first ? ' style="margin-top:2px"' : "") + ">Notes</h3>";
          a.notes.split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean)
            .forEach(function (p) { html += "<p>" + esc(p) + "</p>"; });
          first = false;
        }
        if (a.producer) {
          html += "<h3" + (first ? ' style="margin-top:2px"' : "") + ">About the producer</h3><p>" + esc(a.producer) + "</p>";
        }
        if (a.photo_credit) html += '<p class="photo-credit">Photo: ' + esc(a.photo_credit) + "</p>";
        html += "</div>";
        openSheet(html);
      }

      function openSpirit(id) {
        var s = spiritsById[id];
        if (!s) return;
        lastFocus = document.activeElement;
        var meta = [s.origin, s.abv ? s.abv + " ABV" : ""].filter(Boolean).join(" · ");
        var html = '<div class="sheet-hero">' +
          '<button type="button" class="close-btn" id="sheet-close" aria-label="Close">×</button>' +
          photoThumb(s.has_photo, "assets/images/spirits/" + s.id + ".jpg", "Bottle of " + s.name, "photo") +
          '<div class="hero-text"><div class="kicker">' + esc(s.category) + "</div>" +
          '<h2 id="sheet-title">' + esc(s.name) + "</h2>" +
          (s.price ? '<div class="price">$' + esc(s.price) + " per pour</div>" : "") +
          (meta ? '<div class="style">' + esc(meta) + "</div>" : "") +
          "</div></div>" +
          '<div class="sheet-body">';
        var glance = "";
        if (s.origin) glance += '<div><dt>Origin</dt><dd>' + esc(s.origin) + "</dd></div>";
        if (s.abv) glance += '<div><dt>Alcohol</dt><dd>' + esc(s.abv) + "</dd></div>";
        if (s.price) glance += '<div><dt>Price</dt><dd>$' + esc(s.price) + " per pour</dd></div>";
        glance += '<div><dt>Category</dt><dd>' + esc(s.category) + "</dd></div>";
        html += '<dl class="glance">' + glance + "</dl>";
        if (s.tasting_notes) {
          html += '<h3>Tasting notes</h3><p class="tasting">' + esc(s.tasting_notes) + "</p>";
        }
        if (s.producer_note) {
          html += "<h3>About the producer</h3><p>" + esc(s.producer_note) + "</p>";
        }
        if (s.photo_credit) html += '<p class="photo-credit">Photo: ' + esc(s.photo_credit) + "</p>";
        html += "</div>";
        openSheet(html);
      }

      function openBeer(idx) {
        var b = BEERS[idx];
        if (!b) return;
        lastFocus = document.activeElement;
        var meta = [b.brewery, b.origin, b.size, b.abv ? b.abv + " ABV" : ""].filter(Boolean).join(" · ");
        var html = '<div class="sheet-hero">' +
          '<button type="button" class="close-btn" id="sheet-close" aria-label="Close">×</button>' +
          '<div class="hero-text"><div class="kicker">Beer &amp; Cider' + (b.style ? " · " + esc(b.style) : "") + "</div>" +
          '<h2 id="sheet-title">' + esc(b.name) + "</h2>" +
          (b.price ? '<div class="price">$' + esc(b.price) + "</div>" : "") +
          (meta ? '<div class="style">' + esc(meta) + "</div>" : "") +
          "</div></div>" +
          '<div class="sheet-body">';
        var first = true;
        if (b.tasting_notes) {
          html += '<h3 style="margin-top:2px">Tasting notes</h3><p class="tasting">' + esc(b.tasting_notes) + "</p>";
          first = false;
        }
        if (b.brewery_note) {
          html += "<h3" + (first ? ' style="margin-top:2px"' : "") + ">About the brewery</h3><p>" + esc(b.brewery_note) + "</p>";
        }
        html += "</div>";
        openSheet(html);
      }

      function closeSheet() {
        sheetEl.classList.remove("open"); scrimEl.classList.remove("open");
        document.body.style.overflow = "";
        setTimeout(function () { sheetEl.hidden = true; }, 260);
        if (lastFocus && lastFocus.focus) lastFocus.focus();
      }

      document.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-open]");
        if (btn) { openWine(parseInt(btn.getAttribute("data-open"), 10)); return; }
        var cb = e.target.closest("[data-cocktail]");
        if (cb) { openCocktail(parseInt(cb.getAttribute("data-cocktail"), 10)); return; }
        var ab = e.target.closest("[data-amaro]");
        if (ab) { openAmaro(parseInt(ab.getAttribute("data-amaro"), 10)); return; }
        var sb = e.target.closest("[data-spirit]");
        if (sb) { openSpirit(parseInt(sb.getAttribute("data-spirit"), 10)); return; }
        var bb = e.target.closest("[data-beer]");
        if (bb) openBeer(parseInt(bb.getAttribute("data-beer"), 10));
      });
      scrimEl.addEventListener("click", closeSheet);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && sheetEl.classList.contains("open")) closeSheet();
      });

      document.getElementById("brand-sub").textContent = WINES.length + " wines · " + COCKTAILS.length + " cocktails · " + AMARI.length + " amari · " + SPIRITS.length + " spirits · " + BEERS.length + " beers & ciders";
      document.getElementById("footer").textContent = VIEW_META.home.footer;
      render();
    </script>
  </body>
</html>
