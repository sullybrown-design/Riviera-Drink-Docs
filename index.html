ct/amaro-di-toscana/)"},{"name":"Amaro Virgilio","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"10","region":"Lazio, Italy","abv":"30%","tasting_notes":"Intense and complex — china bark, sweet orange, rhubarb, and Calabrian licorice, with the traditional bitter-sweet amaro balance.","ingredients":"China calissaia, sweet orange, rhubarb, Calabrian licorice.","notes":"","producer":"Made by Pallini, the historic Roman distillery (founded 1875 — the only working distillery in Rome). Dedicated to Virgilio Pallini; the recipe comes from an old family formula re-proposed in 2016.","has_photo":true,"photo_credit":"beverfood.com — https://www.beverfood.com/distilleria-alcolici/pallini-spa"},{"name":"Cicchetto Amaro York","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"10","region":"Toronto, Canada","abv":"28%","tasting_notes":"Made in the brand's natural, balanced style — citrus-forward and not too sweet. Works well in a Negroni with sweet vermouth and gin.","ingredients":"Not published — made with natural ingredients in the Italian tradition.","notes":"","producer":"Made in Toronto by Cicchetto Liquori, founded by local bartender Murru with Pasquini. Family recipes made with natural ingredients at a certified distillery — 'cicchetto' is Italian for a shot glass.","has_photo":true,"photo_credit":"cicchetto.ca — https://www.cicchetto.ca/products"},{"name":"Jefferson Amaro","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"11","region":"Calabria, Italy","abv":"30%","tasting_notes":"citrus and vanilla predominately on the nose. Citrusy lemon and grapefruit mingle on the palate, followed by some bitter notes of wormwood and gentian. The aftertaste softens again with a citrusy freshness","ingredients":"bergamot (a fruit considered to be a hybrid of lemon & bitter orange), bitter orange, sweet orange, rosemary, oregano","notes":"this amaro is a total crowd pleaser, I have yet to pour it for someone who didn't fall in love with it. It is also generally the perfect match for our pavlova at Riviera","producer":"Made by Vecchio Magazzino Doganale in Calabria from local herbs, spices, and citrus. The old recipe is named for a Captain Jefferson said to have been shipwrecked on the Calabrian coast.","has_photo":true,"photo_credit":"enotecacolombo.com — https://enotecacolombo.com/categoria-prodotto/distillati-e-liquori/"},{"name":"L'Amaro Limonio","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"14","region":"Sicily, Italy","abv":"30%","tasting_notes":"An infusion of herbs and roots with a strong, distinctive character — a proper herbal amaro from a Sicilian citrus family.","ingredients":"Herbs and roots (per the producer).","notes":"","producer":"Made by Casa Limonio in Partinico, near Palermo — a Sicilian family citrus company going back two centuries. Their 'Lamaro' is an infusion of herbs and roots with a strong character.","has_photo":true,"photo_credit":"casalimonio.it — https://www.casalimonio.it/prodotti/lamaro/"},{"name":"La Miscela 30 Amaro","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"12","region":"Veneto, Italy","abv":"30%","tasting_notes":"very gentle, and interestingly complex. The herbs and citrus are very apparent, but somewhere along the line it picks up some cocoa notes that are super appealing.","ingredients":"a natural infusion of herbs, berries and citrus fruits. Not especially revealing, but such is often the nature of amaro information","notes":"this is a great amaro for newbies to the category. The fact that it comes in a very cool oil can will make it stand out for your customers (make sure to show them the can!)","producer":"A Veneto amaro sold in a distinctive oil can. A natural infusion of herbs, berries, and citrus fruits — a great one for amaro newcomers.","has_photo":true,"photo_credit":"panerogroup.com — https://www.panerogroup.com/prodotto/la-miscela-al-30/"},{"name":"Vecchio Amaro Del Capo","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"8","region":"Calabria, Italy","abv":"35%","tasting_notes":"notes of medicinal herbs, orange and bitter juniper berries on the nose. The taste is a very pleasant hit of bitterness with bright citrus notes. The aftertaste is rich with candied fruit, cinnamon, licorice and vanilla.","ingredients":"bitter orange, sweet orange, licorice, mandarin, chamomile, juniper","notes":"","producer":"Made by Distilleria Caffo in Calabria since 1915, from 29 herbs, spices, roots, fruits, and flowers. Best served ice-cold.","has_photo":true,"photo_credit":"bodegasbordino.com — https://bodegasbordino.com/productos/vecchio-amaro-del-capo-70cl-5188"},{"name":"Amaro Berta San Nicolao","camp":"Just a Touch Left of Centre","price":"11","region":"Piedmont, Italy","abv":"30%","tasting_notes":"Balanced, warm and persistent, with berry fruit, anise and raspberry over a cherry-menthol core. Not very bitter — thick on the palate with a creamy vanilla finish from the barrel ageing.","ingredients":"infusion of aromatic herbs in alcohol and brandy, aged two years in barrels","notes":"","producer":"Distillerie Berta, the Piedmont grappa house. “Il 28 di Via San Nicolao” is a tribute to the company’s historic distilleries at Via San Nicolao 28 in Nizza Monferrato, and to the first bitter recipes developed there.","has_photo":true,"photo_credit":"fonsvinum.com — https://fonsvinum.com/prodotto/amaro-d-erbe-il-28-di-via-san-nicolao-berta/"},{"name":"Amaro Camatti","camp":"Just a Touch Left of Centre","price":"10","region":"Liguria, Italy","abv":"20%","tasting_notes":"A nice strong herbaceous nose, followed by a really lovely balance of bitter & sweet. The bitterness takes slight prominence on the aftertaste, but not so much as to overwhelm.","ingredients":"top secret","notes":"This is a really lovely, mid bodied amaro. Perfect for someone looking for something outside what they would normally see around, but not too crazy challenging.","producer":"","has_photo":true,"photo_credit":"notwasted.com.au — https://notwasted.com.au/products/camatti-amaro-camatti"},{"name":"Amaro Dente Di Leone","camp":"Just a Touch Left of Centre","price":"11","region":"Aosta Valley, Italy","abv":"32.6%","tasting_notes":"The nose is delicate and herbaceous. On the palate dandelion and gentian are at the forefront, followed closely by thyme and other herbs. The finish is long, but relatively gentle (likely the influence of elderflower).","ingredients":"yarrow, nutmeg, angelica (both root & seeds), Roman wormwood, gentian wormwood, basil leaves, cnicus, gentian root, hyssop leaves, elderflower, dandelion roots, thyme","notes":"This is the only amaro on our collection that represents the region of the Aosta Valley, an alpine region close to Piedmont. Yet profile wise this is a solid category one, unlike the more bracing nature of many of the alpine amaros.","producer":"The one Aosta Valley amaro in the collection — an alpine region bordering Piedmont. Named for the dandelion (dente di leone), whose roots are a key botanical.","has_photo":true,"photo_credit":"mercantilenove.it — http://www.mercantilenove.it/"},{"name":"Amaro Frack","camp":"Just a Touch Left of Centre","price":"13","region":"Calabria, Italy","abv":"24%","tasting_notes":"Predominantly herbaceous on the nose. The palate shows a wonderful balance of herbaceous & citrus notes (especially the bergamot). The aftertaste shifts into a persistently bitter gear.","ingredients":"bergamot, bitter orange, sweet orange, rosemary, oregano, gentian, rhubarb, lemon","notes":"This is made by the same producer as Jefferson, and shares many of the same components. Where it differs is in the more herbaceous nature, and heightened bitterness.","producer":"Made by the same producer as Jefferson Amaro (Vecchio Magazzino Doganale, Calabria) — sharing many of the same Calabrian components, but more herbaceous and more bitter.","has_photo":true,"photo_credit":"enotecaalessi.it — https://www.enotecaalessi.it/vecchio-magazzino-doganale-frack-amaro-cl-50"},{"name":"Amaro Gran Sasso","camp":"Just a Touch Left of Centre","price":"10","region":"Abruzzo, Italy","abv":"30%","tasting_notes":"Delicate aroma with hints of spices and roots. Full bodied with bitter notes of rhubarb and gentian, tipping the balance from sweet to bitter. The finish picks up the faint trails of citrus and vanilla.","ingredients":"gentian, cinchona, rhubarb, cardamon, vanilla, centuary (an herb that’s bitter in taste that makes an excellent tonic, that acts on the liver & kidneys and purifies the blood), orange","notes":"This is an excellent amaro, elegantly made and perfect for the person who wants something a little more advanced and complex. This one is also an excellent addition to stirred cocktails like the Negroni or Manhattan.","producer":"Named for the Gran Sasso massif of Abruzzo. An elegant, complex amaro that also works well in stirred cocktails like a Negroni or Manhattan.","has_photo":true,"photo_credit":"sometimesalways.com.au — https://sometimesalways.com.au/collections/paesani"},{"name":"Amaro Intervallo","camp":"Just a Touch Left of Centre","price":"10","region":"Calabria, Italy","abv":"","tasting_notes":"A refined pause in a glass — herbal and bitter, with a velvety palate. No citrus here: the profile is all bitter roots and herbs, rounded out by mint and sage. Best sipped neat, straight in the living room.","ingredients":"gentian, galangal, wormwood, bay leaf and marjoram (each worked in single, separate infusions); mint and sage (steam distillation). No citrus.","notes":"","producer":"Vecchio Magazzino Doganale, Calabria — the Trombino family’s rural distillery. Called “the paradigm of the amaro of the future” by the producer: a synthesis of how they see amaro evolving, built patiently around the natural cycle of the plants.","has_photo":true,"photo_credit":"enotecakru.it — https://enotecakru.it/collections/amari"},{"name":"Amaro Lusor","camp":"Just a Touch Left of Centre","price":"11","region":"Friuli-Venezia Giulia, Italy","abv":"26%","tasting_notes":"The nose is intoxicating and fresh with herbs & roots. On the palate it is distinctly bitter, with the gentian and cloves taking centre stage. The aftertaste is long, bitter and fresh, with persistent hits of cloves.","ingredients":"peppermint, lemon balm, rosemary, cloves, cinnamon and yellow gentian","notes":"This amaro has its feet firmly planted in category 2 of our amaro list. Dry & bitter, it stays on the palate for seemingly ever.","producer":"","has_photo":false,"photo_credit":""},{"name":"Amaro Meraviglioso","camp":"Just a Touch Left of Centre","price":"11","region":"Calabria, Italy","abv":"25%","tasting_notes":"Brings out its vegetal and bitter side on tasting. Fresh citrus notes weave through a long, persistent finish; warm and enveloping overall, with a balance between bitterness and sweetness and notes of roots, spices and citrus.","ingredients":"bitter botanicals (gentian, rhubarb, quassia) and balsamic botanicals (eucalyptus, bay leaf, rosemary, pine, aloe, basil, olive leaves)","notes":"","producer":"Vecchio Magazzino Doganale (“Old Customs Warehouse”), the Calabrian artisanal distillery of the Trombino family. The botanicals come from their own rural plots, and the amaro carries the family’s identity signature on the label.","has_photo":true,"photo_credit":"shop.raineri.be — https://shop.raineri.be/nl/vecchio-magazzino-doganale-meraviglioso-spirito-am.html"},{"name":"Amaro Pugliese","camp":"Just a Touch Left of Centre","price":"9","region":"Puglia, Italy","abv":"30%","tasting_notes":"Speaks of Apulia in the glass: mint, fennel, sage, artichoke and citrus fruits, all raw materials from the area. An amaro of customs and collective memory — fresh, herbal and distinctly southern.","ingredients":"mint, fennel, sage, artichoke, citrus fruits (all local Apulian raw materials)","notes":"","producer":"Fiume, the Apulian brand from Putignano founded by Vittorio Fiume in the 1960s. Their liqueurs are built around the link with the territory, starting with the raw materials — Amaro Pugliese is the contemporary of their famous Elisir dei Trulli.","has_photo":true,"photo_credit":"botta-di-cru.com — https://botta-di-cru.com/products/fiume-amaro-pugliese"},{"name":"Amaro Sibilla","camp":"Just a Touch Left of Centre","price":"11","region":"Marche, Italy","abv":"34%","tasting_notes":"Intense scents of bitter herbs, dried fruits, chestnuts, walnut husks, with hints of coffee and honey. On the palate there is an immediate hit of sweetness from the honey, but that is quickly replaced by a surprisingly intense and persistent bitter-tannic sensation that lasts.","ingredients":"gentian, orange peel, orange peel, cinchona, cinnamon & honey from the Sibilla mountains","notes":"This is the little brother of the Amaro Dell’Erborista, both made with similar ingredients, including the honey. This one is slightly less of a curveball than its sibling, but will still be outside of most people’s understanding of amaro. So again, if you want to blow the mind of a seasoned amaro drinker, this is also the ticket.","producer":"The Sibilla mountains of the Marche give this amaro its name — and its honey, which sweetens the intense bitter-herb base.","has_photo":true,"photo_credit":"enotecaterruli.it — https://enotecaterruli.it/prodotto/amaro-sibilla-varnelli-cl-70-copia/"},{"name":"Amaro Sibona","camp":"Just a Touch Left of Centre","price":"10","region":"Piedmont, Italy","abv":"28%","tasting_notes":"Intense aromas of rhubarb and cinchona, in a Barolo Chinato style — typically Piedmontese. Dense and spicy on the palate with mentholated, balsamic hints of rosemary and Mediterranean scrub. Good persistence, penetrating and spiced just enough to never be banal.","ingredients":"34 aromatic herbs and plants including gentian, cinchona and rhubarb, macerated in a slow infusion","notes":"","producer":"Distilleria Sibona, a Piedmontese distillery best known for its grappas (including Grappa di Barolo). Their amaro follows an ancient Piedmontese recipe handed down for generations.","has_photo":true,"photo_credit":"libraryofspirits.com — http://libraryofspirits.com (Sibona Amaro Bitter)"},{"name":"Bad Spirits Amaro 1904","camp":"Just a Touch Left of Centre","price":"9","region":"Bologna, Italy","abv":"29%","tasting_notes":"Rich amber in the glass. It opens with zesty orange citrus, followed by the warmth of cinnamon and cloves, balanced by refreshing notes of mint and liquorice. Chamomile is the defining element, adding depth and aromatic complexity that elevates the whole profile.","ingredients":"chamomile, orange, cinnamon, mint, fennel, liquorice, cloves","notes":"","producer":"Bad Spirits, Bologna — Andrea & Alessandro De Cinque. Inspired by the family legacy of Ferdinando De Cinque, a scholar and botanist who perfected the recipe after years of refinement. 94 points, International Wine and Spirits Competition 2024.","has_photo":true,"photo_credit":"cellary.com (Tradizione Italiana Amaro \"1904\" Bad Spirits — Bologna)"},{"name":"Chamberton Amaro De Erbe","camp":"Just a Touch Left of Centre","price":"9","region":"Piedmont, Italy","abv":"25%","tasting_notes":"An herbal and balsamic amaro with vegetal notes and a gentle, easy bitterness. Made from alpine herbs, it drinks clean and earthy rather than heavy.","ingredients":"rhubarb, sage, gentian, angelica, cinchona, achillea, wild thyme and other alpine herbs","notes":"","producer":"Distilleria Erboristica Alpina, a mountain distillery in Susa, Piedmont. One of Italy’s biggest producers of génépy, working with alpine plants grown above 1,500m. (The menu lists this as “Chamberton”; the producer’s amaro is sold as Chaberton Amaro di Erbe.)","has_photo":true,"photo_credit":"media.lqrs.com / La Qusina (Distilleria Erboristica Alpina, product page \"distilleria-erboristica-alpina-amaro-di-erbe-alpino\")"},{"name":"Doragrossa Amaro Di Torino","camp":"Just a Touch Left of Centre","price":"10","region":"Piedmont, Italy","abv":"23%","tasting_notes":"The nose already shows distinct bitter tones: gentian roots, juniper, dark honey, fennel and liquorice. Sweetness and bitterness are well balanced, with bitter gentian root notes dominating, plus caramel, cloves and a hint of fennel and liquorice.","ingredients":"pink rhubarb roots, juniper, gentian, wild fennel, liquorice","notes":"","producer":"Doragrossa, a Turin liqueur maker. Their Amaro di Torino is a tribute to the city’s long tradition of producing high-quality spirits — wormwood, rhubarb and gentian macerated in the traditional manner.","has_photo":true,"photo_credit":"bernabei.it (Amaro Di Torino Doragrossa 70cl)"},{"name":"Faccia Brutto Amaro Gorini","camp":"Just a Touch Left of Centre","price":"13","region":"Brooklyn, USA","abv":"22%","tasting_notes":"Sweet orange and fennel on the nose with a subtle bitterness. Smooth and citrusy on the palate with a herbaceous backbone — orange, rhubarb root, cardamom and fennel seed. Lightly sweet finish with lingering gentian, and warming caramel notes from the barrel. Refreshing in hot weather.","ingredients":"13 botanicals including gentian, rhubarb root, fennel seed, sweet and bitter orange; aged a minimum of three months in ex-whiskey barrels, sweetened with cane sugar","notes":"","producer":"Faccia Brutto Spirits, Brooklyn, New York — founded by former fine-dining chef Patrick Miller. Amaro Gorini is named for his grandmother, Lena Pianta, who loved southern Italian spirits. The one American amaro on this list.","has_photo":true,"photo_credit":"importacionescantabria.com (Licor Amaro Gorini Faccia Brutto 750 ml)"},{"name":"Gotha Blu","camp":"Just a Touch Left of Centre","price":"12","region":"Emilia Romagna, Italy","abv":"30%","tasting_notes":"It opens with aromas traditionally associated with whiskey, then notes of licorice, mint & mandarin sweep in. On the palate it is strong, but balanced in flavour, and showing some balsamic notes.","ingredients":"whiskey that has been aged for three years, absinthe infusion, water from the Adriatic Sea","notes":"So basically the goal was to make an amaro that is whiskey with a bitter interpretation. Mis played with it one night, tinkering with the ratio of other ingredients to make a Paper Plane riff (seeing as it kind of covers both the whiskey and amaro aspects of that cocktail). I was skeptical, but what he made was really quite delicious.","producer":"The goal behind this one: an amaro that is whiskey with a bitter interpretation — three-year-aged whiskey plus an absinthe infusion. It even covers both the whiskey and amaro halves of a Paper Plane riff.","has_photo":true,"photo_credit":"winedispensary.com (Gotha Blu Amaro Emilia Romagna Italy)"},{"name":"IL Seminatore","camp":"Just a Touch Left of Centre","price":"11","region":"Friuli-Venezia Giulia, Italy","abv":"30%","tasting_notes":"Nose reveals scents of bitter orange, mint & alpine herbs. On the palate this amaro is round & slightly bitterish. The aftertaste is slightly bitter, with a long herbaceous presence.","ingredients":"closely guarded secret","notes":"This amaro is sort of at the crossroads of categories 1 & 2 on our list, depending on the customer. A good one to include if you have a table willing to try a flight, due to its straddling both worlds.","producer":"","has_photo":true,"photo_credit":"solocru.com (Amaro Seminatore, Toronto)"},{"name":"Roger Amaro Importante","camp":"Just a Touch Left of Centre","price":"12","region":"Calabria, Italy","abv":"20%","tasting_notes":"Intense amber with golden reflections. Intense and complex on the nose, with citrus, herbaceous and spicy notes. The taste is decisively bitter, balanced and persistent, with a long and pleasant aftertaste.","ingredients":"IGP lemons from Rocca Imperiale, sweet and bitter oranges from Bisignano, bergamot from Pellaro, gentian, cinchona, carlina","notes":"","producer":"Vecchio Magazzino Doganale, Calabria. Named for Roger, the navigator who — with Captain Jefferson — survived the 1871 shipwreck off Tropea and sheltered in the old customs warehouse that gives the distillery its name.","has_photo":true,"photo_credit":"kalsa.store (Amaro Roger Vecchio Magazzino Doganale cl 70)"},{"name":"Washington Amaro","camp":"Just a Touch Left of Centre","price":"11","region":"Calabria, Italy","abv":"30%","tasting_notes":"Citrus leads the way — orange in several forms — over a bitter backbone of elecampane root and chiretta. An orange-forward amaro with a proper bitter finish.","ingredients":"Washington oranges, lemon, sweet orange, bitter orange, grapefruit, elecampane root, chiretta, coriander","notes":"","producer":"A Calabrian amaro made for an increasingly demanding audience of bitter drinkers. Sold in Italy as “Amaro di arance ed erbe amaricanti” — a bitter of oranges and bitter herbs.","has_photo":true,"photo_credit":"hellozibly.com (Liquore Amaro Washington Amaro di Arance ed Erbe 70 cl)"},{"name":"Amaro Aplomado","camp":"Vegetal, Herbal (& Sometimes Smoky)","price":"10","region":"San Francisco, USA","abv":"32%","tasting_notes":"Less sweet than most amari and more herb-forward, with a firm herbal backbone, a lovely herbal-and-orange aroma, full body and a pleasant lingering finish. The low sugar makes it good neat or in drier cocktails.","ingredients":"Fresh California artichoke picked at peak flavour, layered over 25 locally sourced roots, herbs, fruits and flowers, on a grain-and-California-grape (brandy) base.","notes":"","producer":"Lo-Fi Aperitifs is a San Francisco line of vermouths and amaro built on California wines and natural botanicals — the botanical bill is printed right on the label — made for sipping and cocktails alike.","has_photo":false,"photo_credit":""},{"name":"Amaro Aplomado Barrel Aged","camp":"Vegetal, Herbal (& Sometimes Smoky)","price":"13","region":"San Francisco, USA","abv":"32%","tasting_notes":"No published tasting notes exist for the barrel-aged expression specifically.\n\nExpect the same base profile as Amaro Aplomado — herb-forward, artichoke-driven, orange notes, low sugar — smoothed and rounded by time in oak, which typically adds vanilla, spice and caramel warmth to the bitter backbone. (That last part is inference, not a published note.)","ingredients":"Same base as Amaro Aplomado: California artichoke over 25 roots, herbs, fruits and flowers; rested in barrel.","notes":"","producer":"Lo-Fi Aperitifs, San Francisco — this is the barrel-rested expression of their Amaro Aplomado.","has_photo":false,"photo_credit":""},{"name":"Amaro Timous","camp":"Vegetal, Herbal (& Sometimes Smoky)","price":"10","region":"Sicily, Italy","abv":"28%","tasting_notes":"Light amber and slightly opalescent, with a green, vegetal character. Wild thyme and bergamot lead on the nose with a balsamic edge, rounded by vanilla notes from the chestnut honey. No added sugar or colouring — only a little natural chestnut honey — so it drinks drier and more bitter than most amari. Best neat or with a cigar.","ingredients":"Wild thyme, bergamot peel and Italian helichrysum, naturally infused; a small amount of chestnut honey. No added sugar or colouring.","notes":"Listed as 'Amaro Nepèta Timous' on the producer's tech sheet — worth confirming against the bottle.","producer":"Made in Sicily by the small artisan liqueur maker Nepèta. Timous is handcrafted by natural infusion of organically farmed botanicals, with no distillation, ageing or filtration.","has_photo":true,"photo_credit":"raroshop.it (Amaro Timous, Nepeta)"},{"name":"Cappelletti Sfumato Rabarbaro","camp":"Vegetal, Herbal (& Sometimes Smoky)","price":"10","region":"Trentino, Italy","abv":"20%","tasting_notes":"Distinct hits of rhubarb, with a pleasant balance of bitterness and sweetness. That bittersweetness follows through into a long, long finish.","ingredients":"Alpine herbs, rhubarb and berries (which add a slight sweetness). The exact recipe is secret.","notes":"Sfumato translates to 'gradient' — a Renaissance painting technique where darkness and light play in perfect harmony. That idea plays out in the glass: this amaro also shows smoky notes that work very well in cocktails, especially with mezcal.","producer":"Antica Erboristeria Cappelletti of Aldeno, Trentino — founded in 1909 by herbalist Giuseppe Cappelletti and still family-run. A small operation (around 8 people, ~250,000 bottles a year) also known for their aperitivo and Elisir Novasalus.","has_photo":true,"photo_credit":"chathamliquor.com / chathambuyrite.com"},{"name":"Cipriani Amaro 7 Parti","camp":"Vegetal, Herbal (& Sometimes Smoky)","price":"13","region":"Veneto, Italy","abv":"35%","tasting_notes":"Bold and bitter on the palate, but with a striking smoothness as well. A carciofo-style amaro, though less aggressively so than others in our collection — and we now have enough of them to put together a very intriguing flight.","ingredients":"Leaves and stems of the purple artichokes grown on the island of Torcello, plus 7 secret herbs and spices.","notes":"","producer":"From the Cipriani family — the Venetian hospitality family behind Harry's Bar.","has_photo":true,"photo_credit":"thebeerguy.ca (Cipriani Amaro 7 Parti, LCBO image)"},{"name":"Cynar","camp":"Vegetal, Herbal (& Sometimes Smoky)","price":"8","region":"Trentino, Italy","abv":"16.5%","tasting_notes":"Savoury, earthy and vegetal, with a sweetish, almost caramel finish.","ingredients":"Artichoke, plus 12 other herbs and plants.","notes":"One of the most versatile amari to work with. It complements pretty much any base spirit, adding an oddball yet enjoyable note that makes you think, \"that drink was super delicious, and there's something interesting in there I can't quite put my finger on.\"","producer":"Created in 1952 by Venetian entrepreneur Angelo Dalle Molle, now made by the Campari Group. One of the most famous amari in the world.","has_photo":true,"photo_credit":"balaskas.shop (Cynar Ricetta Originale 16.5vol 700ml)"},{"name":"Faccia Brutto Carciofo","camp":"Vegetal, Herbal (& Sometimes Smoky)","price":"13","region":"Brooklyn, USA","abv":"25%","tasting_notes":"Bitter, earthy artichoke at the centre, framed by warm spice (cinnamon, allspice), lemon-peel brightness and bitter dandelion root. It sits in the same vegetal family as Cynar, but it isn't a copy — the artichoke reads more like a bitter food ingredient than a liqueur flavour.","ingredients":"Nineteen herbs and botanicals including artichoke, cinnamon, allspice, lemon peel and dandelion root; sweetened with cane sugar.","notes":"","producer":"Faccia Brutto Spirits is a Brooklyn distillery founded by former line cook Patrick Miller. They reinterpret classic Italian amari with American ingredients — fresh California artichokes are macerated for ten days for this bottle.","has_photo":true,"photo_credit":"yorkcellars.com (Faccia Brutto, Carciofo Amaro - 750mL)"},{"name":"Gotha Settemmezzo Amaro","camp":"Vegetal, Herbal (& Sometimes Smoky)","price":"12","region":"Emilia Romagna, Italy","abv":"","tasting_notes":"The violet artichokes are grown in the clay-like soil of the Bologna hills, giving a fresh, herbaceous flavour with notes leaning toward licorice root.","ingredients":"Purple artichokes of Bologna, chinotto, and water from the Adriatic Sea.","notes":"This amaro falls into the carciofo category — a subcategory of amaro built around a thistle of some sort, most commonly artichoke. Others in our collection: Cynar, Amaro Aplomado and Faccia Brutto Carciofo.\n\nThis one really wowed us when it first came in — definitely more of a sipper on its own.","producer":"Gotha Spiriti Nobili. The name Settemmezzo comes from a card game long played in Bologna's bars and osterias, and the amaro is an homage to the city — built around the violet artichoke that only grows in the hills around Bologna.","has_photo":true,"photo_credit":"italyfoodshop.it (Gotha Spiriti Nobili Settemmezzo Amaro al Carciofo 0.7lt)"},{"name":"Negroni Amaro Trevisano","camp":"Vegetal, Herbal (& Sometimes Smoky)","price":"11","region":"Veneto, Italy","abv":"27%","tasting_notes":"The nose is very vegetal, as you'd expect from an amaro built on radicchio. The palate is actually quite soft and balanced, with a hint of a bitter sting lurking in the background. The aftertaste is long — an amazing balancing act of citrus notes and bitterness.","ingredients":"Red radicchio, rhubarb, gentian, dandelion, ginseng and Roman wormwood.","notes":"A great addition to the menu, and an interesting companion to our Rabitt radicchio-based amaro.\n\nWe have a strong collection of vegetal amaros now: artichoke (Cynar, Amaro Aplomado, Settemmezzo, Faccia Brutto Carciofo), Chinese rhubarb (Sfumato, Quaglia Rabarbaro) and radicchio.","producer":"Negroni Antica Distilleria of Treviso — made to an old local recipe, built on the area's famous red radicchio.","has_photo":true,"photo_credit":"distillerianegroni.com (Amaro Trevisano Distilleria Negroni, producer site)"},{"name":"Quaglia Distillery Rabarbaro Amaro","camp":"Vegetal, Herbal (& Sometimes Smoky)","price":"10","region":"Piedmont, Italy","abv":"20%","tasting_notes":"No published tasting notes found for this specific bottle.\n\nRabarbaro liqueurs as a category are bittersweet, built on Chinese rhubarb with citrus zest and aromatic spice — but that describes the style, not this bottle.","ingredients":"Chinese rhubarb (rabarbaro).","notes":"","producer":"Distilleria Quaglia is a family-owned distillery in Castelnuovo Don Bosco, Piedmont, founded in 1890 by Cav. Giuseppe Quaglia. Four generations later the family still runs it, making traditional Piedmontese liqueurs, vermouths and craft spirits — their rhubarb liqueur took Gold at the IWSC in 2025.","has_photo":true,"photo_credit":"https://www.enotecadelfrate.it/prodotto/quaglia-rabarbaro-cl-70/"},{"name":"Roby Marton Rabitt Radicchio Amaro","camp":"Vegetal, Herbal (& Sometimes Smoky)","price":"12","region":"Veneto, Italy","abv":"26.2%","tasting_notes":"No published tasting notes found for this bottle.\n\nThe retail listing describes a bitter amaro made from late-season Treviso red radicchio combined with natural botanicals and essential oils — no synthetic ingredients, allergens, preservatives, colourants or thickeners. Recommended for mixing or as a digestif.\n\nOne listing shows 26.9% ABV against the 26.2% on our menu — worth checking the back-bar bottle.","ingredients":"Late-season Treviso red radicchio, natural botanicals and essential oils.","notes":"","producer":"Roby Marton is a Veneto spirits brand produced at Distilleria Monte Grappa in Bassano del Grappa — a historic distillation town. The brand is best known for its premium gins and vermouths, made with natural ingredients in a traditional Italian craft style.","has_photo":true,"photo_credit":"https://www.robymarton.com/ (Roby Marton producer site)"},{"name":"Amaro D'Angera","camp":"Alpine / Balsamic (& Sometimes Medicinal)","price":"11","region":"Lombardy, Italy","abv":"30%","tasting_notes":"Broad and round, with herbaceous hints and notes of oriental spice — from patchouli to nutmeg, date to bitter almond. The aftertaste is long with a lovely lingering bitterness.","ingredients":"Yarrow, star anise, sage, gentian, lemon balm, lesser calamint and Breckland thyme.","notes":"The texture and level of bitterness make this perfect for slipping into a Negroni as part of the vermouth quotient — the drink goes to another level of complexity, and the finish just keeps giving.","producer":"An alpine-style amaro from Lombardy.","has_photo":true,"photo_credit":"https://milanovino.it/vini/?regione=friuli-venezia-giulia"},{"name":"Amaro D. Co Ulrich","camp":"Alpine / Balsamic (& Sometimes Medicinal)","price":"12","region":"Piedmont, Italy","abv":"32%","tasting_notes":"The nose is full of herbs — a very herbaceous hit. The palate is full of the strong, bitter alpine notes you'd expect from a Piedmont amaro, and the bitterness carries through the finish with some vegetal notes over the top.","ingredients":"Mostly secret, but definitely génépy, gentian, anise, yarrow and wormwood — 19 herbs, flowers, fruits and roots in total.","notes":"A strong amaro, definitely not for the faint of heart. But for anyone wanting something bracing that isn't as bitter as the fernet category, this could be the ticket.","producer":"First made in 1854 to a recipe by Dr Domenico Ulrich; now produced in a revised version by the Marolo Distillery in Piedmont.","has_photo":true,"photo_credit":"https://scrufari.it/categoria-prodotto/liquoristica/amari/"},{"name":"Amaro Dilei","camp":"Alpine / Balsamic (& Sometimes Medicinal)","price":"12","region":"Piedmont, Italy","abv":"30%","tasting_notes":"A strong nose of roots and bitter herbs alongside the fresh scent of peppermint. The palate is sweet but balanced by alpine herb aromas, and the aftertaste is mentholated and almost balsamic — long and persistent.","ingredients":"The recipe is kept secret.","notes":"A pretty gentle amaro — an easy recommendation for anyone looking to get into amaro.","producer":"Made by Distilleria Bordiga in Piedmont, a distillery known for being scrupulous about raw materials — from the wine used as the base to the herbs to the mountain water. The idea is to bottle a specific sense of place: the flowers and herbs of the Piedmontese valleys.","has_photo":true,"photo_credit":"https://www.vinumitaly.it/bordiga-amaro-dilei-0-70-cl.html"},{"name":"Amaro Formidable","camp":"Alpine / Balsamic (& Sometimes Medicinal)","price":"13","region":"Lazio, Italy","abv":"33.5%","tasting_notes":"The nose is very aromatic with solid hits of gentian. The palate shows warming notes of gentian, rhubarb and citrus — and the finish is formidably bitter.","ingredients":"Red cinchona, nutmeg, pink burdock, Roman wormwood, gentian, Chinese rhubarb, sweet and bitter orange peel, kola nut, milk thistle and star anise.","notes":"One of our servers describes it as starting out as a gentle handshake and ending in an arm wrestle. Definitely for the seasoned amaro drinker looking for something special.","producer":"Formidabile Liquori & Affini of Rome — founded in 2013 by Armando Bomba after years of recipe research. A tiny operation making around 10,000 bottles a year; now part of Pallini.","has_photo":true,"photo_credit":"https://dialabottle.com/shop/spirits/liqueur/bitters/pallini-amaro-formidabile-700-ml-bottle/"},{"name":"Amaro Joachim","camp":"Alpine / Balsamic (& Sometimes Medicinal)","price":"14","region":"Calabria, Italy","abv":"30%","tasting_notes":"Distinctly herbal and firmly bitter — bartenders compare it to Cynar, more herbal than anything else, with a strong bitter backbone. It foams a little and drinks well as a bitter modifier, with a solid finish.","ingredients":"30 selected digestive Calabrian herbs, cold-infused. Also comes in Licorice, Balsamic and Bergamot expressions.","notes":"","producer":"Amaro Joachim ('L'Amaro del Profeta') is a small artisanal producer in Celico, Calabria. They exhibited at Vinitaly 2026 showcasing Calabrian amaro, licorice and wine.","has_photo":true,"photo_credit":"https://italvine.com/product/liquorificio-sila-joachim-amaro/"},{"name":"Amaro Scuppoz","camp":"Alpine / Balsamic (& Sometimes Medicinal)","price":"13","region":"Abruzzo, Italy","abv":"30%","tasting_notes":"The nose is quite vegetal with pronounced hits of gentian. The gentian carries onto a strong palate alongside rhubarb, and the finish is quite bitter and root-driven.","ingredients":"Dandelion, Roman wormwood, gentian, juniper, rhubarb, savory and yarrow.","notes":"For the more adventurous amaro drinker — close to the bitter end of the scale.","producer":"The Scuppoz family of Valle Castellana, Abruzzo. The project started in the late 70s with Benito Cicconi's passion for herbs and infusions; the company was officially founded in 1982 and is now run by his son Adriano. 'Scuppoz' is local dialect for the clinking of glasses in a toast.","has_photo":true,"photo_credit":"https://www.elementalspirits.co/spirits/ (Elemental Spirits)"},{"name":"Amaro Venti","camp":"Alpine / Balsamic (& Sometimes Medicinal)","price":"12","region":"Lombardy, Italy","abv":"26%","tasting_notes":"The nose is both floral and vegetal. On the palate there's a delightful blast of citrus before a wave of basil follows. The finish is long, long, long, with a slight dry bitterness.","ingredients":"Myrtle, lemon, basil, orange, juniper, olive, tansy, yarrow and gentian.","notes":"Venti sits at the gentler end of the bolder amaro camp. Good for stretching a guest who already has some amaro experience.","producer":"Venti is built around 20 botanicals — one handpicked ingredient for each of Italy's 20 regions, which is where the name comes from.","has_photo":true,"photo_credit":"https://horecanews.it/ (Horeca News)"},{"name":"Argala Amaro Alpino","camp":"Alpine / Balsamic (& Sometimes Medicinal)","price":"12","region":"Piedmont, Italy","abv":"28%","tasting_notes":"Very fragrant and citrusy on the nose, with balsamic notes. On the palate it's intense, warm and full-bodied with pleasant citrusy overtones; the aftertaste stays bitter with balsamic and pine-needle notes.","ingredients":"Orange peel, lavender, pine, cardamom and ginger.","notes":"The word 'Argala' means to be satisfied.\n\nA trip down the old spice road — maybe not for a first-timer, but not hard to like if your guest seems curious and open-minded.","producer":"Argalà — a small producer in Boves, Piedmont, started in 2011 by two childhood friends, Enrico and Piero, who now grow their own botanicals.","has_photo":true,"photo_credit":"https://amaroaficionado.com/encyclopedia"},{"name":"Cappelletti Amaro Pasubio","camp":"Alpine / Balsamic (& Sometimes Medicinal)","price":"10","region":"Trentino, Italy","abv":"17%","tasting_notes":"A taste of the Dolomites: on a base of rich aged wine (not neutral spirit), it shows blueberries, pine and smoke together with bitter alpine herbs. Rare among amari for featuring mountain berries, which give it a lovely fruitiness on the finish. Smooth and lush — traditionally enjoyed neat at cellar temperature or chilled, and it makes simple spritzes with tonic, soda or lemonade.","ingredients":"Mountain berries (including blueberry), pine (mugo) and bitter alpine herbs, on an aged-wine base.","notes":"","producer":"Antica Erboristeria Cappelletti of Aldeno, Trentino — founded 1909 by herbalist Giuseppe Cappelletti, still family-run (see the Sfumato brief).","has_photo":true,"photo_credit":"https://www.labat.ch/ (Labat)"},{"name":"Cappelletti Elisir Novasalus","camp":"Alpine / Balsamic (& Sometimes Medicinal)","price":"12","region":"Trentino, Italy","abv":"16%","tasting_notes":"The nose is an intense bouquet of alpine herbs. The palate registers bitterness instantly, with some balsamic notes — and almost juicy citrus notes once the shock of the first sip or two subsides. The aftertaste is classic alpine, except dialled up to 11. The finish lasts until food is consumed.","ingredients":"Aloe, angelica, anise, orange, wormwood, burdock, cinnamon, cardamom, centaury, cloves, ivy, eucalyptus, fennel, buckthorn, ash, gentian, juniper, orris, lavender, lemon balm, mint, licorice, rhubarb, dandelion, valerian, saffron, zedoary and ginger.","notes":"This one needs just the right guest — likely the most shockingly bitter thing in our collection, and that's saying something. An amazing thing to have.","producer":"Antica Erboristeria Cappelletti of Aldeno, Trentino (see the Sfumato brief).","has_photo":true,"photo_credit":"https://www.nicks.com.au/products/cappelletti-vino-elisir-novasalus-vino-amaro-digestif-liqueur-750ml"},{"name":"Chiot Montamaro","camp":"Alpine / Balsamic (& Sometimes Medicinal)","price":"11","region":"Piedmont, Italy","abv":"18%","tasting_notes":"A gentle, easygoing alpine amaro. The nose is soft and floral with orange blossom and sweet herbs; the palate is warm, full and slightly syrupy, with citrus, spice (clove, saffron, cinnamon) and a mild gentian bitterness on the finish that keeps it balanced. Sweeter and more floral than robust — a beginner-friendly amaro, closer to a liqueur like Grand Marnier than a bitter classic like Braulio.","ingredients":"Wild-foraged alpine botanicals — génépy, yarrow, gentian, thyme and mint — dried at altitude, infused individually and blended.","notes":"'Chiot' is a Piedmontese word for a shepherd's mountain refuge hut.\n\nOur menu lists 18% ABV, but some listings show 28% — worth checking the bottle.","producer":"Distilleria Bordiga, a historic distillery in the Cuneo area of Piedmont. The recipe is thought to date back to the 1930s.","has_photo":true,"photo_credit":"https://evolvehoreca.ro/bordiga/ (Evolve Horeca)"},{"name":"Distilleria Alpina Amaro Alpino","camp":"Alpine / Balsamic (& Sometimes Medicinal)","price":"10","region":"Trentino, Italy","abv":"18.5%","tasting_notes":"Bitterness and sweetness in perfect balance, with persistent hits of cinchona and rhubarb. The aftertaste drops some of the sweetness and highlights the drying, bitter notes.","ingredients":"Gentian roots, juniper berries, cinchona, rhubarb and calamus (a tall wetland plant whose oils are traditionally used for stomach complaints).","notes":"A great pick for someone who's tried the classics (Montenegro, Lucano, Averna, Nonino) and wants something rarer and slightly more challenging.","producer":"Distilleria Alpina of Trento — founded by Agostino Pontillo, a Sicilian who fell in love with the Alps while stationed on the Asiago plateau in WWI. The Amaro Alpino recipe dates to 1930.","has_photo":true,"photo_credit":"https://www.trentiner.it/food/amaro-alpino-1-l-amaro-alpino.html"},{"name":"Distilleria Alpina Amaro Alpino Riserva","camp":"Alpine / Balsamic (& Sometimes Medicinal)","price":"13","region":"Trentino, Italy","abv":"18.5%","tasting_notes":"The base Amaro Alpino is built on 22 mountain herbs, roots and berries — gentian, juniper, clary sage and elderflower stand out — giving rich mountain scents and easy drinking. The Riserva is the rested expression: higher herb concentration with slow maturation, so it drinks deeper and more intense than the base. No detailed third-party tasting notes exist for the Riserva specifically.","ingredients":"Same base botanicals as Amaro Alpino: gentian roots, juniper berries, cinchona, rhubarb, calamus and more.","notes":"","producer":"Distilleria Alpina of Trento (see the Amaro Alpino brief) — the Riserva is their matured, more concentrated expression.","has_photo":true,"photo_credit":"https://www.amaroalpino.it/prodotto/la-riserva-bottiglia-da-07-litri/ (producer)"},{"name":"Faccia Brutto Amaro Alpino","camp":"Alpine / Balsamic (& Sometimes Medicinal)","price":"13","region":"Brooklyn, USA","abv":"35%","tasting_notes":"Alpine amaros are invigorating and intensely herbal, often with a spicy, savoury character — and this one has all of that in spades.","ingredients":"Gentian, cinchona, cinnamon, orange zest, angelica, licorice root, wormwood, allspice, rhubarb root, cardamom, nutmeg, cloves, chicory and dark honey from upstate New York.","notes":"Very exciting to have — we don't usually get many of the great American-made amari, and this little Brooklyn distiller makes some of the most highly regarded ones.","producer":"Faccia Brutto Spirits — the Brooklyn distillery founded by former line cook Patrick Miller (see the Carciofo brief).","has_photo":true,"photo_credit":"https://www.bittersandbottles.com/products/faccia-brutto-amaro-alpino"},{"name":"Luxardo Amaro Abano","camp":"Alpine / Balsamic (& Sometimes Medicinal)","price":"11","region":"Veneto, Italy","abv":"30%","tasting_notes":"The nose is a blast of intense medicinal herbs. The palate is another story — perfectly balanced between bitterness and sweetness. The follow-through turns slightly more bitter, and the citrus notes come out more than at the outset.","ingredients":"Cardamom, cinnamon, bitter orange peel, cinchona and other secret ingredients.","notes":"Very voluptuous in the mouth — beautiful texture. Also an incredible mixing amaro: it adds without overwhelming.","producer":"Luxardo of Torreglia, Veneto — the historic liqueur house founded in 1821, best known for maraschino.","has_photo":true,"photo_credit":"https://www.nestorliquor.com/products/luxardo-amaro-abano"},{"name":"Poli Amaro Vaca Mora","camp":"Alpine / Balsamic (& Sometimes Medicinal)","price":"9","region":"Veneto, Italy","abv":"32%","tasting_notes":"The nose opens with spice and a hint of mint. After that it's full-on bitter-medicinal, straight through a long, grippy finish.","ingredients":"Lemon balm, hops, cinchona, wormwood, calamus, bitter orange, cardamom, blood orange, cinnamon, coriander, mint, hyssop, chamomile, iris, angelica and mace.","notes":"A bracing, wonderfully fierce amaro — one foot slipping toward the fernet category. It's named for a steam train: while passengers waited in the café, they'd sip this strong amaro with their coffee.","producer":"Distilleria Poli of Veneto — the grappa-making Poli family, distilling since 1898.","has_photo":true,"photo_credit":"https://winevybe.com/poli-vaca-mora-amaro/"},{"name":"Quaglia Balsamico Amaro","camp":"Alpine / Balsamic (& Sometimes Medicinal)","price":"12","region":"Piedmont, Italy","abv":"19%","tasting_notes":"Deep, intense colour with a nose of medicinal herbs — gentian and quassia lead — followed by an elegant resin and wood aftertaste. The namesake balsamic note is there but blends in rather than dominating. Soft and enveloping in the mouth: it opens sweet and settles into a bitter, clean, persistent finish. Serve cold, neat as a digestif, or as a cocktail base.","ingredients":"Gentian, quassia and medicinal herbs.","notes":"","producer":"Distilleria Quaglia — the family distillery in Castelnuovo Don Bosco, Piedmont, founded 1890. The Balsamico belongs to their Amari 1890 line marking 130 years of the family recipe, and it took Silver at the IWSC in 2025.","has_photo":true,"photo_credit":"https://sar.luding.ru:443/collection/item/1890-amaro-balsamico--291901/"},{"name":"St. Hubertus Amaro Riserva","camp":"Alpine / Balsamic (& Sometimes Medicinal)","price":"13","region":"Piedmont, Italy","abv":"38%","tasting_notes":"An intense nose of roots, barks and alpine flowers. The palate is powerful, bitter and aromatic with strong hits of eucalyptus; the aftertaste turns balsamic and flows into a long licorice finish.\n\nOur training notes describe the base St. Hubertus — the Riserva is its rested, more mature expression.","ingredients":"Licorice, dandelion, masterwort, gentian, aloe and angelica.","notes":"Not for the faint of heart, but an amaro lover would be impressed we have it on the list.","producer":"Made by Distilleria Bordiga in Piedmont, in small-batch style. Named for St. Hubertus, the patron saint of hunters.","has_photo":true,"photo_credit":"https://www.thewinecollective.com.au/products/bordiga-amaro-riserva-st-hubertus-38-700ml"},{"name":"Faccia Brutto Fernet Pianta","camp":"Fernet (In a League of Their Own)","price":"13","region":"Brooklyn, USA","abv":"35%","tasting_notes":"A more nuanced fernet than many on the market — lighter in both colour and flavour, not the dense bitter beast. Powerful but not a bully.","ingredients":"Saffron, myrrh, rhubarb root, chamomile, gentian, nutmeg, star anise, fennel seed, allspice, galangal, cocoa nibs, chicory, orange zest, peppermint, coriander, cinnamon, aloe ferox.","notes":"An interesting cocktail ingredient — strong enough to stand up in a drink without taking it over.","producer":"Faccia Brutto (\"ugly face\") is a small Brooklyn distillery making Italian-style spirits; the Fernet Pianta is its take on the category.","has_photo":true,"photo_credit":"Flatiron Wines NYC"},{"name":"Fernet Branca","camp":"Fernet (In a League of Their Own)","price":"9","region":"Lombardy, Italy","abv":"39%","tasting_notes":"Strong and medicinal, with top notes of eucalyptus and elements of candy cane, mint toothpaste and mentholated cough drop. Extremely bitter — this is not the bottle to hand a fernet newcomer first; it usually takes a few tries to get past that initial bitterness.","ingredients":"Aloe ferox, bitter orange, cardamom, chamomile, cinchona bark, galangal, laraha (a bitter orange relative from Curaçao), laurel, myrrh, rhubarb.","notes":"In cocktails it is usually used in small doses — it has a very loud voice.\n\nAlso known as half of the \"Ferrari\" shot, alongside Campari; a straight shot is nicknamed the \"bartender's handshake\".","producer":"Fratelli Branca Distillerie, Milan. Founded in 1845 and still family-owned, it is the fernet that defined the category — the benchmark every other fernet gets measured against.","has_photo":true,"photo_credit":"https://brimel-bebidas.lovable.app"},{"name":"Fernet Brancamenta","camp":"Fernet (In a League of Their Own)","price":"10","region":"Lombardy, Italy","abv":"28%","tasting_notes":"The mint version of Fernet Branca — intense cooling peppermint and spearmint up front, backed by a chocolaty core and the familiar bitter herbal depth. Noticeably sweeter and more approachable than the original, with a long, refreshing minty finish.","ingredients":"The Fernet Branca base of 40+ herbs, plus Piedmontese peppermint oil.","notes":"One of the most accessible fernets for sipping neat, especially served ice-cold. Developed in the 1960s.","producer":"Fratelli Branca, Milan — the same family house behind Fernet Branca, distilling since 1845. Brancamenta was inspired by opera singer Maria Callas, who reportedly drank her Fernet Branca with mint syrup.","has_photo":true,"photo_credit":"https://www.systembolaget.se/produkt/sprit/fernet-8740102/"},{"name":"Fernet Francisco Manzanilla","camp":"Fernet (In a League of Their Own)","price":"10","region":"San Francisco, USA","abv":"40%","tasting_notes":"\"Manzanilla\" is Spanish for chamomile, and this is the chamomile-forward expression of Fernet Francisco — fresh mint and eucalyptus on the nose with bay laurel, then chamomile, wild fennel and cinnamon on a dry palate.","ingredients":"12 botanicals native to the San Francisco Bay Area, including chamomile, mint, eucalyptus, bay laurel, wild fennel, rhubarb, gentian root, orris root, cardamom, cinnamon, orange peel and angelica root.","notes":"","producer":"Fernet Francisco — founded by Bay Area locals Max Rudsten and Ben Flajnik, the first locally crafted Bay Area fernet, built from ingredients sourced within 100 miles of San Francisco.","has_photo":true,"photo_credit":"https://bourbonhuntusa.com/collections/fernet"},{"name":"Fernet Francisco Ruibarbo","camp":"Fernet (In a League of Their Own)","price":"10","region":"San Francisco, USA","abv":"40%","tasting_notes":"The rhubarb variation — rich rhubarb, orange, anise and herbs. Cola notes on the nose, then licorice, rhubarb and fennel, finishing with orange peel and a hint of sugared cashews. Drinks closer to the broader amaro family than a straight bitter bomb.","ingredients":"The 12-botanical Bay Area base, led by rhubarb.","notes":"","producer":"Fernet Francisco — founded by Bay Area locals Max Rudsten and Ben Flajnik, the first locally crafted Bay Area fernet, built from ingredients sourced within 100 miles of San Francisco.","has_photo":true,"photo_credit":"https://bespokewineandspirits.com/collections/spirits"},{"name":"Fernet Paesani","camp":"Fernet (In a League of Their Own)","price":"11","region":"Abruzzo, Italy","abv":"40%","tasting_notes":"Spicy aroma with strong bitter notes. Intensely bitter on the palate, with big hits of rhubarb and cinchona; the bitterness and spice carry through a long, intense finish. Notably drier and less syrupy than Fernet Branca.","ingredients":"Aloe, rhubarb, cinchona.","notes":"","producer":"An Abruzzo-made fernet whose calling card is dryness — very little of the syrupy weight found in the bigger brands.","has_photo":false,"photo_credit":""},{"name":"Fernet Vallet","camp":"Fernet (In a League of Their Own)","price":"10","region":"Mexico /","abv":"35%","tasting_notes":"Extremely bitter and wood-focused — dark cloves, cardamom and gentian root lead, with a cinnamon-and-allspice nose and a hint of prune. Almost no sweetness; lighter in body than Branca, with the flavour carried by botanical intensity rather than weight.","ingredients":"Cinnamon, clove, quassia wood, gentian root, cardamom.","notes":"","producer":"Created in 1860s Mexico by French emigrant Henri Vallet, and still made to the original 150-year-old recipe in Hidalgo. One of the oldest fernet recipes in the world.","has_photo":true,"photo_credit":"https://www.diffordsguide.com/beer-wine-spirits/7104/fernet-vallet"},{"name":"Francisco Fernet Willet Bourbon Barrel","camp":"Fernet (In a League of Their Own)","price":"13","region":"San Francisco, USA","abv":"40%","tasting_notes":"Six months in Willett bourbon casks makes this rich, complex and oaky — the bourbon barrel rounds the bitter edge with vanilla-oak depth.","ingredients":"The 12-botanical Bay Area base (see Fernet Francisco Manzanilla).","notes":"Part of the limited Cask series; bottled at 80 proof.","producer":"Fernet Francisco (see Fernet Francisco Manzanilla); the Cask series rests the fernet in Willett whiskey barrels.","has_photo":true,"photo_credit":"https://www.delmesaliquor.com/collections/fernet-francisco"},{"name":"Francisco Fernet Willet Rye Barrel","camp":"Fernet (In a League of Their Own)","price":"13","region":"San Francisco, USA","abv":"39.4%","tasting_notes":"The Fernet Francisco base after a rest in Willett rye whiskey barrels — the bitter botanicals pick up drier spice and oak character from the cask.","ingredients":"The 12-botanical Bay Area base (see Fernet Francisco Manzanilla).","notes":"Part of Fernet Francisco's limited Cask series of barrel-rested releases.","producer":"Fernet Francisco (see Fernet Francisco Manzanilla); the Cask series rests the fernet in Willett whiskey barrels.","has_photo":true,"photo_credit":"https://sf.flatiron-wines.com/products/fernet-francisco-cask-aged-in-willett-rye-barrels"},{"name":"Leonardo Spadoni Fernet","camp":"Fernet (In a League of Their Own)","price":"11","region":"Emilia-Romagna, Italy","abv":"51%","tasting_notes":"BIG — big even by fernet standards. A big wallop of mint followed by deep bitterness. Not for the faint of heart, but great for someone looking to move past Fernet Branca.","ingredients":"Licorice, chamomile, myrrh, masterwort, gentian, elderberry, quinine, cardamom, mint, chili, angostura, angelica, saffron, caramelized sugar.","notes":"Starts life as a grappa before the botanicals go in, and it is bottled at a massive 51% ABV.","producer":"Leonardo Spadoni's fernet from Emilia-Romagna — a grappa-based, 51% bruiser.","has_photo":true,"photo_credit":"https://www.beercraftsman.com/product-tag/spadoni/"},{"name":"Letherbee Fernet","camp":"Fernet (In a League of Their Own)","price":"13","region":"Chicago, USA","abv":"35%","tasting_notes":"Spicy and smooth — cinnamon and pepper up front, with spearmint, eucalyptus and dark notes of coffee and chocolate. Still bitter, but a slight sweetness balances it out; saffron leads, with rhubarb root and myrrh underneath and a subtle mentholated finish.","ingredients":"Over 20 botanicals, including saffron, rhubarb root, myrrh gum, spearmint and eucalyptus.","notes":"Versatile — shoot it, sip it after a meal, add it to coffee, or mix it into a cocktail.","producer":"Letherbee Distillers, Chicago. Released in 2014, it is the house's refined, balance-first take on the classic digestif.","has_photo":true,"photo_credit":"https://binendswine.com/products/letherbee-distillers-fernet-liqueur-illinois"},{"name":"Luxardo Fernet","camp":"Fernet (In a League of Their Own)","price":"","region":"Trentino, Italy","abv":"40%","tasting_notes":"Drier and more savory than most fernets — intensely bitter, built on gentian root, licorice and saffron, with black coffee and dark chocolate underneath. There is zero sweetness to soften it; the finish is long and herbal.","ingredients":"An infusion of 15 herbs and spices, including licorice, cardamom, gentian and saffron.","notes":"","producer":"The Luxardo family — the historic liqueur house famous for its maraschino since 1821 — has been producing this fernet since 1889.","has_photo":true,"photo_credit":"https://www.magnificofood.it/products/fernet-amaro-luxardo-700-ml"},{"name":"Meletti Fernet","camp":"Fernet (In a League of Their Own)","price":"11","region":"Marche, Italy","abv":"40%","tasting_notes":"Herbaceous nose with balsamic notes alongside the expected eucalyptus. Rich spices on the palate evolve into balsamic and mint before finishing on bitter gentian root. Long, persistent, clean and balanced — lighter in colour and more moderate in bitterness than most fernets, with hints of dark chocolate and espresso.","ingredients":"Top secret.","notes":"A very good fernet to recommend to skeptics — proof that fernet is not one single thing.","producer":"From Meletti, the Marche distillery whose spirits are known for that clean, balanced finish.","has_photo":true,"photo_credit":"https://www.klwines.com/products/details/1451360"},{"name":"Quaglia Fernet","camp":"Fernet (In a League of Their Own)","price":"10","region":"Piedmont, Italy","abv":"40%","tasting_notes":"No published tasting notes found for this bottling.","ingredients":"","notes":"","producer":"Antica Distilleria Quaglia — a fourth-generation family distillery at Castelnuovo Don Bosco in Piedmont, operating since 1890. Known for the Bèrto line of vermouths and liqueurs, built on long infusions of local botanicals.","has_photo":true,"photo_credit":"https://www.b-21.com/Quaglia-Fernet/productinfo/LCORQUAGAE/"}];
      var SPIRITS = [{"id":1,"name":"6 O'CLOCK GIN","category":"GIN - BRITISH ISLES","price":"10","origin":"England (Bristol)","abv":"43%","tasting_notes":"A classic, juniper-forward dry gin that stays smooth and easy-drinking. Clean pine notes up front, then a summery lift of elderflower and bright orange-citrus, with a warm, slightly peppery finish.","producer_note":"Made by Bramley & Gage, a family-run liqueur and spirit maker on the outskirts of Bristol, England.","has_photo":true,"photo_credit":"https://www.whiskynsunshine.com/classic-gin-and-tonic/"},{"id":2,"name":"ABLEFORTH'S BATHTUB GIN","category":"GIN - BRITISH ISLES","price":"9","origin":"England","abv":"43.3%","tasting_notes":"Bold and spice-driven rather than delicate: warming cinnamon, clove and cardamom sit over a piney juniper base, with bright orange peel cutting through. Oily and full-bodied, it drinks like it smells festive.","producer_note":"Created in 2011 by Atom Brands (the team behind Master of Malt), made by cold-infusing botanicals in spirit instead of re-distilling.","has_photo":true,"photo_credit":"https://lussorian.com/ultimate-christmas-gin-guide-2017/"},{"id":3,"name":"BEEFEATER LONDON DRY GIN","category":"GIN - BRITISH ISLES","price":"7","origin":"England (London)","abv":"40%","tasting_notes":"The textbook London Dry: loud, piney juniper with lots of fresh lemon and orange peel. Crisp, dry and clean with a light peppery bite on the finish — the classic bartender workhorse for gin cocktails.","producer_note":"Distilled since 1863 at the Beefeater Distillery in Kennington, London, from James Burrough's original nine-botanical recipe; owned by Pernod Ricard.","has_photo":true,"photo_credit":"https://www.barfish.de/Beefeater-London-Dry-Gin-1-Liter-40-Vol.html"},{"id":4,"name":"BLOOD MONKEY IRISH GIN","category":"GIN - BRITISH ISLES","price":"9","origin":"Ireland (Co. Cork)","abv":"40%","tasting_notes":"Unlike a typical dry gin — this one tastes almost like a light whiskey with juniper. Smooth, warm citrus spice up front, a hint of floral, and a smoky-sweet caramel finish. Built for sipping neat.","producer_note":"Dublin-based Outcast Brands, founded by Jason Kidd in 2020; distilled at West Cork Distillers in Skibbereen from malted Irish barley in a 350-year-old genever style.","has_photo":true,"photo_credit":"https://www.lcbo.com/en/blood-monkey-irish-gin-30756"},{"id":5,"name":"BOODLES LONDON DRY GIN","category":"GIN - BRITISH ISLES","price":"7","origin":"England","abv":"40%","tasting_notes":"A softer, more herbal take on London Dry — notably made without any citrus in the recipe. Piney juniper is mellowed by garden herbs (sage, rosemary) and warm nutmeg, giving a smooth, easy-mixing gin that takes a lemon twist beautifully.","producer_note":"Recipe dating to 1845, named for Boodle's gentleman's club in St James's (a favourite of Churchill and Ian Fleming); distilled at Greenall's distillery in Warrington, owned by Proximo Spirits.","has_photo":true,"photo_credit":"https://direct.winealign.com/wines/87891-Boodles-London-Dry-Gin"},{"id":6,"name":"THE BOTANIST GIN","category":"GIN - BRITISH ISLES","price":"10","origin":"Scotland (Isle of Islay)","abv":"46%","tasting_notes":"Wildly aromatic and floral rather than juniper-heavy: imagine a walk through a herb garden — mint, thyme, wildflowers and citrus over a mellow juniper backbone. Silky, rich texture with a long, fresh, cool finish.","producer_note":"Made at Bruichladdich Distillery on the Isle of Islay using 22 hand-foraged island botanicals plus nine classics, slowly distilled in a one-off Lomond still nicknamed 'Ugly Betty'.","has_photo":true,"photo_credit":"cdn.prod.website-files.com"},{"id":7,"name":"BROKER'S PREMIUM LONDON DRY GIN","category":"GIN - BRITISH ISLES","price":"8","origin":"England (near Birmingham)","abv":"40%","tasting_notes":"Big, classic and unapologetically juniper-forward: piney and spicy with lemon and orange zest brightening it up and a warm peppery fade. A bold, old-school London-style gin that holds its own in any cocktail.","producer_note":"Created in 1998 by brothers Martin and Andy Dawson, distilled in a 200-year-old distillery outside Birmingham in a traditional copper pot still; famously wears a bowler-hat bottle cap.","has_photo":true,"photo_credit":"https://www.gopuff.com/p/big-gin-london-dry-750ml/p32543"},{"id":8,"name":"BURROUGHS RESERVE GIN","category":"GIN - BRITISH ISLES","price":"15","origin":"England (London)","abv":"43%","tasting_notes":"Beefeater's oaked sipping gin: the familiar juniper-and-citrus core is softened and enriched with creamy vanilla, butterscotch and dried fruit from the barrel. Long, warming finish — best neat or in a simple Old Fashioned.","producer_note":"Beefeater's premium expression, distilled in James Burrough's tiny original 19th-century 'Still No. 12' and rested in Jean de Lillet / Bordeaux wine barrels at the Kennington distillery.","has_photo":true,"photo_credit":"https://www.fooddive.com/news/beefeater-introduces-new-burroughs-reserve-gin/130556/"},{"id":9,"name":"CAORUNN GIN","category":"GIN - BRITISH ISLES","price":"9","origin":"Scotland (Speyside, Highlands)","abv":"41.8%","tasting_notes":"Clean and crisp with a distinctly Scottish accent: juniper and citrus peel up front, then floral heather, wild herbs and a fleeting hint of sweet apple. Full-bodied but fresh, with a dry, lightly peppery finish.","producer_note":"Scotland's first small-batch gin, distilled at the Balmenach whisky distillery in Speyside using five hand-foraged Celtic botanicals (rowan berry, heather, bog myrtle, dandelion, Coul Blush apple); named from the Gaelic for rowan berry.","has_photo":true,"photo_credit":"media.immediate.co.uk"},{"id":10,"name":"CONKER DORSET DRY GIN","category":"GIN - BRITISH ISLES","price":"10","origin":"England (Dorset)","abv":"40%","tasting_notes":"A fresh, bright London Dry with a coastal twist: piney juniper and crisp lime-citrus up front, then savoury seaside herbs and a jammy hint of elderberry. Lively and layered with a clean, lingering citrus finish.","producer_note":"Dorset's first gin distillery, founded 2014 by Rupert Holloway in Bournemouth, using ten botanicals including foraged gorse flowers, samphire and elderberries from the Dorset coast and New Forest.","has_photo":true,"photo_credit":"i.pinimg.com"},{"id":11,"name":"CONKER PORT BARREL GIN","category":"GIN - BRITISH ISLES","price":"8","origin":"England (Dorset)","abv":"43%","tasting_notes":"Conker's Dorset Dry rested in port barrels, so you get the gin's piney juniper and fresh herbs wrapped in soft port flavour: red berries, warm spice and a vanilla-woody sweetness, with a gentle fruity sweetness on the finish.","producer_note":"Conker Spirit (Rupert Holloway, Bournemouth) — their signature Dorset Dry rested for 8 weeks in used ruby port barrels from Portugal, which also gives it a blush-pink hue.","has_photo":true,"photo_credit":"drinkch.rokka.io"},{"id":12,"name":"COTSWOLD LONDON DRY GIN","category":"GIN - BRITISH ISLES","price":"10","origin":"England (Cotswolds)","abv":"46%","tasting_notes":"Bold and oily at a full 46%: strong juniper with a burst of fresh grapefruit and citrus, then floral lavender and a fiery black-pepper kick. Rich, punchy and distinctive — great in a Martini or French 75.","producer_note":"Flagship gin of the Cotswolds Distillery (founded by Daniel Szor) in Stourton, England, made with nine botanicals including local lavender, bay leaf and fresh citrus zest; famously turns cloudy ('looshes') with ice.","has_photo":true,"photo_credit":"https://www.clickfrenzy.com.au/deal/parrot-bay-mango-50ml-1787171711811"},{"id":13,"name":"CURIO OF CORNWALL GIN","category":"GIN - BRITISH ISLES","price":"10","origin":"England (Cornwall)","abv":"41%","tasting_notes":"A coastal, savoury gin rather than a citrusy one: juniper leads, with a sea-breeze hint of samphire and seaweed, warm spice (star anise, nutmeg) and bright lemon and lime peel. Smooth enough to sip neat.","producer_note":"Made by the Curio Spirits Company, founded by William and Rubina Tyler-Street in Mullion, West Cornwall, using 15 botanicals including rock samphire foraged from the Cornish cliffs.","has_photo":true,"photo_credit":"https://www.pinterest.com/ideas/curio-gin/896308665658/"},{"id":14,"name":"DRUMSHANBO GUNPOWDER TEA GIN","category":"GIN - BRITISH ISLES","price":"10","origin":"Ireland (Co. Leitrim)","abv":"43%","tasting_notes":"Citrus first — grapefruit and lime — then a grassy, green-tea character that makes it stand out from other gins, over a juniper base with cardamom and star anise spice. Bright, layered and aromatic.","producer_note":"Flagship of The Shed Distillery in Drumshanbo, Co. Leitrim, founded by PJ Rigney in 2014; slow-distilled in medieval-style copper pot stills with 12 botanicals including Chinese gunpowder tea and Irish meadowsweet.","has_photo":true,"photo_credit":"https://www.ubereats.com/brand-city/dallas-tx/specs"},{"id":15,"name":"DRUMSHANBO SARDINIAN CITRUS GIN","category":"GIN - BRITISH ISLES","price":"10","origin":"Ireland (Co. Leitrim)","abv":"43%","tasting_notes":"The Gunpowder gin turned up in citrus: a bright, almost candy-like burst of orange, grapefruit and lemon from the rare Sardinian 'sa pompia' citrus, with the same green-tea and oriental spice backbone underneath. Big, juicy G&T material.","producer_note":"The Shed Distillery, Drumshanbo, Co. Leitrim (PJ Rigney) — the original Gunpowder recipe boosted with vapour-infused Sardinian Citrus monstruosa fruit discovered on founder PJ Rigney's travels.","has_photo":true,"photo_credit":"https://pro.winetime.com.ua/mitsnyy-alkogol/dzhin/brand=drumshanbo"},{"id":16,"name":"EAST LONDON LIQUOR CO. DRY GIN","category":"GIN - BRITISH ISLES","price":"11","origin":"England (London)","abv":"40%","tasting_notes":"A straightforward, no-nonsense London Dry: lemon and grapefruit peel bring the freshness, juniper stays front and centre, and cardamom and cubeb berries add a warm, peppery spice on the finish. A solid house-style mixer.","producer_note":"East London Liquor Company, founded by Alex Wolpert at Bow Wharf in Hackney — the first spirits distillery in East London in over 100 years, making gin, vodka, rum and whisky on site.","has_photo":true,"photo_credit":"https://www.behance.net/gallery/22959113/East-London-Liquor-Company-Gin?locale=en_US"},{"id":17,"name":"FIFTY POUNDS GIN","category":"GIN - BRITISH ISLES","price":"10","origin":"England (London)","abv":"43.5%","tasting_notes":"Classic and silky: piney juniper with lots of bright lemon and lime, a touch of coriander spice and a gentle warming pepper tickle. Smooth, balanced and refined with a long, clean, fresh finish.","producer_note":"Produced at Thames Distillers in London in small ~1,000-bottle batches; the name references the 1736 Gin Act's £50 distilling tax, and the recipe draws on botanicals from four continents.","has_photo":true,"photo_credit":"https://bevingrosso.it/prodotti/distillati/gin/fifty-pounds-london-dry-gin-cl-70-x-1-bottiglia-vetro/?add-to-cart=39709"},{"id":18,"name":"FISHER'S 50 GIN","category":"GIN - BRITISH ISLES","price":"13","origin":"England (Suffolk)","abv":"50%","tasting_notes":"A bold, savoury, higher-strength gin that tastes of the Suffolk coast: juniper and pine with salty-herbaceous notes of samphire and sea purslane, a warm nutmeg-cinnamon spice and a peppery bite. Built for a strong Martini.","producer_note":"Fishers Gin distillery in Aldeburgh, Suffolk, founded by Andrew Heald; 'Fifty' marks the 50% ABV and the opening of the seaside distillery, using foraged coastal botanicals like spignel, wood avens and bog myrtle.","has_photo":true,"photo_credit":"cdn11.bigcommerce.com"},{"id":19,"name":"FORDS GIN","category":"GIN - BRITISH ISLES","price":"7","origin":"England (London)","abv":"45%","tasting_notes":"Made by bartenders, for cocktails: juniper and coriander up front, bright grapefruit and lemon citrus through the middle, and a delicate jasmine-floral lift. Rich and slightly oily, it keeps its flavour even when diluted in a drink.","producer_note":"Launched by Simon Ford with master distiller Charles Maxwell at Thames Distillers in London; its nine botanicals were chosen by reverse-engineering classic cocktail recipes, bottled at 45% to punch through mixers.","has_photo":true,"photo_credit":"https://www.systembolaget.se/produkt/sprit/fords-8212601/"},{"id":20,"name":"GLENDALOUGH WILD BOTANICAL ROSE GIN","category":"GIN - BRITISH ISLES","price":"9","origin":"Ireland (Co. Wicklow)","abv":"41%","tasting_notes":"A proper rose gin: fresh rose-petal perfume up front (three rose varieties), with bright citrus and juniper keeping it structured and not soapy. Floral but dry, with a hint of pink-peppercorn spice on the finish.","producer_note":"Glendalough Distillery in the Wicklow Mountains, 'the Garden of Ireland,' founded by five friends; botanicals are hand-foraged year-round by the distillery's full-time forager, Geraldine Kavanagh.","has_photo":true,"photo_credit":"https://www.reservebar.com/products/glendalough-rose-gin/GROUPING-1177953"},{"id":21,"name":"HAYMAN'S LONDON DRY GIN","category":"GIN - BRITISH ISLES","price":"7","origin":"England (London)","abv":"41.2%","tasting_notes":"A gin-lover's London Dry: bold, piney juniper with lively lemon-orange citrus and a gentle warming spice, finishing dry with a touch of earthiness. Classic, balanced and great in a G&T with a lemon twist.","producer_note":"Family-run Hayman Distillers, in London since 1863 (five generations); made to a 150-year-old family recipe with a traditional two-day steeping process, from the family of Beefeater founder James Burrough.","has_photo":true,"photo_credit":"https://www.mironet.cz/haymans-london-dry-gin-412-07-l+dp772813/"},{"id":22,"name":"HAYMAN'S FAMILY RESERVE GIN","category":"GIN - BRITISH ISLES","price":"10","origin":"England (London)","abv":"41.3%","tasting_notes":"Hayman's London Dry smoothed by a short rest in whisky barrels: the juniper and coriander stay dominant but rounder, with lemony spice, a honeyed hint and a gentle peppery warmth. Mellower than the London Dry without turning woody.","producer_note":"Hayman Distillers, London — the standard family recipe rested for three weeks in aged Scotch whisky barrels (released in numbered small batches), from England's longest-serving gin-distilling family.","has_photo":true,"photo_credit":"https://www.zigarrenvolles.de/spirituosen/"},{"id":23,"name":"HAYMAN'S OLD TOM GIN","category":"GIN - BRITISH ISLES","price":"10","origin":"England (London)","abv":"41.4%","tasting_notes":"Old Tom is the Victorian, slightly-sweetened style of gin: piney juniper softened by candied orange and almond, with warm baking spice and a rounded, silky sweetness from liquorice root. Made for a Martinez or Tom Collins.","producer_note":"Hayman Distillers, London — revived in 2007 at the request of London bartenders from an 1870s family recipe; the standard-bearer of the lightly-sweetened Old Tom style.","has_photo":true,"photo_credit":"https://pisanisrl.it/product/haymans-old-tom-gin/"},{"id":24,"name":"HENDRICK'S GIN","category":"GIN - BRITISH ISLES","price":"9","origin":"Scotland","abv":"41.4%","tasting_notes":"Cool and fresh rather than pine-heavy: cucumber and rose lead over gentle juniper and light citrus, with a smooth, clean finish.","producer_note":"William Grant & Sons, distilled at the Girvan Distillery in South Ayrshire using two antique stills (an 1860 Bennett and a 1948 Carter-Head).","has_photo":true,"photo_credit":"https://www.studiock.de/fotografie/"},{"id":25,"name":"HENDRICK'S ORBIUM GIN","category":"GIN - BRITISH ISLES","price":"10","origin":"Scotland","abv":"43.4%","tasting_notes":"The familiar cucumber-and-rose base with an added bitter twist: quinine and wormwood bring a dry, bittersweet herbal edge and a long zesty-to-bitter finish, lifted by blue lotus blossom.","producer_note":"William Grant & Sons, Girvan Distillery; a limited 'Cabinet of Curiosities' release created by Master Distiller Lesley Gracie.","has_photo":true,"photo_credit":"https://webshop.rotodinamic.hr/en/hendricks-orbium-gin"},{"id":26,"name":"ISLE OF HARRIS GIN","category":"GIN - BRITISH ISLES","price":"13","origin":"Scotland","abv":"45%","tasting_notes":"Clean and maritime: piney juniper and bright citrus (bitter orange, grapefruit) with a whisper of salty sea air from hand-harvested sugar kelp, in a notably soft, smooth body.","producer_note":"Isle of Harris Distillery, Tarbert, Outer Hebrides; made with sugar kelp gathered by local divers from the island's sea lochs.","has_photo":true,"photo_credit":"https://imbibemagazine.com/drink-of-the-week-isle-of-harris-gin/"},{"id":27,"name":"LIND & LIME","category":"GIN - BRITISH ISLES","price":"11","origin":"Scotland","abv":"44%","tasting_notes":"A textbook London Dry: fresh lime zest up front, earthy juniper at the core, and a gentle warm tingle of pink peppercorn on the finish.","producer_note":"Port of Leith Distillery, Edinburgh; named for Dr James Lind, the Leith ship's surgeon who linked citrus to curing scurvy.","has_photo":true,"photo_credit":"https://www.billingtonsoflenzie.co.uk/shop/wine-beer-spirits/gin/lind-lime/"},{"id":28,"name":"NO. 3 DRY GIN","category":"GIN - BRITISH ISLES","price":"9","origin":"England (distilled in the Netherlands)","abv":"46%","tasting_notes":"A bold, crisp London Dry: strong piney juniper, bright citrus from Spanish orange and grapefruit peel, and a dry, peppery warmth from coriander and cardamom.","producer_note":"Berry Bros. & Rudd, London's oldest wine merchant (trading from No. 3 St James's Street since 1698); distilled in a 100-year-old brick-encased copper pot still in Holland.","has_photo":true,"photo_credit":"https://qkawine.com/ruou-gin-no-3/"},{"id":29,"name":"OLD OXFORD GIN","category":"GIN - BRITISH ISLES","price":"11","origin":"England","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"https://saboresdotejo.com/producto/gin-oxford/"},{"id":30,"name":"ORKNEY NORTHWEST PASSAGE GIN","category":"GIN - BRITISH ISLES","price":"8","origin":"Scotland","abv":"42%","tasting_notes":"Bright and rounded: sharp citrus and floral dried-rose notes over solid juniper, with a light salty edge from sugar kelp and a dry, gently spiced finish.","producer_note":"Orkney Distillery, Kirkwall; made with botanicals from the shores of Orkney and Canada's Hudson Bay to fund a rowing expedition across the Arctic.","has_photo":true,"photo_credit":"https://www.davidmcconaghy.com/products"},{"id":31,"name":"OXLEY LONDON DRY GIN","category":"GIN - BRITISH ISLES","price":"8","origin":"England","abv":"47%","tasting_notes":"Exceptionally clean and smooth: bright fresh citrus (grapefruit, orange, lemon) with gentle juniper and a rounded, almost creamy mouthfeel.","producer_note":"Thames Distillery, London (Bacardi); famously cold-distilled at -5°C under vacuum to keep the botanicals' freshness intact.","has_photo":true,"photo_credit":"https://www.diffordsguide.com/forum/KdzgJE"},{"id":32,"name":"PLYMOUTH GIN","category":"GIN - BRITISH ISLES","price":"8","origin":"England","abv":"41.2%","tasting_notes":"Softer and rounder than a London Dry: restrained juniper with bright orange and lemon citrus and a slight natural sweetness, finishing smooth and elegant.","producer_note":"Black Friars Distillery, Plymouth (Pernod Ricard); distilled on the same site since 1793 in a Victorian copper pot still.","has_photo":true,"photo_credit":"https://www.mmidiplomatic.com/product-category/spirits/gin/"},{"id":33,"name":"RAMSBURY LONDON DRY","category":"GIN - BRITISH ISLES","price":"10","origin":"England","abv":"40%","tasting_notes":"Smooth and fragrant: fresh floral tones and a crisp fruity note from estate-grown quince over savoury juniper, with a light touch of spice on the finish.","producer_note":"Ramsbury Brewing & Distilling Company, Wiltshire; a single-estate gin distilled from winter wheat grown on the Ramsbury Estate's own fields.","has_photo":true,"photo_credit":"https://www.thehandbook.com/beautiful-gin-bottles-gifts/"},{"id":34,"name":"SACRED GIN CORIANDER","category":"GIN - BRITISH ISLES","price":"11","origin":"England","abv":"43.8%","tasting_notes":"Coriander turned up loud: a sweet burst of fresh-cracked coriander seed (citrusy and warm) with ginger, cinnamon and a light piney juniper backdrop, finishing dry and spicy.","producer_note":"Sacred Spirits, Highgate, London; each botanical is distilled separately under vacuum at low temperature by Ian Hart and Hilary Whitney.","has_photo":true,"photo_credit":"https://wodkavines.ca/sacred-coriander-gin/"},{"id":35,"name":"SHORTCROSS GIN","category":"GIN - BRITISH ISLES","price":"7","origin":"Northern Ireland","abv":"46%","tasting_notes":"Floral and meadow-like: elderflower and fresh apple lift a classic juniper core, with lemony coriander spice and a rich, oily mouthfeel leading to a gentle peppery finish.","producer_note":"Rademon Estate Distillery, Crossgar, County Down; the first gin distilled in Northern Ireland, made by Fiona and David Boyd-Armstrong with botanicals foraged on the estate.","has_photo":true,"photo_credit":"https://paperjamdesign.com/shortcross_gin/"},{"id":36,"name":"SIPSMITH LONDON DRY GIN","category":"GIN - BRITISH ISLES","price":"9","origin":"England","abv":"41.6%","tasting_notes":"A classic, well-mannered London Dry: dry juniper up front, then lemon tart and orange marmalade citrus, with warming spice and a creamy hint of liquorice on the finish.","producer_note":"Sipsmith, Hammersmith, London; founded 2009, the first copper-pot distillery to open in London in nearly 200 years.","has_photo":true,"photo_credit":"https://www.dynamiki-sa.gr/en"},{"id":37,"name":"SKELLIG SIX18 IRISH DRY","category":"GIN - BRITISH ISLES","price":"10","origin":"Ireland","abv":"43.4%","tasting_notes":"Herbaceous and wild: juniper with fresh Douglas fir and yarrow notes, pink grapefruit citrus, and a mild sweet mineral edge from birch s
