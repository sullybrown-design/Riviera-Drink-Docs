e":"Merlot ‘Les Cailloux’ — Château Penin, Bordeaux Supérieur 2020","price":"Bottle $140 (Riviera)","menu_note":"","region":"Bordeaux Supérieur (right bank)","grape":"100% Merlot (40-year-old vines)","producer":"Château Penin — the Carteyron family","style":"Pebble-soil parcel selection, ripe and structured","alcohol":"14.5%","body":5,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":4,"tannins_label":"High","tasting_notes":"black plum, wild blackberry, cassis jam, black cherry, vanilla, toast, graphite, crushed stones","story":"‘Les Cailloux’ means ‘the pebbles’ — the 40-year-old Merlot vines grow in half a metre of large round pebbles over clay, an unusual soil for the right bank, more like the left bank’s gravels. After a cool two-day soak and a three-week ferment, the wine ages 12 months in French oak barrels and then another 18 months in concrete tanks, which folds the oak into the wine while keeping it fresh. The 14.5% alcohol is high for Bordeaux and marks the ripe 2020 vintage; decant around two hours.","pairings":"Game, beef cuts, dishes with sauce, duck breast, veal with mushroom sauce.","producer_note":"Château Penin is a family estate founded in 1855 by Louis Carteyron, now 50 sustainably farmed hectares — in 2022 Antoine and his brother Étienne became the sixth generation to run it. ‘Les Cailloux’ is the estate’s premier vin, its top parcel selection.","photo_credit":"Photo: Krote","has_photo":true,"also_in":[]},{"id":81,"number":"10","section":"Red — France","subsection":null,"title":"Syrah ‘Le Moulin’ — Domaine Dumien-Serrette, Vin de France 2022","price":"Bottle $150 (Riviera)","menu_note":"","region":"Rhône Valley (labelled Vin de France)","grape":"100% Syrah","producer":"Domaine Dumien-Serrette (Cornas)","style":"‘Baby Cornas’ — smoky, juicy northern Rhône red","alcohol":"13%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"black and red cherries, smoky edge, black pepper, light baking spice, earth, juicy","story":"A ‘baby Cornas’: the fruit grows just outside the Cornas appellation boundary, on the Rhône’s east side in rocky alluvial soils like those of Crozes-Hermitage — so it can’t legally be called Cornas and is bottled as Vin de France. The cuvée takes its name from an old mill that once stood beside the parcel, planted with young vines in 2013. Hand-harvested and hand-sorted, foot-trodden (crushed by foot, the old way), fermented with wild yeasts and aged in old barrels; bottled unfined and unfiltered — not clarified or stripped. The importer suggests serving it with a slight chill, as the locals do in the northern Rhône.","pairings":"Good lamb, charcuterie, roast pork, grilled sausages, steak-frites — a natural summer-table red.","producer_note":"The Serrette family has been in Cornas since 1515 but only began estate-bottling in 1983, when Gilbert Serrette decided to make the wines himself instead of selling grapes to négociants. Now run by his son Nicolas on a tiny estate of just a few hectares; alongside ‘Le Moulin’ the domaine makes Cornas ‘Patou’ and ‘Henri’.","photo_credit":"Photo: Mon Vin Français (label shown is the 2021 vintage).","has_photo":true,"also_in":[]},{"id":82,"number":"11","section":"Red — France","subsection":null,"title":"Cabernet Franc ‘Clos du Château’ — Château de Parnay, Saumur-Champigny 2019","price":"As printed on the menu: ‘Cabernet Franc, Clos du Chateau, Chateau de Parnay, Saumur-Champigny (2019)’ — accents aside, same wine.","menu_note":"Bottle $150 (Riviera)","region":"Saumur-Champigny, Loire Valley","grape":"100% Cabernet Franc (old vines)","producer":"Château de Parnay","style":"Polished, oaked, age-worthy","alcohol":"13.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"ripe raspberry, red plums, blackberries, fresh herbs, mint, tobacco, violet, polished tannins","story":"Château de Parnay’s old vines grow in clay-limestone on a white-stone cliff above the Loire — the classic ground for serious Saumur-Champigny. The wine is aged in oak and comes out deeply coloured, structured and silky, built to hold rather than impress by weight. Expect dark red fruit with an herbal lift and a long, poised finish. A serious, complete Cabernet Franc from France’s Loire heartland.","pairings":"Bœuf bourguignon, roast lamb, slow-cooked casseroles, soft cheeses.","producer_note":"Château de Parnay has made wine on the Loire for more than two centuries, working 35 hectares on what its importer calls the most reputable clay-limestone terroir of Saumur-Champigny. In Ontario the estate is brought in by Nicholas Pearce Wines; it also makes a Saumur Blanc from the same limestone holdings.","photo_credit":"Photo: Maison Soulat (pictured label: 2020 vintage)","has_photo":true,"also_in":[]},{"id":83,"number":"12","section":"Red — France","subsection":null,"title":"Trousseau ‘Les Corvées’ — Domaine Ratte, Arbois 2023","price":"As printed on the menu: TROUSSEAU, DOMAINE RATTE, ARBOIS, JURA (2023) — the menu lists no cuvée name; the 2023 bottling in the market is the ‘Les Corvées’ cuvée.","menu_note":"Bottle $160 (Riviera)","region":"Arbois, Jura","grape":"100% Trousseau (Trousseau à la Dame selection)","producer":"Domaine Ratte","style":"Medium-weight, floral, elegant Jura red","alcohol":"13.5%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":3,"tannins_label":"Medium","tasting_notes":"raspberry, red cherry, strawberry, violet, spice, silky, delicate","story":"The fruit comes from Les Corvées, described as the best slope in Arbois for soil, exposure and aspect. The domaine has farmed organically and biodynamically since 1989 and adds nothing in the cellar — no additives, no filtering. They sought out a rare, low-yielding Trousseau selection (‘Trousseau à la Dame’, with few berries per cluster) to concentrate the variety’s aromas and tannins, and part of the wine ages in new barrels to round out Trousseau’s sometimes rustic tannins. Expect a medium-weight, red-fruited, floral red with Jura freshness — elegant enough to remind tasters of Pinot Noir.","pairings":"Charcuterie, roast chicken with herbs, mushroom tart, saucisson, soft savoury cheeses. Serve cool, 14–16°C.","producer_note":"Run by Michel-Henri and Françoise Ratte in Arbois; the family owned vineyards for generations but only began estate-bottling in 2015, farming about 9 hectares across Les Corvées, Clos Maire and Pré Levront. Their son Quentin has now joined the winemaking.","photo_credit":"Photo: V2Vin (2023 vintage — matches the listed wine).","has_photo":true,"also_in":[]},{"id":84,"number":"13","section":"Red — France","subsection":null,"title":"Cabernet Franc Blend — Closerie Saint Roc, Bordeaux 2019","price":"As printed on the menu: ‘Cabernet Franc+, Closerie Saint Roc, Bordeaux (2019)’","menu_note":"Bottle $165 (Riviera)","region":"Bordeaux — Côtes de Franc, on limestone plateau east of Saint-Émilion","grape":"Cabernet Franc-led blend (Cabernet Franc, Cabernet Sauvignon, Merlot)","producer":"Closerie Saint Roc — the Amoreau family","style":"Natural, organic and biodynamic","alcohol":"13%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"sweet cherries, blueberries, blackberries, cassis, rock, mocha, powdery tannins, fresh mineral lift","story":"This is the new project of the Amoreau family — also behind Château Le Puy — launched with the 2018 vintage on limestone hills east of Saint-Émilion. The vineyards are farmed organically and biodynamically, the grapes ferment gently in big old barrels using only the wild yeasts on the skins, and nothing is added: no preservative sulphur, and the wine is bottled unfined and unfiltered. The result is the modern natural-Bordeaux style — pure juicy fruit and freshness rather than weight. Serve at 16–17°C; it benefits from a decant in youth.","pairings":"Braised beef cheeks, pink rack of lamb, mushroom dishes, aged Comté.","producer_note":"Closerie Saint Roc is the Amoreau family’s newest domaine: 16 hectares on the high limestone plateau above the Francs. 2018 was the first vintage; since then they have begun bottling single-parcel wines alongside this base cuvée. The domaine is Demeter-certified and sits squarely in Bordeaux’s natural-wine avant-garde.","photo_credit":"Photo: Unser Weinladen","has_photo":true,"also_in":[]},{"id":85,"number":"14","section":"Red — France","subsection":null,"title":"Syrah — Dard et Ribo, Crozes-Hermitage 2023","price":"Bottle $165 (Riviera)","menu_note":"","region":"Crozes-Hermitage, Northern Rhône","grape":"100% Syrah","producer":"Domaine Dard et Ribo","style":"Vivid, savoury natural Syrah — made to be drunk, not cellared","alcohol":"≈ 13%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":3,"tannins_label":"Medium","tasting_notes":"red and black fruits, violets, olive, leather, truffle, cinnamon, salty mineral edge","story":"René-Jean Dard and François Ribo were making natural wine in the northern Rhône from the early 1980s — organic farming, minimal sulphur, short fermentations — decades before it was fashionable. The grapes ferment as whole bunches (stems and all) and the wine ages 11 to 15 months in large 600-litre barrels. Dard’s own summary of the philosophy: wine ‘does not necessarily have to be kept — just drunk and drunk again.’ The fruit comes from red clay, gravel and alluvial stones on the flatter southern part of the appellation. With no added sulphur, bottles can vary a little — normal for this style, and part of its charm.","pairings":"Grilled lamb, sausages, rustic charcuterie, BBQ meat, outrageously old hard cheese, mushroom and lentil dishes.","producer_note":"Created in the 1980s at Mercurol by René-Jean Dard and François Ribo; 7.5 hectares across Crozes-Hermitage, Saint-Joseph and Hermitage. A cult following in France’s natural-wine bars and in Japan — and a benchmark for a younger generation of natural winemakers across the valley.","photo_credit":"Photo: wine retailer bottle shot (label shown is the 2020 vintage).","has_photo":true,"also_in":[]},{"id":86,"number":"15","section":"Red — France","subsection":null,"title":"Grenache+ ‘Chante Cigale’ — Domaine Chante Cigale, Châteauneuf-du-Pape 2023","price":"As printed on the menu: GRENACHE+, CHANTE CIGALE, CHATEAUNEUF-DU-PAPE (2023). ‘Chante Cigale’ (‘singing cicada’) is the domaine’s name — this is their standard estate red.","menu_note":"Bottle $175 (Riviera)","region":"Châteauneuf-du-Pape AOP, southern Rhône Valley, France","grape":"65% Grenache, 20% Syrah, 10% Mourvèdre, 5% Cinsault","producer":"Domaine Chante Cigale (Sabon-Favier family)","style":"Red blend, fermented with native yeasts, aged in oak foudres, tanks and barriques","alcohol":"~15%","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":4,"tannins_label":"Firm","tasting_notes":"raspberry and cherry, black pepper, leather, a hint of vanilla; firm tannins, long finish. Opens up with a short decant.","story":"Chante Cigale — ‘the singing cicada’ — is a family estate right in the village of Châteauneuf-du-Pape, run by Alexandre Favier, who took over from his father at twenty. With fruit from some forty-odd parcels, it’s one of the bigger domaines in the appellation, and it’s known for honest, good-value wine rather than trophy bottles. This is their bread-and-butter red: mostly Grenache, fermented slowly with the yeasts from the vineyard, then rested in big old oak casks. It’s classic southern Rhône — warm, spicy, generous — the kind of bottle that makes roast lamb taste like it was always meant to be there.","pairings":"Roast or braised lamb with herbes de Provence, grilled beef or venison, wild-mushroom risotto, smoked meats, duck pâté.","producer_note":"Family estate of the Sabon-Favier family in Châteauneuf-du-Pape, run by Alexandre Favier since 2002. Some 41–50 hectares across ~40 parcels; known for value and for producing more white Châteauneuf-du-Pape than any other estate.","photo_credit":"Photo: KWM Wine (pictured bottle shows the 2023 vintage).","has_photo":true,"also_in":[]},{"id":87,"number":"16","section":"Red — France","subsection":null,"title":"Trousseau ‘Bruyères Rosière’ — Lucien Aviet, Arbois 2022","price":"As printed on the menu: TROUSSEAU, ‘BRUYERES & ROSIERE’ LUCIEN AVTIET, ARBOIS, JURA (2022) — the producer is Lucien Aviet, and the cuvée is ‘Bruyères Rosière’ (the Les Bruyères and Rosière parcels).","menu_note":"Bottle $180 (Riviera)","region":"Arbois, Jura","grape":"100% Trousseau","producer":"Lucien Aviet (Caveau de Bacchus)","style":"Pale, perfumed, traditional Jura red","alcohol":"≈ 14%","body":2,"body_label":"Light to medium","acidity":3,"acidity_label":"Medium","tannins":2,"tannins_label":"Low","tasting_notes":"red berries, floral lift, pale and perfumed, soft tannins, easy-drinking, leaves you wanting more","story":"Trousseau is the Jura’s signature red grape — pale in colour but full of perfume. Lucien Aviet is the celebrated traditionalist of Montigny-lès-Arsures, and 95–97% of the domaine’s wine is still sold at the cellar door, which is why these bottles are so scarce. The ‘Cuvée des Géologues’ line names each Trousseau after its vineyard parcel — this one blends Les Bruyères and Rosière. Hand-harvested, destemmed, fermented naturally in big old oak vats, aged patiently and bottled under cork and wax with hardly any added sulphur: a wine of finesse, not power.","pairings":"Regional charcuterie, saucisse de Morteau, Comté, roast chicken, meat-stuffed mushrooms. Serve at 15°C.","producer_note":"Caveau de Bacchus was founded in 1960 and is the father-and-son domaine of Lucien and Vincent Aviet on just 6 hectares. The ‘Cuvée des Docteurs’ honours the medical students who helped Lucien with harvests in the early years. The family’s UK importer relays the verdict that Aviet makes ‘Jura’s finest reds.’","photo_credit":"Photo: iDealwine (Rosière cuvée; vintage not legible on the label).","has_photo":true,"also_in":[]},{"id":88,"number":"17","section":"Red — France","subsection":null,"title":"Grenache+ ‘Canne’ — Charlotte & Aurélien Houillon, Côtes-du-Rhône 2020","price":"As printed on the menu: GRENACHE+, ‘CANNE’ DOMAINE HUILLON, VAUCLUSE (2020). The producer’s name is Houillon, and the wine is a Côtes-du-Rhône (Vaucluse is just the department).","menu_note":"Bottle $190 (Riviera)","region":"Côtes-du-Rhône AOC, Faucon, Vaucluse (southern Rhône), France","grape":"70% Grenache, 30% Syrah","producer":"Charlotte & Aurélien Houillon (Faucon)","style":"Natural red — free-run juice only, no added sulphur, unfined/unfiltered","alcohol":"~13.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"black cherry and blackberry, cracked pepper, Mediterranean herbs, a mineral lift; smooth tannins with a fine bitter-fresh grip.","story":"‘Canne’ is French for a tap — the wooden spigot on the big old vats where wine is made. This cuvée is pressed from only the free-run juice that flows out of that tap on its own; the harder-pressed juice goes elsewhere. Aurélien Houillon started this tiny farm in 2017 at the foot of Mont Ventoux, after learning natural winemaking from some of the Jura’s legends (his brother is one of them). Everything here is hands-off: grapes picked by hand, fermented with their own yeasts, no added sulfur, nothing filtered out. What lands in the glass is southern Rhône Grenache with the volume turned down and the detail turned up — savoury, fresh, alive.","pairings":"Herb-crusted lamb chops, duck breast with blackberries, wild-mushroom ragout, ratatouille, charcuterie and Comté.","producer_note":"Charlotte & Aurélien Houillon farm 4.5 hectares of old vines in Faucon, certified organic with biodynamic practices. Founded 2017; Aurélien trained under Pierre Overnoy in Arbois and is the brother of Jura legend Emmanuel Houillon. Natural wines in the spirit of Jules Chauvet.","photo_credit":"Photo: Lo-Fi Wines (pictured bottle shows the 2021 vintage; listed vintage is 2020).","has_photo":true,"also_in":[]},{"id":89,"number":"18","section":"Red — France","subsection":null,"title":"Syrah — Dard et Ribo, Saint-Joseph 2023","price":"As printed on the menu: SYRAH, DARD ET RIBO, SAINT JOSEPH (2023) — correctly spelled ‘Saint-Joseph’.","menu_note":"Bottle $200 (Riviera)","region":"Saint-Joseph, Northern Rhône","grape":"100% Syrah","producer":"Domaine Dard et Ribo","style":"Granite-grown Syrah — floral, smoky, fresh","alcohol":"12.5%","body":4,"body_label":"Full","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"raspberry, wild strawberry, rose petal, black fruit coulis, smoky minerality, spices","story":"A multi-parcel blend from three granite hillside sites — Pitrou, Les Champs and Vion — this is the domaine’s ‘granite expression’, where the Crozes-Hermitage is its clay-and-gravel one. The grapes ferment as whole bunches, then the wine spends 10 to 12 months in used 600-litre oak casks; it is neither fined nor filtered — not clarified or stripped before bottling. The importer calls the 2023 ‘loosely composed, so up for early drinking’: vivid, unforced, and happy now.","pairings":"Grills and lamb dishes, grilled sausages, charcuterie, roast pork, steak — the bottle for the grill section.","producer_note":"The same domaine as the Crozes-Hermitage and Hermitage elsewhere on this list — René-Jean Dard and François Ribo, pioneers of natural winemaking in the northern Rhône since the 1980s.","photo_credit":"Photo: Le Passeur de Vin (label shown is the 2022 vintage; pictured bottle is a 1500 ml magnum).","has_photo":true,"also_in":[]},{"id":90,"number":"19","section":"Red — France","subsection":null,"title":"Merlot Blend ‘La Fleur Garderose’ — Vignobles Pueyo, Saint-Émilion Grand Cru 2018","price":"Menu prints ‘Vognobles Pueyo’ — should read Vignobles Pueyo.","menu_note":"Bottle $210 (Riviera)","region":"Saint-Émilion Grand Cru, right bank","grape":"Ã70% Merlot, 30% Cabernet Franc","producer":"Vignobles Pueyo — Christophe Pueyo","style":"Natural-leaning, organic Grand Cru","alcohol":"","body":4,"body_label":"Medium-Full","acidity":4,"acidity_label":"High","tannins":4,"tannins_label":"High","tasting_notes":"blackberry, currant, ripe plum, spice box, earth, leather emerging, freshness kept","story":"La Fleur Garderose is a selection of the best barrels from the oldest vines, raised for 18 months in large wooden vessels and clay amphorae rather than new small barrels — so the fruit speaks and the oak stays invisible — then bottled unfined and unfiltered. Since Christophe Pueyo took over in 2010 the estate has gone organic and low-intervention, making a Saint-Émilion Grand Cru of purity and freshness rather than extraction. At eight years it is opening into a comfortable drinking window, though a short decant still helps.","pairings":"Roast lamb or beef, duck, wild mushroom risotto, Comté or aged cheddar.","producer_note":"Vignobles Pueyo is the winemaking arm of the Pueyo family, in the Libournais for generations — they have owned Château Belregard-Figeac, a Saint-Émilion Grand Cru, since 1853. Christophe Pueyo, the fifth generation, converted the estate to organic farming and replaced many small barriques with large-format wood and amphorae.","photo_credit":"Photo: La Croix Vins","has_photo":true,"also_in":[]},{"id":91,"number":"20","section":"Red — France","subsection":null,"title":"Pinot Noir ‘Champs Perdrix’ — Aurélien Verdet, Marsannay 2023","price":"As printed on the menu: PINOT NOIR, ‘CHAMPS PEDRIX’ VERDET, MARSANNAY (2023) — the vineyard is correctly spelled ‘Champs Perdrix’ (as in perdrix, partridge).","menu_note":"Bottle $220 (Riviera)","region":"Marsannay, Côte de Nuits, Burgundy","grape":"100% Pinot Noir","producer":"Domaine Aurélien Verdet","style":"Bright, mineral village Burgundy with a salty edge","alcohol":"13.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"tart currants, pomegranate, cherries, a hint of herbs, saline minerality, plush texture, good length","story":"Champs Perdrix is a high, stony limestone slope at about 350 metres on the Fixin border — exactly the kind of cool site that has become prized as Burgundy warms. The grapes are handpicked and hand-sorted, fermented with wild yeasts, and aged 13 to 18 months in barrels (about a third of them new oak), keeping the focus on the site rather than the wood. Merchants consistently say this punches above its village-level weight.","pairings":"Roast chicken or turkey, duck, pork, mushroom dishes, charcuterie. Serve lightly cool, around 15–16°C.","producer_note":"Domaine Aurélien Verdet is a Côte de Nuits producer distributed in Québec by Dame-Jeanne Inc. and listed by the SAQ. Published detail beyond the wines themselves is thin; the bottle does the talking.","photo_credit":"Photo: Wine Brothers Japan (label shown is the 2019 vintage).","has_photo":true,"also_in":[]},{"id":92,"number":"21","section":"Red — France","subsection":null,"title":"Pinot Noir ‘Clos du Roy’ — Pierre-Olivier Garcia, Marsannay 2022","price":"As printed on the menu: PINOT NOIR, ‘CLOS DU ROY’ DOMAINE GARCIA, MARSANNAY (2022) — the domaine is Domaine Moron-Garcia, now bottled under winemaker Pierre-Olivier Garcia’s own name.","menu_note":"Bottle $250 (Riviera)","region":"Marsannay, Côte de Nuits, Burgundy","grape":"100% Pinot Noir","producer":"Pierre-Olivier Garcia (Moron-Garcia)","style":"Serious, mineral village Burgundy from a walled vineyard","alcohol":"","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"red and dark fruits, real energy, mineral tension, fresh, floral lift","story":"Clos du Roy is a true clos — a vineyard surrounded by a stone wall, which traps daytime heat and helps the grapes ripen. It is the northernmost site in Marsannay, on light gravel over limestone and marl. The estate farms organically with biodiversity in mind and uses very little added sulphur. Its signature cellar method is a layered ‘millefeuille’ fermentation — whole bunches, whole berries and destemmed grapes stacked in layers — which Garcia says brings a rose-and-peony perfume to the wines.","pairings":"Roast poultry, beef and veal, charcuterie, roast pork, mushroom dishes. Give it 30–45 minutes of air.","producer_note":"The same winemaker as the Corton Grand Cru ‘Baie par Baie’ elsewhere on this list: Pierre-Olivier Garcia, who founded Domaine Moron-Garcia in 2016 and has run it solo since 2020. Tiny, artisanal, organic — and increasingly sought after.","photo_credit":"Photo: Firadis (label shown is the 2022 vintage).","has_photo":true,"also_in":[]},{"id":93,"number":"22","section":"Red — France","subsection":null,"title":"Cabernet Sauvignon & Syrah ‘Rouge’ — Domaine de Trévallon, Alpilles 2021","price":"Menu prints ‘Les Alpilles’ as the cuvée and ‘Provence’ as the region — the wine is officially Domaine de Trévallon Rouge, IGP Alpilles.","menu_note":"Bottle $325 (Riviera)","region":"IGP Alpilles, Provence","grape":"50% Cabernet Sauvignon, 50% Syrah (vines ~40 years old)","producer":"Domaine de Trévallon — the Dürrbach family","style":"Cult, natural, built to age","alcohol":"13.5%","body":5,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":4,"tannins_label":"High","tasting_notes":"blackcurrant, blackberry, sloe, licorice, black pepper, dark chocolate, blue flowers, allspice","story":"Because this half-Cabernet, half-Syrah blend breaks the local appellation rules, the estate deliberately sells it outside the system as IGP Alpilles — ‘Provence’ on the menu places it geographically. Whole bunches go into the fermenter uncrushed, only wild yeasts are used, no sulphur is added, and the wine ages two full years in large old wooden vats with its lees — the spent yeast sediment — left to feed it, then it is bottled unfiltered. The cool 2021 gave a fresher, classic vintage after a run of warm years; it is tightly youthful now, so decant several hours ahead or give it cellar time.","pairings":"Grilled or roast lamb, beef, game; slow-braised dishes and aged hard cheeses.","producer_note":"Éloi Dürrbach planted Cabernet Sauvignon and Syrah in the Alpilles hills in 1973 — dynamiting the limestone to do so — and made the first vintage in 1976, building one of France’s great cult estates with labels first designed by his painter father, a friend of Picasso. Dürrbach died in 2021, making this the first vintage of the succession era; his wife and three children carry the domaine forward.","photo_credit":"Photo: Nicks Wine Merchants (pictured label: 2019 vintage)","has_photo":true,"also_in":[]},{"id":94,"number":"23","section":"Red — France","subsection":null,"title":"Pinot Noir ‘1er Cru Clos Sorbé’ — David Duband, Morey-Saint-Denis 2021","price":"Menu prints ‘Clos Sorbe’ — the climat is correctly spelled Clos Sorbé.","menu_note":"Bottle $345 (Riviera)","region":"Morey-Saint-Denis 1er Cru, Côte de Nuits, Burgundy","grape":"100% Pinot Noir","producer":"Domaine David Duband","style":"Organic, minimal-intervention, terroir-driven","alcohol":"12.5–13.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"fresh red fruits, red berries, cherry, black pepper, delicate spice, toasted bread, enveloping finish","story":"2021 was a cool, frost-affected year in Burgundy — low yields and a light, fragrant, fresh style that suits Duband’s elegant register perfectly. The domaine has been farmed organically since 2006, and the winemaking is hands-off: the aim is to let the vineyard site speak rather than to extract or polish. Clos Sorbé is a premier cru vineyard in the heart of the Côte de Nuits, between Gevrey-Chambertin and Chambolle-Musigny. Approachable now with air, it will deepen over the next several years — decant 30–60 minutes if opened young.","pairings":"Roast lamb with fine herbs, game, aged cheeses, gently spiced dishes.","producer_note":"Domaine David Duband is based at Chevannes, near Nuits-Saint-Georges. Founded in 1991, the estate has grown to about 17 hectares spread across prestigious appellations of the Côte de Nuits, and is known for wines of elegance, complexity and purity of fruit.","photo_credit":"Photo: Achetez du Vin (pictured label: 2019 vintage)","has_photo":true,"also_in":[]},{"id":95,"number":"24","section":"Red — France","subsection":null,"title":"Syrah — Dard et Ribo, Hermitage 2023","price":"Bottle $350 (Riviera)","menu_note":"","region":"Hermitage, Northern Rhône","grape":"100% Syrah","producer":"Domaine Dard et Ribo","style":"Powerful, mineral flagship red from the granite hill","alcohol":"12.5%","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":3,"tannins_label":"Medium","tasting_notes":"black and blue fruit, leather, musk, truffle, cedar, cinnamon, granite-mineral frame","story":"Hermitage is the granite hill rising above the Rhône at Tain-l’Hermitage — the most celebrated Syrah site in France, famous for combining savage power with a granitic mineral cut. Dard et Ribo’s flagship comes from hillside parcels on that south-facing slope. Organically farmed and hand-harvested, fermented with wild yeasts and raised about 12 months in used barrels, barely any new oak. It will be youthful and primary now — decant it, and expect a faint wild edge that blows off with air, normal for low-sulphur wines.","pairings":"Slow-braised beef, venison, gamey meats, hard aged cheeses. Serve 16–18°C after a good decant.","producer_note":"The same domaine as the Crozes-Hermitage and Saint-Joseph elsewhere on this list — René-Jean Dard and François Ribo, pioneers of natural winemaking in the northern Rhône since the 1980s.","photo_credit":"Photo: Cave de Chaz (pictured bottle is a 1500 ml magnum of the 2023).","has_photo":true,"also_in":[]},{"id":96,"number":"25","section":"Red — France","subsection":null,"title":"Merlot Blend ‘Cuvée Barthélémy’ — Château Le Puy, Francs Côtes de Bordeaux 2019","price":"Menu prints ‘Barthelemy’ — the cuvée is correctly spelled Barthélémy.","menu_note":"Bottle $350 (Riviera)","region":"Francs Côtes de Bordeaux (limestone plateau shared with Saint-Émilion and Pomerol)","grape":"85% Merlot, 15% Cabernet Sauvignon (single parcel ‘Les Rocs’)","producer":"Château Le Puy — the Amoreau family","style":"Natural Bordeaux manifesto, transparency over power","alcohol":"~12.5–14%","body":4,"body_label":"Medium-Full","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"blackcurrant, blackberry, plum, blueberry pie, liquorice, caramel, silky texture, long fresh finish","story":"Barthélémy comes from one old-vine parcel on deep limestone, and its making is a manifesto: the grapes are soaked gently rather than pumped or punched for extraction, new oak has always been banned, and no sulphites have been added since 1990. The wine ages two years in old barrels — cellar work is timed to the lunar calendar — and is bottled unfined and unfiltered. The through-line is depth without heaviness: intense, silky, and already expressive with a decant; it will keep 10–15 years.","pairings":"Grilled meats, game, mushrooms, roast poultry, duck.","producer_note":"Château Le Puy has belonged to the Amoreau family since 1610 — the fifteenth generation runs it today — on the famous Plateau des Merveilles. Fully organic and biodynamically farmed, it sits outside the classified-growth system by choice, and the 2003 vintage was famously named the best wine in the world by the manga Les Gouttes de Dieu. Note: the estate left the Côtes de Francs appellation in 2017, so the bottle may be labelled Vin de France or Bordeaux.","photo_credit":"Photo: Mon Vin Français (pictured label: 2018 vintage)","has_photo":true,"also_in":[]},{"id":97,"number":"26","section":"Red — France","subsection":null,"title":"Cabernet Franc ‘Le Clos’ — Clos Rougeard, Saumur-Champigny 2019","price":"Menu prints ‘Saumur Champigny’ — the appellation is correctly hyphenated Saumur-Champigny.","menu_note":"Bottle $500 (Riviera)","region":"Saumur-Champigny, Loire Valley","grape":"100% Cabernet Franc","producer":"Clos Rougeard (Bouygues family since 2017)","style":"Organic, long-aged, cult cult Burgundy-style patience","alcohol":"13%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"raspberry, cherry, violet, green pepper, spice, crushed stone, wet slate, silky tannins","story":"Clos Rougeard’s reputation rests on patience and restraint: hand-picked grapes ferment for four to six weeks in open concrete vats with only wild yeasts, then the wine ages 18 to 24 months in old barrels — all of it sees oak, none of it new, so you get texture without any oaky taste. Unusually, the 2019 then spent another five to six years in the estate’s own cellars before its release in 2025, so this bottle arrives already mature and settled. Expect silky, mineral, faintly floral red fruit and a long elegant finish; serve at 14–16°C in a large glass.","pairings":"Simply prepared roast beef or lamb, game birds like pheasant or pigeon, mushroom dishes.","producer_note":"Clos Rougeard near Saumur was run by eight successive generations of the Foucault family; brothers Charly and Nady, who took over in the 1980s, made it a legend by farming organically decades before it was fashionable and leaving the wine in peace to express itself. Sold to the Bouygues family in 2017, the domaine remains strictly allocated and fiercely sought-after.","photo_credit":"Photo: The Grape’s Juice (eBay)","has_photo":true,"also_in":[]},{"id":98,"number":"27","section":"Red — France","subsection":null,"title":"Pinot Noir ‘Baie par Baie’ — Pierre-Olivier Garcia, Corton Grand Cru 2022","price":"Bottle $700 (Riviera)","menu_note":"","region":"Corton Grand Cru, Côte de Beaune, Burgundy","grape":"100% Pinot Noir","producer":"Pierre-Olivier Garcia (formerly Moron-Garcia)","style":"Tiny-production grand cru, extremely hands-on","alcohol":"","body":4,"body_label":"Medium to full","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"deep red and black fruit, subtle florals, rose lift, vibrant energy, fine polished tannins, long finish","story":"This cuvée is named for Garcia’s signature trick: instead of a machine ripping the grapes off their stems, a large team hand-clips each grape berry-by-berry with its little stem attached. That gives the wine the perfume and texture of whole-bunch fermentation without harsh green flavours — extraordinarily slow, expensive work. Fermentation runs on wild yeasts, the wine ages in mostly used French oak, and nothing is fined or filtered. At $700 a bottle it is the most expensive wine on this list, and it is made in tiny quantities.","pairings":"Roast game birds, venison, simply prepared beef or lamb, mushroom dishes; aged Comté or Époisses. Decant generously if opened young.","producer_note":"Pierre-Olivier Garcia founded Domaine Moron-Garcia in 2016 with childhood friend Mathieu Moron and has run it solo since 2020, from a converted house in the centre of Nuits-Saint-Georges. The project’s ‘eco-attitude’ means organic farming and restoring biodiversity — cereals, ploughing, tree planting, even grazing chickens — and the wines have become much harder to acquire as they have become better known.","photo_credit":"Photo: Sovy Wine (label shown is the 2021 vintage).","has_photo":true,"also_in":[]},{"id":99,"number":"01","section":"Red — Italy","subsection":null,"title":"Nebbiolo 'Buon Padre' — Giovanni Viberti, Barolo 2021","price":"Half bottle $75 (Riviera)","menu_note":"","region":"Barolo DOCG, Piedmont — blend of eight crus (Barolo, Monforte d'Alba, Verduno)","grape":"100% Nebbiolo (Barolo by law is 100% Nebbiolo)","producer":"Giovanni Viberti — family winery, origins 1923","style":"Traditional: 36–40 months in large Slavonian oak casks, bottled unfiltered","alcohol":"13%+","body":4,"body_label":"Full","acidity":4,"acidity_label":"High","tannins":4,"tannins_label":"High","tasting_notes":"dried sour cherry, strawberry, dried rose, violet, cinnamon, blood orange, leather, tobacco, tar, dried herbs","story":"'Buon Padre' means 'Good Father' — the wine is named for the Locanda del Buon Padre, the inn the Viberti family bought in 1923 and whose basement restaurant wine became this Barolo. It has been the family's flagship for nearly a century. It is built the old way: each cru harvested and vinified separately, aged three-plus years in large Slavonian oak casks (no small new barriques), and bottled unfiltered. The 2021 is a widely acclaimed, classic Barolo vintage — cool and long, with natural acidity and refined tannins. IMPORTANT: the menu lists this as a HALF BOTTLE (1/2 BTL), not a full 750 ml. Given its youth, decant 60–90 minutes.","pairings":"Traditional Piemontese pairings: brasato al Barolo (beef braised in Barolo), agnolotti del plin with roast meat, wild mushroom risotto, roast lamb, game (boar, venison), aged hard cheeses such as Parmigiano-Reggiano or Toma, and truffle dishes.","producer_note":"Giovanni Viberti is a family winery in Vergne, in the commune of Barolo. The estate's origins date to 1923, when Antonio Viberti bought the Locanda del Buon Padre and began making wine in its basement for the restaurant's guests. Antonio's son Giovanni expanded the holdings from 1968 (including parcels on the Bussia hill in Monforte), and today the third generation — brothers Claudio and GianLuca — runs the roughly 20-hectare estate. The winery celebrated its centenary in 2023.","photo_credit":"Photo: Foltyn Wine (pictures the 2020 vintage; the listed vintage is 2021)","has_photo":true,"also_in":[]},{"id":100,"number":"02","section":"Red — Italy","subsection":null,"title":"Nebbiolo+ — G.D. Vajra, Langhe Rosso, Piedmont 2024","price":"As printed on the menu: Nebbiolo+. The '+' signals a Nebbiolo-led blend, not a single variety.","menu_note":"Bottle $95 (Riviera)","region":"Langhe Rosso DOC, Piedmont (young vineyards around Barolo, incl. Bricco delle Viole)","grape":"Nebbiolo-led blend: Barbera, Dolcetto, Freisa, Albarossa, Pinot Nero","producer":"G.D. Vajra — family estate in Vergne, Barolo","style":"Each variety vinified separately; aged 18–24 months in steel and large oak casks","alcohol":"~13.5%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":2,"tannins_label":"Low","tasting_notes":"red cherry, raspberry, dried herbs, liquorice, mint, vanilla, blood orange, graphite, dusty spice","story":"Vajra calls it 'a hug from Piedmont': a fruity, savoury, early-drinking red made for the table, not the cellar. Each grape variety is fermented separately with wild yeasts and blended after ageing in stainless steel and large neutral oak casks — so the wine stays transparent and drinkable rather than powerful. It needs no decanting, takes a slight chill happily (15–16°C), and its fresh acidity makes it a natural fit for tomato-driven dishes. At 91 points, it is one of the best-scored entry-level reds in Piedmont.","pairings":"Pizza, pasta with tomato sauce, ragù, charcuterie and salumi, roast chicken, grilled sausages, mushroom dishes and medium-aged cheeses.","producer_note":"G.D. Vajra is one of Piedmont's most respected family estates, based in Vergne, Barolo. Aldo Vajra took over the family farm at fifteen in 1968; the family has farmed the Bricco delle Viole cru — the highest cru in the commune of Barolo — since the 1880s. Aldo obtained the region's first organic certification (1971), pioneered massal selections of Nebbiolo and Dolcetto, and led the renaissance of the forgotten Freisa grape. Today the family-run estate remains a benchmark for elegant, terroir-transparent Barolo — and for value blends like this one.","photo_credit":"Photo: Bauer Wine & Spirits","has_photo":true,"also_in":[]},{"id":101,"number":"03","section":"Red — Italy","subsection":null,"title":"Lagrein 'St. Magdalena' — Cantina Bolzano, Alto Adige 2024","price":"Bottle $100 (Riviera)","menu_note":"","region":"Alto Adige DOC, South Tyrol (warm valley floor around Bolzano)","grape":"100% Lagrein","producer":"Cantina Bolzano (Kellerei Bozen) — large cooperative of grower families","style":"Fresh, fruit-forward; mainly large oak vats, ~20% in seasoned barrique","alcohol":"12.5–13%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":3,"tannins_label":"Medium","tasting_notes":"red cherry, raspberry, violet, rose, bitter almond, marzipan, refreshing fruitiness","story":"A small naming twist: 'St. Magdalena' is traditionally the name of a light Schiava-based blend from the hills above Bolzano — but this bottle is a pure Lagrein under the same name, a modern, export-oriented move that trades the traditional blend's lightness for Lagrein's deeper colour and structure while keeping the friendly, accessible positioning. In the glass it's fresh and unforced: juicy cherry and raspberry, floral notes of violet and rose, and Lagrein's signature bitter-sweet almond note on the finish. Made for immediate drinking, not cellaring.","pairings":"Speck and Tyrolean charcuterie, grilled sausages, mushroom pasta, goulash, roast pork, cold platters, pizza and medium-aged cheeses. Serve at 15–17°C.","producer_note":"Cantina Bolzano (Kellerei Bozen) is a large cooperative winery based in Bolzano, capital of South Tyrol, formed by the merger of the historic Gries and St. Magdalena cooperatives — its cube-shaped winery on the city's northern edge is a local landmark. It works with hundreds of grower families, farming from the valley floor (Lagrein in Gries) up the Santa Maddalena slopes; the 'St. Magdalena' line is its widely distributed, value-oriented red range.","photo_credit":"Photo: Cantina Bolzano (official site; shows the winery's classic Lagrein label)","has_photo":true,"also_in":[]},{"id":102,"number":"04","section":"Red — Italy","subsection":null,"title":"Teroldego 'Lezèr' — Foradori, Vigneti delle Dolomiti 2025","price":"As printed on the menu: \"LEZER\" — the cuvée’s official styling is \"Lezèr\" (meaning \"light\" in the local dialect).","menu_note":"Glass $20 (5 oz) · Bottle $100 (Riviera)","region":"Vigneti delle Dolomiti IGT, Trentino, Italy","grape":"84% Teroldego with Schiava, Lagrein and Merlot","producer":"Azienda Agricola Foradori, Mezzolombardo","style":"Light, juicy, short-maceration red — best served chilled","alcohol":"≈ 12.5%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":2,"tannins_label":"Low","tasting_notes":"wild strawberry, raspberry, cherry, blueberry, cranberry, violets, delicate spice","story":"Foradori is the reference estate for Teroldego — the family that made the grape famous internationally. “Lezèr” (local dialect for “light”) began in 2017 when a hailstorm damaged the crop; the salvageable fruit spent just a day on its skins and made a joyful, thirst-quenching red instead of the grape’s usual dark, brooding style. It’s now an annual bottling: spontaneous fermentation, four months in cement, old wood and terracotta, bottled unfiltered. Bright acidity, low tannin, vivid fruit — a red that loves a slight chill.","pairings":"Cured-meat and cheese platters, pizza and light pasta, grilled vegetables, fried foods, white meats. Serve lightly chilled at 14–16°C.","producer_note":"Azienda Agricola Foradori in Mezzolombardo, Trentino — led by Elisabetta Foradori and now her son Emilio, farming biodynamically. Teroldego and Pinot Grigio grow on the Campo Rotaliano flood plain; the whites come from the dolomitic hills. The Lezèr label is redesigned every vintage, keeping the project playful.","photo_credit":"Photo: Bodeboca, French wine retailer. Pictured bottle is the 2024 release; labels change each vintage and the listed wine is 2025.","has_photo":true,"also_in":[]},{"id":103,"number":"05","section":"Red — Italy","subsection":null,"title":"Barbera 'Umberta' — Cascina Iuli, Monferrato NV","price":"As printed on the menu: NV. Note that 'Umberta' is released as a vintage-dated wine (recent releases include 2021–2023) — staff may wish to confirm the vintage on the bottle in hand.","menu_note":"Bottle $110 (Riviera)","region":"Monferrato, Piedmont (bottled as Vino Rosso, not DOC — a deliberate choice)","grape":"100% Barbera (old vines, planted 1940–1999)","producer":"Cascina Iuli — Fabrizio Iuli and wife Summer, family estate","style":"Natural, unoaked, low-intervention; fermented and aged in concrete","alcohol":"~13%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":1,"tannins_label":"Low","tasting_notes":"bright cherry, raspberry, black plum, cherry cola, black olive, balsamic, dried herbs, violets","story":"A fresh, juicy Barbera from a small family estate where the grape is everything. Fermented with natural yeasts and aged in concrete tanks rather than oak, with no fining or filtering and only a small amount of sulphur at bottling — so what you taste is pure bright Barbera fruit, not cellar work. This sits far from the heavy, oaky Barberas of the past: it's honest, vivid and immediately enjoyable. The menu lists it as NV, but it is a vintage-dated wine in reality — check the bottle for the year.","pairings":"A natural with Italian red-sauce cooking: ragù, meatballs, sausages, pizza, lasagne, parmigiano-topped dishes, pesto and olive-driven sauces. The lively acidity cuts richness, so it suits the heartier end of the menu.","producer_note":"Cascina Iuli is a small family winery at Montaldo di Cerrina in the far north of Monferrato, run by Fabrizio Iuli and his wife Summer — Fabrizio is the village's only winegrower. His grandfather planted vines here in the 1930s; Fabrizio made his first commercial vintage in 1998. The estate farms 16 hectares of vines in an isolated, wooded valley, organically since long before certification was fashionable, and Fabrizio — a self-described 'Barberista' — also champions near-extinct local grapes.","photo_credit":"Photo: Braja","has_photo":true,"also_in":[]},{"id":104,"number":"06","section":"Red — Italy","subsection":null,"title":"Pinot Nero 'Tiamat' — Cordero San Giorgio, Oltrepò Pavese 2024","price":"As printed on the menu: \"TIAMAT\" — the producer and importer render the cuvée name as \"Tiāmat\" (with a macron over the a).","menu_note":"Bottle $115 (Riviera)","region":"Oltrepò Pavese DOC, Lombardy, Italy","grape":"100% Pinot Nero (Pinot Noir)","producer":"Cordero San Giorgio, Santa Giuletta","style":"Elegant, savoury Pinot Nero — Burgundian methods at an Oltrepò price","alcohol":"≈ 13%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":2,"tannins_label":"Low","tasting_notes":"strawberry, red cherry, earth, black pepper, liquorice, undergrowth, dried herbs","story":"From the hills south of Pavia, where more Pinot Nero grows than anywhere else in Italy — most of it destined for sparkling wine. Cordero San Giorgio treats its still Pinot Nero the way Burgundy would: grapes from nine separate hillside lots are fermented individually, some whole-cluster (stems and all), then blended for balance, with only a modest touch of French oak. The result is an elegant, savoury Pinot Nero at a fraction of Burgundy prices — 92 points from James Suckling for the 2024. The name “Tiāmat” is the Babylonian dragon goddess, playing on the estate’s St-George-and-the-dragon story.","pairings":"Roast chicken and game birds, duck breast, mushroom risotto or pasta, pork tenderloin, charcuterie, richer fish like salmon. Serve at 15–17°C.","producer_note":"An estate in Santa Giuletta, in the heart of the Oltrepò Pavese, part of a quiet quality push to prove the zone’s limestone hills can make serious still Pinot Nero. Imported into North America by Banville Wine Merchants; “Tiamat” is the flagship red.","photo_credit":"Photo: Neunweine, German wine retailer. Pictured label shows the 2023 vintage; the listed wine is 2024.","has_photo":true,"also_in":[]},{"id":105,"number":"07","section":"Red — Italy","subsection":null,"title":"Frappato+ 'SP68' — Arianna Occhipinti, Sicily 2024","price":"As printed on the menu: Frappato+. The '+' signals a Frappato-led blend with Nero d'Avola.","menu_note":"Bottle $130 (Riviera)","region":"Terre Siciliane IGT, Sicily — vineyards around Vittoria, south-eastern Sicily","grape":"70% Frappato, 30% Nero d'Avola","producer":"Arianna Occhipinti","style":"Natural-leaning, unoaked, aged in concrete; notably low alcohol","alcohol":"11%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":2,"tannins_label":"Low","tasting_notes":"dark cherry, blackberry, pomegranate, raspberry blossom, violets, peony, Mediterranean herbs, blood orange, graphite","story":"The wine is named for the Strada Provinciale 68, the provincial road that runs past Arianna Occhipinti's vineyards. It is effectively her declassified Cerasuolo di Vittoria — she deliberately bottles it under the broader IGT label because she feels the DOCG's rules don't guarantee the quality she wants. Everything about the winemaking is about freshness: wild yeasts, about two weeks on the skins, ageing in concrete vats with no oak, bottled unfiltered with minimal sulphur. At just 11% alcohol it is a light-footed, juicy, floral red that drinks beautifully cool.","pairings":"Sicilian cooking is the obvious match: pasta alla Norma, caponata, grilled vegetables with herbs, lamb skewers, meaty fish (tuna, swordfish), tomato-based dishes and pizza. Serve cool, around 14–16°C.","producer_note":"Arianna Occhipinti, born 1982, is one of Sicily's most celebrated winemakers and a leading figure in Italy's natural-wine movement. She caught the wine bug at 16 accompanying her uncle Giusto Occhipinti (of the pioneering COS estate) to Vinitaly, studied oenology in Milan, and founded her own estate in Vittoria in 2004 with a single hectare — now 25–40 hectares farmed biodynamically. Her bright Frappato bottlings made her reputation.","photo_credit":"Photo: Raisin (pictures the 2019 vintage; the listed vintage is 2024)","has_photo":true,"also_in":[]},{"id":106,"number":"08","section":"Red — Italy","subsection":null,"title":"Merlot+ 'Le Pievi' — Fabio Motta, Bolgheri, Toscana 2023","price":"As printed on the menu: 'PIEVI' — the label reads 'Le Pievi'. The '+' signals a Merlot-led blend.","menu_note":"Bottle $135 (Riviera)","region":"Bolgheri Rosso DOC, Tuscany (single 'Le Pievi' vineyard near the Tyrrhenian sea)","grape":"50% Merlot, 20% Cabernet Sauvignon, 20% Sangiovese, 10% Syrah","producer":"Fabio Motta — small quality-focused estate, founded 2009","style":"Concrete-aged, unfined and unfiltered; fruit and freshness over oak","alcohol":"13.5–14%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":2,"tannins_label":"Low","tasting_notes":"cherry, redcurrant, orange zest, red rose, hibiscus, violet, Mediterranean herbs, myrtle, eucalyptus","story":"A Merlot-led blend from Bolgheri, the home of the Super Tuscan, in the warm, sea-breezed corner of the Tuscan coast. Fabio Motta's philosophy is simple — 'the two main ingredients of my wines are fruit and freshness' — and the cellar work follows it: natural yeasts, ageing in unglazed concrete vats rather than new oak, no fining or filtering. What you taste is ripe Mediterranean fruit and savoury herbs, not toast and vanilla. The 2023 scored 96 points from Decanter and 92 from James Suckling — exceptional critical consensus for the price.","pairings":"Grilled red meats, bistecca alla fiorentina, wild boar ragù (pappardelle al cinghiale), roast lamb, aged pecorino and Tuscan salumi, mushroom dishes and hearty tomato-based pasta. Serve at 16–18°C.","producer_note":"Fabio Motta founded his winery in 2009 with four hectares of vines planted in 1997 within the Bolgheri DOC — but he was no newcomer, having spent years working alongside Michele Satta, one of Bolgheri's esteemed pioneering producers, who is both his mentor and his father-in-law. The estate remains small and quality-focused; 'Le Pievi' is its flagship Bolgheri Rosso.","photo_credit":"Photo: Bottle of Italy (pictures the 2022 vintage; the listed vintage is 2023)","has_photo":true,"also_in":[162]},{"id":107,"number":"09","section":"Red — Italy","subsection":null,"title":"Sangiovese — Villa Calcinaia, Chianti Classico 2022","price":"Bottle $140 (Riviera)","menu_note":"","region":"Chianti Classico DOCG (Greve in Chianti), Tuscany, Italy","grape":"90% Sangiovese, 10% Canaiolo (organically grown)","producer":"Villa Calcinaia (Conti Capponi)","style":"Classic, transparent, food-first Chianti Classico","alcohol":"14%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"cherry, raspberry, blackberry, violet, pepper, dried leaves, struck stone, toast","story":"From Greve in Chianti, on the border of the Greve and Montefioralle sub-zones, on the galestro and alberese soils that define the appellation. 90% Sangiovese softened with 10% Canaiolo — the traditional blending partner — all organically grown. The style is deliberately transparent rather than extracted: bright red fruit, refreshing acidity, fine tannins. A wine built for the table; Decanter’s 2025 panel gave the 2022 91 points, calling it “very mouth cleansing and easy to drink”.","pairings":"Ragù and tomato-based pasta, grilled sausages, roast pork, pecorino Toscano, white-bean and sausage stews, pizza — one of the most versatile food wines on the list.","producer_note":"The historic home of the Counts Capponi, who have owned the estate since 1524 — Count Sebastiano Capponi represents the 37th generation, one of Tuscany’s oldest wine dynasties. About 75 acres of vines farmed organically; the estate celebrated its 500th anniversary recently. Known for fragrant, balanced, food-friendly wines.","photo_credit":"Photo: Dortodoor, Dutch wine retailer. Pictured label shows the 2020 vintage; the listed wine is 2022.","has_photo":true,"also_in":[]},{"id":108,"number":"10","section":"Red — Italy","subsection":null,"title":"Nebbiolo — Viberti, Langhe 2023","price":"As printed on the menu: \"LANGHE, PIEMONT\" — the correct spelling is Piemonte.","menu_note":"Bottle $140 (Riviera)","region":"Langhe Nebbiolo DOC, Piedmont, Italy","grape":"100% Nebbiolo","producer":"Viberti Giovanni, Vergne di Barolo","style":"Fresh, early-drinking “baby Barolo” from westerly Barolo-zone vineyards","alcohol":"≈ 14%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"strawberry, cherry, small berries, red flowers, balsamic, light spice, dried herbs","story":"This is Nebbiolo grown inside the Barolo zone, on more westerly-facing vineyards, made in a fresher, shorter-aged style and bottled as Langhe Nebbiolo instead of Barolo. After a short 8–10 day fermentation on the skins in cool steel tanks, the wine spends a year in big old wooden vats, which softens the tannins without adding any new-oak flavour. Same grape, same hands as the estate’s Barolos — all the rose-and-cherry signatures — but ready to drink on release.","pairings":"Grilled white meats, tomato pasta and pizza, roast chicken, mushroom risotto, charcuterie. Serve at 16–18°C; no decanting needed.","producer_note":"Founded in 1923 by Antonio Viberti around the Locanda del Buon Padre inn near Barolo; today run by the third generation, Claudio and GianLuca Viberti, across about 20 hectares farmed with eco-sustainable practices. The Langhe Nebbiolo is the estate’s workhorse red and a fixture of independent retail across North America.","photo_credit":"Photo: Nick’s Wine Merchants, Australia. Pictured label shows the 2015 vintage; the listed wine is 2023.","has_photo":true,"also_in":[130,163]},{"id":109,"number":"11","section":"Red — Italy","subsection":null,"title":"Nebbiolo 'Pian delle Mole' — Giulia Negri, La Morra 2023","price":"As printed on the menu: 'Pian delle Mole' — some retail sheets render it 'Pian del Molle'; the label uses 'Pian delle Mole'.","menu_note":"Bottle $150 (Riviera)","region":"Langhe Nebbiolo DOC, La Morra — lower slopes of the Serradenari cru (~500 m)","grape":"100% Nebbiolo","producer":"Giulia Negri — organically farmed","style":"Wild yeasts, 14–18 months in steel and neutral 500-litre oak tonneaux","alcohol":"13.5%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":2,"tannins_label":"Low","tasting_notes":"rose petal, violet, sour cherry, ripe plum, red liquorice, dried earth, mineral, spice, dried florals","story":"This is often described as a 'declassified Barolo': the fruit comes from younger vines, or parcels not selected for the estate's Barolo bottlings, at the lower slopes of the Serradenari cru — the highest cru in the entire Barolo zone, whose cool, airy 500-metre sites preserve acidity and floral aromatics even in warm vintages like 2023. It ages in neutral 500-litre oak casks, which add texture without any toast or vanilla — so what you taste is the vineyard, not the cellar. Graceful, fine-boned and Pinot-drinker-friendly: one critic found it 'not far off the quality of her Barolo efforts'.","pairings":"Funghi pizza (recommended by Kermit Lynch's team), mushroom risotto, roast game birds, braised beef, truffle pasta, hard aged cheeses and charcuterie. Serve at 16–18°C.","producer_note":"Giulia Negri took over her family's cantina in La Morra in 2014 at age 24, after degrees in management and biology and a winemaking apprenticeship in Burgundy, where she fell for elegance and refinement. The family has grown wine at Serradenari for some 150 years. In a short time she built a reputation for independence and meticulousness, and her Barolos are imported to the US by Kermit Lynch. The 'Pian delle Mole' Langhe Nebbiolo is her accessible entry point.","photo_credit":"Photo: OneCellar (pictures the 2019 vintage; the listed vintage is 2023)","has_photo":true,"also_in":[]},{"id":110,"number":"12","section":"Red — Italy","subsection":null,"title":"Primitivo 'Senatore' — Coppi, Gioia del Colle 2017","price":"Bottle $150 (Riviera)","menu_note":"","region":"Gioia del Colle DOC, Puglia, Italy","grape":"100% Primitivo","producer":"Casa Vinicola Coppi, Turi (Bari)","style":"Age-worthy, traditional Primitivo — fresh and structured, not jammy","alcohol":"13.5%","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":4,"tannins_label":"High","tasting_notes":"dried cherry, red fruit, tobacco, leather, sweet spice, earth, warm savoury depth","story":"From the Murge plateau inland of Bari — one of the two great DOCs for Primitivo — where higher altitude and limestone hills give fresher, more structured wine than the riper Manduria style. Hand-picked from bush-trained vines in the Marchione district, fermented in steel, then aged a year in large, already-used oak barrels so the wood stays in the background. At nine years old it should be mature and resolved — dried fruit, tobacco and leather over the cherry core. The wine honours Senator Antonio Michele Coppi, the winery’s founder; the label’s red circles are an altitude map of the Gioia del Colle hill.","pairings":"Braised and slow-cooked red meats, ragù, barbecue, aged Parmigiano-Reggiano, charcuterie, game. Serve at 18–20°C. Check the bottle on opening — this is the oldest red on the list by vintage.","producer_note":"Casa Vinicola Coppi is a historic winery at Turi, regarded as the reference for traditional, age-worthy Primitivo di Gioia del Colle. “Senatore” is one of Italy’s most decorated Primitivos: Tre Bicchieri in multiple vintages and best Primitivo at Vinitaly 2017.","photo_credit":"Photo: Schöne Weinwelt, German wine retailer.","has_photo":true,"also_in":[]},{"id":111,"number":"13","section":"Red — Italy","subsection":null,"title":"Nebbiolo 'Teorema' — Molino, Barbaresco 2022","price":"Bottle $150 (Riviera)","menu_note":"","region":"Barbaresco DOCG, Piedmont, Italy","grape":"100% Nebbiolo","producer":"Azienda Agricola Molino (Virginio Molino), Treiso","style":"Traditional, elegant Barbaresco aged in large oak barrels","alcohol":"≈ 14%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":4,"tannins_label":"High","tasting_notes":"red cherry, dried rose, violet, eucalyptus, mint, tobacco, warm spice, sweet tannins","story":"'Teorema' is one of two Barbarescos from the Molino family in Treiso — the highest of the three Barbaresco communes, whose wines tend to be perfumed and elegant rather than heavy. The grapes are picked by hand and fermented in open vats, then the wine rests for about two years in large oak barrels, which smooths out the tannins without adding much wood flavour. One naming note: this is Virginio Molino's Treiso estate, not Mauro Molino of La Morra — a different, better-known producer.","pairings":"Grilled red meats and roast beef, meat-stuffed pasta (agnolotti), salami and cured meats, mature Toma or Fontina. Decant about 60 minutes.","producer_note":"A small family estate founded by Virginio Molino in the early 1980s and today run by his three sons Tommaso, Franco and Dario, farming 16 hectares across Treiso, Guarene and Costigliole d’Asti. The philosophy is old-school and local: only Piedmontese varieties — Nebbiolo, Barbera, Dolcetto and Arneis — fermented and aged the traditional way.","photo_credit":"Photo: Markus Saletz, Austrian wine merchant.","has_photo":true,"also_in":[]},{"id":112,"number":"14","section":"Red — Italy","subsection":null,"title":"Sangiovese 'Soffocone di Vincigliata' — Bibi Graetz, Toscana 2023","price":"As printed on the menu: 'SOFFOCONE VINCI' — the full name is Soffocone di Vincigliata.","menu_note":"Bottle $150 (Riviera)","region":"Toscana IGT, Tuscany (single Vincigliata vineyard above Florence)","grape":"Sangiovese, with small amounts of Colorino and Canaiolo","producer":"Bibi Graetz — cult Tuscan winemaker based in Fiesole","style":"Single-vineyard Sangiovese, aged 18 months in old large oak casks","alcohol":"13–13.5%","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":4,"tannins_label":"Firm","tasting_notes":"red cherry, pomegranate, blood orange, dried Mediterranean herbs, sweet spice, vanilla, stony minerality","story":"This is the only Bibi Graetz wine named after its vineyard — the Vincigliata hill above Florence, where Bibi started his winery in 2000 with a tiny five-acre plot. The vines are around 70 years old, rooted in galestro (a crumbly Tuscan rock) and wrapped by forest, facing the city. After fermentation the wine spends 18 months in old, large wooden casks — no new oak — so what you taste is the grape and the hill: bright red fruit, a savoury edge, and tannins with real grip. It drinks beautifully now but has the structure to age.","pairings":"Grilled red meats, bistecca alla fiorentina, wild boar ragù, mushroom dishes, aged pecorino","producer_note":"Bibi Graetz began making wine in 2000 with no formal training, from a small vineyard in Fiesole above Florence. His Testamatta and Colore bottlings made him one of Tuscany's cult names, and he now works with old vines across Tuscany. Soffocone is his tribute to the hill where it all started.","photo_credit":"Photo: Caffetteria Stazione (pictures the 2023 vintage)","has_photo":true,"also_in":[]},{"id":113,"number":"15","section":"Red — Italy","subsection":null,"title":"Nebbiolo — De Forville, Barbaresco 2022","price":"Bottle $155 (Riviera)","menu_note":"","region":"Barbaresco DOCG, Piedmont, Italy","grape":"100% Nebbiolo","producer":"De Forville, village of Barbaresco","style":"Rigorously traditional: fermented in steel, aged in large old oak casks","alcohol":"≈ 14%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":4,"tannins_label":"High","tasting_notes":"dark cherry, rose, lavender, truffle, earth, leather, tobacco, menthol","story":"The standard Barbaresco from one of the village’s historic houses blends three vineyards: warm, generous Loreto; structured, long-lived Ovello; and round, fruity Cavanna. The grapes are fully destemmed and fermented on their own natural yeasts in steel tanks for about two weeks, then the wine rests in large Slavonian oak casks for at least 18 months and is bottled without fining or filtering. Classic savoury, floral Barbaresco — rose and tar with sweet, dusty tannins — and built to age.","pairings":"Braised beef and brasato, wild mushroom risotto, truffle pasta, roast game birds, aged Parmigiano-Reggiano. Open an hour before service or decant 60–90 minutes.","producer_note":"Founded in 1860 by Gioacchino De Forville, of Belgian descent, in the village of Barbaresco. Today the fifth generation — brothers Paolo and Valter Anfosso — runs about 11 hectares across Barbaresco and Castagnole Lanze. A benchmark traditionalist and one of the area’s historic names.","photo_credit":"Photo: Some Good Wine, US retailer. Pictured label shows the 2017 vintage; the listed wine is 2022.","has_photo":true,"also_in":[]},{"id":114,"number":"16","section":"Red — Italy","subsection":null,"title":"Sangiovese — Marchese Antinori Chianti Classico Riserva 2023 (Tenuta Tignanello)","price":"As printed on the menu: \"SANGIOVESE+, ANTINORI, TENUTA TIGNANELLO, CHIANTI CLASSICO RISERVA\" — the official label reads \"Marchese Antinori Chianti Classico Riserva DOCG\".","menu_note":"Bottle $160 (Riviera)","region":"Chianti Classico Riserva DOCG, Tuscany, Italy","grape":"90% Sangiovese, 10% Cabernet Sauvignon (the “+” in the menu title)","producer":"Marchesi Antinori, Tenuta Tignanello","style":"Polished, structured Riserva aged 24 months in oak barriques","alcohol":"14%","body":4,"body_label":"Full","acidity":4,"acidity_label":"High","tannins":4,"tannins_label":"High","tasting_notes":"black cherry, blackberry, blueberry, ripe plum, sweet tobacco, dried herbs, forest floor, spice","story":"The classic Antinori flagship Riserva, made at the Tenuta Tignanello estate in the heart of Chianti Classico. It spends a full two years in French and Hungarian oak barriques — double the DOCG minimum — which builds structure without heaviness. Sangiovese leads with cherry and spice; the 10% Cabernet Sauvignon adds colour and cassis depth. Polished, structured, Old World — made to drink well for a decade or more.","pairings":"Charcuterie and cured meats, red meats, bistecca, wild-boar ragù, aged pecorino and Parmigiano. Decant 30–60 minutes while young; serve at 16–18°C.","producer_note":"Marchesi Antinori is one of the world’s most famous wine families — 26 generations of Tuscan winemaking since 1385. Tenuta Tignanello produced the 1971 Tignanello that invented the “Super Tuscan”; this Riserva is the estate’s traditional DOCG flagship.","photo_credit":"Photo: WineOnLine.ie, Irish wine retailer.","has_photo":true,"also_in":[]},{"id":115,"number":"17","section":"Red — Italy","subsection":null,"title":"Nebbiolo 'Recta Pete' — Fletcher, Barbaresco 2022","price":"Bottle $165 (Riviera)","menu_note":"","region":"Barbaresco DOCG, Piedmont — multi-cru blend (incl. Roncaglie and Faset for 2022)","grape":"100% Nebbiolo","producer":"Fletcher Wines — Dave Fletcher","style":"Wild yeasts; 24 months in 10+ year-old French barriques; unfined, unfiltered, low sulphur","alcohol":"14%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"black cherry, almond, liquorice, aniseed, baking spice, new leather, incense, orange peel","story":"'Recta Pete' is the motto of Dave Fletcher's Scottish clan — it means 'seek what is right', rendered by the winemaker as 'shoot straight', a nod to his family's history as arrow-makers and to his forthright approach to Barbaresco. The wine itself is a throwback to the old Barbaresco tradition of blending prized crus rather than bottling them separately. It ferments with wild yeasts and ages two years in French oak barriques that are over ten years old — so the wood works as slow oxygenation rather than flavouring — and is bottled without fining or filtering. The 2022 was a warm, dry year, but reviewers found it well balanced rather than heavy: generous black-cherry fruit with crunchy acidity and gently dusty tannins. More approachable young than Fletcher's single-cru bottlings, but built to age.","pairings":"Classic Barbaresco pairings: brasato al Barolo (braised beef), agnolotti del plin, tajarin with porcini, roasted game birds, wild-boar ragù, and mature hard cheeses such as aged Parmigiano-Reggiano. Decant at least an hour if opened young.","producer_note":"Fletcher Wines is the personal project of Dave Fletcher, an Australian winemaker who fell for Nebbiolo, moved his family to Piedmont, and now makes wine in Barbaresco's old train station. His day job for years was winemaking at the well-known Ceretto estate, and his small label — roughly ten wines from a dozen vineyard sources — is built on long-term relationships with local growers. Recta Pete has been made since 2009 in tiny quantities (around 2,500–3,200 bottles a year); Fletcher is firmly established as one of Barbaresco's respected small artisan names.","photo_credit":"Photo: Kent Street Cellars (pictures the 2018 vintage; the listed vintage is 2022)","has_photo":true,"also_in":[]},{"id":116,"number":"18","section":"Red — Italy","subsection":null,"title":"Sangiovese — Villa Calcinaia, Chianti Classico Riserva 2020","price":"Bottle $165 (Riviera)","menu_note":"","region":"Chianti Classico Riserva DOCG (Greve in Chianti), Tuscany, Italy","grape":"100% Sangiovese, old vines, organic","producer":"Villa Calcinaia (Conti Capponi)","style":"Traditional-leaning Riserva — large-format oak, long ageing","alcohol":"≈ 14%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":4,"tannins_label":"High","tasting_notes":"forest fruit, white pepper, red rose petal, gardenia, blackberry, spiced orange peel, sweet spice","story":"The estate’s flagship red, from two blocks of old vines near Greve in Chianti. Each block ferments separately for 15–20 days, then ages separately for 15 months in 500-litre French oak tonneaux; after blending, the wine spends a further 4–6 months in large Slavonian oak casks. The large-format wood lets air in slowly and builds structure without heavy toast flavour. A mid-weight Riserva that starts closed and opens with air — silky but structured, with savoury, mineral drive. 93 points from Wine Advocate; drinking well from 2024 through 2032 and beyond.","pairings":"Bistecca alla fiorentina, wild-boar ragù with pappardelle, roast lamb with rosemary, aged pecorino, rich mushroom dishes.","producer_note":"The historic home of the Counts Capponi, one of the oldest continuous family ownerships in Chianti Classico (since 1524), today run by Sebastiano Capponi. 75 acres farmed organically; the style is deliberately classic — large-format oak, long ageing, no international make-up. Also known for the single-vineyard Gran Selezione “Vigna Contessa Luisa”, planted in 1959.","photo_credit":"Photo: Dortodoor, Dutch wine retailer.","has_photo":true,"also_in":[]},{"id":117,"number":"19","section":"Red — Italy","subsection":null,"title":"Sangiovese ‘Contessa Luisa’ — Villa Calcinaia, Chianti Classico Gran Selezione 2022","price":"As printed on the menu: SANGIOVESE, ‘CONTESSA LUISA’ VILLA CALCINAIA CHIANTI CLASSICO GRAN SELEZIONE (2022).","menu_note":"Bottle $175 (Riviera)","region":"Chianti Classico DOCG, Greve in Chianti, Toscana, Italy","grape":"100% Sangiovese (single vineyard: Vigna Contessa Luisa)","producer":"Villa Calcinaia (Conti Capponi)","style":"Gran Selezione — 30 months in large oak casks and tonneaux, organic","alcohol":"~14.5%","body":4,"body_label":"Full","acidity":4,"acidity_label":"High","tannins":4,"tannins_label":"Firm","tasting_notes":"black cherry and blackberry, balsamic, smoked meat, dried herbs, tobacco and spice; firm but fine tannins, bright acidity, long mineral finish.","story":"Villa Calcinaia has been the Tuscan home of the Capponi counts since 1524 — five centuries in the same family. ‘Gran Selezione’ is Chianti Classico’s top rank, created in 2014: the wine must come entirely from the estate’s own vineyards, age at least thirty months, and pass a tougher blind tasting than an ordinary Riserva. ‘Contessa Luisa’ is one of the estate’s three single-vineyard Gran Seleziones, from a west-facing slope of dense clay that gives it extra muscle. Thirty months in big oak casks — used gently, so the Sangiovese stays front and centre. It’s built to age a decade, but it’s generous enough to drink now.","pairings":"Bistecca alla fiorentina, pappardelle with wild boar ragù, braised beef short ribs, grilled lamb chops, aged Parmigiano-Reggiano.","producer_note":"Historic estate near Greve in Chianti, home of the Counts Capponi since 1524 (today Conte Sebastiano Capponi). ~75 acres of certified-organic vineyards; traditional, restrained-oak Sangiovese, including three single-vineyard Gran Seleziones.","photo_credit":"Photo: Fancy Magazine (fancymagazine.it).","has_photo":true,"also_in":[]},{"id":118,"number":"20","section":"Red — Italy","subsection":null,"title":"Sangiovese 'Eneo' — Montepeloso, Costa Toscana 2023","price":"Bottle $180 (Riviera)","menu_note":"","region":"Costa Toscana IGT, Tuscan coast (Suvereto), Italy","grape":"Sangiovese-led blend of native varieties (Montepulciano, Malvasia Nera, Alicante Bouschet)","producer":"Montepeloso, Suvereto","style":"The estate’s “grand vin” — rich coastal Tuscan from native grapes","alcohol":"14%","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":3,"tannins_label":"Medium","tasting_notes":"black cherry, plum, fig, chocolate, sage, smoke, liquorice, cured meat, balsamic spice","story":"“Eneo” is Montepeloso’s answer to globalisation: a flagship built from native Tuscan grapes instead of the Bordeaux varieties most coastal neighbours favour. The vineyards sit on chalky gravel and clay a few kilometres from the Tyrrhenian Sea near Suvereto, beside the acclaimed Tua Rita estate. The wine spends 15–18 months in used French oak — so the oak polishes rather than flavours it — plus another 18 months in bottle before release. The 2023 earned 95 points from Wine Advocate; it is drinking now through the late 2020s.","pairings":"Grilled and roasted red meats (bistecca, lamb chops), wild-boar ragù, robust pasta dishes, aged pecorino, mushroom dishes.","producer_note":"A small Suvereto estate bought in 1998 by Swiss-born historian Fabio Chiarelotto, who rebuilt it vine by vine; co-owned since 2007 with Silvio Denz, owner of several Bordeaux châteaux. The range runs from the entry-level A Quo through Eneo and Nardo to Gabbro, a 100% Cabernet Sauvignon; Eneo is consistently the estate’s most decorated wine.","photo_credit":"Photo: Erik Sørensen Vin, Danish wine retailer.","has_photo":true,"also_in":[]},{"id":119,"number":"21","section":"Red — Italy","subsection":null,"title":"Sangiovese 'San Lorenzo' — Castello di Ama, Chianti Classico Gran Selezione 2015","price":"As printed on the menu: \"CASTELLO DI AMA CHIANTI CLASSICO RISERVA GRAN SELEZIONE\" — the correct classification is Chianti Classico Gran Selezione \"San Lorenzo\" (Gran Selezione is its own tier, not a \"Riserva\").","menu_note":"Bottle $190 (Riviera)","region":"Chianti Classico DOCG — Gran Selezione, Gaiole in Chianti, Tuscany","grape":"80% Sangiovese, 13% Merlot, 7% Malvasia Nera","producer":"Castello di Ama","style":"Polished, modern-classic Gran Selezione — a second selection of the flagship lots","alcohol":"13.5%","body":4,"body_label":"Full","acidity":4,"acidity_label":"High","tannins":4,"tannins_label":"High","tasting_notes":"blackcurrant, brambleberry, blackberry, orange rind, sage, thyme, heather, sous-bois","story":"Gran Selezione is the top tier of Chianti Classico: estate-grown fruit, a tasting-panel approval, and at least 30 months of ageing. “San Lorenzo” comes from the estate’s oldest vines (20 years and more) and is effectively a second selection of the lots that feed the flagship Gran Seleziones “Vigneto La Casuccia” and “Vigneto Bellavista” — flagship depth without the flagship price. Each variety ferments separately on wild yeasts with long skin contact, then the blend ages about 10 months in fine-grained oak barriques, only 18% new. At a decade past harvest, the 2015 is at or near its peak.","pairings":"Bistecca alla fiorentina, grilled and braised red meats, venison, wild boar, aged pecorino and Parmigiano-Reggiano, rich ragù pastas. Serve at around 18°C.","producer_note":"Founded in 1976 in the hamlet of Ama near Gaiole in Chianti; owners Marco Pallanti and Lorenza Sebasti built it into a Chianti Classico benchmark, known for single-vineyard Gran Seleziones, the Merlot “L’Apparita”, and a celebrated contemporary-art programme among the vineyards.","photo_credit":"Photo: Antikwein, German vintage wine merchant.","has_photo":true,"also_in":[]},{"id":120,"number":"22","section":"Red — Italy","subsection":null,"title":"Cabernet Sauvignon 'Nemo' — Castello di Monsanto, Toscana 2019","price":"Bottle $200 (Riviera)","menu_note":"","region":"Toscana IGT — 'Il Mulino' single vineyard, inside the Chianti Classico zone","grape":"100% Cabernet Sauvignon (estate vines planted 1976)","producer":"Castello di Monsanto — Bianchi family, since 1961/62","style":"Super-Tuscan; 18 months in new French oak barriques, 12 months in bottle","alcohol":"14%","body":4,"body_label":"Full","acidity":2,"acidity_label":"Medium","tannins":3,"tannins_label":"Medium","tasting_notes":"blackcurrant, cassis, black cherry, bell pepper, rosemary, wild sage, cedar, saline-mineral edge","story":"'Nemo' is Latin for 'nobody' — from the saying 'no man is a prophet in his own land'. When Fabrizio Bianchi planted Cabernet Sauvignon in the Chianti Classico hills in 1976 (the first such planting in the area, first Nemo harvest 1982), a French grape in Tuscany was close to heresy, appreciated more abroad than at home. The name is a wry nod to that outsider status. The result is a Tuscan, not a Bordeaux, expression of Cabernet: full-bodied but fresh, savoury and herbal, with a saline-mineral edge from the galestro (schistous clay) soils.","pairings":"Roasts and grilled red meats, bistecca, wild boar and other game, hearty stews, rich pasta entrées such as pappardelle al ragù, and aged or soft cheeses. Decant an hour or two when young.","producer_note":"Castello di Monsanto's history begins in 1961/62, when Aldo Bianchi bought the land and castle at Monsanto in Barberino Val d'Elsa. His son Fabrizio drove the estate's modern reputation — the pioneering 1976 Cabernet planting for Nemo, and the celebrated Chianti Classico Riserva 'Il Poggio'. The estate remains family-run and is one of Chianti Classico's historic names; Nemo is still a single-vineyard wine from Il Mulino, made essentially the same way for four decades.","photo_credit":"Photo: Tannico","has_photo":true,"also_in":[]},{"id":121,"number":"23","section":"Red — Italy","subsection":null,"title":"Dolcetto d'Alba 'Pinotto' — Fabio Gea, Piemonte 2023","price":"Bottle $200 (Riviera)","menu_note":"","region":"Dolcetto d'Alba DOC, Piedmont (tiny plots near Barbaresco)","grape":"100% Dolcetto","producer":"Fabio Gea ('La Msòira e'l Rastel' — 'the sickle and the rake' in Piedmontese)","style":"Unfiltered, no fining, little or no added sulphur; aged in large old barrels and porcelain amphorae","alcohol":"12.3%","body":3,"body_label":"Medium","acidity":2,"acidity_label":"Low","tannins":2,"tannins_label":"Low","tasting_notes":"black cherry, blueberry, cassis, balsamic, herbs, almond, juicy dark fruit, warm textured finish","story":"Dolcetto is usually the simple, juicy red of Piedmont — but this is the most serious take on it you'll find. Fabio Gea is an ex-geologist who left corporate life to revive his grandfather's tiny plots by hand (only about 5,000 bottles a year in total, each hand-numbered, on hand-pressed pulp paper). He ferments with wild yeasts, never fines or filters, and ages the wine in large old barrels and in porcelain amphorae of his own design — vessels that age the wine gently without adding any oak flavour. The result is a Dolcetto with real depth and intensity, far beyond the simple quaffer the variety is often reduced to.","pairings":"Piedmontese classics: agnolotti, tajarin, vitello tonnato, charcuterie and salumi, mushroom dishes, and truffled rice. Retailer notes also suggest steak tartare or duck with red berries for the adventurous.","producer_note":"Fabio Gea is one of Piedmont's most original natural winemakers. A former geologist with a doctorate, he walked away from corporate work to revive tiny family plots bequeathed by his maternal grandfather around the Bricco in Barbaresco — a few rows of Nebbiolo, Dolcetto, Barbera and Grignolino totalling under two hectares, farmed by hand in polyculture. His first vintage was 2009, and he has become a cult figure internationally while remaining little-known locally.","photo_credit":"Photo: Lieu-dit","has_photo":true,"also_in":[]},{"id":122,"number":"24","section":"Red — Italy","subsection":null,"title":"Nebbiolo 'Castiglione' — Vietti, Barolo 2021","price":"Bottle $225 (Riviera)","menu_note":"","region":"Barolo DOCG, Piedmont — multi-cru blend ('Barolo classico')","grape":"100% Nebbiolo (vines 10–45 years old)","producer":"Vietti — Castiglione Falletto, founded 1919","style":"Each cru vinified and aged separately (~30 months in oak casks and barriques), then blended","alcohol":"14%","body":4,"body_label":"Full","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"rose, strawberries, sweet violets, cinnamon, menthol, licorice, dark red fruit, spice, dusty earth","story":"'Castiglione
