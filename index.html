ap.","producer_note":"Skellig Six18 Distillery, Cahersiveen, Co. Kerry; small-batch pot-still gin named for the 618 steps of the Skellig Michael monastery island.","has_photo":true,"photo_credit":"https://celticcanada.com/ancient-skellig-michael-steps-inspire-irish-distillery/"},{"id":38,"name":"TANQUERAY LONDON DRY","category":"GIN - BRITISH ISLES","price":"7","origin":"England (distilled in Scotland)","abv":"43.1%","tasting_notes":"Bold, dry and juniper-led from just four botanicals: peppery coriander, aromatic angelica and a touch of liquorice sweetness, finishing crisp and clean.","producer_note":"Diageo; created by Charles Tanqueray in 1830 with his original four-botanical recipe, still made today.","has_photo":true,"photo_credit":"tymber-greenline.imgix.net"},{"id":39,"name":"TANQUERAY TEN GIN","category":"GIN - BRITISH ISLES","price":"9","origin":"England (distilled in Scotland)","abv":"47.3%","tasting_notes":"Bright and citrus-forward: fresh grapefruit, lime and orange with soft chamomile florals; silky and smooth despite the higher strength, with a clean, zesty finish.","producer_note":"Diageo; distilled in the small 'Tiny Ten' copper pot still from whole fresh citrus fruit and chamomile flowers alongside the classic botanicals.","has_photo":true,"photo_credit":"https://www.gincident.co.za/product/tanqueray-no-ten-gin/"},{"id":40,"name":"TARQUIN'S CORNISH DRY GIN","category":"GIN - BRITISH ISLES","price":"11","origin":"England (Cornwall)","abv":"42%","tasting_notes":"Piney juniper with bright citrus (orange blossom, lemon sherbet) and a delicate floral lift from handpicked violets; smooth, full and very easy drinking.","producer_note":"South Western Distillery, Cornwall; the first gin distilled in Cornwall in over 100 years, by Tarquin Leadbetter.","has_photo":true,"photo_credit":"https://distilleduk.com/gin-map/"},{"id":41,"name":"TOBERMORY ISLE OF MULL","category":"GIN - BRITISH ISLES","price":"9","origin":"Scotland","abv":"43.3%","tasting_notes":"Fresh juniper and citrus with floral hints of heather and elderflower; a creamy, full mouthfeel carries a subtle sweet malt note from a splash of whisky-still spirit.","producer_note":"Tobermory Distillery, Isle of Mull (Distell); the first gin in the distillery's 200-plus-year history, using Hebridean tea and local botanicals.","has_photo":true,"photo_credit":"https://bottleswithoutborders.com/abv/43-3/"},{"id":42,"name":"WARNER'S LONDON DRY GIN","category":"GIN - BRITISH ISLES","price":"10","origin":"England","abv":"40%","tasting_notes":"Fresh and zesty: a big sweet, lemony juniper hit like juniper sherbet, with floral spice and a warm, gently spicy finish.","producer_note":"Warner's Distillery, Falls Farm, Harrington, Northamptonshire; a farm distillery growing many of its own botanicals, run by Tom and Tina Warner.","has_photo":true,"photo_credit":"https://vinefilos.com/ginebras/1111-warner-s-london-dry.html"},{"id":43,"name":"WEAVERS IRISH DRY GIN","category":"GIN - BRITISH ISLES","price":"8","origin":"Northern Ireland (Co. Down)","abv":"","tasting_notes":"Citrusy and softly floral: grapefruit, lime and lemon with lavender, rose and jasmine, a gentle peppery warmth, and a creamy smoothness from Irish flax seed.","producer_note":"Echlinville Distillery, Kircubbin, Co. Down (Ireland's first farm distillery); the gin celebrates Ulster's linen-weaving heritage and uses flax seeds among its botanicals.","has_photo":true,"photo_credit":"https://nutsaboutwine.ie/product/weavers-dry-gin-70cl/"},{"id":1001,"name":"AUDEMUS PINK PEPPER GIN","category":"GIN - EUROPE/OTHER","price":"11","origin":"France","abv":"44%","tasting_notes":"Spicy and aromatic: pink peppercorn, juniper and cardamom up front, warming into sweet vanilla and tonka pastry notes as it sits; over ice it opens into delicate florals.","producer_note":"Audemus Spirits, Cognac, France; a tiny vacuum-distillery founded by Miko Abouaf, with each batch dedicated to friends and family of the story.","has_photo":true,"photo_credit":"https://hoferwineandspirits.ch/de/audemus-pink-pepper-44proz-p1558/"},{"id":1002,"name":"BACUR DRY GIN","category":"GIN - EUROPE/OTHER","price":"11","origin":"Italy","abv":"40%","tasting_notes":"Focused and herbal: clean, intense juniper with bright lemon zest and a leafy sage warmth, smooth and balanced throughout.","producer_note":"Bottega SpA, Veneto, Italy; distilled in copper stills with Italian juniper, sage and lemon zest — 'Bacûr' refers to the copper still itself.","has_photo":true,"photo_credit":"https://bondstore.net/shop/page/9/?add_to_wishlist=12392&_wpnonce=01c62a4cdb"},{"id":1003,"name":"BERTO DRY GIN","category":"GIN - EUROPE/OTHER","price":"10","origin":"Italy","abv":"43%","tasting_notes":"An Italian herb-garden gin: juniper layered with rosemary and bay leaf, a soft iris-petal floral note and fresh lemon brightness.","producer_note":"Antica Distilleria Quaglia, Castelnuovo Don Bosco, Piedmont; a family distillery since 1890, each botanical macerated 48 hours and distilled separately.","has_photo":true,"photo_credit":"https://waterfordwine.com/products/moletto-gin"},{"id":1004,"name":"BOBBY'S GIN","category":"GIN - EUROPE/OTHER","price":"9","origin":"Netherlands (Schiedam)","abv":"42%","tasting_notes":"Dutch gin meets Indonesian spice: bright lemongrass, warm clove and cinnamon over soft juniper, with rosehip floral notes and a long peppery cubeb finish. Less juniper-forward than a classic London dry.","producer_note":"Bobby's Gin, created by the van Bokkel brothers from their grandfather Bobby's recipe, distilled with the Herman Jansen distillery.","has_photo":true,"photo_credit":"https://www.gin-foundry.com/gin/bobbys-gin/"},{"id":1005,"name":"BOLS GENEVER GIN","category":"GIN - EUROPE/OTHER","price":"7","origin":"Netherlands (Amsterdam)","abv":"42%","tasting_notes":"Malt-driven and whiskey-like: bread, sweet oatmeal and raisin notes over gentle juniper, with a touch of apricot and warm spice. Smooth, rich and grainy rather than crisp.","producer_note":"Lucas Bols, one of the world's oldest distillery brands (founded 1575), still following its 1820 genever recipe.","has_photo":true,"photo_credit":"https://eng.whisky.dk/shop/bols-genever-gin-6403p.html"},{"id":1006,"name":"BOTICA LONDON DRY GIN","category":"GIN - EUROPE/OTHER","price":"9","origin":"Spain (Barcelona)","abv":"37.5%","tasting_notes":"A classic-style small-batch London dry with bright juniper and citrus up front, a dry, robust palate of spice and lime, and a long smooth finish.","producer_note":"Botica, a Barcelona brand distilling since June 2018 from an old family recipe in copper pot stills.","has_photo":true,"photo_credit":"https://www.alkospotgdansk.pl/sklep/page/83/"},{"id":1007,"name":"CAPE FYNBOS (SOUTH AFRICA)","category":"GIN - EUROPE/OTHER","price":"9","origin":"South Africa (Paarl)","abv":"45%","tasting_notes":"Deeply herbal and complex from 33 hand-harvested fynbos wildflowers and herbs, with a hint of orange zest. Surprisingly smooth for its strength.","producer_note":"Created by Oliver Kirsten and Johan du Toit of Cape Fynbos Wines & Spirits, distilled at Wilderer Distillery in Paarl.","has_photo":true,"photo_credit":"https://www.rum-paradise.de/nordes-gin"},{"id":1008,"name":"CARMIN GIN","category":"GIN - EUROPE/OTHER","price":"16","origin":"France (Normandy)","abv":"42%","tasting_notes":"A fruity, red-berry gin: ripe raspberry, blackcurrant and elderflower over soft juniper, silky and floral rather than bone-dry. (See report: input name did not exactly match; closest verified product is Drouin's Carmina.)","producer_note":"Closest verified match: Le Gin de Christian Drouin Carmina, made by the Calvados house Christian Drouin, distilled from 30 cider-apple varieties.","has_photo":true,"photo_credit":"https://www.boozebud.com.au/product/le-gin-de-christian-drouin-carmina-gin-700ml/"},{"id":1009,"name":"CITADELLE","category":"GIN - EUROPE/OTHER","price":"7","origin":"France (Cognac)","abv":"44%","tasting_notes":"Juniper-forward with citrus and warm spice: cardamom, cinnamon and cracked pepper over lemon and orange peel. Round and full-bodied with a long, spiced finish.","producer_note":"Maison Ferrand, the Cognac house; distilled in open-flame Charentais copper stills with 19 botanicals added one by one (patented progressive infusion).","has_photo":true,"photo_credit":"https://citadellegin.com/gin/citadelle-original/"},{"id":1010,"name":"ENGINE GIN","category":"GIN - EUROPE/OTHER","price":"11","origin":"Italy (Piedmont)","abv":"42%","tasting_notes":"Bold and herbal: fresh sage, bright lemon and soft Damask rose up front, with sweet licorice root underneath and a lightly bitter herbal finish.","producer_note":"Italian organic gin founded by Paolo Dalla Mora, distilled at Torino Distillati (also home of Malfy), sold in the signature motor-oil-can bottle.","has_photo":true,"photo_credit":"https://www.bevandecuni.it/spirits/gin-engine?1f15f73d_page=6&944b1952_page=3&944b1966_page=2"},{"id":1011,"name":"ETNEUM VOLCANIC GIN","category":"GIN - EUROPE/OTHER","price":"11","origin":"Italy (Sicily, Mount Etna)","abv":"40%","tasting_notes":"Citrus-led and fresh: Sicilian bergamot and lemon with wildflower and herb notes (violet, elderflower, eucalyptus), all ingredients from the slopes of Etna.","producer_note":"Aetnae, the Sicilian project of Giuseppe Librizzi to showcase the products of his native Etna region.","has_photo":true,"photo_credit":"https://www.baraitalienskaprodukter.se/upload_pc/prodotti/30761_immagine_0.webp"},{"id":1012,"name":"FAVIGNANA SICILIAN GIN","category":"GIN - EUROPE/OTHER","price":"11","origin":"Italy (Sicily, Favignana island)","abv":"41%","tasting_notes":"Lemon and mint freshness, sweet chamomile balancing juniper's bitter edge, with myrtle and wild island herbs giving a soft, almost creamy texture.","producer_note":"The Favignana Flavor Company, founded by three island locals (Nino, Thibault, Davide) with botanist Dr Rizza; 12 botanicals wild-foraged on the island.","has_photo":true,"photo_credit":"https://enotecacostantinipiero.it/gin/18628-Gin-Favignana-0-70-lt-8003230002891.html"},{"id":1013,"name":"FRIEDRICHS DRY GIN","category":"GIN - EUROPE/OTHER","price":"9","origin":"Germany (Steinhagen)","abv":"45%","tasting_notes":"Dry, aromatic and floral with strong juniper character, orange peel, rosemary and lavender, rounded off with a soft coriander note.","producer_note":"Schwarze & Schlichte, a family-owned Steinhagen distillery with 250 years of juniper tradition; triple distilled and made without artificial additives.","has_photo":true,"photo_credit":"https://www.bebiendoestrellas.com.ar/productos/gin-friedrichs-dry-gin-700-ml-de-alemania/"},{"id":1014,"name":"FOUR PILLARS RARE DRY GIN","category":"GIN - EUROPE/OTHER","price":"10","origin":"Australia (Yarra Valley, Victoria)","abv":"41.8%","tasting_notes":"Bright whole oranges and classic juniper up front, with native lemon myrtle and Tasmanian pepperberry adding citrus lift and gentle spice. Dry, clean finish.","producer_note":"Four Pillars, founded 2013 by Stuart Gregor, Cameron Mackenzie and Matt Jones; the gin that defined modern Australian gin, distilled in copper still 'Wilma'.","has_photo":true,"photo_credit":"https://eluenheng.luenheng.com/product/four-pillars-rare-dry-gin/"},{"id":1015,"name":"GENEROUS GIN","category":"GIN - EUROPE/OTHER","price":"11","origin":"France (Charente)","abv":"44%","tasting_notes":"Floral and citrusy: juniper softened by jasmine and elderflower, with citrus fruits and a warm red-pepper and spice finish. Aromatic and rounded.","producer_note":"Produced by the French company Odevie (Creative Spirits), bottled in the brand's signature white 'Tree of Life' porcelain-style bottle.","has_photo":true,"photo_credit":"https://liquorlegends.com.au/spirit/generous-gin-odevie-700ml"},{"id":1016,"name":"GOTHA MENEGIKS GIN","category":"GIN - EUROPE/OTHER","price":"10","origin":"Italy (Bologna)","abv":"42%","tasting_notes":"Savoury and unusual: juniper with caper berries, sea fennel (samphire) and peppermint, plus a touch of Adriatic seawater that makes it herbaceous and lightly briny rather than sweet.","producer_note":"Gotha, a tiny craft distillery in Bologna; Menegiks is the phonetic spelling of the Albanian word for peppermint (Menexhik).","has_photo":true,"photo_credit":"https://www.estal.com/news/post/the-sustainable-packaging-age"},{"id":1017,"name":"HOOGHOUDT RAW GENEVER","category":"GIN - EUROPE/OTHER","price":"9","origin":"Netherlands (Groningen)","abv":"43%","tasting_notes":"Malt-driven genever: soft grain and bread notes, bright lemon and orange zest, subtle juniper, with an oily texture and black pepper and coriander spice.","producer_note":"Hooghoudt, a family-owned distillery in Groningen, Netherlands, known for grain whiskies and craft genevers.","has_photo":true,"photo_credit":"https://www.drankenhandelleiden.nl/hooghoudt-raw-genever-holland-gin.html"},{"id":1018,"name":"JAISALMER INDIAN CRAFT","category":"GIN - EUROPE/OTHER","price":"9","origin":"India (Rampur, Himalayan foothills)","abv":"43%","tasting_notes":"Fresh and citrusy with lemon and orange peel, spicy cubeb pepper and coriander, and an earthy, exotic edge from vetiver and lemongrass. Smooth and refreshing.","producer_note":"Made at Rampur Distillery, one of India's oldest distilleries, by Radico Khaitan; 11 botanicals, seven of them Indian, including Darjeeling green tea.","has_photo":true,"photo_credit":"https://eastmidconnected.co.uk/refreshing-summer-cocktails-to-enjoy-whilst-temperatures-sizzle-%f0%9f%8d%b9/"},{"id":1019,"name":"KALEVALA DRY GIN","category":"GIN - EUROPE/OTHER","price":"12","origin":"Finland (Kitee, Karelia)","abv":"46.3%","tasting_notes":"Fresh, herbal and green: juniper, rosemary and raspberry leaf with sea-buckthorn, mint and a touch of rose. Savoury yet bright, like a pine forest in a glass.","producer_note":"Kalevala Distillery, founded by biochemical engineer Moritz Wustenberg; a small handmade organic distillery, named after the Finnish national epic.","has_photo":true,"photo_credit":"https://www.liquiddirectorclub.com/ginguide/kalevala-gin-gindependence/"},{"id":1020,"name":"KAPRIOL GIN","category":"GIN - EUROPE/OTHER","price":"11","origin":"Italy (Veneto, Dolomites)","abv":"41.7%","tasting_notes":"Dry and balsamic like mountain air: juniper and mint with mountain pine, bay leaf and rosemary, plus a soft bitter touch of hops. No citrus, deliberately crisp.","producer_note":"Distilleria dell'Alpe, run by the Beniamino Maschio family, which revived the historic Kapriol line in 2016 with alpine botanicals.","has_photo":true,"photo_credit":"https://centro-italia-berlin-test.de/gazzetta/wissen/negroni-in-brera-mailand-gazzetta/"},{"id":1021,"name":"LA BOTA NO.81 GIN","category":"GIN - EUROPE/OTHER","price":"25","origin":"Spain (Jerez de la Frontera)","abv":"","tasting_notes":"A London Dry style gin aged nearly four years in a single Fino sherry cask and bottled at cask strength: marked citrus and juniper with a subtle nutty, wine-like sherry character and a delicate manzanilla-like palate.","producer_note":"Equipo Navazos, a team of sherry lovers bottling single-cask rarities from Jerez since 2005; the No.81 gin is a single-cask limited edition.","has_photo":true,"photo_credit":"https://teorema.pub/page/44/"},{"id":1022,"name":"MATOROA GIN","category":"GIN - EUROPE/OTHER","price":"9","origin":"Greece","abv":"","tasting_notes":"Piney juniper with Mediterranean herbs: bay leaf, mastic, lavender and chamomile with citrus lift from orange and lemon peel. Aromatic, smooth and distinctly Greek. (See report: input name did not exactly match; actual brand is Mataroa.)","producer_note":"Mataroa Mediterranean Dry Gin, distilled and bottled at the century-old Melissanidi Distillery in northern Greece; 12 botanicals from 11 Mediterranean countries.","has_photo":true,"photo_credit":"https://toppersdrinks.co.uk/product/mataroa-gin/?add-to-cart=881"},{"id":1023,"name":"MONKEY 47","category":"GIN - EUROPE/OTHER","price":"18","origin":"Germany (Black Forest, Lossburg)","abv":"47%","tasting_notes":"Layered and complex: juniper, citrus, lavender and spruce with tart cranberry and blackberry fruit, stone-fruit sweetness and a long peppery herbal finish.","producer_note":"Black Forest Distillers, founded from a recipe by RAF officer Montgomery Collins; 47 botanicals, many foraged locally, rested in earthenware before bottling at 47%.","has_photo":true,"photo_credit":"https://modernebarnwines.com/products/monkey-47"},{"id":1024,"name":"NORMINDIA DISTILLED GIN","category":"GIN - EUROPE/OTHER","price":"8","origin":"France (Normandy)","abv":"41.4%","tasting_notes":"Bright calamondin citrus (a tart little fruit between lime and mandarin), warm cardamom and coriander over green juniper, with a rounded apple note and a long, warm, spicy finish.","producer_note":"Domaine du Coquerel, a Calvados distillery founded 1937; Normindia is a 'gin d'auteur' by Pierre Martin Neuhaus, distilled in a traditional Calvados column still.","has_photo":true,"photo_credit":"https://www.icon-icon.com/wp-content/uploads/2022/10/"},{"id":1025,"name":"PANAREA GIN","category":"GIN - EUROPE/OTHER","price":"8","origin":"Italy (Aeolian Islands, Sicily)","abv":"44%","tasting_notes":"Mediterranean and elegant: strong juniper with lemon, myrtle and coriander; citrusy and spiced, smooth and very easy to drink.","producer_note":"Distilleria Lorenzo Inga, the Inga family distilling since 1832; dedicated to Panarea, 'the pearl of the Aeolian Islands' (44% applies to both the Island and Sunset expressions).","has_photo":true,"photo_credit":"https://www.bernardistore.it/tag-prodotto/gin-panarea-island-distilleria-lorenzo-inga/?product_group=featured"},{"id":1026,"name":"POLI MARCONI 42 GIN","category":"GIN - EUROPE/OTHER","price":"10","origin":"Italy (Veneto, Schiavon)","abv":"42%","tasting_notes":"Very herbal and savoury: mint, basil, sage and rosemary with a cooling menthol lift and a hint of cardamom. Juniper plays second fiddle to the garden-herb character.","producer_note":"Distillerie Poli, the family grappa distillery founded 1898; distilled by Jacopo Poli in his vacuum bain-marie still 'Crysopea', named for inventor Guglielmo Marconi and the distillery's street.","has_photo":true,"photo_credit":"https://www.nicks.com.au/products/poli-marconi-42-mediteranean-gin-700ml"},{"id":1027,"name":"POLI MARCONI 44 AGRUMATO","category":"GIN - EUROPE/OTHER","price":"11","origin":"Italy","abv":"44%","tasting_notes":"A citrus-forward gin: pink grapefruit and sweet orange on the nose, fresh lemon brightness in the mouth, with juniper and bitter orange giving it depth and a little warmth of cardamom and coriander at the end.","producer_note":"Poli Distillerie, a family distillery in Schiavon (Veneto) since 1898, best known for grappa; the Marconi gin line is named after Guglielmo Marconi and vacuum bain-marie distilled.","has_photo":true,"photo_credit":"https://www.meyerhof.de/Produkte/Spirituosen/Gin/"},{"id":1028,"name":"POLI MARCONI 46 GIN","category":"GIN - EUROPE/OTHER","price":"11","origin":"Italy","abv":"46%","tasting_notes":"Big pine-juniper up front, cooled by fresh mint and mountain pine, like walking through a pine forest. A smooth, slightly sweet muscat grape softness rounds it out, with a long warm finish of cardamom and coriander.","producer_note":"Poli Distillerie, a family distillery in Schiavon (Veneto) since 1898, best known for grappa; the Marconi gin line is named after Guglielmo Marconi and vacuum bain-marie distilled.","has_photo":true,"photo_credit":"https://www.meinlamgraben.eu/shop/en/poli-gin-marconi-46-0-7l"},{"id":1029,"name":"ROBY MARTON GIN","category":"GIN - EUROPE/OTHER","price":"15","origin":"Italy","abv":"47%","tasting_notes":"Bold and dry with lots of flavour: strong juniper backed by licorice, ginger and warm baking spice, finishing with delicate citrus. Complex and punchy rather than light.","producer_note":"Roby Marton, a small handcrafted gin from Treviso (Veneto) made by cold-infusing botanicals for about 10 days and bottled unfiltered; only around 10,000 bottles are produced.","has_photo":true,"photo_credit":"https://oltrevino.it/gin-handcrafted-70-cl-roby-marton.html"},{"id":1030,"name":"SCAPEGRACE BLACK","category":"GIN - EUROPE/OTHER","price":"9","origin":"New Zealand","abv":"41.6%","tasting_notes":"Naturally black in the glass and turns purple when you add tonic. Juniper-forward with citrus and a cool, almost minty freshness, plus pineapple and a hint of warm spice; juicy and bright in a G&T.","producer_note":"Scapegrace Distillery in Canterbury, New Zealand, founded by brothers-in-law Mark Neal and Daniel McLaughlin; Black is billed as the world's first naturally black, colour-changing gin.","has_photo":true,"photo_credit":"evessio.s3.amazonaws.com"},{"id":1031,"name":"VOR ICELANDIC GIN","category":"GIN - EUROPE/OTHER","price":"11","origin":"Iceland","abv":"47%","tasting_notes":"Unlike most gins: malty and grainy like a young whisky or genever, with wild berries, rhubarb, thyme and licorice notes in a rich, slightly oily body. Herbal and savoury, very unusual.","producer_note":"Eimverk Distillery, Iceland, distilled from Icelandic barley and wild Icelandic botanicals (birch leaves, thyme, crowberries, Iceland moss, kelp) in a 300-litre still; 'Vor' means spring.","has_photo":true,"photo_credit":"https://www.whiskyandpassion.com/vor-gin-4419.html"},{"id":1032,"name":"VORDING'S GIN","category":"GIN - EUROPE/OTHER","price":"12","origin":"Netherlands","abv":"45%","tasting_notes":"Light, fresh and silky: citrusy on the nose with soft juniper, hints of orange and cinnamon, and a gentle whisper of smoke from toasted cedar wood on the finish.","producer_note":"Vørding Spirits of Amsterdam, founded by Thomas Vørding who developed the recipe in his own kitchen; the hand-toasted cedar chips are still prepared in-house and the gin is distilled in Schiedam.","has_photo":true,"photo_credit":"https://melgers.nl/product/vording-s-gin-cedar-wood-infused-70cl/"},{"id":2001,"name":"CIRKA GIN SAUVAGE","category":"GIN - CANADA","price":"9","origin":"Montréal, Québec, Canada","abv":"44%","tasting_notes":"A taste of the boreal forest: pine and conifer notes kept in balance with floral and fruity tones, silky and clean, easy to sip neat or stir into a martini. 'Sauvage' means wild.","producer_note":"CIRKA Distilleries in Montréal, Québec's first grain-to-bottle distillery, distilling everything on site from Québec corn with mostly local botanicals.","has_photo":true,"photo_credit":"https://dashofhoney.ca/fr/cocktail-festif-des-fetes-au-gin-et-canneberges/"},{"id":2002,"name":"CLAWFOOT STILLS","category":"GIN - CANADA","price":"9","origin":"Ottawa, Ontario, Canada","abv":"","tasting_notes":"Bolder than a typical gin: bright citrus layered with woodland spice, ginger, coriander seed and grains of paradise, in a rich, full-bodied spirit built for cocktails and food pairing.","producer_note":"Clawfoot Stills, an Ottawa craft gin brand; its first 363-bottle batch (Recipe No. 7) was distilled in July 2023 at SFR Distillery in Kanata, with a foraged-ingredient, sustainability-first ethos.","has_photo":true,"photo_credit":"https://www.451spirits.com/curbsidepickup/p/clawfoot-gin (451 Spirits)"},{"id":2003,"name":"DILLON'S 22 UNFILTERED GIN","category":"GIN - CANADA","price":"9","origin":"Beamsville (Niagara), Ontario, Canada","abv":"40%","tasting_notes":"A modern, aromatic style: citrusy and floral with lavender, lemon-lime and soft juniper, plus lemongrass, spice and a touch of licorice. The '22' is the number of botanicals; bottled unfiltered for extra flavour.","producer_note":"Dillon's Small Batch Distillers in Beamsville, Ontario, a family craft distillery founded in 2012 making spirits from Niagara grapes and 100% Ontario rye.","has_photo":true,"photo_credit":"https://mcstaging3.lcbo.com/fr/gin-dillon-s-22-non-filtre-358556"},{"id":2004,"name":"DILLON'S GENEVA GIN","category":"GIN - CANADA","price":"9","origin":"Beamsville (Niagara), Ontario, Canada","abv":"","tasting_notes":"","producer_note":"Dillon's Small Batch Distillers in Beamsville, Ontario, a family craft distillery founded in 2012; a 'Geneva gin' product could not be verified from any public source.","has_photo":false,"photo_credit":""},{"id":2005,"name":"DILLON'S NAVY STRENGTH","category":"GIN - CANADA","price":"9","origin":"Beamsville (Niagara), Ontario, Canada","abv":"","tasting_notes":"","producer_note":"Dillon's Small Batch Distillers in Beamsville, Ontario, a family craft distillery founded in 2012; a Dillon's navy strength gin could not be verified from any public source (navy strength generally means ~57% ABV).","has_photo":false,"photo_credit":""},{"id":2006,"name":"EMPRESS 1908 GIN","category":"GIN - CANADA","price":"9","origin":"Sidney, British Columbia, Canada","abv":"42.5%","tasting_notes":"The indigo-purple gin that turns pink when you add tonic or citrus. Under the colour it drinks like a classic gin: bright juniper and grapefruit, a little rose petal, black tea and warm ginger-cinnamon spice.","producer_note":"Victoria Distillers of Sidney, BC, in collaboration with the Fairmont Empress Hotel in Victoria (the hotel, founded in 1908, gives the gin its name); the colour comes from butterfly pea blossom and its tea blend.","has_photo":true,"photo_credit":"https://wallpapers.com/wallpapers/empress-1908-gin-750-ml-s6o66t1h0vjzvovv.html"},{"id":2007,"name":"MADISON PARK BREAKFAST GIN","category":"GIN - CANADA","price":"9","origin":"Montréal (Verdun), Québec, Canada","abv":"","tasting_notes":"A tea-forward gin: bold black tea and bergamot (think Earl Grey) layered over piney juniper, with bright lemon oil, lavender and chamomile edges and a warm, dry finish.","producer_note":"1769 Distillery in Verdun, Montréal, founded by Maureen David and certified master distiller Andrew Mikus; the Breakfast Gin (actual name: Madison Park Bergamote Breakfast Gin) builds on their Madison Park London Dry.","has_photo":true,"photo_credit":"https://virtual-clone-1656422952-clone-1677143226-vinexposium.expoplatform.com/product/29323"},{"id":2008,"name":"OPEN COAST GIN","category":"GIN - CANADA","price":"8","origin":"St. John's, Newfoundland and Labrador, Canada","abv":"","tasting_notes":"A bright, strongly aromatic dry gin: fresh juniper with lemon and citrus, a subtle floral lift, and hints of nutmeg, coriander and cracked pepper running through to a lingering finish.","producer_note":"Open Coast Gin Co. of St. John's, Newfoundland and Labrador, a 100% Canadian-made artisanal gin brand launched in 2022.","has_photo":true,"photo_credit":"https://opencoastgin.ca/cocktail/ocean-martini/"},{"id":2009,"name":"RADOUNE GIN","category":"GIN - CANADA","price":"9","origin":"Gaspé, Québec, Canada","abv":"43%","tasting_notes":"Savoury and earthy rather than citrusy: forest-floor and damp-earth notes with pine, juniper and a mushroom-like umami, plus thyme, a little baked blueberry and a cooling finish. Great in a Negroni.","producer_note":"O'Dwyer microdistillerie in Gaspé, Québec, staying true to the region: Radoune is made with wild mushrooms foraged by Gaspésie Sauvage and juniper berries dried in sea salt.","has_photo":true,"photo_credit":"https://odwyer.biz/product/wooden-single-drawer/"},{"id":2010,"name":"REID'S GIN","category":"GIN - CANADA","price":"9","origin":"Toronto, Ontario, Canada","abv":"42.2%","tasting_notes":"A classically balanced gin with a Canadian twist: smooth juniper and citrus with wild-foraged botanicals, clean and well-rounded, easy to drink in a martini or a G&T.","producer_note":"Reid's Distillery, a family-run gin distillery at 32 Logan Ave in Toronto's Leslieville, selling Signature, Spiced and Citrus gins in decanter-style bottles with hand-waxed seals.","has_photo":true,"photo_credit":"https://www.lcbo.com/fr/reid-s-gin-38922"},{"id":2011,"name":"SHERINGHAM GIN","category":"GIN - CANADA","price":"9","origin":"Sooke, Vancouver Island, British Columbia, Canada","abv":"43%","tasting_notes":"Bright and coastal: juniper with rose, lavender and citrus, plus coriander and cardamom, and a subtle salty sea-breeze note from local winged kelp. Elegant neat or in a G&T.","producer_note":"Sheringham Distillery in Sooke, BC, owned and operated by husband-and-wife team Jason and Alayne MacIsaac; its Seaside Gin was named World's Best Contemporary Gin at the 2019 World Gin Awards.","has_photo":true,"photo_credit":"https://www.supernaturalbc.com/de/listings/sheringham-distillery-900304994/"},{"id":2012,"name":"SPIRIT OF YORK GIN","category":"GIN - CANADA","price":"9","origin":"Toronto, Ontario, Canada","abv":"40%","tasting_notes":"Delicate and floral with bright lemon-zest citrus and a distinct juniper finish; gentle notes of lavender, orange, cinnamon and pine with a peppery edge and lingering licorice.","producer_note":"Spirit of York Distillery Co. in Toronto's Distillery District, distilling all of its spirits from 100% Ontario-grown rye and Ontario springwater.","has_photo":true,"photo_credit":"https://mytoastlife.com/toronto-craft-gins-to-level-up-your-cocktail-game/"},{"id":2013,"name":"STEINHART GIN","category":"GIN - CANADA","price":"9","origin":"Arisaig, Nova Scotia, Canada","abv":"","tasting_notes":"A traditional juniper-forward gin: strong juniper up front with floral notes, a bit of citrus, and warming anise and white pepper complexity. Comes in the distillery's signature blue bottle.","producer_note":"Steinhart Distillery in Arisaig, Nova Scotia, founded by Thomas Steinhart from a family distilling heritage in Germany, on a farm along the Northumberland Shore.","has_photo":true,"photo_credit":"https://westsidebeerwinespirits.com/product/steinhart-gin/"},{"id":2014,"name":"VALLEY OF MOTHER OF GOD","category":"GIN - CANADA","price":"9","origin":"London, Ontario, Canada","abv":"43%","tasting_notes":"A balanced, complex modern-classic dry gin led by wild juniper; the Maplewood Smoked version adds a gentle, subtly sweet wood smoke, like a walk in a maple forest with a campfire in the distance.","producer_note":"Foxglove Spirits, a small Ontario producer whose farm is about an hour north of Toronto; the Wild Juniper Dry Gin is distilled in London, Ontario, and the Maplewood Smoked version uses Ottawa Valley juniper hand-smoked over maplewood.","has_photo":true,"photo_credit":"https://sidecar.ltd/ginmenu"},{"id":3001,"name":"NIKKA COFFEY GIN","category":"GIN - JAPAN","price":"9","origin":"Japan","abv":"47%","tasting_notes":"Bright and zesty: Japanese citrus like yuzu, kabosu and amanatsu over classic juniper, with a creamy, almost oily body and a tangy green-pepper (sansho) tingle on the finish.","producer_note":"Nikka Whisky Distilling Co., made at its Miyagikyo distillery on rare Coffey stills in use since 1963; the base is corn and malted barley rather than neutral spirit.","has_photo":true,"photo_credit":"https://www.vinalia.mc (Vinalia)"},{"id":3002,"name":"ROKU GIN","category":"GIN - JAPAN","price":"9","origin":"Japan","abv":"43%","tasting_notes":"Elegant and layered: bright yuzu citrus and cherry-blossom floral notes up front, a savoury green-tea depth in the middle, and a gentle peppery tingle from sansho on the finish. Silky and never harsh.","producer_note":"House of Suntory (founded 1899), made at its Osaka atelier where each of the 14 botanicals is distilled separately; 'Roku' means six, for the six seasonal Japanese botanicals (sakura flower and leaf, yuzu, sencha, gyokuro, sansho).","has_photo":true,"photo_credit":"https://www.tropheesdubar.com/"},{"id":4001,"name":"AGUA SANTA","category":"MEZCAL","price":"11","origin":"Santiago Matatlán, Oaxaca, Mexico","abv":"42%","tasting_notes":"Joven made from 100% Espadín agave. Smoky yet smooth, with citrus and herbal notes; clean enough for cocktails or sipping.","producer_note":"Founded by Carmen Marron, a Mexican entrepreneur based in Toronto; artisanal pit-roasted and tahona-crushed, open-air fermented.","has_photo":true,"photo_credit":"https://mezcalaguasanta.com/new-expressions.php"},{"id":4002,"name":"AGUA SANTA PECHUGA","category":"MEZCAL","price":"16","origin":"Oaxaca, Mexico","abv":"","tasting_notes":"","producer_note":"Same producer as Agua Santa (Carmen Marron, Toronto-based). ABV and tasting notes for the Pechuga expression could not be verified from any published source.","has_photo":true,"photo_credit":"https://www.legacyliquorstore.com/LL/product/spirits/tequila-mezcal/mezcal/agua-santa-pechuga-mezcal-1-x-750ml"},{"id":4003,"name":"ALACRAN","category":"MEZCAL","price":"11","origin":"Oaxaca, Mexico","abv":"46%","tasting_notes":"Joven made from 100% Espadín. Smooth and smoky with a hint of ripe fruit; bold and herbaceous on the nose.","producer_note":"Led by owner-founder Douglas French, a master distiller, with master distillers Elsa Arguelles Sanchez and Erika Aquino Aguilar; made traditionally in Oaxaca with no additives.","has_photo":true,"photo_credit":"https://www.elpalaciodehierro.com/alacran-mezcal-alacran-36-750-ml-37599094.html"},{"id":4004,"name":"ALIPUS STA. ANA DEL RIO","category":"MEZCAL","price":"11","origin":"Santa Ana del Río, Oaxaca, Mexico","abv":"47.9%","tasting_notes":"Joven made from 100% Espadín. Mineral and herbal with a long finish; aromas of toasted seeds, citrus and rosemary. Big and savory, full-bodied style.","producer_note":"Alipús began in 1999 as a project with Los Danzantes distillery to map how each Oaxacan village's soil, water and climate shapes its mezcal; made by the Hernández Melchor family.","has_photo":true,"photo_credit":"Shopify-hosted retailer (source page not captured)"},{"id":4005,"name":"ALIPUS SAN JUAN","category":"MEZCAL","price":"11","origin":"San Juan del Río, Oaxaca, Mexico","abv":"47-49%","tasting_notes":"Joven made from 100% Espadín. The most elegant and delicate of the Alipús line: floral, a kiss of sweetness, minty notes and very soft, well-integrated smoke.","producer_note":"Alipús (founded 1999 with Los Danzantes) bottles village-specific mezcals; this one made by the Antonio Juan family in San Juan del Río.","has_photo":true,"photo_credit":"https://www.walmart.com.mx/ip/mezcal-alipus-san-juan-100-750-ml-alipus-mezcal/00750300231124"},{"id":4006,"name":"AMARAS VERDE","category":"MEZCAL","price":"11","origin":"Tlacolula, Oaxaca, Mexico","abv":"40%","tasting_notes":"Joven made from 100% Espadín, pit-roasted with three woods (ocote pine, oak and peppertree). Bright and tangy: charred orange and grapefruit, tamarind and fresh ginger, with dark chocolate and earthy tobacco on the finish. (Some sources list 42%.)","producer_note":"Mezcal Amarás (Amores in the US), founded 2010 by Santiago Suarez and Luis Niño de Rivera; runs a sustainability program planting ten new agaves for every one harvested.","has_photo":true,"photo_credit":"https://mezcalamaras.com/"},{"id":4007,"name":"ANTIDOTO \"CUISHE\"","category":"MEZCAL","price":"20","origin":"Mexico","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"https://www.suburbia.com.mx/tienda/pdp/mezcal-antidoto-madrecuishe-joven-750-ml/1153661151"},{"id":4008,"name":"ANTIDOTO \"ESPADIN\"","category":"MEZCAL","price":"12","origin":"Mexico","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"El Palacio de Hierro mezcal category page"},{"id":4009,"name":"ANTIDOTO \"TEPEZTATE\"","category":"MEZCAL","price":"20","origin":"Mexico","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"https://thewiseolddog.com/products/antidoto-tepezate-tripas-de-maguey-25-year-mezcal"},{"id":4010,"name":"ANTIDOTO \"TOBALA\"","category":"MEZCAL","price":"24","origin":"Mexico","abv":"","tasting_notes":"","producer_note":"","has_photo":false,"photo_credit":""},{"id":4011,"name":"BANHEZ ESPADIN & BARRIL","category":"MEZCAL","price":"11","origin":"San Miguel Ejutla, Oaxaca, Mexico","abv":"42%","tasting_notes":"Joven ensamble of 90% Espadín and 10% Barril. Mild, floral and fruity: pineapple and banana with notes of lime and pepper; easy sipping, great for cocktails.","producer_note":"Made by a cooperative of 36+ families (Integradora Comercial de Ejutla) in San Miguel Ejutla; sustainable, fair-trade production for nearly two centuries.","has_photo":true,"photo_credit":"https://www.casa-agave.com/shop/mezcals/banhez-ensamble-mezcal/"},{"id":4012,"name":"BOZAL \"MEXICANO/BARRIL/ESPADIN\"","category":"MEZCAL","price":"15","origin":"Oaxaca, Mexico","abv":"47%","tasting_notes":"Ensamble of cultivated Espadín plus wild Barril and Mexicano agaves. Herbaceous with hay, citrus and floral notes, a slight smokiness, and a warm, rich finish from the Mexicano.","producer_note":"Bozal (Spanish for 'wild/untamed') sources from mezcaleros in Miahuatlán and Etla; each lot reflects the individual producer's terroir.","has_photo":true,"photo_credit":"Shopify-hosted retailer (source page not captured)"},{"id":4013,"name":"DE LEYENDAS PUEBLA","category":"MEZCAL","price":"16","origin":"Puebla, Mexico","abv":"48%","tasting_notes":"Made from 100% Tobalá (wild, tiny agave needing up to 15 years to mature). Very dry with grape-leaf (dolmas) and lightly bitter notes; floral and savory.","producer_note":"Mezcales de Leyenda works with one master producer per region across Mexico's mezcal states, championing fair trade and agave sustainability since 2006.","has_photo":true,"photo_credit":"https://www.wine.com/product/mezcales-de-leyenda-puebla-mezcal/541979"},{"id":4014,"name":"DE LEYENDAS OAXACA","category":"MEZCAL","price":"11","origin":"San Juan del Río, Oaxaca, Mexico","abv":"42%","tasting_notes":"Joven made from 100% Espadín, double distilled in copper pots. Herbal aromas of lemongrass with sweet cane-syrup notes; flavors of citrus confit, cooked agave and herbs.","producer_note":"Mezcales de Leyenda (from the producer's own Oaxaca page): sources regional mezcals from local maestro mezcaleros with fair-trade practices.","has_photo":true,"photo_credit":"https://applejack.com/Leyendas-Mezcal-Oaxaca-Espadin-750-ml"},{"id":4015,"name":"DE LEYENDAS MAGUEY ESPADIN","category":"MEZCAL","price":"12","origin":"San Juan del Río, Oaxaca, Mexico","abv":"42%","tasting_notes":"Joven made from 100% Espadín, double distilled in copper pots. Herbal aromas of lemongrass with sweet cane-syrup notes; flavors of citrus confit, cooked agave and herbs.","producer_note":"Mezcales de Leyenda regional mezcal from Oaxaca. Note: no separate 'Maguey Espadin' bottling could be verified; details mirror the brand's verified De Leyendas Oaxaca Espadín, which may be the same product.","has_photo":true,"photo_credit":"https://lucacollections.com.au/pages/shipping-1"},{"id":4016,"name":"DEL MAGUEY VIDA","category":"MEZCAL","price":"10","origin":"San Luis del Rio, Oaxaca, Mexico","abv":"42%","tasting_notes":"Espadin agave. Bright fruit, honey and vanilla on the nose; ginger, cinnamon, sandalwood, banana and tangerine on the palate with roasted agave and a long, soft finish. The most mixable of the Del Maguey range.","producer_note":"Del Maguey's entry-level single-village mezcal (launched 2010), made by palenqueros Paciano Cruz Nolasco and Marcos Cruz Mendez; twice distilled in wood-fired riverside copper stills.","has_photo":true,"photo_credit":"https://caskcartel.com/products/del-maguey-vida-single-village-de-puebla-limited-edition-mezcal"},{"id":4017,"name":"DEL MAGUEY LAS MILPAS","category":"MEZCAL","price":"16","origin":"Las Milpas, Oaxaca, Mexico","abv":"46%","tasting_notes":"Espadin agave. Fresh and zesty with tropical fruit, citrus and sweet corn, plus lavender and green agave character; a stony, almost salty undertone from the granite hillside oven.","producer_note":"Single-village mezcal by palenquero Anastacio Cruz Antonio and his sons Rigoberto, Abel and Pedro; ripe Espadin is roasted in an earthen horno carved directly into a granite hillside.","has_photo":true,"photo_credit":"https://www.whiskybrother.com/products/del-maguey-las-milpas-mezcal"},{"id":4018,"name":"DEL MAGUEY MINERO","category":"MEZCAL","price":"16","origin":"Santa Catarina Minas, Oaxaca, Mexico","abv":"50%","tasting_notes":"Espadin agave. Soft yet powerful: baked fruit and cocoa with a signature minerality; deep and warm, sweet all the way to a long, dry finish.","producer_note":"Ancestral-style mezcal by the Carlos Sarmiento family, hand-milled and double-distilled in clay stills with bamboo tubing.","has_photo":true,"photo_credit":"https://nightowlexpress.hk/collections/tequila-mezcal/products/del-maguey-minero"},{"id":4019,"name":"DEL MAGUEY WILD JABALI","category":"MEZCAL","price":"28","origin":"Santa Maria Albarradas, Oaxaca, Mexico","abv":"47%","tasting_notes":"Rare wild Jabali agave (A. convallis). Fresh figs, baked apples, star anise and a hint of parmesan rind on the nose; bright acidity with sweet violets, tarragon and a light sandalwood finish.","producer_note":"By Rogelio Martinez Cruz and Leopoldino Miranda; Jabali is notoriously hard to work with - its saponins make it foam at every step of production.","has_photo":true,"photo_credit":"http://www.bittersandbottles.com/products/del-maguey-wild-jabali-mezcal"},{"id":4020,"name":"DOS HOMBRES ESPADIN","category":"MEZCAL","price":"12","origin":"San Luis del Rio, Oaxaca, Mexico","abv":"42%","tasting_notes":"Espadin agave. Smooth and fruit-forward: green apple, mango and citrus with caramelized agave, light smoke and a soft, slightly sweet finish.","producer_note":"Brand founded by actors Bryan Cranston and Aaron Paul (Breaking Bad); made by third-generation mezcalero Gregorio Velasco Luis.","has_photo":true,"photo_credit":"https://whiskeyd.com/collections/joven-blanco-mezcal/products/buy-dos-hombres-mezcal-espadin"},{"id":4021,"name":"EL DESTILADO BARRIL","category":"MEZCAL","price":"25","origin":"Oaxaca, Mexico","abv":"","tasting_notes":"A blend of wild Barril (a tall Karwinskii agave) and Espadin. Piney and resinous with citrus, honey and stony minerality; bottled without dilution, so full-flavored.","producer_note":"Independent bottling by El Destilado, the London indie bottler (founders of Sager + Wilde and East London Liquor Co.) releasing small-batch agave distillates from independent Mexican producers outside the mezcal DO.","has_photo":true,"photo_credit":"https://youshuchiga.shop-pro.jp/?pid=162890202"},{"id":4022,"name":"EL DESTILADO PAPALOME","category":"MEZCAL","price":"25","origin":"Oaxaca, Mexico","abv":"","tasting_notes":"Made from Papalome agave (A. cupreata). Described by El Destilado's co-founder as a fruit-driven distillate.","producer_note":"Bottled by El Destilado from a producer named Armando; part of the London indie bottler's range of non-certified agave distillates.","has_photo":true,"photo_credit":"gotomexico.today (source page not captured)"},{"id":4023,"name":"EL DESTILADO SIERRA NEGRA","category":"MEZCAL","price":"25","origin":"Santa Catarina Albarradas, Oaxaca, Mexico","abv":"","tasting_notes":"Sierra Negra agave, a slow-maturing variety taking 12-25 years. Carefully cooked to keep smoke low, giving a delicate spirit with a lanolin, sheep's-wool character.","producer_note":"By Alberto Martinez in Santa Catarina Albarradas, Oaxaca; distilled in clay pots in the ancestral style.","has_photo":true,"photo_credit":"https://www.masterofmalt.com/distilleries/el-destilado/"},{"id":4024,"name":"EL DESTILADO TEPEXTATE","category":"MEZCAL","price":"30","origin":"Oaxaca, Mexico","abv":"","tasting_notes":"Wild Tepextate agave (A. marmorata), which grows on rocky mountain cliffs. Deep and complex, with fruity notes and a hint of spice.","producer_note":"Bottled by El Destilado; the producer for this vintage could not be verified.","has_photo":true,"photo_credit":"https://www.masterofmalt.com/spirit/el-destilado/el-destilado-tepextate-48-9-spirit/"},{"id":4025,"name":"EL DESTILADO TOBAZICHE","category":"MEZCAL","price":"30","origin":"Oaxaca, Mexico","abv":"","tasting_notes":"From the tall, palm-like Tobaziche (A. karwinskii). Piney and resinous with a pineapple-and-pine-nut nose and a very long, complex finish.","producer_note":"Bottled by El Destilado from a producer named Pedro; part of the London indie bottler's non-certified agave distillate range.","has_photo":true,"photo_credit":"Master of Malt CDN (source page not captured)"},{"id":4026,"name":"EL DESTILADO PIZORRA","category":"MEZCAL","price":"30","origin":"Puebla, Mexico","abv":"","tasting_notes":"Wild-harvested Pizorra agave (A. marmorata) from the Mixteca Poblana region - a smaller relative of Tepextate.","producer_note":"Bottled by El Destilado; the producer for this vintage could not be verified.","has_photo":false,"photo_credit":""},{"id":4027,"name":"EL DESTILADO MEXICANO","category":"MEZCAL","price":"25","origin":"Oaxaca, Mexico","abv":"","tasting_notes":"Mexicano agave (A. rhodacantha). A powerful style - herbaceous and earthy with a long, lingering finish.","producer_note":"Bottled by El Destilado; the producer for this vintage could not be verified.","has_photo":true,"photo_credit":"thewhiskyexchange.com"},{"id":4028,"name":"EL DESTILADO PIERNA DE BORREGO","category":"MEZCAL","price":"30","origin":"Oaxaca, Mexico","abv":"","tasting_notes":"","producer_note":"A rare El Destilado bottling listed on UK bar menus; agave variety, ABV and vintage details could not be verified.","has_photo":false,"photo_credit":""},{"id":4029,"name":"EL JOLGORIO TOBALA","category":"MEZCAL","price":"25","origin":"Santiago Matatlan, Oaxaca, Mexico","abv":"47%","tasting_notes":"Wild/semi-wild Tobala agave (A. potatorum), harvested at 12 years. Bright and floral with an almost perfume-like character, herbal and fruity with gentle smoke.","producer_note":"By mezcalero Gregorio Martinez Jarquin; El Jolgorio bottles wild and semi-wild agave mezcals in numbered editions, twice distilled in copper pot stills.","has_photo":false,"photo_credit":""},{"id":4030,"name":"EL JOLGORIO CUISHE","category":"MEZCAL","price":"25","origin":"Santiago Matatlan, Oaxaca, Mexico","abv":"47%","tasting_notes":"Wild Cuishe agave (A. karwinskii), harvested at 13 years. Bright and herbaceous - roasted agave, mint, citrus and smoke with a long, mineral finish.","producer_note":"By mezcalero Gregorio Martinez Jarquin; Cuishe's tall single stalk makes it difficult to work with, giving an intense spirit.","has_photo":true,"photo_credit":"keg-n-bottle (cdn.shopify.com)"},{"id":4031,"name":"EL SILENCIO","category":"MEZCAL","price":"12","origin":"San Baltazar, Oaxaca, Mexico","abv":"43%","tasting_notes":"Made from 100% Espadín agave; soft and lightly smoky with roasted agave, hints of dark chocolate, honey, and cherry on a long, smooth finish.","producer_note":"Small-batch Espadín made in San Baltazar by master mezcalero Pedro Hernandez for Casa Silencio; the matte-black bottle is inspired by Oaxacan barro negro pottery.","has_photo":true,"photo_credit":"caskcartel.com"},{"id":4032,"name":"ESTANCIA RAICILLA","category":"MEZCAL","price":"14","origin":"La Estancia de Landeros, Jalisco, Mexico","abv":"45%","tasting_notes":"Distilled from Maximiliana agave; fragrant and floral with citrus, pear, and plum over herbal, botanical notes — livelier and less smoky than mezcal.","producer_note":"A raicilla (Jalisco agave spirit, not mezcal) founded by Rio Chenery and made with maestro raicillero Alfredo Salvatierra in the Sierra Madre Occidental highlands.","has_photo":true,"photo_credit":"reservastequila.com"},{"id":4033,"name":"ILEGAL ESPADIN","category":"MEZCAL","price":"10","origin":"Santiago Matatlan, Oaxaca, Mexico","abv":"40%","tasting_notes":"Signature eucalyptus-tinged smoke with green apple, citrus, pear, and a touch of red chili pepper; smooth, lightly smoky, and versatile for sipping or cocktails.","producer_note":"Made with 100% Espadín by fourth-generation mezcaleros Alvaro Hernandez, Armando Hernandez Lorenzo, and Eric Hernandez at Palenque Mal de Amor; the brand began as a smuggling operation from Mexico to a Guatemalan bar in 2004 and went legal in 2006.","has_photo":true,"photo_credit":"saq.com"},{"id":4034,"name":"LA SERPIENTE TOBALA","category":"MEZCAL","price":"18","origin":"Mexico","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"saq.com"},{"id":4035,"name":"MADRE ENSAMBLE ESPADIN Y CUISHE","category":"MEZCAL","price":"14","origin":"San Dionisio Ocotepec, Oaxaca, Mexico","abv":"45%","tasting_notes":"A blend of Espadín and wild Cuishe agave; roasted agave sweetness with herbal notes of sage and dill, chalky minerals, and a gentle, well-integrated smoke with a floral finish.","producer_note":"Produced by Jose Garcia Morales and his family at their ranch in the Oaxacan Sierra, a Zapotec recipe blending mostly estate Espadín with wild Cuishe from the Miahuatlán region.","has_photo":true,"photo_credit":"keg-n-bottle (cdn.shopify.com)"},{"id":4036,"name":"MARCA NEGRA ESPADIN","category":"MEZCAL","price":"16","origin":"San Luis del Rio, Oaxaca, Mexico","abv":"51%","tasting_notes":"Smoky and punchy at 51% with roasted agave, ripe fruit, citrus, and spice on a creamy palate; long, sweet, and smoky finish.","producer_note":"Marca Negra ('black mark') was founded around 2011; this Espadín is made by mezcalero Jorge Méndez in San Luis del Río and bottled at a bold, near-natural strength.","has_photo":true,"photo_credit":"enotecadelfrate.it"},{"id":4037,"name":"MONTELOBOS ESPADIN","category":"MEZCAL","price":"12","origin":"Santiago Matatlan, Oaxaca, Mexico","abv":"43.2%","tasting_notes":"Green and vegetal with cooked agave, citrus zest, roasted pepper, fresh herbs, and a measured, gentle smokiness; smooth and balanced.","producer_note":"Created by agave biologist Iván Saldaña and produced in Santiago Matatlán from certified-organic Espadín; the brand is made with a focus on sustainability and community.","has_photo":true,"photo_credit":"swapnowus.com"},{"id":4038,"name":"PALENQUEROS: REY ABELLENES (ESPADIN/TABASICHE)","category":"MEZCAL","price":"30","origin":"Oaxaca, Mexico","abv":"","tasting_notes":"","producer_note":"Palenqueros is a line of single-palenque bottlings curated by La Maison du Whisky and Velier, bottled unadjusted at natural strength with the producing palenquero (here, Rey Abellenes) named on the label; a blend of Espadín and Tabasiche (Karwinskii family) agaves.","has_photo":false,"photo_credit":""},{"id":4039,"name":"PALENQUEROS: BALTAZAR CRUZ (TOBALA)","category":"MEZCAL","price":"20","origin":"San Juan del Rio, Oaxaca, Mexico","abv":"49.5%","tasting_notes":"Delicate and refined for a Tobalá: white flowers, vanilla, and creamy silk on the palate with cracked white pepper and a savory, fresh finish.","producer_note":"Palenqueros is a line of single-palenque bottlings curated by La Maison du Whisky and Velier, bottled as found without adjustment; this wild Tobalá was made by palenquero Baltazar Cruz of San Juan del Río.","has_photo":true,"photo_credit":"saq.com"},{"id":4040,"name":"PROFESOR COYOTE","category":"MEZCAL","price":"15","origin":"Mexico","abv":"","tasting_notes":"","producer_note":"","has_photo":false,"photo_credit":""},{"id":4041,"name":"PROFESOR ENSAMBLE","category":"MEZCAL","price":"15","origin":"Mexico","abv":"","tasting_notes":"","producer_note":"","has_photo":false,"photo_credit":""},{"id":4042,"name":"PROFESOR PECHUGA","category":"MEZCAL","price":"15","origin":"Mexico","abv":"","tasting_notes":"","producer_note":"","has_photo":false,"photo_credit":""},{"id":4043,"name":"PROFESOR SAN DIONISIO OCOTEPEC ESPADIN","category":"MEZCAL","price":"9","origin":"San Dionisio Ocotepec, Oaxaca, Mexico","abv":"","tasting_notes":"","producer_note":"","has_photo":false,"photo_credit":""},{"id":4044,"name":"PROFESOR SAN JUAN DEL RIO ESPADIN","category":"MEZCAL","price":"9","origin":"San Juan del Rio, Oaxaca, Mexico","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"profesormezcal.com"},{"id":4045,"name":"SIETE MISTERIOS DOBA-YEJ","category":"MEZCAL","price":"12","origin":"Oaxaca, Mexico","abv":"44%","tasting_notes":"100% Espadín agave, copper-distilled for a cleaner, more approachable style; bright citrus, roasted agave, green herbs, and gentle smoke.","producer_note":"Made by brothers Julio and Eduardo Mestre, who work with independent mezcaleros across Oaxaca; 'Doba-Yej' is the Zapotec word for Espadín.","has_photo":true,"photo_credit":"latitudewine.co.uk"},{"id":4046,"name":"SOMBRA","category":"MEZCAL","price":"11","origin":"Santiago Matatlán, Oaxaca, Mexico","abv":"45%","tasting_notes":"A 100% Espadín mezcal. Smoky but balanced, with citrus zest, black pepper, roasted sweet corn and a gentle honeyed sweetness underneath; an approachable, bartender-favorite sipper.","producer_note":"Founded by sommelier Richard Betts in 2006 and distilled at its own palenque in Santiago Matatlán using organic espadín, a solar-powered tahona mill and rainwater; spent agave fibers are upcycled into adobe bricks for homes in Mexico.","has_photo":true,"photo_credit":"sandstrompartners.com"},{"id":4047,"name":"THE LOST EXPLORER ESPADIN","category":"MEZCAL","price":"22","origin":"San Pablo Huixtepec, Oaxaca, Mexico","abv":"42%","tasting_notes":"A 100% Espadín mezcal. Sweet and herbaceous with fresh-cut agave, red apple and ripe pear, light mesquite smoke and green herbs; clean, gentle and easy-drinking.","producer_note":"Made by maestro mezcalero Don Fortino Ramos (with his daughter Xitlali) from 8-year-old espadín; the distillery roasts much of the agave in brick ovens and runs partly on solar power, bottling at the strength Ramos prefers.","has_photo":true,"photo_credit":"thedistiller.gr"},{"id":4048,"name":"TRIBAL ENSAMBLE","category":"MEZCAL","price":"10","origin":"Oaxaca, Mexico","abv":"46%","tasting_notes":"A joven ensamble blending several agave varieties. Bright and citrusy — grapefruit, orange peel and pineapple with a light smokiness and a mineral, clay-earth finish.","producer_note":"A family company founded by Chef Andrea Serra and Engineer Bernardo González, made in Oaxaca with master mezcaleros José Diaz and Cipriano Hernandez using stone-pit roasting, tahona grinding and double copper distillation; named Best Mezcal at the 2016 San Francisco World Spirits Competition.","has_photo":true,"photo_credit":"realliquor1.com"},{"id":4049,"name":"UNION MEZCAL UNO ESPADIN Y CIRIAL","category":"MEZCAL","price":"13","origin":"San Baltazar Guelavila, Oaxaca, Mexico","abv":"40%","tasting_notes":"A joven blend of farmed Espadín and wild Cirial agave. Soft and balanced — sweet citrus, ripe pear and tropical fruit with restrained smoke and a herbal, mineral edge from the cirial; built for mixing.","producer_note":"A cooperative brand sourcing from 50+ mezcalero families across Oaxaca, built around fair wages and traditional methods; scored 92 points from Wine Enthusiast.","has_photo":true,"photo_credit":"toppersdrinks.co.uk"},{"id":4050,"name":"YUU BAAL REPOSADO","category":"MEZCAL","price":"22","origin":"San Juan del Río, Oaxaca, Mexico","abv":"40%","tasting_notes":"Made from Espadín agave and rested 6 months in used American white oak. Soft and smooth with toffee, vanilla and roasted agave, light smoke and a hint of caramel; a great entry point to aged mezcal.","producer_note":"Part of the Grupo Yuu Baal cooperative of Oaxacan producers; the reposado and añejo are made by mezcalero Isaías Martínez Juan in San Juan del Río ('Yuu Baal' means earth and fire in Zapotec).","has_photo":true,"photo_credit":"caskcartel.com"},{"id":4051,"name":"YUU BAAL ANEJO","category":"MEZCAL","price":"25","origin":"San Juan del Río, Oaxaca, Mexico","abv":"40%","tasting_notes":"Made from Espadín agave and aged 12 months in used American white oak. Full-bodied and golden with dried fruit, warm wood and vanilla, finishing with lightly smoked wood.","producer_note":"Grupo Yuu Baal is a 100% Mexican-owned cooperative working with mezcaleros in San Juan del Río and other Oaxacan villages; the añejo is made by mezcalero Isaías Martínez Juan.","has_photo":true,"photo_credit":"https://www.liquoronbroadway.com/products/yuu-baal-anejo"},{"id":4052,"name":"YUU BAAL TEPEXTATE","category":"MEZCAL","price":"30","origin":"Oaxaca, Mexico","abv":"46%","tasting_notes":"A wild Tepeztate agave mezcal. Herbal and elegant — wild plants and flowers, black pepper, roasted agave and scorched earth with a sweet agave perfume on the finish.","producer_note":"Grupo Yuu Baal is a 100% Mexican-owned cooperative highlighting native Oaxacan producers and their wild agaves (tepeztate takes 25–30 years to mature in the wild).","has_photo":true,"photo_credit":"https://www.oldtowntequila.com/yuu-baal-joven-tepeztate-mezcal/"},{"id":4053,"name":"YUU BAAL MADREQUIXE","category":"MEZCAL","price":"33","origin":"Santa María La Pila, Oaxaca, Mexico","abv":"48%","tasting_notes":"A wild Madrecuixe (Karwinskii) agave mezcal. Intensely herbal and mineral — green vegetation, wet earth, dark cherry and pear with a cigar-like smokiness and full texture.","producer_note":"Made by master mezcalero Alberto Ortiz in Santa María La Pila for the Grupo Yuu Baal cooperative, fermented with wild yeast and roasted in stone ovens.","has_photo":true,"photo_credit":"https://www.reposadobar.ca/products/yuu-baal-madrecuixe-mezcal"},{"id":4054,"name":"YUU BAAL PECHUGA","category":"MEZCAL","price":"20","origin":"Oaxaca, Mexico","abv":"48%","tasting_notes":"A traditional pechuga mezcal made from Espadín agave, distilled with a raw turkey breast and fresh fruit hung in the still. Bright and fruity — orange, pineapple, mango and anise — with a savory-sweet finish and a velvety character.","producer_note":"Grupo Yuu Baal is a 100% Mexican-owned cooperative of Oaxacan mezcaleros; pechuga is traditionally reserved for grand occasions such as baptisms and weddings.","has_photo":true,"photo_credit":"https://vsliquor.com/products/yuu-baal-pechuga-joven-mezcal-750ml"},{"id":4055,"name":"YUU BAAL TOBALA","category":"MEZCAL","price":"23","origin":"Oaxaca, Mexico","abv":"46%","tasting_notes":"A wild Tobalá agave mezcal. Elegant and aromatic — wild flowers, lemongrass, peach, apple, vanilla and clove over earthy stone and light smoke, finishing peppery.","producer_note":"Grupo Yuu Baal is a 100% Mexican-owned cooperative working with native Oaxacan producers; tobalá is a small wild agave prized as one of the most coveted and complex mezcal agaves.","has_photo":true,"photo_credit":"https://ludwigsfinewine.com/products/yuu-baal-tobala-750-ml"},{"id":5001,"name":"ATAMAN VERMUT","category":"VERMOUTH RED/ROJO","price":"14","origin":"Spain","abv":"17%","tasting_notes":"Rich and deeply herbal with a bold, bitter bite — dark cherry and cocoa layered over nutty, salty sherry notes, with a long, punchy finish.","producer_note":"Barbadillo, a family sherry house in Sanlúcar de Barrameda, revived its 1940s recipe with a small dose of vermouth stock aged since the 1970s.","has_photo":true,"photo_credit":"https://worldwine.com.au/collections/tsa/products/barbadillo-ataman-vermut-de-manzanilla-500ml-nv"},{"id":5002,"name":"BARALE FRATELLI BAROLO CHINATO (1oz)","category":"VERMOUTH RED/ROJO","price":"14","origin":"Italy (Piedmont)","abv":"17%","tasting_notes":"Like Barolo dressed in cola, orange peel and baking spice — rich and velvety up front, with a long, warming, pleasantly bitter grip.","producer_note":"Fratelli Barale has been a respected Barolo producer in Piedmont for around 150 years.","has_photo":true,"photo_credit":"https://www.baralefratelli.it/"},{"id":5003,"name":"BERTO ROSSO DA TRAVAJ","category":"VERMOUTH RED/ROJO","price":"10","origin":"Italy (Piedmont)","abv":"17%","tasting_notes":"Zesty orange peel and warm spice over a bittersweet base of wormwood and rhubarb — bright, bitter and made for aperitivo hour.","producer_note":"Bèrto (Distilleria Quaglia), a family distillery in Castelnuovo Don Bosco, Piedmont, works from a vermouth recipe dating to the 1930s.","has_photo":true,"photo_credit":"https://galadeux.com/shop/"},{"id":5004,"name":"BOTTEGA VERMOUTH ROSSO","category":"VERMOUTH RED/ROJO","price":"8","origin":"Italy","abv":"16%","tasting_notes":"Velvety and smooth with vanilla, cinnamon and a herbal, almost radicchio-like edge — sweet up front with a balancing bitter note.","producer_note":"Bottega S.p.A., a Venetian house better known for Prosecco, blends Merlot with an extract of 30+ botanicals.","has_photo":true,"photo_credit":"Best Brands Peru (bestbrands.com.pe)"},{"id":5005,"name":"CARLO ALBERTO VERMOUTH DI TORINO","category":"VERMOUTH RED/ROJO","price":"12","origin":"Italy (Piedmont)","abv":"18%","tasting_notes":"Bright cherry, rose and vanilla lead into a smooth, bittersweet palate of burnt caramel, cinnamon bark and clove.","producer_note":"Riserva Carlo Alberto has made vermouth in Turin since 1837, said to be created for King Carlo Alberto.","has_photo":true,"photo_credit":"londonwinecompetition.com"},{"id":5006,"name":"CARPANO ANTICA FORMULA","category":"VERMOUTH RED/ROJO","price":"10","origin":"Italy","abv":"16.5%","tasting_notes":"Rich, full and velvety — big vanilla, dried fruit and cocoa with bitter orange and a warm, spiced, gently bitter finish.","producer_note":"Antonio Benedetto Carpano invented modern vermouth in Turin in 1786; today it is made by Fratelli Branca.","has_photo":true,"photo_credit":"Taster's Club (tastersclub.com)"},{"id":5007,"name":"CASA MARIOL VERMUT NEGRE","category":"VERMOUTH RED/ROJO","price":"8","origin":"Spain (Catalonia)","abv":"15%","tasting_notes":"Dark and spicy with stewed fruit, cinnamon and vanilla — like fruit pie with a cola-and-nutty edge and a gently bitter, caramel finish.","producer_note":"Casa Mariol is the Vaquer family's artisan winery in Terra Alta, making wine and vermouth for nearly a century from Macabeu grapes, green walnuts and 150+ botanicals.","has_photo":true,"photo_credit":"LQRS (media.lqrs.com)"},{"id":5008,"name":"CASAL FARNETTO VERMOUTH ROSSO","category":"VERMOUTH RED/ROJO","price":"13","origin":"","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"https://shop.casalfarneto.it/"},{"id":5009,"name":"CIVICO 10 VERMOUTH","category":"VERMOUTH RED/ROJO","price":"12","origin":"Italy (Piedmont)","abv":"18%","tasting_notes":"Bright citrus and red fruit over a rich, velvety palate — a touch tannic, with bitter orange and a long, pleasantly sweet finish.","producer_note":"Distilleria Sibona of Piobesi d'Alba, Piedmont — Civico 10 is the distillery's own street address — builds it on Nebbiolo d'Alba DOC with 22 botanicals.","has_photo":true,"photo_credit":"LCBO"},{"id":5010,"name":"COCCHI STORICO VERMOUTH","category":"VERMOUTH RED/ROJO","price":"8","origin":"Italy (Piedmont)","abv":"16%","tasting_notes":"Bittersweet and full — candied orange, cherry and vanilla with cocoa and a cool, herbal edge; the classic red-vermouth benchmark for a Manhattan.","producer_note":"Giulio Cocchi founded his aperitif house in Asti in 1891; the Bava family has owned it since 1978.","has_photo":true,"photo_credit":"cdn.shopify.com merchant image"},{"id":5011,"name":"COCCHI VINO CHINATO","category":"VERMOUTH RED/ROJO","price":"8","origin":"Italy (Piedmont)","abv":"","tasting_notes":"","producer_note":"Giulio Cocchi founded his aperitif house in Asti in 1891; the Bava family has owned it since 1978.","has_photo":true,"photo_credit":"https://vinearts.ca/products/cocchi-barolo-chinato"},{"id":5012,"name":"COCCHI DOPO TEATRO VERMOUTH","category":"VERMOUTH RED/ROJO","price":"9","origin":"Italy (Piedmont)","abv":"16%","tasting_notes":"Cocchi's bitter 'evening' vermouth — dark cherry and cocoa up front, then a firm, amaro-like bitterness of gentian and cinchona; excellent with whiskey.","producer_note":"Named for Turin's after-the-theatre drinking hour, Cocchi's 'vermouth amaro' starts from its classic rosso with a double dose of cinchona bark.","has_photo":true,"photo_credit":"San Lorenzo Enoteca (sanlorenzoenoteca.it)"},{"id":5013,"name":"COCCHI BAROLO CHINATO (1oz)","category":"VERMOUTH RED/ROJO","price":"14","origin":"Italy (Piedmont)","abv":"16.5%","tasting_notes":"Barolo wine steeped in quinine bark and spice — rich black cherry and cocoa with orange peel and a long, warming bittersweet finish; the classic after-dinner sip with dark chocolate.","producer_note":"Cocchi has made Barolo Chinato to Giulio Cocchi's original 1891 recipe.","has_photo":true,"photo_credit":"https://barrelshoppe.com/products/barolo-chinato"},{"id":5014,"name":"COCCHI BAROLO CHINATO 2016 (1oz)","category":"VERMOUTH RED/ROJO","price":"24","origin":"Italy (Piedmont)","abv":"18%","tasting_notes":"A rare single-vintage chinato, deeper and stronger than the classic — dried roses, cocoa and tobacco over dark berries and velvet tannins, finishing on bitter chocolate.","producer_note":"Cocchi's 130th-anniversary 'Tipo Esportazione' release: a single 2016 Barolo vineyard in Castiglione Falletto, bottled from one cask.","has_photo":true,"photo_credit":"Shop Lightspeed merchant (cdn.shoplightspeed.com)"},{"id":5015,"name":"CUEVA NEUVA VERMUT","category":"VERMOUTH RED/ROJO","price":"9","origin":"Spain","abv":"","tasting_notes":"","producer_note":"A young Spanish vermut label co-founded by David Neimanis and Phi Peinado, currently available in Spain.","has_photo":true,"photo_credit":"Good Wine Good People (goodwinegoodpeople.com)"},{"id":5016,"name":"DEL PROFESSORE CLASSICO TRADIZIONALE","category":"VERMOUTH RED/ROJO","price":"10","origin":"Italy (Piedmont)","abv":"18%","tasting_notes":"Warm and herbal with balsam, mint and orange zest over vanilla — a bittersweet, almost medicinal vermouth lifted by ginger and citrus.","producer_note":"Del Professore was created by Roman bartender Leonardo Leuci as a tribute to Jerry Thomas, made in Piedmont with botanicals grown around the distillery.","has_photo":true,"photo_credit":"BevinGrosso (bevingrosso.it)"},{"id":5017,"name":"DEL PROFESSORE ROSSO DI TORINO","category":"VERMOUTH RED/ROJO","price":"10","origin":"Italy (Piedmont)","abv":"18%","tasting_notes":"Amber and balsamic — mint and citrus on the nose, soft and full with a warm, bittersweet finish of rhubarb and gentian.","producer_note":"Del Professore was created by Roman bartender Leonardo Leuci as a tribute to Jerry Thomas, made in Piedmont with botanicals grown around the distillery.","has_photo":true,"photo_credit":"i.blogs.es"},{"id":5018,"name":"DEL PROFESSORE ROSSO SUPERIORE","category":"VERMOUTH RED/ROJO","price":"13","origin":"Italy (Piedmont)","abv":"","tasting_notes":"","producer_note":"Del Professore was created by Roman bartender Leonardo Leuci as a tribute to Jerry Thomas, made in Piedmont with botanicals grown around the distillery.","has_photo":true,"photo_credit":"https://www.rebeshop.ro/cumpara/vermouth-superiore-del-professore-rosso-0-75l-3740"},{"id":5019,"name":"DOLIN VERMOUTH DE CHAMBERY","category":"VERMOUTH RED/ROJO","price":"8","origin":"France (Savoie)","abv":"16%","tasting_notes":"Light and fresh rather than syrupy — spiced fruit compote, prunes and walnuts with a clean herbal lift and a gently bitter finish; lets the whiskey shine in a Manhattan.","producer_note":"Dolin of Chambéry, Savoie, makes its vermouths to an unchanged historic recipe.","has_photo":true,"photo_credit":"Flask Fine Wines (flaskfinewines.com)"},{"id":5020,"name":"DORAGROSSA VERMOUTH DI TORINO","category":"VERMOUTH RED/ROJO","price":"12","origin":"Italy (Piedmont)","abv":"17%","tasting_notes":"Elegant and aromatic — absinthe and citrus up front, then ginger, cinnamon and orange, with a deep bitter backbone of chamomile, gentian and rhubarb rounded by vanilla.","producer_note":"Doragrossa Liquoristi & Distillatori, an artisan Italian liquorist and distiller.","has_photo":true,"photo_credit":"Premium Drinks (premiumdrinks.es)"},{"id":5021,"name":"ETNA VERMUT","category":"VERMOUTH RED/ROJO","price":"9","origin":"","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"https://www.baraitalienskaprodukter.se/aziende/scheda-6624.html"},{"id":5022,"name":"FALSET DES 1912","category":"VERMOUTH RED/ROJO","price":"9","origin":"Spain (Catalonia)","abv":"16%","tasting_notes":"Bright and fruit-driven — ripe berries and wild Mediterranean herbs with moderate sweetness and a light tannic grip.","producer_note":"From Agricola Falset Marçà, one of the historic 'wine cathedral' wineries of Montsant/Priorat.","has_photo":true,"photo_credit":"https://www.solwines.es/2024/05/vermuth-falset-negro-1912/"},{"id":5023,"name":"FERNANDO DE CASTILLA VERMUT","category":"VERMOUTH RED/ROJO","price":"9","origin":"Jerez, Spain","abv":"15%","tasting_notes":"Mahogany in colour with rich aromas of dried fruit, nuts and herbs; full-flavoured, silky and sweet with a characteristic refreshing bitter bite from the wormwood.","producer_note":"Bodegas Rey Fernando de Castilla of Jerez — reviving the sherry-vermouth tradition that died out in the 1960s, using old Pedro Ximénez and Oloroso with 27 botanicals.","has_photo":true,"photo_credit":"https://weinq.de/wein/43365877068/"},{"id":5024,"name":"FONTANAFREDDA BAROLO CHINATO (1oz)","category":"VERMOUTH RED/ROJO","price":"14","origin":"Piedmont, Italy","abv":"16.5%","tasting_notes":"Intensely aromatic with calisaya bark, cinnamon, cloves, nutmeg and herbs over Barolo red wine; smooth and round with a long bittersweet finish. Made for sipping after dinner.","producer_note":"Fontanafredda — the historic Barolo estate at Serralunga d'Alba, founded in 1858 on the former royal hunting grounds of King Vittorio Emanuele II.","has_photo":true,"photo_credit":"https://www.vino.com/en/dettaglio/barolo-chinato-le-righe-fontanafredda.html"},{"id":5025,"name":"FREDERIC BROUCA VERMOUTH","category":"VERMOUTH RED/ROJO","price":"9","origin":"","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"https://vinimondo.dk/collections/okologisk/products/domaine-frederic-brouca-vermouth"},{"id":5026,"name":"GANCIA VERMOUTH DI TORINO","category":"VERMOUTH RED/ROJO","price":"13","origin":"Canelli, Asti, Piedmont, Italy","abv":"16%","tasting_notes":"Rich notes of herbs and dry spice with bold red berries and gentle sweetness; fresh and fruity on the palate with a long, slightly bitter finish.","producer_note":"Fratelli Gancia — founded in Canelli in 1850 by Carlo Gancia, the man credited with creating Italy's first sparkling wine and producing Vermouth of Turin since the start.","has_photo":true,"photo_credit":"lqrs.com"},{"id":5027,"name":"GONZALES BYASS LA COPA RISERVA","category":"VERMOUTH RED/ROJO","price":"10","origin":"Jerez, Spain","abv":"","tasting_notes":"Cola-brown and generous; rich Pedro Ximénez sherry character with nuts, orange peel and dried fruit, prominent cinnamon and a long, gently bitter, nutty finish.","producer_note":"González Byass of Jerez — one of Spain's most historic sherry houses; the La Copa range revives a 19th-century vermouth recipe from their archives.","has_photo":true,"photo_credit":"https://www.conalco.de/Gonzalez-Byass-Vermouth-La-Copa-Reserva-0-75L-18-vol"},{"id":5028,"name":"GOTHA DOK'61","category":"VERMOUTH RED/ROJO","price":"13","origin":"","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"https://www.thewinecountry.com/gotha-dok-61-vermouth-italy.html"},{"id":5029,"name":"GUERRA VERMUT ROJO","category":"VERMOUTH RED/ROJO","price":"8","origin":"Bierzo, Spain","abv":"15%","tasting_notes":"Rich and spiced with chocolate, ripe fruit and warm spice; a savoury, artichoke-like edge keeps the sweetness in check — complex enough to sip on ice.","producer_note":"Vinos Guerra of Bierzo — a revival of the house's original 1879–1960s vermouth recipe, built on native Mencía and Godello with over 40 botanicals.","has_photo":true,"photo_credit":"vinotheek.be"},{"id":5030,"name":"GUERRA ROJO RISERVA","category":"VERMOUTH RED/ROJO","price":"14","origin":"Bierzo, Spain","abv":"","tasting_notes":"","producer_note":"Vinos Guerra of Bierzo — a revival of the house's original 1879–1960s vermouth recipe, built on native Mencía and Godello with over 40 botanicals.","has_photo":true,"photo_credit":"https://www.bodeboca.com/vino/vermouth-guerra-reserva-rojo-1l"},{"id":5031,"name":"LA BOTA VERMUT ROJO","category":"VERMOUTH RED/ROJO","price":"12","origin":"Jerez de la Frontera, Spain","abv":"17.5%","tasting_notes":"Made from young Oloroso with modest sweetness and an elegant bitterness; clean and complex with citrus standing out. Serve over ice with orange, or in a Manhattan.","producer_note":"Equipo Navazos — the sherry negociants behind the cult La Bota series, bottling rare cask finds in tiny numbered editions (this one around 2,000 bottles).","has_photo":true,"photo_credit":"https://www.vinissimus.com/es/vermut/la-bota-de-vermut-rojo-no-132/"},{"id":5032,"name":"LACUESTA VERMUT RISERVA","category":"VERMOUTH RED/ROJO","price":"10","origin":"La Rioja, Spain","abv":"","tasting_notes":"Deep and complex from long oak ageing; liquorice, cinnamon and ginger with an earthy, robust character — built for sipping over ice with an olive and lemon.","producer_note":"Martínez Lacuesta — the only vermouth house in La Rioja, making vermouth since 1937 from a secret botanical formula passed down through the Spanish Civil War.","has_photo":true,"photo_credit":"https://imbibemagazine.com/lacuesta-vermouth-reserva/"},{"id":5033,"name":"LES COUSINS DONZELL VERMUT","category":"VERMOUTH RED/ROJO","price":"9","origin":"Priorat, Catalunya, Spain","abv":"","tasting_notes":"","producer_note":"Les Cousins Marc & Adrià — a friends-and-family wine project in Priorat, made together with Joan Carbó.","has_photo":true,"photo_credit":"https://ultramarinoszurich.ch/product/les-cousins-vermouth/"},{"id":5034,"name":"NEBUR VERMOUTH","category":"VERMOUTH RED/ROJO","price":"10","origin":"","abv":"","tasting_notes":"","producer_note":"","has_photo":false,"photo_credit":""},{"id":5035,"name":"OSCAR 697","category":"VERMOUTH RED/ROJO","price":"10","origin":"Asti, Piedmont, Italy","abv":"16%","tasting_notes":"A modern take: rhubarb and liquorice lead (no cinchona here), with less sugar and a drier, more bitter profile than classic rosso; coloured naturally with burnt sugar.","producer_note":"OSCAR.697 — a contemporary vermouth from the province of Asti, founded in 2012 by Stefano Di Dio to modernise the Vermouth di Torino tradition.","has_photo":true,"photo_credit":"https://www.wine.com/product/oscar-697-vermouth-rosso/1001565"},{"id":5036,"name":"PUNT E MES","category":"VERMOUTH RED/ROJO","price":"9","origin":"Turin, Piedmont, Italy","abv":"16%","tasting_notes":"Bitter orange, cloves and quinine; opens sweet with dried fruit, then turns assertively bitter — sits halfway between a vermouth and an amaro. A Negroni classic.","producer_note":"Carpano — Antonio Benedetto Carpano invented commercial vermouth in Turin in 1786; Punt e Mes dates to 1870 (brand now owned by Fratelli Branca).","has_photo":true,"photo_credit":"https://topvinos.com/producto/aperitivo-carpano-punt-e-mes/"},{"id":5037,"name":"POLI GRAN BASSO VERMOUTH","category":"VERMOUTH RED/ROJO","price":"9","origin":"Veneto, Italy","abv":"18%","tasting_notes":"Bold dried cherry, raspberry and orange peel with savoury hints of sun-dried tomato and oregano; finishes relatively dry with a gentle herbal bitterness.","producer_note":"Distilleria Poli — family-run in Schiavon, near Bassano del Grappa, since 1898; four generations of grappa distillers who revived a 1930s family vermouth recipe.","has_photo":true,"photo_credit":"https://www.blackwellswines.com/collections/all"},{"id":5038,"name":"SILVIO CARTA VERMOUTH SARDEGNA","category":"VERMOUTH RED/ROJO","price":"11","origin":"Oristano, Sardinia, Italy","abv":"18%","tasting_notes":"Rich and nutty with honeyed apricot and ripe fruit; wild Sardinian herbs — rosemary, thyme, myrtle — over a clean, faintly salty mineral finish.","producer_note":"Silvio Carta — family winemakers on Sardinia since 1950, known for Vernaccia di Oristano; this rosso is made from 12-year-aged Vernaccia Riserva.","has_photo":true,"photo_credit":"https://malawinnica.pl/p/vermouth-rosso-silvio-carta"},{"id":5039,"name":"SPIRITI ARTIGIANI NOT ANOTHER VERMUT","category":"VERMOUTH RED/ROJO","price":"11","origin":"Italy","abv":"","tasting_notes":"Restrained sweetness with a subtle bitter backbone; aromatic herbs and candied citrus peel with gentle sweet spice — soft, balanced and easy-drinking, not cloying.","producer_note":"Spiriti Artigianali — a small artisanal Italian spirits producer.","has_photo":false,"photo_credit":""},{"id":5040,"name":"STARLINO TORINO VERMOUTH","category":"VERMOUTH RED/ROJO","price":"9","origin":"Torino, Piedmont, Italy","abv":"17%","tasting_notes":"Rested 30 days in ex-bourbon barrels, so there's vanilla and spice behind stewed prune, candied orange and wormwood bitterness; bittersweet but leaner than most rosso.","producer_note":"Torino Distillati — the Moncalieri, Piedmont distillery of master distillers Denis Muni and Beppe Ronco, who developed the bourbon-barrel vermouth recipe.","has_photo":true,"photo_credit":"https://bottlestork.com/collections/vermouth"},{"id":5041,"name":"ULRICH VERMOUTH DI TORINO","category":"VERMOUTH RED/ROJO","price":"12","origin":"Piedmont, Italy","abv":"16.5%","tasting_notes":"Sunny orange fruit — candied orange, gentian, lemon balm — with confident bitterness softened by balanced sweetness; lovely neat on ice with an orange twist.","producer_note":"First made in 1854 from pharmacist Domenico Ulrich's Turin recipe; the historic brand is revived today by the Marolo distillery.","has_photo":true,"photo_credit":"https://craftcellars.ca/products/marolo-ulrich-vermouth-rosso"},{"id":5042,"name":"VILLA M VERMOUTH DI TORINO SUPERIORE","category":"VERMOUTH RED/ROJO","price":"12","origin":"","abv":"","tasting_notes":"","producer_note":"","has_photo":true,"photo_credit":"https://www.vinogvin.dk/shop/vermouth-di-torino-2353p.html"},{"id":5043,"name":"WINESTILLERY TUSCAN VERMOUTH","category":"VERMOUTH RED/ROJO","price":"13","origin":"Gaiole in Chianti, Tuscany, Italy","abv":"18%","tasting_notes":"Amber-toned with candied citrus, rosemary and sage over roots and dried flowers; a balanced play of sweetness, bitterness and herbs with a persistent finish.","producer_note":"Winestillery — the first independent craft distillery in the Chianti Classico zone, set up by the Chioccioli Altadonna winemaking family (est. 2019).","has_photo":true,"photo_credit":"https://opimian.ca/winestillery-tuscan-vermouth-chioccioli-altadonna-family-estate-11067/"},{"id":5044,"name":"YZAGUIRRE VERMOUTH","category":"VERMOUTH RED/ROJO","price":"10","origin":"Reus, Tarragona, Catalunya, Spain","abv":"15%","tasting_notes":"Mahogany with intense herby, spicy aromas; orange and cinnamon over good aromatic intensity, with a long, slightly bitter finish. Classic Spanish-style rojo.","producer_note":"Bodegas Yzaguirre — one of Spain's oldest vermouth houses, making vermouth in El Morell, between Reus and Tarragona, since 1884.","has_photo":true,"photo_credit":"https://bodegaslacatedral.com/products/vermouth-yzaguirre-rojo-reserva"},{"id":6001,"name":"AMARO AVERNA","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Sicily, Italy","abv":"34%","tasting_notes":"cola, orange peel, licorice, and vanilla. Sweet, with soft and subtle bitter","producer_note":"Made by Fratelli Averna in Caltanissetta, Sicily, since 1868, when Salvatore Averna was gifted the recipe by a Benedictine monk.","has_photo":false,"photo_credit":""},{"id":6002,"name":"AMARO CAMATTI","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Liguria, Italy","abv":"20%","tasting_notes":"A nice strong herbaceous nose, followed by a really lovely balance of bitter & sweet. The bitterness takes slight prominence on the aftertaste, but not so much as to overwhelm.","producer_note":"","has_photo":false,"photo_credit":""},{"id":6003,"name":"AMARO AMARA","category":"AMARI & HERBAL SPIRITS","price":"10","origin":"Sicily, Italy","abv":
