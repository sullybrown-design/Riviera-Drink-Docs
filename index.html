 After fermentation the wine goes into old barrels that are deliberately left unfilled; a natural yeast veil forms on the surface and the wine ages that way — slowly exchanging air — for six years and three months. That's where the unmistakable walnut-and-curry character comes from. Tissot's En Spois is widely regarded as the estate's most elegant. It's bottled in the traditional squat 620 ml clavelin.","pairings":"Comté aged 24 months or more, roast chicken in vin jaune and morel sauce, mushroom risotto, walnut-based dishes, charcuterie, blue cheeses.","producer_note":"Domaine André et Mireille Tissot is now run by Bénédicte and Stéphane Tissot — the family that did more than any other to define modern Jura wine. Stéphane took over in 1990, converted the estate to biodynamics, and built the single-vineyard range of which En Spois, from Arbois' warmest slope, is the most complete vin jaune.","photo_credit":"Photo: Toppers Drinks (label shown is the 2012 vintage).","has_photo":true,"also_in":[28]},{"id":168,"number":"01","section":"Sparkling, Pét-Nat & Champagne","subsection":null,"title":"Chenin Blanc 'Gardien de Bulles' — Les Athlètes du Vin, Loire NV","price":"Bottle $90 (Riviera)","menu_note":"","region":"Loire, France","grape":"100% Chenin Blanc (50-year-old vines)","producer":"Les Athlètes du Vin (Vini Be Good collective)","style":"Traditional method, no dosage, two years on lees","alcohol":"12.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"green apple, lemon, peach, quince, almond blossom, creamy texture","story":"Gardien de Bulles — 'guardian of the bubbles' — is Chenin Blanc from 50-year-old Loire vines, fermented a second time in the bottle and aged two years on its yeast with no added sweetness (zero dosage). It is made by Les Athlètes du Vin, a collective of French natural winemakers, in a deliberately low-intervention way: neutral yeasts, minimal sulphur. The result keeps the structure of long bottle ageing but drinks fresh and easy — bright orchard fruit with a creamy mousse.","pairings":"Oysters, appetizers and light starters, cheese boards, or on its own as the first pour of the meal.","producer_note":"Les Athlètes du Vin is a Loire négociant project of the Vini Be Good natural-winemaker collective, making value-driven, terroir-typical wines from their own grapes and neighbours' fruit; the hand-drawn labels are by Michel Tolmer.","photo_credit":"Photo: FerroWine.","has_photo":true,"also_in":[]},{"id":169,"number":"02","section":"Sparkling, Pét-Nat & Champagne","subsection":null,"title":"Chardonnay — Mason Vineyard Sparkling, Twenty Mile Bench 2020","price":"As printed on the menu: Chardonnay, Mason Vinyards, Twenty Mile Bench, Niagara (2020)","menu_note":"Bottle $100 (Riviera)","region":"Twenty Mile Bench, Niagara, Ontario","grape":"100% Chardonnay","producer":"Mason Vineyard","style":"Méthode traditionnelle, 18 months on lees, 2 g/L dosage","alcohol":"12.0%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"lemon, grapefruit, flint, apple skin, saline, bakery notes","story":"Kelly Mason founded this tiny Niagara estate in 2021 after head-winemaker roles across the region, focusing on one Twenty Mile Bench vineyard and wild, native-yeast fermentations. This 2020 blanc de blancs is bottle-fermented, aged 18 months on its lees, and finished with just 2 grams per litre of dosage — practically no added sweetness — so it drinks dry, energetic and taut. Expect citrus drive, flinty minerality and a saline lift.","pairings":"Oysters and raw shellfish, delicate white fish, sushi and sashimi, creamy cheeses, light first courses.","producer_note":"Mason Vineyard is a small, winemaker-led Niagara estate founded in 2021 by Kelly Mason — Brock-trained, previously at Domaine Queylus, Honsberger Estate and The Farm. Low volumes, wild fermentations, Chardonnay, Pinot Noir and Cabernet Franc.","photo_credit":"Photo: Wines in Niagara. The pictured label shows the Hors Domaine 2020 bottling.","has_photo":true,"also_in":[]},{"id":170,"number":"03","section":"Sparkling, Pét-Nat & Champagne","subsection":null,"title":"Lambrusco Salamino+ ‘Stile Antica’ — Marchesi di Ravarino, Emilia-Romagna 2025","price":"As printed on the menu: LAMBRUSCO SALAMINO+, ‘STILE ANTICA’ MARCHESI DI RAVARINO, EMILIA-ROMAGNA (2025). Note: the bottle label reads ‘STILE ANTICO’ — the menu’s ‘STILE ANTICA’ looks like a typo.","menu_note":"Bottle $110 (Riviera)","region":"Lambrusco di Modena DOC, Emilia-Romagna, Italy","grape":"Lambrusco Salamino + Lambrusco di Sorbara","producer":"Marchesi di Ravarino (Ravarino, Modena)","style":"Ancestral-method sparkling red — dry, lightly fizzy (frizzante), unfiltered","alcohol":"~11–12%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":2,"tannins_label":"Light","tasting_notes":"cherry, raspberry, strawberry, violet and rose, tangy red fruit, a little grip and gentle bitterness on the finish, savoury earthy edge. Serve well chilled.","story":"A father-and-son farm just outside Modena that makes only one kind of Lambrusco: the old ancestral way. Instead of adding bubbles later, they bottle the wine while it’s still fermenting, seal it with a crown cap, and let the bubbles form naturally inside the bottle — the same trick behind a good pét-nat. It’s dry, a touch cloudy, and gently fizzy rather than full-on sparkling. Their whole point is that Lambrusco belongs on serious restaurant lists, and one sip of this with cured meat makes the case.","pairings":"Mortadella with Parmigiano-Reggiano, prosciutto di Parma with grissini, tagliatelle al ragù, wood-fired pizza.","producer_note":"A small organic farm in Ravarino run by Angelo and Nicola Marchesi; their winemaking project began with the 2017 vintage. They farm organically at low yields and have been cited in Gambero Rosso and the Slow Wine guide.","photo_credit":"Photo: Bossanova Wine and Beer (pictured bottle shows the 2022 vintage; listed vintage is 2025).","has_photo":true,"also_in":[]},{"id":171,"number":"04","section":"Sparkling, Pét-Nat & Champagne","subsection":null,"title":"Chardonnay — Domaine Baud, Crémant du Jura NV","price":"Bottle $100 (Riviera)","menu_note":"","region":"Crémant du Jura, France","grape":"100% Chardonnay","producer":"Domaine Baud Père et Fils","style":"Traditional method, 12 months on lees, Brut","alcohol":"12.5%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"citrus, green apple, white flowers, mineral, fine creaminess","story":"The Jura is a small mountain region in eastern France, and its Crémant must be bottle-fermented like Champagne and rest on its lees for at least 12 months. Baud's is 100% Chardonnay from the domaine's marl and limestone slopes, fermented in stainless steel and finished with a light Brut dosage of about 4.6 g/L — just enough added sweetness to round the edges, never a sweet wine. Fresh, mineral and finely creamy: the friendliest introduction to the Jura at the table.","pairings":"Aperitif; shellfish, light starters, cheese boards.","producer_note":"Domaine Baud Père et Fils traces its history to 1742. The ninth generation — siblings Clémentine and Bastien Baud — now runs it with an emphasis on sustainable farming and traditional Jura style.","photo_credit":"Photo: Wine.com.","has_photo":true,"also_in":[]},{"id":172,"number":"05","section":"Sparkling, Pét-Nat & Champagne","subsection":null,"title":"Chardonnay 'Culmination' — Lighthall Vineyards, Prince Edward County 2022","price":"Bottle $110 (Riviera)","menu_note":"","region":"VQA Prince Edward County, Ontario","grape":"100% estate-grown Chardonnay","producer":"Lighthall Vineyards (Milford)","style":"Traditional method, two years on lees, no-dosage style","alcohol":"~12%","body":3,"body_label":"Medium","acidity":5,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"lemon pith, green apple, oyster shell, shortbread, macadamia, beeswax, biscuit","story":"Prince Edward County is Canada's coolest wine region — deep winter cold and limestone-shale soils give Chardonnay knife-edge acidity, the raw material for Ontario's most Champagne-like sparklers. Culmination is Lighthall's flagship: handpicked estate Chardonnay, fermented a second time in the bottle, and left on its yeast for two years, which builds the toasty, shortbread and macadamia-nut richness. It is made with no sweetening dosage, so the finish is dry, bright and mineral.","pairings":"Oysters, halibut, butter-poached cod, lobster, lemon chicken, creamy mild cheeses.","producer_note":"A small, low-volume family winery in Milford run by Glenn Symons and Jennifer Hennock — non-interventionist in the cellar, and unusually also an artisan cheesemaker, with each pour paired to a cheese in the tasting room.","photo_credit":"Photo: WineAlign. The pictured label shows the 2019 vintage; Riviera lists 2022.","has_photo":true,"also_in":[]},{"id":173,"number":"06","section":"Sparkling, Pét-Nat & Champagne","subsection":null,"title":"Xarel·lo ‘Mirgin’ Gran Reserva Brut Nature — Alta Alella 2021","price":"As printed on the menu: “Xarel-lo, ‘Mirgin’ Alta Alella, Gran Reserva, Catalunya, Spain (2021).” “Xarel-lo” is the list’s shorthand for the blend; the local spelling is Xarel·lo.","menu_note":"By the glass · $21  /  Bottle $120 (Riviera)","region":"DO Alella (Cava), Catalonia, Spain","grape":"Xarel·lo (Pansa Blanca) with Macabeu and Parellada","producer":"Alta Alella","style":"Cava Gran Reserva, Brut Nature (0 g/L — no added sugar)","alcohol":"12%","body":2,"body_label":"Light","acidity":5,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"white fruit, pink grapefruit, citrus peel, green apple, roasted salted almonds, yeast pastry, sea-breeze salinity","story":"This is Cava taken seriously. Brut Nature means zero sugar is added at the end, and the wine rests on its lees for at least 30 months before release — well past the legal minimum — which builds the yeasty, pastry depth. The vineyards run down to the Mediterranean on loose sandy granite soil, which is why the wine tastes of the sea — iodine, salt, crushed shell — behind the citrus fruit. It is certified organic and vegan.","pairings":"Oysters, tapas spreads, sushi, lean fish and shellfish, appetizers and snacks — and a strong partner for fried foods and salted snacks; also works as a cocktail base for a sparkling punch.","producer_note":"Alta Alella is a family winery founded in 1991 by winemaker Josep Maria Pujol-Busquets and his wife Cristina Guillén at the 19th-century estate Can Genís between Alella and Tiana, just 2 km from the Mediterranean — the closest cellar to Barcelona. Built on organic farming and estate-grown fruit from the start, the estate joined Grandes Pagos de España, the association of Spain’s great single estates, in 2024.","photo_credit":"Photo: Equipamiento Hostelero. Pictured label shows the 2015 vintage; the listed wine is 2021.","has_photo":true,"also_in":[]},{"id":174,"number":"07","section":"Sparkling, Pét-Nat & Champagne","subsection":null,"title":"Chardonnay 'Blanc de Blanc' — Dobbin Estates, Twenty Mile Bench NV","price":"Bottle $120 (Riviera)","menu_note":"","region":"Twenty Mile Bench, Niagara, Ontario","grape":"100% Chardonnay","producer":"Dobbin Estates","style":"Traditional method, 36 months on lees","alcohol":"12.4%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"lemon, yellow apple, white flowers, baked goods, lemon meringue, saline","story":"Dobbin Estate is a brand-new ultra-premium Niagara project, opened in 2024, on the clay-and-limestone slopes of the Twenty Mile Bench — one of Ontario's best sites for sparkling Chardonnay. This blanc de blancs is bottle-fermented and rests on its spent yeast for three years before release; that long contact turns fresh lemon and green apple into pastry, lemon meringue and a creamy mousse. The cool climate gives it the taut, saline backbone of classic Niagara sparkling. Note: Riviera lists the wine as NV; the only detailed published review concerns a release drawn from the 2021 vintage, so confirm the back label when ordering.","pairings":"Fresh-shucked oysters, sushi, ham-and-cheese quiche, Nova Scotia lobster, or simply as an apéritif.","producer_note":"Founder Wade Dobbin recruited two of Niagara's most decorated winemakers, Ann Sperling and Peter Gamble, and launched the estate at the top of Ontario's price ladder on a 'drink less, drink better' philosophy.","photo_credit":"","has_photo":false,"also_in":[]},{"id":175,"number":"08","section":"Sparkling, Pét-Nat & Champagne","subsection":null,"title":"Pinot Noir Blanc de Noirs — Champagne Fleury NV","price":"As printed on the menu: “Pinot Noir, Champagne Fleury, Blanc de Noirs, France (NV)” — listed as a half bottle (375 mL), not a standard 750 mL bottle.","menu_note":"Half bottle (375 mL) $115 (Riviera)","region":"Côtes des Bar, Champagne, France (Courteron)","grape":"100% Pinot Noir","producer":"Champagne Fleury","style":"Blanc de Noirs, low dosage (~3–5 g/L), reserve wines back to 2006","alcohol":"12%","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"red summer berries, raspberry, redcurrant, dark cherry, toasted almonds, pastry, candied lemon, creamy texture, salty minerality","story":"Fleury farms in the Côtes des Bar, Champagne’s warmest and most southerly corner, where Pinot Noir ripens fully — which is why this Blanc de Noirs tastes rich and generous rather than lean. The blend includes reserve wines dating back to 2006, aged in big old wooden casks, giving it real depth even though it finishes dry. It is also a pioneer bottle: Fleury was the first Champagne producer to farm fully biodynamically, starting the switch in 1989.","pairings":"Roast white meats, meaty fish, pizza night, fried food, fresh seafood, crunchy greens — or simply as an apéritif.","producer_note":"Founded in 1895 in Courteron, Fleury was the first grower in the Côtes des Bar to bottle its own Champagne (1928) and the first Champagne producer to convert to biodynamics: Jean-Pierre Fleury began with 3 hectares in 1989 and had the entire 15-hectare estate certified by 1992. Certified organic (Ecocert) and biodynamic (Demeter); the wine is vegan.","photo_credit":"Photo: The Champagne Guide","has_photo":true,"also_in":[]},{"id":176,"number":"09","section":"Sparkling, Pét-Nat & Champagne","subsection":null,"title":"Auxerrois — Pierre Frick, Crémant d'Alsace 2023","price":"Bottle $140 (Riviera)","menu_note":"","region":"Crémant d'Alsace, France","grape":"100% Auxerrois","producer":"Domaine Pierre Frick (Pfaffenheim, Alsace)","style":"Traditional-method sparkling, no added sulphites","alcohol":"13%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"apple, pear, brioche, toast, yeast, minerals, baked lemon, honey","story":"Pierre Frick has farmed organically since 1970 and biodynamically since 1981 — one of the very first in France — and about 90% of the domaine's wines are bottled with no added sulphites at all, so this is about as natural as bottle-fermented sparkling gets. The wine is 100% Auxerrois, a soft white grape native to Lorraine, fermented a second time in the bottle and rested on its spent yeast, which builds the bready, creamy texture. Expect a characterful golden fizz of apple and toast rather than a neutral aperitif bubble.","pairings":"Shellfish, roast chicken, creamy cheeses, or on its own as an apéritif; serve chilled at 8–10°C.","producer_note":"Domaine Pierre Frick is a 12-hectare family estate in Pfaffenheim, Alsace, run by Jean-Pierre Frick with his wife Chantal and their son Thomas, with twelve generations of winegrowing behind it. A touchstone of the natural-wine movement in Alsace — organic since 1970, Demeter-certified biodynamic since 1990.","photo_credit":"Photo: MORE Natural Wine. The pictured label shows the 2018 vintage; Riviera lists 2023.","has_photo":true,"also_in":[]},{"id":177,"number":"10","section":"Sparkling, Pét-Nat & Champagne","subsection":null,"title":"Gamay+ 'Matsuri' — Maison Chantereves, Pet-Nat NV","price":"As printed on the menu: Gamay+, 'Matsuri' Maison Chantereves, Bourgogne, Pet-Nat, France (NV)","menu_note":"Bottle $150 (Riviera)","region":"Burgundy, France (Vin de France label)","grape":"Gamay + early-harvest Aligoté","producer":"Maison Chantereves (Guillaume Bott & Tomoko Kuriyama)","style":"Pétillant naturel, undisgorged","alcohol":"11.5%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":1,"tannins_label":"Low","tasting_notes":"rose petal, red fruit, tart, juicy, natural-wine tang","story":"Matsuri is a pet-nat — an 'ancestral method' sparkling wine bottled before fermentation finishes, so the bubbles form naturally in the bottle and the wine stays lightly cloudy from its lees. Chantereves uses an unusual technique called flottaison: early-picked Aligoté juice is poured over whole Gamay bunches, and the two ferment together for a week, giving the wine its pink colour and berry-forward fruit. 'Matsuri' means 'festival' in Japanese, a nod to co-founder Tomoko Kuriyama's roots. Low in alcohol and boisterously fruity — a chillable, convivial fizz.","pairings":"Charcuterie, gougères, ham roll-ups, salmon-and-cream-cheese bites, brunch and picnic fare; serve well chilled.","producer_note":"Maison Chantereves is the micro-négoce of husband-and-wife team Guillaume Bott (Burgundian, previously at Sauzet and Bize) and Tomoko Kuriyama (Japanese, trained in Germany's Rheingau), founded 2010/2011 in Savigny-lès-Beaune. Organic farming, minimal inputs, tiny volumes — about three barrels of the 2023.","photo_credit":"Photo: Winerl. The pictured label shows the 2023 release; Riviera lists the wine as NV.","has_photo":true,"also_in":[]},{"id":178,"number":"11","section":"Sparkling, Pét-Nat & Champagne","subsection":null,"title":"Chardonnay+ 'BBF' — Stéphane & Bénédicte Tissot, Crémant du Jura NV","price":"As printed on the menu: Chardonnay+, 'BBF' Stephane & Benedicte Tissot, Arbois, Jura, France (NV)","menu_note":"Bottle $170 (Riviera)","region":"Crémant du Jura, France","grape":"Chardonnay-led; exact blend uncertain (see menu note)","producer":"Domaine André & Mireille Tissot","style":"Extra Brut, barrel-raised, ~5 years on lees, zero dosage","alcohol":"12.5%","body":4,"body_label":"Full","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"orchard fruit, brioche, hazelnut, smoky, vanilla, white pepper, chamomile","story":"BBF stands for 'blanc de blancs aged in barrel' — the base wine spends at least nine months in oak before its second bottle fermentation, then rests on its lees for roughly five years, which is extraordinarily long for a Crémant. All that time builds bread, brioche and creamy nutty depth. It is finished with zero dosage — no added sweetness — so the finish stays brisk, mineral and dry. The menu's '+' is honest: published sources disagree on whether it is all Chardonnay or Chardonnay with Pinot Noir, so check the back label if the exact blend matters.","pairings":"Butter-seared scallops, Camembert, charcuterie or poutine, roast poultry, mushroom dishes.","producer_note":"Stéphane and Bénédicte Tissot run the family domaine in Montigny-lès-Arsures near Arbois. Stéphane is one of the Jura's iconic, experimental producers, farming 32–40 hectares organically and biodynamically and making about 28 small cuvées.","photo_credit":"","has_photo":true,"also_in":[]},{"id":179,"number":"12","section":"Sparkling, Pét-Nat & Champagne","subsection":null,"title":"Pinot Noir+ ‘Chemin du Chemin’ — Fresne Ducret, Champagne NV","price":"As printed on the menu: “25. Pinot Noir+, ‘Chemin du Chemin’ Fresne Ducret, Champagne, France (NV) — 180.” The “+” covers Chardonnay and Pinot Meunier beyond Pinot Noir.","menu_note":"Bottle $180 (Riviera)","region":"Ville-Dommange, Premier Cru, Montagne de Reims, Champagne, France","grape":"40% Pinot Noir, 35% Chardonnay, 25% Pinot Meunier","producer":"Champagne Fresne Ducret","style":"Extra Brut (5.3 g/L), about six years on lees","alcohol":"12%","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"apricot, fresh bread, brioche, praline, hazelnut, shortbread, quince, saline finish","story":"Most entry-level non-vintage Champagnes rest about 15 months on their lees — the spent yeast left in the bottle after the second fermentation. This one rests about six years, which is why it tastes of fresh bread, brioche and hazelnuts instead of simple fruit. It is still dry, with only a tiny dose of sugar at the end, so all that richness closes on a clean, savory, almost salty line. Winemaker Pierre Fresne calls it his winemaker’s-choice cuvée.","pairings":"Briny seafood such as Belon oysters, razor clams or sea urchins; smoked salmon with crème fraîche; triple-cream Brie or aged Comté; green asparagus with Parmesan; citrus risotto.","producer_note":"Champagne Fresne Ducret is an artisanal family grower in Ville-Dommange, with seven generations on the estate; the Fresne-Ducret brand was created after WWII from the parents’ family names. Pierre Fresne works six hectares of Premier Cru vines; the estate began organic conversion in 2018 after years of sustainable farming.","photo_credit":"Photo: Liner & Elsen","has_photo":true,"also_in":[]},{"id":180,"number":"13","section":"Sparkling, Pét-Nat & Champagne","subsection":null,"title":"‘L’Esquisse’ — Famille Moussé, Champagne NV","price":"As printed on the menu: “26. Pinot Meunier, ‘L’Esquisse’ Famille Mousse, Champagne, France (NV) — 190.” (The bottle spells the producer Famille Moussé.)","menu_note":"Bottle $190 (Riviera)","region":"Vallée de la Marne, Champagne, France (Cuisles, Jonquery, Châtillon-sur-Marne)","grape":"70–76% Pinot Meunier, balance Pinot Noir","producer":"Champagne Famille Moussé","style":"Blanc de Noirs, Extra Brut (~1–1.5 g/L)","alcohol":"12%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"red and dark berries, pear, peach, violets, chamomile, wet-stone minerality, citrus zest, dry savory finish","story":"“Esquisse” means “sketch” — this is the estate’s opening statement, meant to be the fresh, energetic first taste of the house. Most of the selected plots grow in rare green clay over limestone, which gives the Meunier its distinctive savory edge. It is made Extra Brut, with almost no sugar added at the end, so the fruit tastes vivid and the finish stays dry and tangy.","pairings":"Duck breast with berry sauce, roast chicken with herbs, grilled salmon, mushroom risotto, gougères, baked or fried oysters, pâté and rillettes, or a charcuterie and cheese board.","producer_note":"Based in Cuisles, Champagne Famille Moussé has grown grapes since 1750 and bottled estate Champagne since the early twentieth century. Fourth-generation Cédric Moussé has made the domaine a benchmark for Meunier-driven grower Champagne; the family is the only Club Trésor member producing a 100% Meunier Special Club cuvée. The estate is farmed organically and sustainably, powered by solar and geothermal energy.","photo_credit":"Photo: The Wine Wave","has_photo":true,"also_in":[]},{"id":181,"number":"15","section":"Sparkling, Pét-Nat & Champagne","subsection":null,"title":"Brut Réserve — Bérêche et Fils, Champagne NV","price":"As printed on the menu: “Pinot Noir, Brut Reserve, Bereche et Fils, Champagne, France (NV).” Note: “Pinot Noir” is menu shorthand — the cuvée is actually about one-third each Pinot Noir, Pinot Meunier and Chardonnay.","menu_note":"Bottle $240 (Riviera)","region":"Montagne de Reims & Vallée de la Marne, Champagne, France (Ludes)","grape":"~35% Pinot Noir, ~35% Pinot Meunier, ~30% Chardonnay","producer":"Bérêche et Fils","style":"Brut, reserve-wine blend, partly wood-aged, bottle-fermented under cork","alcohol":"12.5%","body":4,"body_label":"Full","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"nectarine, orange zest, red apple, white cherry, brioche, fresh bread, chalky minerality, fine mousse","story":"This is a grower Champagne, meaning the family grows the grapes and makes the wine themselves rather than buying in fruit. About a third of the blend comes from older reserve wines held back from past harvests, and the base wines age partly in wooden vats — that is where the brioche and fresh-bread notes come from. Instead of the usual metal cap, the second fermentation happens in the bottle under a real cork, giving a fine, creamy bead of bubbles.","pairings":"Roast or fried chicken, sushi, crudo or tempura, mushroom risotto, charcuterie, or aged Comté or Beaufort.","producer_note":"Bérêche et Fils is a grower estate in Ludes, Montagne de Reims, founded in 1847; Jean-Pierre Bérêche was among the first growers to build a reputation for estate-bottled Champagne. His sons Raphaël and Vincent now farm about nine hectares across four villages with certified organic practices. Brut Réserve is the house’s foundational cuvée and one of the most reliable entry-level grower Champagnes.","photo_credit":"Photo: Vinosacra","has_photo":true,"also_in":[]},{"id":182,"number":"16","section":"Sparkling, Pét-Nat & Champagne","subsection":null,"title":"Chardonnay 'Bouvet' — Cose, Chouilly Grand Cru, Champagne 2023","price":"As printed on the menu: Chardonnay, 'Bouvet' Cose, Chouilly, Champagne, France (2023)","menu_note":"Bottle $300 (Riviera)","region":"Chouilly Grand Cru, Côte des Blancs, Champagne","grape":"100% Chardonnay","producer":"Champagne Cose, in collaboration with grower Antoine Bouvet","style":"Micro-négociant, barrel-fermented, full malolactic","alcohol":"","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"chalky citrus, white flowers, creamy lees, barrel spice, bread, orchard fruit","story":"Cose is a tiny Champagne project by two friends who own no vineyards: they buy grapes from grower friends and make one barrel at a time. For 2023 the Chardonnay comes from Antoine Bouvet, a young biodynamic grower. It ferments in old oak barrels — many previously used by Jacques Selosse, one of Champagne's legends — then ages under natural cork rather than the usual metal cap, which the makers say keeps the wine more open and expressive. No tasting notes exist yet (the 2023 was not yet released at the time of research), but expect a broad, textured, Burgundy-like Champagne.","pairings":"Roast turbot or sole, butter-poached lobster, scallops, roast chicken, aged Comté or Beaufort.","producer_note":"Champagne Cose was founded by Victor Allier (owner of Paris burger joint Sacre Burger) and Mexico-born Gil Conejo, who learned winemaking with Jean-Baptiste Geoffroy of Champagne René Geoffroy. The debut 2022 release totalled about 3,000 bottles.","photo_credit":"Photo: Blanco Tinto.","has_photo":true,"also_in":[]},{"id":183,"number":"17","section":"Sparkling, Pét-Nat & Champagne","subsection":null,"title":"Chardonnay 'Champion' R.22 — Cose, Chouilly Grand Cru, Champagne 2022","price":"Bottle $295 (Riviera)","menu_note":"","region":"Chouilly Grand Cru, Côte des Blancs, Champagne","grape":"100% Chardonnay","producer":"Champagne Cose, grower Roland Champion","style":"Single-parcel blanc de blancs, barrel-fermented","alcohol":"","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"chalky citrus, creamy lees, barrel spice, orchard fruit, breadth, texture","story":"Champion R.22 is Cose's debut Chardonnay from one parcel — Les Loutrets de Champion in the Grand Cru village of Chouilly — grown by Roland Champion. It ferments in used 225-litre oak barrels (about 70% previously held Jacques Selosse's wine), goes through full malolactic conversion, and ages on its lees under natural cork instead of a crown cap. Only 782 bottles were made. No published tasting note exists for this first release; expect a deep, vinous, textured blanc de blancs that drinks more like a fine still white Burgundy than an aperitif fizz.","pairings":"Treat like a fine still Chardonnay: roast fish, butter-poached lobster, scallops, roast chicken, aged Comté.","producer_note":"Champagne Cose is the micro-négociant label of Victor Allier and Gil Conejo — no owned vineyards, grapes bought from grower friends. The first release, from 2022, was three single-parcel wines totalling about 3,000 bottles.","photo_credit":"Photo: Thatcher's Wine.","has_photo":true,"also_in":[]},{"id":184,"number":"18","section":"Sparkling, Pét-Nat & Champagne","subsection":null,"title":"Pinot Noir ‘232°’ — Gaspard Brochet, Champagne (base 2022)","price":"As printed on the menu: PINOT NOIR, ‘232°’ GASPARD BROCHET, CHAMPAGNE, FRANCE (BASE 2022 WITH RESERVE 2020). This replaces the ‘2938’/333.f cuvée previously listed.","menu_note":"Bottle $295 (Riviera)","region":"Champagne — Écueil, Montagne de Reims, France","grape":"Pinot Noir-led blend (exact blend not published; likely two varieties)","producer":"Gaspard Brochet (Écueil)","style":"Grower Champagne, extra-brut style — very low to zero dosage","alcohol":"~12–12.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"No published tasting note for this cuvée yet; the house style runs to red berries (cherry, raspberry), baked apple and citrus, brioche, a chalky mineral streak, and a fresh, salty finish — precise and vibrant rather than rich.","story":"Gaspard Brochet is one of Champagne’s most talked-about young growers: born in 1995, he left graphic design to take over part of his family’s vines in Écueil and now farms about three hectares, making barely 8,000 bottles a year. Everything ferments on its own in oak barrels, almost no sugar is added at the end, and he draws his own labels. His cuvées are numbered — the famous 333 blends three grapes, three villages and three vintages — so 232° most likely means two grapes, three villages, two vintages (2022 plus 2020 reserve). That last part is our read, not his words.","pairings":"Fresh oysters with lemon, hamachi crudo, seared scallops, roast chicken with citrus, aged Comté.","producer_note":"Grower-producer in Écueil, Montagne de Reims; took over family vines in 2016–17. Farms HVE-certified, converting to organic; spontaneous fermentations, hand-disgorgement, releases in tiny quantities. No verified bottle photo found for the ‘232°’ cuvée.","photo_credit":"","has_photo":false,"also_in":[]},{"id":185,"number":"19","section":"Sparkling, Pét-Nat & Champagne","subsection":null,"title":"Chardonnay 'Le Bourg Sud' — La Rogerie, Avize Grand Cru, Champagne NV","price":"Bottle $350 (Riviera)","menu_note":"","region":"Avize Grand Cru, Côte des Blancs, Champagne","grape":"100% Chardonnay (blanc de blancs)","producer":"La Rogerie (Justine Boxler & François Petit)","style":"Extra-brut, named-vineyard (lieu-dit) cuvée","alcohol":"≈ 13%","body":4,"body_label":"Full","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"toasted hazelnut, brown pastry, apricot, lemon zest, measured oak, chalky mineral","story":"Le Bourg Sud is a single named vineyard in Avize, a Grand Cru village of the Côte des Blancs, so this is Chardonnay from one of Champagne's most prized spots, bottled as an extra-brut — almost no added sweetness, letting the site speak. La Rogerie blends in wine from a perpetual reserve started in 2018, so the 'non-vintage' bottle is really a multi-year blend built for depth; the latest release draws on the hot, dry 2022 vintage. Expect a ripe, vinous Champagne of apricot, lemon zest, pastry and hazelnut — more like a fine still Chardonnay with bubbles than a lean toast wine.","pairings":"Aperitif through first courses; anything you would serve with a fine white Burgundy.","producer_note":"La Rogerie is the young grower estate of Justine Boxler and François Petit in Avize — they farm their own Grand Cru Chardonnay rather than buying grapes, and quickly won critical attention for the house.","photo_credit":"Photo: Amélie World. The pictured label shows the Réserve Perpétuelle bottling.","has_photo":true,"also_in":[]},{"id":186,"number":"01","section":"Orange & Skin Contact","subsection":null,"title":"Chardonnay+ 'Trebez' — Dario Prinčič, Venezia-Giulia 2017","price":"As printed on the menu: Chardonnay+, 'Trebez' Dario Princic, Friuli-Venezia-Giulia, Italy (2017). Correct spelling: Prinčič; the '+' signals a three-grape blend.","menu_note":"Bottle $200 (Riviera)","region":"Oslavia, Collio, Friuli-Venezia Giulia, Italy (IGT Venezia Giulia)","grape":"≈ 40% Sauvignon Blanc, 30% Chardonnay, 30% Pinot Grigio","producer":"Azienda Agricola Dario Prinčič, Oslavia","style":"Orange wine, long skin contact","alcohol":"13%","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":3,"tannins_label":"Medium","tasting_notes":"dried apricot, compote, honey, chestnut, spice, autumn earth, mineral","story":"The '+' means blend — Chardonnay is only about a third; Sauvignon Blanc leads. The grapes ferment with their skins for weeks (around 18 days for Sauvignon and Chardonnay, 8 for Pinot Grigio) in open wooden vats with natural yeasts — that skin time is what gives the dark amber colour, the tannin and the savoury character. The wine then ages 20 months in old oak and settles 6 months in steel before bottling unfiltered. Savoury and wild — a wine for robust food, not delicate aperitif sipping.","pairings":"Game and beef, braised veal shank, smoky and spicy dishes.","producer_note":"Azienda Agricola Dario Prinčič is in Oslavia, near Gorizia and the Slovenian border, farming about 10 hectares by hand on steep clay-and-sandstone ponca marl slopes. With Stanko Radikon and Joško Gravner, Prinčič pioneered the low-intervention, long-maceration orange wines of the region.","photo_credit":"Photo: Tuscany Wine (Japan).","has_photo":true,"also_in":[]},{"id":187,"number":"02","section":"Orange & Skin Contact","subsection":null,"title":"Ribolla — Gravner, Venezia-Giulia 2016","price":"Bottle $330 (Riviera)","menu_note":"","region":"Oslavia, Collio, Friuli-Venezia Giulia, Italy (IGT Venezia Giulia)","grape":"100% Ribolla Gialla","producer":"Gravner (Joško Gravner, with daughter Mateja)","style":"Amber orange wine, qvevri-aged","alcohol":"14%","body":5,"body_label":"Full","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"chamomile, saffron, dried apricot, honey, orange peel, resin, sea air","story":"100% Ribolla Gialla, fermented and aged about six to seven months on its skins in buried Georgian clay amphorae (qvevri), then roughly six years in large old oak casks and further rest in bottle — no fining, no filtration, minimal sulfur. The result is amber, dry and full-bodied, with tea-like tannins and vibrant acidity, built to age 10–15 years or more. Serve it like a structured table wine, decanted about an hour.","pairings":"Frico with polenta, wild mushroom risotto, grilled octopus, grilled meats, mature Montasio and medium-aged cheeses.","producer_note":"Joško Gravner took over the family estate in Oslavia in 1973. After a devastating 1996 hailstorm he turned to long skin contact and buried Georgian amphorae, travelling to Georgia to have qvevri made by hand. With Stanko Radikon and Dario Prinčič, he's considered a father of the modern orange-wine movement; his daughter Mateja now works alongside him.","photo_credit":"Photo: Enoteca Collova (label shown is the 2016 vintage).","has_photo":true,"also_in":[]},{"id":188,"number":"01","section":"Rosé","subsection":null,"title":"Limonia+ 'Apla' — Oenops, Drama, Greece 2024","price":"As printed on the menu: Limonia+. The variety is Limniona; the '+' signals a blend rather than a single-variety rosé.","menu_note":"Bottle $85 (Riviera)","region":"Drama, Macedonia, northern Greece (Wine of Greece)","grape":"Xinomavro 50%, Mavroudi 30%, Limniona 20%","producer":"Oenops","style":"Dry, savoury rosé","alcohol":"12.5%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":1,"tannins_label":"Low","tasting_notes":"citrus, red cherry, raspberry, tomato leaf, savoury herbs, dry finish, fresh","story":"'Apla' means 'simply' in Greek — a wry name for a wine made from three hard-to-grow native grapes. It is a blend of Xinomavro, Mavroudi and Limniona from 15- to 45-year-old vines in Drama, in northern Greece. The hand-picked grapes are chilled, gently pressed and fermented in stainless steel and concrete, then rested on the fine sediment for two to four months — that rest gives the wine texture without any oak flavour.","pairings":"Grilled fish, shellfish and seafood pasta; tomato-based pasta, margherita pizza, Greek salad and grilled vegetables — a flexible food rosé.","producer_note":"Oenops is based in Drama, in the Macedonia region of northern Greece, and works with indigenous Greek varieties. 'Apla' is its rosé cuvée.","photo_credit":"Photo: Bottles.gr (pictured bottle shows the 2023 vintage; listed vintage is 2024)","has_photo":true,"also_in":[]},{"id":189,"number":"02","section":"Rosé","subsection":null,"title":"Zweigelt+ 'Rosa' — Umathum, Burgenland 2023","price":"As printed on the menu: Zweigelt+, 'Rosa' Umathum, Bergenland, Austria (2023) — the region is Burgenland. The '+' signals a blend, not varietal Zweigelt.","menu_note":"Bottle $90 (Riviera)","region":"Burgenland, Austria (Lake Neusiedl)","grape":"Zweigelt, St. Laurent, Blaufränkisch (roughly equal thirds)","producer":"Weingut Umathum","style":"Structured saignée rosé","alcohol":"","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":2,"tannins_label":"Low","tasting_notes":"raspberry, cherry, red currant, citrus, gooseberry, vinous, dry, deeper colour","story":"Umathum makes Rosa by the traditional 'saignée' method — before the red-wine fermentation begins, some juice is drawn off the tank after a few hours of skin contact. That short soak gives the wine its deep raspberry-red colour, a little tannin and a red-wine character most pale rosés don't have. It is a roughly equal blend of Zweigelt, St. Laurent and Blaufränkisch from biodynamically farmed vines on the eastern shore of Lake Neusiedl, fermented naturally in stainless steel and bottled under glass cork.","pairings":"Light appetizers and composed salads — but pair it like a light red; it also works as a chilled aperitif.","producer_note":"Josef Umathum's estate in Frauenkirchen on Lake Neusiedl is one of Burgenland's reference addresses for Zweigelt, St. Laurent and Blaufränkisch. The winery farms biodynamically, runs on solar power, and helped bring back the rare Pannonian variety Lindenblättriger.","photo_credit":"Photo: Dropshop (pictured bottle shows the 2024 vintage; listed vintage is 2023)","has_photo":true,"also_in":[]},{"id":190,"number":"03","section":"Rosé","subsection":null,"title":"Tempranillo — Bodegas Moraza, Rioja 2024","price":"Bottle $90 (Riviera)","menu_note":"","region":"Rioja Alta, Spain (Rioja DOCa)","grape":"100% Tempranillo","producer":"Bodegas Moraza","style":"Dry rosado, raised in concrete","alcohol":"12%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":1,"tannins_label":"Low","tasting_notes":"bright red fruit, savoury, juicy, fresh, citrus lift, clean dry finish","story":"Bodegas Moraza is in San Vicente de la Sonsierra in Rioja Alta, where its vineyards sit 450–700 metres up above the Ebro River. It is one of Rioja's few estates certified both organic and Demeter biodynamic, and the 1983 winery is built entirely of concrete — the wine ferments and ages in concrete with natural yeasts and never sees oak. Picked early for freshness, it is about 12% alcohol and bone dry.","pairings":"Grilled fish, shellfish and seafood tapas, charcuterie, olives and mixed tapas, white meats and Mediterranean vegetable dishes — pair it like a light, savoury red.","producer_note":"Bodegas Moraza, Rioja Alta — certified organic and Demeter biodynamic, working with minimal intervention and no oak.","photo_credit":"Photo: Naturavini (pictured bottle shows the 2022 vintage; listed vintage is 2024)","has_photo":true,"also_in":[]},{"id":191,"number":"04","section":"Rosé","subsection":null,"title":"Pinot Noir, 'Roselana' — Pearl Morissette, Niagara 2024","price":"As printed on the menu: Pinot Noir+, 'Roseland' Pearl Morissette, Niagara, Ontario (2024). The wine's actual name is Cuvée Roselana; the '+' signals a blend.","menu_note":"Bottle $95 (Riviera)","region":"Niagara Peninsula, Ontario (Jordan Station)","grape":"Pinot Noir 80%, Gamay 15%, Syrah 5% (2024)","producer":"Pearl Morissette","style":"Dark, serious rosé","alcohol":"","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":2,"tannins_label":"Low","tasting_notes":"cherry pie, black raspberry, plum, strawberry, dried herbs, dry, structured, deep colour","story":"Pearl Morissette's Cuvée Roselana is a deliberately dark, serious rosé from Niagara's Jordan Station — one retailer jokes it has 'flirted with being a light red.' The 2024 is 80% Pinot Noir with Gamay and Syrah, made by the direct-press method with short skin soaks of two, four and six days. Each grape ferments separately in concrete tanks, giving a rosé with real red-wine backbone but no oak.","pairings":"Pork tenderloin, BBQ wings, grilled salmon, duck, charcuterie and salumi, creamy or pungent cheeses — built for dishes that would overwhelm a pale rosé.","producer_note":"Pearl Morissette is a small estate winery outside the village of Jordan, founded by winemaker François Morissette, an icon of Canadian natural winemaking. The philosophy is low-intervention: hand harvest in multiple passes, native fermentations.","photo_credit":"Photo: Primitive Selections","has_photo":true,"also_in":[]},{"id":192,"number":"05","section":"Rosé","subsection":null,"title":"Nebbiolo, 'Rosabella' — G.D. Vajra, Piemonte 2023","price":"Bottle $100 (Riviera)","menu_note":"","region":"Piemonte, Italy (Rosato IGT Piemonte; Barolo)","grape":"Nebbiolo, with touches of Dolcetto and Barbera","producer":"G.D. Vajra","style":"Dry rosato with real structure","alcohol":"","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":2,"tannins_label":"Low","tasting_notes":"cherry, blood orange, rose petal, lemon, white flowers, crisp, delicate tannin","story":"G.D. Vajra is a family estate in Barolo, and this rosato comes from Nebbiolo grown on Bricco delle Viole, the highest vineyard in the commune. The juice is pressed gently and fermented cold in stainless steel, with a short rest on the lees — no oak, so the wine keeps its fresh fruit and floral lift. It has more structure than most rosés because Nebbiolo brings natural tannin and acidity. Vinous gave the 2023 92 points.","pairings":"Harvest salads, roasted squash, creamy cheeses, charcuterie and salumi with olives, grilled salmon and light tomato pasta — and, as one retailer puts it, 'whatever's in your takeout bag.'","producer_note":"G.D. Vajra is an independent, family-owned winery in the heart of Barolo. Aldo Vajra took over the estate in 1968 at fifteen and became one of Piedmont's great innovators — the region's first organic certification in 1971.","photo_credit":"Photo: Wine.com","has_photo":true,"also_in":[]},{"id":193,"number":"06","section":"Rosé","subsection":null,"title":"Cinsault+ 'Love' — Léoube, Côtes de Provence 2025","price":"As printed on the menu: Cinsault+, 'Love' Leoube, Cotes de Provence, France (2025). The '+' signals a blend rather than a single-variety rosé.","menu_note":"Bottle $100 (Riviera)","region":"Côtes de Provence AOP, Provence, France","grape":"Grenache 53%, Cinsault 40%, Syrah 5%, Mourvèdre 2%","producer":"Château Léoube","style":"Dry pale rosé","alcohol":"12.5%","body":2,"body_label":"Light","acidity":3,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"mandarin, white peach, fresh citrus, red berries, white flowers, sea-spray salinity, clean mineral finish","story":"Château Léoube sits on almost four kilometres of Mediterranean coastline at Bormes-les-Mimosas, with vineyards on schist and sandstone close to the water — the sea breeze gives the wine its salty edge. The 2025 is a blend led by Grenache with 40% Cinsault plus small amounts of Syrah and Mourvèdre. It is fermented cold in stainless steel with very little added sulphur, and the estate is certified organic, so what you taste is fruit, citrus and sea air — nothing oaky.","pairings":"Oysters, seafood towers, octopus salad, Provençal prawns, monkfish tail, tuna tataki and ceviche; also burrata with peach and basil — or simply a well-chilled aperitif.","producer_note":"Château Léoube is a 560-hectare coastal estate near Bormes-les-Mimosas in the Var, owned by British businessman Anthony Bamford since the 1990s. Winemaking is led by Romain Ott, of the Domaines Ott family, and the estate is certified organic.","photo_credit":"Photo: Mr.Wheeler Wine (pictured bottle shows the 2024 vintage; listed vintage is 2025)","has_photo":true,"also_in":[166]},{"id":194,"number":"07","section":"Rosé","subsection":null,"title":"Mourvèdre, 'Cuvée Spéciale' — Château Pradeaux, Bandol 2024","price":"As printed on the menu: Mourvèdre+, 'Cuvée Speciale' Chateau Pradeaux, Bandol, France (2024). Note: no separate 'Cuvée Spéciale' rosé could be confirmed in trade listings — this brief describes the estate's standard 2024 Bandol rosé.","menu_note":"Bottle $150 (Riviera)","region":"Bandol AOC, Provence, France","grape":"Mourvèdre-led blend with Cinsault and Grenache","producer":"Château Pradeaux","style":"Structured, gastronomic rosé","alcohol":"≈13.5%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":2,"tannins_label":"Low","tasting_notes":"red berries, apricot, spring flowers, spice, juicy fruit, mineral finish","story":"Château Pradeaux has been in the Portalis family since before the French Revolution, on the coast at Saint-Cyr-sur-Mer in Bandol — the great Mourvèdre appellation of Provence. The rosé gets a short soak on the skins for colour, then a cool fermentation in stainless steel and time on its lees for extra texture. Robert Parker's Wine Advocate gave the 2024 93 points, noting red berries, spices, spring flowers and apricots.","pairings":"River fish and crustaceans, grilled fish with olives and fennel over saffron rice, cooked cheeses like Comté, Tomme and Beaufort; also charcuterie and roast chicken. Serve fresh at 10–12°C.","producer_note":"Château Pradeaux is a historic Bandol estate in the hands of the Portalis family since before the Revolution, revived after phylloxera by Arlette and Suzanne Portalis.","photo_credit":"Photo: Château Pradeaux","has_photo":true,"also_in":[]},{"id":195,"number":"08","section":"Rosé","subsection":null,"title":"Tibouren, 'Cuvée Spéciale des Vignettes' — Clos Cibonne, Côtes de Provence 2023","price":"Bottle $165 (Riviera)","menu_note":"","region":"Côtes de Provence AOP, France (near Toulon)","grape":"Tibouren 90%, Grenache 10%","producer":"Clos Cibonne","style":"Age-worthy, savoury rosé","alcohol":"≈13.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":2,"tannins_label":"Low","tasting_notes":"peach, apricot, raspberry, pomegranate, rosehip, thyme flower, wild fennel, salt, long saline finish, pale copper colour","story":"Clos Cibonne is one of the 18 estates named Cru Classé in the 1955 Côtes de Provence classification, near Toulon at the foot of the Maures mountains. It has championed the rare Tibouren grape since the 1930s; this cuvée comes from its oldest Tibouren vines, over 60 years old, plus 10% Grenache. After fermentation the wine spends about a year in 5,000-litre oak vats that are 120 years old, under a thin veil of yeast — the same kind of ageing used for sherry — which makes it savoury, textured and able to age 10 years or more. Decanter and Wine Spectator both gave the 2023 93 points.","pairings":"Bouillabaisse and other seafood stews, ratatouille and Provençal vegetable dishes, saffron-led dishes, aged cheeses and slow-cooked Provençal stews — serve it like a structured light red.","producer_note":"Clos Cibonne, Cru Classé 1955, on schist and sandstone overlooking the Mediterranean near Toulon — the estate that has championed the Tibouren grape since the 1930s.","photo_credit":"Photo: 8Wines","has_photo":true,"also_in":[]},{"id":196,"number":"09","section":"Rosé","subsection":null,"title":"Pinot Noir — Pierre-Yves Colin-Morey, Bourgogne Rosé 2022","price":"Bottle $200 (Riviera)","menu_note":"","region":"Burgundy, France (Bourgogne Rosé)","grape":"100% Pinot Noir","producer":"Pierre-Yves Colin-Morey","style":"Barrel-aged rosé","alcohol":"≈13.5%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":1,"tannins_label":"Low","tasting_notes":"citrus, red berries, white flowers, chalky mineral, textured, long and precise","story":"This is not a simple pink wine. Pierre-Yves Colin-Morey makes his Bourgogne rosé the same way he makes his famous white Burgundies. The 100% Pinot Noir comes mainly from 55-year-old vines in the Hautes-Côtes de Beaune, is pressed directly off the skins and fermented with natural yeasts, then aged up to 18 months on its fine sediment in older 350-litre barrels — never new oak, so the wood gives texture rather than flavour. The result is a pale, savoury rosé with unusual depth.","pairings":"Gougères, jambon persillé, shellfish, crab and lobster, sushi, soft cheeses, roast poultry and salade niçoise.","producer_note":"Pierre-Yves Colin-Morey is based in Chassagne-Montrachet and is one of white Burgundy's defining producers. His exacting, barrel-raised style extends to this rosé.","photo_credit":"Photo: M.S Cellars (pictured bottle shows the 2024 vintage; listed vintage is 2022)","has_photo":true,"also_in":[]},{"id":197,"number":"01","section":"Magnums","subsection":null,"title":"Gamay, 'Bibine' — Domaine Bulliat, Beaujolais-Villages 2022","price":"Magnum 1.5L — $160 (Riviera)","menu_note":"","region":"Beaujolais-Villages AOC, France","grape":"100% Gamay","producer":"Domaine Bulliat","style":"Magnum 1.5L — red, juicy organic Villages","alcohol":"≈13%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":2,"tannins_label":"Low","tasting_notes":"strawberry, raspberry, cherry, lavender, sage, tea, black pepper, granitic, stony","story":"Domaine Bulliat is a seventh-generation family estate run by father-and-son Noël and Loïc Bulliat, with parcels across eight Beaujolais appellations on granite and schist soils. Bibine is 100% Gamay from organically farmed vines, fermented cool in stainless steel with carbonic-influenced whole berries, then rested about four and a half months on its fine sediment in concrete — no oak at all. It is made to drink young, and the magnum will evolve a touch more gracefully than a bottle.","pairings":"Charcuterie and pâtés, herb-roasted chicken, grilled pork, confit duck, soft cheeses, beet and goat-cheese salads — a magnum built for a full table.","producer_note":"Domaine Bulliat — a family estate since 1978 under Noël Bulliat (Loïc joined in 2005), now 27 hectares across eight appellations, organic since 2010. Bibine is its calling card.","photo_credit":"Photo: Wine.com (pictured bottle shows the 2023 vintage; listed vintage is 2022)","has_photo":true,"also_in":[]},{"id":198,"number":"02","section":"Magnums","subsection":null,"title":"Garnacha Blend, 'Bru' — Mas Martinet, Priorat 2021","price":"Magnum 1.5L — $265 (Riviera)","menu_note":"","region":"Priorat DOCa, Catalonia, Spain","grape":"Garnacha, Syrah, Mazuelo (roughly equal thirds)","producer":"Mas Martinet","style":"Magnum 1.5L — red, organic village Priorat","alcohol":"≈ 13%","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":3,"tannins_label":"Medium","tasting_notes":"blackberry, compote red fruits, cocoa, lavender, Mediterranean herbs, slate mineral, spice","story":"Mas Martinet is one of the five founding estates of Priorat's modern revival, run today by Sara Pérez — one of Spain's most respected winemakers. Bru is its village-level red, from the Mas d'en Seró vineyard near Falset: roughly equal parts Garnacha, Syrah and Mazuelo grown on the region's famous slate soils, farmed organically and aged as a crianza. The 2021 was called one of the finest vintages of Bru by Wine Advocate's Luis Gutiérrez. Low yields give even this entry wine real concentration.","pairings":"Grilled ribeye, beef tenderloin, lamb, game stews and slow-braised dishes, aged Manchego, cured meats and hearty mushroom preparations — a magnum centrepiece for a meat-led table.","producer_note":"Mas Martinet Viticultors — one of the five founding estates of the modern Priorat revival of the 1980s–90s, run by Sara Pérez and her family alongside the flagship Clos Martinet.","photo_credit":"Photo: Liquor Store Online (pictured bottle shows the 2020 vintage; listed vintage is 2021)","has_photo":true,"also_in":[]},{"id":199,"number":"03","section":"Magnums","subsection":null,"title":"Chardonnay, 'Cuvée du Père Neige' — Laurent Ponsot, Bourgogne 2019","price":"As printed on the menu: Chardonnay, 'Cuvee du Pere Neige' Laurent Ponsot, Bourgogne, France (2019).","menu_note":"Magnum 1.5L — $315 (Riviera)","region":"Burgundy, France (Bourgogne AOC)","grape":"100% Chardonnay","producer":"Laurent Ponsot","style":"Magnum 1.5L — white, minimalist Bourgogne Blanc","alcohol":"≈ 13%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"white orchard fruit, citrus peel, white flowers, chalky, poised, dry","story":"Laurent Ponsot ran the legendary Domaine Ponsot of Morey-Saint-Denis for decades before leaving in 2017 to start his own négociant house with his son Clément. His style carries over: late harvesting, natural yeasts, very little sulphur and zero new oak — white Burgundy kept as pure and unadorned as possible. No published tasting note exists for the 2019 Cuvée du Père Neige specifically; this describes it in its 2019 mould, a ripe but structured Bourgogne Blanc from a tiny, high-quality crop — 2019 was roughly half a normal harvest after spring frost and summer drought.","pairings":"Roast chicken, sole meunière, lobster and shellfish, creamy mushroom dishes, Brie and Brillat-Savarin, charcuterie — a magnum of Bourgogne Blanc is ideal for seafood-led sharing plates.","producer_note":"Laurent Ponsot, the longtime head of Domaine Ponsot, founded his own house in Gilly-lès-Cîteaux in 2017 with his son Clément, sourcing fruit from top sites across the Côte.","photo_credit":"Photo: Vinibianchirossi (pictured bottle shows the 2018 vintage; listed vintage is 2019)","has_photo":true,"also_in":[]},{"id":200,"number":"04","section":"Magnums","subsection":null,"title":"Cabernet Franc, 'Violette' — Clau de Nell, Anjou 2020","price":"Magnum 1.5L — $345 (Riviera)","menu_note":"","region":"Anjou AOC, Loire, France","grape":"Cabernet Franc 65%, Cabernet Sauvignon 35%","producer":"Clau de Nell (Leflaive family)","style":"Magnum 1.5L — red, biodynamic","alcohol":"~13%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":3,"tannins_label":"Medium","tasting_notes":"red plum, black cherry, red currant, rhubarb, crushed stone, forest floor, dried porcini, long savoury finish","story":"Clau de Nell is the Loire outpost of the Leflaive family of Puligny-Montrachet fame — Anne-Claude Leflaive bought this 10-hectare Anjou estate in 2008. The 2020 Violette is 65% Cabernet Franc and 35% Cabernet Sauvignon from vines up to 70 years old, farmed biodynamically since 2000. The hand-picked grapes are left to soak gently for 30 days — a slow 'infusion' rather than hard extraction — then aged 12 months before bottling. Wine Enthusiast praised its savoury, mushroom-edged depth.","pairings":"Vegetables, mushroom-based sauces, white-meat dishes, roast pork, duck, lentil and root-vegetable dishes, semi-aged goat and sheep cheeses — a magnum built for a long, shared table.","producer_note":"The Loire project of the Leflaive family of Puligny-Montrachet — Anne-Claude Leflaive, one of Burgundy's great figures, bought the estate with her husband in 2008. Fully Demeter-certified biodynamic since 2000.","photo_credit":"Photo: Lebendige Weine (pictured bottle shows the 2019 vintage; listed vintage is 2020)","has_photo":true,"also_in":[]},{"id":201,"number":"05","section":"Magnums","subsection":null,"title":"Tempranillo Blend, Rioja Reserva — Remelluri, Rioja 2005","price":"Magnum 1.5L — $425 (Riviera)","menu_note":"","region":"Rioja DOCa, Rioja Alavesa, Spain","grape":"Tempranillo-led (~80%) with Garnacha and Graciano","producer":"Granja Nuestra Señora de Remelluri","style":"Magnum 1.5L — red, Rioja Reserva","alcohol":"≈ 13.5%","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":3,"tannins_label":"Medium","tasting_notes":"ripe berries, hazelnuts, spice, tobacco, clean, defined, long lively finish","story":"Granja Nuestra Señora de Remelluri has been owned by the Rodríguez family since 1967 and is run by Telmo Rodríguez, one of Spain's most influential winemakers. Its high-altitude vineyards around Labastida are divided into some 150 separately vinified plots — a Burgundian, terroir-first approach rare in Rioja. The Reserva spends 21 months in wood and over five years in bottle before release. The 2005 earned 94 points from Wine Advocate, James Suckling and Tim Atkin — a unanimous score across all three.","pairings":"Roast lamb, grilled ribeye, oxtail, aged Manchego and Idiazábal, mushroom tagliatelle, rabbit with herbs — a magnum statement bottle for a celebration table.","producer_note":"Granja Nuestra Señora de Remelluri — owned by the Rodríguez family since 1967, some 86–100 organically farmed hectares around Labastida in Rioja Alavesa.","photo_credit":"Photo: Volver (pictured bottle shows the 2012 vintage; listed vintage is 2005)","has_photo":true,"also_in":[]},{"id":202,"number":"06","section":"Magnums","subsection":null,"title":"Syrah, 'Les Bâties' — Dard et Ribo, Crozes-Hermitage 2023","price":"As printed on the menu: Syrah, 'Les Bâties' Dard et Ribo, Crozes-Hermitage, France (2023).","menu_note":"Magnum 1.5L — $460 (Riviera)","region":"Crozes-Hermitage AOC, Northern Rhône, France","grape":"100% Syrah (old vines, some from 1923)","producer":"Dard et Ribo","style":"Magnum 1.5L — red, natural Syrah","alcohol":"","body":4,"body_label":"Full","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"raspberry, strawberry, smoke, red fruits, savoury, pepper, juicy, structured","story":"René-Jean Dard and François Ribo are two of the northern Rhône's pioneering natural winemakers, working organically and biodynamically since the 1980s. Les Bâties is a 2.5-hectare parcel of old vines — some planted in 1923 — on red clay and rolled stones at Larnage. A high proportion of whole bunches (grapes fermented with their stems still on) gives the wine its savoury, spicy edge; it spends 10 months in used 600-litre oak casks and is bottled unfined and unfiltered.","pairings":"Duck breast, venison, lamb chops, charcuterie, mushroom and lentil dishes, hard mountain cheeses — the pepper and whole-bunch spice also flatter Middle Eastern-spiced dishes. A magnum for a meat-led group dinner.","producer_note":"Dard et Ribo, based at Tain-l'Hermitage — natural-wine pioneers of the northern Rhône since the 1980s, making pure whole-bunch wines from Crozes-Hermitage, Saint-Joseph and Cornas.","photo_credit":"Photo: Cave de Chaz","has_photo":true,"also_in":[]},{"id":203,"number":"07","section":"Magnums","subsection":null,"title":"Pinot Noir Blend, 'Eugène' — Moussé Fils, Champagne NV","price":"As printed on the menu: Pinot Noir+, 'Eugene' Moussé, Chatillon-sur-Marne, Champagne, France (NV). Note: the wine is 80% Meunier, 20% Pinot Noir — a blanc de noirs; the '+' correctly signals a blend.","menu_note":"Magnum 1.5L — $475 (Riviera)","region":"Champagne AOC, Vallée de la Marne, France","grape":"Meunier 80%, Pinot Noir 20%","producer":"Champagne Moussé Fils","style":"Magnum 1.5L — extra-brut Champagne, perpetual cuvée","alcohol":"12.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"red fruits, quince, candied citrus, hazelnut, bread crust, dried flowers, fine bubbles, mineral tension","story":"Eugène is not a normal non-vintage Champagne — it is a 'perpetual cuvée.' Moussé keeps a reserve of wine going back to 2003 and tops it up each year with half of the new harvest, so every glass holds two decades of vintages. It is 80% Meunier — the Vallée de la Marne's signature grape — with 20% Pinot Noir, given a very low extra-brut dosage, so it stays taut and savoury. The cuvée was created to mark the house's centenary, named for founder Eugène Moussé.","pairings":"The house suggests international street food — pizza, focaccia, burgers, tacos, samosas — plus fried chicken, charcuterie, sushi and soft cheeses; the acidity and fine bubbles cut through fried and rich dishes. A magnum opened tableside is theatre.","producer_note":"Champagne Moussé Fils, founded in 1923 by Eugène Moussé, now in its fourth generation at Cuisles in the Vallée de la Marne — a standard-bearer for Meunier.","photo_credit":"Photo: Halles de Quercamps","has_photo":true,"also_in":[]}];

      var AMARO_INTRO = "Amaro is the Italian word for bitter. But it's also so much more, as this is a category of spirits that range wildly in flavour profile.\n\nThey can be sweet(ish) & syrupy or bitter & dry, with a range of flavours from floral to citrusy, vegetal to woody, and from aromatic and herbaceous to invigorating and medicinal.\n\nThere are 4 key elemental groups that typically make up an amaro :\n1.) Alcohol : usually mild in flavour, like neutral grain spirits or high proof vodka.\n2.) Bittering Agent : typically things like various roots, barks, flowers, seeds & nuts.\n3.) Flavouring Agent : typically citrus peels, anise, flowers & menthol\n4.) Sweetener : typically molasses, beet molasses, sugar or honey to balance the bitterness and make the spirit enjoyable (to varying degrees!)\n\nOr, as they say in Italy, if a spirit is the same colour as the sunset, it is an aperitivo. And if it is the colour of night it is an amaro.";
      var AMARI = [{"name":"Amaro Amara","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"9","region":"Sicily, Italy","abv":"30%","tasting_notes":"Candied orange, licorice, herbs, and clove with floral, fruity notes. Rich and bittersweet on the palate with a long finish.","ingredients":"IGP Sicilian blood orange peels, herbs from the slopes of Mount Etna.","notes":"","producer":"Made by Rossa Sicily, founded in 2014 by Edoardo Strano on his family's citrus estate on the slopes of Mount Etna. Built on hand-peeled IGP Sicilian blood oranges in small batches.","has_photo":true,"photo_credit":"ilvinaiodiviamussi.it (https://ilvinaiodiviamussi.it/product/amara/Mr6eN7jq)"},{"name":"Amaro Averna","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"8","region":"Sicily, Italy","abv":"34%","tasting_notes":"cola, orange peel, licorice, and vanilla. Sweet, with soft and subtle bitter","ingredients":"lemon & orange essential oils, pomegranate","notes":"in the cocktail world this amaro's shining moment is the Black Manhattan, where it is subbed in for the sweet vermouth, resulting in a very smooth, rich cocktail. But it's also a bartender favourite when looking to add a velvety bittersweetness to a drink, as it's texture is really quite lovely.","producer":"Made by Fratelli Averna in Caltanissetta, Sicily, since 1868, when Salvatore Averna was gifted the recipe by a Benedictine monk.","has_photo":true,"photo_credit":"tastingroom.bg (https://tastingroom.bg/%D1%84%D0%B8%D0%BB%D1%82%D1%8A%D1%80/alc/29/)"},{"name":"Amaro Chianciano","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"8","region":"Tuscany, Italy","abv":"16%","tasting_notes":"this amaro is broad and rich & refined. Balanced between bitter and sweet, with persistent notes of rhubarb & licorice. The aftertaste is pleasantly medicinal.","ingredients":"34 secret ingredients","notes":"this is also a favourite of mine. Super elegant, and wonderful alongside chocolate desserts, or with an espresso (alternating sips of each is pretty heavenly)","producer":"A Tuscan amaro made from 34 secret ingredients. Broad, rich, and refined — wonderful alongside chocolate desserts or with an espresso.","has_photo":true,"photo_credit":"santonitoscana.it (producer) (https://www.santonitoscana.it/shop/)"},{"name":"Amaro Dell' Etna","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"10","region":"Sicily, Italy","abv":"29%","tasting_notes":"nose features herbaceous hits, followed by notes of orange & vanilla. On the palate there is just the right amount of bitterness, mitigated beautifully by the nuances of cinnamon & orange. The aftertaste has subtle and pleasant waves of cocoa.","ingredients":"local bitter orange (from Etna), orange blossom, licorice, wormwood, aloe, gentian, quassia, cinchona, saffron, rhubarb, angelica, myrrh, vanilla, cinnamon","notes":"","producer":"A Sicilian amaro built around bitter oranges grown on the volcanic slopes of Mount Etna, with orange blossom, saffron, and rhubarb.","has_photo":true,"photo_credit":"mixedculturebeershop.com (https://mixedculturebeershop.com/products/amaro-delletna)"},{"name":"Amaro Di Angostura","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"8","region":"Trinidad & Tobago","abv":"35%","tasting_notes":"Unmistakably Angostura on the nose — nutmeg, cardamom, bitter orange peel, licorice, black pepper, and cinnamon, rooty like a handcrafted root beer. The palate starts sweet with caramel and crème brûlée, then the spice and bitterness build through the middle to a very long, warm finish.","ingredients":"The Angostura bitters botanical base (secret recipe), neutral spirit, and Caribbean spices.","notes":"","producer":"Made by the House of Angostura in Trinidad & Tobago — the same company behind the famous aromatic bitters. The amaro is built on that bitters base, macerated for about three months.","has_photo":true,"photo_credit":"bauturialcoolice.ro (https://bauturialcoolice.ro)"},{"name":"Amaro Eroico","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"10","region":"Calabria, Italy","abv":"28%","tasting_notes":"Soft and balanced, with a spicy, fresh opening and a balsamic finish carried by a lingering citrus note.","ingredients":"Bitter orange, gentian, china bark, rosemary, oregano, juniper, bergamot, mandarin, red orange, Sorrento lemon, almond, Calabrian licorice.","notes":"","producer":"Made by Essentia Mediterranea in Calabria. Every botanical is gathered through the year and cold-infused separately to keep the flavors fresh.","has_photo":true,"photo_credit":"robbreport.it (https://robbreport.it/amaro-eroico-la-proposta-di-essentia-mediterranea-per-un-viaggio-nei-cinque-sensi/)"},{"name":"Amaro Leon","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"11","region":"Trentino, Italy","abv":"33%","tasting_notes":"a ripe fruit aroma leaps out of the glass, followed quickly by the more bittering agents, but not so much that it overwhelms the rich, elegant sweetness this displays on the mouthfeel.","ingredients":"gentian, rhubarb, angelica, dandelion. There are 45 ingredients altogether, mostly native to the Veneto region.","notes":"this amaro begins life as a grappa that is then aged in bourbon barrels before being aromatized. It is extremely elegant & easygoing, something any newbie or seasoned amaro drinker can enjoy.","producer":"Made by Castagner. It starts life as grappa, aged in bourbon barrels, then aromatized with 45 botanicals — extremely elegant and easygoing.","has_photo":true,"photo_credit":"lebarbatelle.com (https://www.lebarbatelle.com)"},{"name":"Amaro Lucano","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"8","region":"Basilicata, Italy","abv":"28%","tasting_notes":"medium sweetness with herbal bitterness and notes of cinnamon, licorice and caramel","ingredients":"aloe ferox (a large flowering evergreen indigenous to South Africa, used in various medicinal treatments), angelica root (a flowering plant that grows pretty much all over the world, used to treat digestive and sometimes circulatory issues), bitter orange, blessed thistle (a flowering plant native to the Mediterranean that is commonly used for digestive purposes), elderberry (dark purple berries of the elder tree, commonly used to battle colds & flu), gentian, rue (the leaves of this plant are often used to relieve ear aches and headaches), sage, wormwood (the primary ingredient in both absinthe and sweet vermouth, again an aid in digestion)","notes":"Amaro Lucano is one of the few amaro that reveal almost all their ingredients, but knowing what's in it doesn't really help the amateur amaro maker. It's all in the balance and the blending, and in the case of amaro Lucano that results in something super approachable in terms of drinking straight or incorporating in cocktails, like we do in the Riviera Whiskey Sour.","producer":"Made by Amaro Lucano in Basilicata since 1894. One of the few amari that reveals almost all of its ingredients.","has_photo":true,"photo_credit":"coqtail.com (https://www.coqtail.com/friends-of-lucano-animano-world-amaro-day-2025/)"},{"name":"Amaro Mazardo","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"11","region":"Trentino, Italy","abv":"30%","tasting_notes":"aromatic and herbaceous, both bitter and fresh with highlights of gentian. The finish shows persistent notes of rhubarb & chamomile.","ingredients":"alpine rhubarb, gentian, white briony (a flowering vine found in Europe & Northern Iran, it is used medicinally for gastrointestinal, respiratory & rheumatic disorders), chamomile, fennel, holy thistle, galega (native to Northern Africa, Western Asia and Europe, its properties are used in blood glucose lowering activity), yarrow (a flowering plant whose uses include the aid of digestion and the easing of menstrual cramps)","notes":"","producer":"Made by Marzadro in Trentino from alpine botanicals including alpine rhubarb, gentian, chamomile, and fennel.","has_photo":true,"photo_credit":"clusa.ro (https://clusa.ro/amaro-marzadro-0-700-l)"},{"name":"Amaro Meletti","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"10","region":"Marche, Italy","abv":"32%","tasting_notes":"floral with hints of rose, lavender and citrus fruits. The taste is simultaneously creamy with hits of bitter orange. And the aftertaste has just the right amount of lingering bitterness to bite and remind you you're drinking an amaro.","ingredients":"bitter orange, cloves, gentian and saffron from the Sibillini mountains","notes":"simply put Amaro Meletti is spectacular and is a huge crowd pleaser. We've served it to many many folks at Riviera and everyone has loved it. Definitely one to keep in your back pocket when you feel you have an Amaro newbie who wants to be taken on a journey.\n\ngeography played a big part in the success story of Meletti, as it is made in a town in the Le Marche region of Italy, which is neatly tucked in a river valley between the Apennine Mountain range and the Adriatic Sea. Combining access to alpine herbs, and the fact that the town was along the Via Salaria, known to us as the \"salt road\" meant that this beautiful spirit had ample opportunity to traverse trade routes and allow the world to fall in love with it.","producer":"Made by Meletti in Ascoli Piceno, Marche, since 1871, in a river valley between the Apennine mountains and the Adriatic Sea.","has_photo":true,"photo_credit":"shoplightspeed retailer (no source page returned)"},{"name":"Amaro Montenegro","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"8","region":"Emilia-Romagna, Italy","abv":"23%","tasting_notes":"floral, with notes of bitter orange, mint and licorice. Warming spice notes from clove, cinnamon and nutmeg bring up the rear of the palate, in a super welcoming way.","ingredients":"orange peel & vanilla","notes":"this amaro has a lighter, sweeter flavour profile than many. It is a great introductory amaro, and very versatile in cocktails, as like Amaro Nonino it can stand in for vermouth in many classic cocktails.\n\nnamed after Princess Elena of Montenegro, who later became Queen of Italy (and something of a celebrity in her time), Montenegro is the best selling amaro in Italy, and pretty much any bar or restaurant making any kind of nod to amaro will have a bottle on the back bar","producer":"Named after Princess Elena of Montenegro, later Queen of Italy. The best-selling amaro in Italy — lighter and sweeter than most, and very versatile in cocktails.","has_photo":true,"photo_credit":"stmenu.it (https://stmenu.it/categorie/amari,73504/)"},{"name":"Amaro Nepeta","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"9","region":"Sicily, Italy","abv":"28%","tasting_notes":"strikingly fresh and vibrant, due to the prevalence of citrus and bright herb notes. Once those notes from the first sip fades, there is a compelling underlying bitterness. It's slight, but just enough to give this amaro a complexity that makes it quite interesting.","ingredients":"nepitella (an herb native to southeastern Sicily that is in the mint family, but flavour wise falls between mint & oregano), Siracusa lemon peels, and a mix of bitter Sicilian herbs","notes":"to sum up, this is definitely a category one amaro. One I feel that alongside the Jefferson would be an excellent match for the pavlova. Or a great one to help initiate newbies into the wide world of amaro.","producer":"A small-production Sicilian amaro built around nepitella, a wild mint-family herb native to southeastern Sicily, plus Siracusa lemon peels and bitter Sicilian herbs.","has_photo":true,"photo_credit":"monlacata.es (https://monlacata.es/producto/amaro-nepeta-50cl/)"},{"name":"Amaro Nonino","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"9","region":"Friuli-Venezia Giulia, Italy","abv":"35%","tasting_notes":"subtle, herbal bitterness and gentle spice with dominant notes of orange peel and caramel sweetness.","ingredients":"bitter orange peel, cinchona bark (originally used to treat malaria, as it contains quinine), galangal (a root spice closely related to ginger & turmeric), gentian (a root commonly used to aid digestion), licorice, quassia (a tropical plant whose leaves and sometimes bark are used for medicinal, digestive purposes), rhubarb root, saffron (a spice often used in cooking for both colour and bitter, slightly metallic taste), tamarind (pod like fruits that contain a sweet, tangy pulp commonly used in world cuisine)","notes":"Amaro Nonino is very much on the gentler, mellower end of the amaro spectrum, so much so that it can be used almost in place of sweet vermouth, especially in a cocktail like a Manhattan, as the whiskey holds enough sweetness to make it work.","producer":"Made by the Nonino family distillers in Friuli. One of the gentlest, mellowest amari — it can stand in for sweet vermouth in cocktails like a Manhattan.","has_photo":true,"photo_credit":"giorgio-ferrari.com (https://www.giorgio-ferrari.com/products/nonamainf00700)"},{"name":"Amaro Punico","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"12","region":"Sicily, Italy","abv":"30%","tasting_notes":"citrus notes are the first things that leap out of the glass. That taste is super balanced and mellow. The aftertaste is slightly bitter and vegetal.","ingredients":"wild fennel, mint, sage, laurel, rosemary, oregano, cinnamon, cloves, star anise, coriander, licorice, cinchona roots.","notes":"This amaro is towards the end of category one. Something for someone who's had a few of the LCBO available amaros, and is ready to take a small step forward.","producer":"A Sicilian amaro built on wild Mediterranean herbs — fennel, mint, sage, laurel, rosemary, and oregano. A good small step up for drinkers ready to move past the basics.","has_photo":true,"photo_credit":"reliquo.com (https://reliquo.com/de/produkt-kategorie/destillate/bitter/)"},{"name":"Amaro Salvano Dli Amis","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"11","region":"Sicily, Italy","abv":"26%","tasting_notes":"Specific tasting notes weren't available for this lesser-known label. Expect a balanced, warming profile in line with the rest of this camp.","ingredients":"","notes":"","producer":"Made by Salvano in Italy. A lesser-known label with little published information — it sits at the gentler end of this camp at 26% ABV.","has_photo":false,"photo_credit":""},{"name":"Amaro Seta","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"12","region":"Lombardy, Italy","abv":"30%","tasting_notes":"Soft and gentle — saffron, vanilla, mulberry, rose petal, and cardamom, with candied orange and white peach. Full and slightly syrupy, with a mild herbal bitterness on the finish. Very easygoing — a good first amaro.","ingredients":"Not published — tasting suggests saffron, bitter orange, mulberry, rose petal, and cardamom.","notes":"","producer":"Made by Seteria Bellieni 1954 of Como — a historic silk company from the Lake Como area ('seta' means silk) that also makes this amaro.","has_photo":true,"photo_credit":"monlacata.es (https://monlacata.es/producto/amaro-seta/)"},{"name":"Amaro Toscana","camp":"Balanced, Warming (& Sometimes Softly Aromatic)","price":"10","region":"Tuscany, Italy","abv":"30%","tasting_notes":"this is definitely one of the more balanced amaro on the market. Spice notes are followed in quick succession by herbaceous notes and a nice subtle caramel sweetness.","ingredients":"top secret, but there are 27 medicinal plants native to the Tuscan woods involved.","notes":"this amaro does quite a few things well, and would definitely be an easy one to recommend to customers who are new to amaro but seem open minded.","producer":"A Tuscan amaro made with 27 medicinal plants native to the Tuscan woods. One of the most balanced amari on the market.","has_photo":true,"photo_credit":"culinarium.to (https://www.culinarium.to/produ
