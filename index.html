<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Wine List — Riviera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f2;
        --surface: #ffffff;
        --surface-2: #f3ede3;
        --ink: #221c15;
        --ink-2: #5c5347;
        --ink-3: #8a7f70;
        --line: #e3dacb;
        --accent: #7c2231;
        --accent-soft: #f3e3e1;
        --gold: #a07d2c;
        --chip-bg: #efe8db;
        --shadow: 0 10px 30px rgba(60, 40, 20, 0.14);
        --header-bg: rgba(250, 247, 242, 0.92);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171310;
          --surface: #221d18;
          --surface-2: #2a241e;
          --ink: #f0e9dd;
          --ink-2: #c4b9a7;
          --ink-3: #948a7a;
          --line: #3a332a;
          --accent: #d98a97;
          --accent-soft: #3a232a;
          --gold: #c9a44e;
          --chip-bg: #2a241e;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
          --header-bg: rgba(23, 19, 16, 0.92);
        }
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Karla", system-ui, -apple-system, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3, .serif { font-family: "Cormorant Garamond", Georgia, serif; }

      /* ---------- header ---------- */
      header {
        position: sticky; top: 0; z-index: 40;
        background: var(--header-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .header-inner { max-width: 1180px; margin: 0 auto; padding: 14px 18px 10px; }
      .brand-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
      .brand-row h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: 0.01em; }
      .brand-row .sub { color: var(--ink-2); font-size: 14px; }
      .search-row { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
      .search-box { position: relative; flex: 1; }
      .search-box svg {
        position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
        width: 18px; height: 18px; stroke: var(--ink-3); pointer-events: none;
      }
      #search {
        width: 100%; padding: 11px 38px 11px 38px;
        border: 1px solid var(--line); border-radius: 10px;
        background: var(--surface); color: var(--ink);
        font: inherit; font-size: 16px; outline: none;
      }
      #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      #clear-search {
        position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
        border: 0; background: transparent; color: var(--ink-3); cursor: pointer;
        font-size: 20px; line-height: 1; padding: 6px 8px; display: none;
      }
      .result-count { color: var(--ink-2); font-size: 14px; white-space: nowrap; min-width: 0; }
      /* ---------- index (home) ---------- */
      .index-group { margin-top: 32px; }
      .index-group:first-child { margin-top: 10px; }
      .tile-list { display: grid; gap: 10px; margin-top: 14px; grid-template-columns: 1fr; }
      @media (min-width: 760px) { .tile-list { grid-template-columns: 1fr 1fr; } }
      .tile {
        display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
        background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
        padding: 16px 18px; cursor: pointer; font: inherit; color: inherit;
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      .tile:hover { border-color: var(--accent); transform: translateY(-1px); }
      .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .tile .t-name { flex: 1; min-width: 0; font-family: "Cormorant Garamond", Georgia, serif; font-size: 20.5px; font-weight: 600; line-height: 1.25; }
      .tile .t-count { color: var(--ink-3); font-size: 14px; white-space: nowrap; }
      .tile .t-arrow { color: var(--accent); font-size: 19px; flex: 0 0 auto; }
      .back-btn {
        font: inherit; font-weight: 700; font-size: 14.5px; cursor: pointer; color: var(--accent);
        background: transparent; border: 1px solid var(--accent); border-radius: 999px;
        padding: 8px 16px; margin-top: 20px;
      }
      .back-btn:hover { background: var(--accent-soft); }
      .back-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* ---------- text cards (cocktails, amari) ---------- */
      .list-card {
        display: block; text-align: left; width: 100%;
        background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
        padding: 15px 16px; cursor: pointer; font: inherit; color: inherit;
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      .list-card:hover { border-color: var(--accent); transform: translateY(-1px); }
      .list-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .card-note { display: block; color: var(--ink-2); font-size: 13.5px; font-style: italic; margin-top: 3px; }
      .cocktail-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
      .cocktail-oz {
        flex: 0 0 auto; font-size: 13px; font-weight: 700; white-space: nowrap;
        color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 9px;
      }
      .ing-preview {
        display: block; color: var(--ink-2); font-size: 13.5px; margin-top: 8px; line-height: 1.5;
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      }

      /* ---------- sheet lists & prose ---------- */
      .spec-list { margin: 0; padding: 0; list-style: none; }
      .spec-list li { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15.5px; }
      .spec-list li:last-child { border-bottom: 0; }
      .step-list { margin: 0; padding-left: 21px; }
      .step-list li { font-size: 15.5px; line-height: 1.55; margin-bottom: 7px; }
      .prose { max-width: 780px; margin-top: 18px; }
      .prose p { font-size: 16px; line-height: 1.65; margin: 0 0 14px; white-space: pre-line; }

      /* ---------- amaro cards ---------- */
      .price-pill {
        flex: 0 0 auto; font-size: 13.5px; font-weight: 700; white-space: nowrap;
        color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px;
      }

      /* ---------- province subgroups (Gin — Canada) ---------- */
      .subsection-head .count {
        color: var(--ink-3); font-size: 14px; font-weight: 400;
        font-family: "Karla", system-ui, sans-serif; letter-spacing: 0;
      }

      /* ---------- layout ---------- */
      main { max-width: 1180px; margin: 0 auto; padding: 8px 18px 70px; }
      section.wine-section { margin-top: 34px; scroll-margin-top: 150px; }
      .section-head { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
      .section-head h2 { margin: 0; font-size: 27px; font-weight: 700; }
      .section-head .count { color: var(--ink-3); font-size: 14px; }
      .subsection-head {
        margin: 22px 0 4px; font-size: 19px; font-weight: 600; color: var(--accent);
        font-family: "Cormorant Garamond", Georgia, serif; letter-spacing: 0.02em;
      }
      .grid {
        display: grid; gap: 14px; margin-top: 16px;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      }
      @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }

      /* ---------- wine card ---------- */
      .card {
        display: flex; gap: 14px; text-align: left; width: 100%;
        background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
        padding: 14px; cursor: pointer; font: inherit; color: inherit;
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      .card:hover { border-color: var(--accent); transform: translateY(-1px); }
      .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .thumb {
        flex: 0 0 74px; width: 74px; height: 118px; border-radius: 8px;
        background: var(--surface-2); overflow: hidden;
        display: flex; align-items: center; justify-content: center;
      }
      .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
      .thumb .no-photo { text-align: center; padding: 6px; }
      .thumb .no-photo .bottle-glyph { width: 26px; height: 44px; margin: 0 auto 4px; display: block; }
      .thumb .no-photo span { font-size: 10px; color: var(--ink-3); letter-spacing: 0.04em; text-transform: uppercase; }
      .card-body { flex: 1; min-width: 0; }
      .card-top { display: flex; gap: 8px; align-items: baseline; }
      .card-num {
        font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700;
        color: var(--gold); font-size: 17px; flex: 0 0 auto;
      }
      .card-title { font-size: 19px; font-weight: 600; line-height: 1.25; margin: 0; }
      .card-price { color: var(--accent); font-weight: 700; font-size: 14.5px; margin-top: 3px; }
      .card-meta { color: var(--ink-2); font-size: 13.5px; margin-top: 4px; line-height: 1.45; }
      .card-notes {
        color: var(--ink-2); font-size: 13.5px; font-style: italic; margin-top: 6px;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      }
      .scales { display: flex; gap: 16px; margin-top: 9px; flex-wrap: wrap; }
      .scale { display: flex; align-items: center; gap: 6px; }
      .scale .lbl { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
      .dots { display: inline-flex; gap: 3px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
      .dot.on { background: var(--accent); }
      .glass-badge {
        display: inline-block; margin-top: 8px; font-size: 11.5px; font-weight: 700;
        letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent);
        background: var(--accent-soft); border-radius: 999px; padding: 3px 9px;
      }

      .empty {
        text-align: center; padding: 70px 20px; color: var(--ink-2);
      }
      .empty .serif { font-size: 26px; color: var(--ink); display: block; margin-bottom: 6px; }
      .empty button {
        margin-top: 14px; font: inherit; font-weight: 700; cursor: pointer;
        background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 10px 18px;
      }
      @media (prefers-color-scheme: dark) { .empty button { color: #1d1215; } }

      footer { max-width: 1180px; margin: 0 auto; padding: 0 18px 40px; color: var(--ink-3); font-size: 13px; }

      /* ---------- detail sheet ---------- */
      .scrim {
        position: fixed; inset: 0; background: rgba(20, 12, 8, 0.55);
        opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 60;
      }
      .scrim.open { opacity: 1; pointer-events: auto; }
      .sheet {
        position: fixed; z-index: 70; background: var(--bg); color: var(--ink);
        top: 0; right: 0; height: 100dvh; width: min(560px, 100vw);
        transform: translateX(102%); transition: transform 0.25s ease;
        overflow-y: auto; box-shadow: var(--shadow);
        padding: 0 0 50px;
      }
      .sheet.open { transform: translateX(0); }
      @media (max-width: 640px) {
        .sheet { top: auto; bottom: 0; left: 0; right: 0; width: 100vw; height: 92dvh; border-radius: 18px 18px 0 0; transform: translateY(103%); }
        .sheet.open { transform: translateY(0); }
      }
      .sheet-hero {
        background: var(--surface-2); padding: 22px 22px 18px; position: relative;
        display: flex; gap: 18px;
      }
      .sheet-hero .photo {
        flex: 0 0 108px; width: 108px; height: 200px; border-radius: 10px;
        background: var(--surface); overflow: hidden; display: flex; align-items: center; justify-content: center;
      }
      .sheet-hero .photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
      .sheet-hero .photo .no-photo { text-align: center; padding: 8px; }
      .sheet-hero .photo .no-photo .bottle-glyph { width: 34px; height: 58px; margin: 0 auto 6px; display: block; }
      .sheet-hero .photo .no-photo span { font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.05em; text-transform: uppercase; }
      .sheet-hero .hero-text { flex: 1; min-width: 0; padding-top: 4px; }
      .sheet-hero .kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--gold); }
      .sheet-hero h2 { margin: 6px 0 0; font-size: 27px; line-height: 1.15; font-weight: 700; }
      .sheet-hero .price { color: var(--accent); font-weight: 700; margin-top: 8px; font-size: 16px; }
      .sheet-hero .style { color: var(--ink-2); font-style: italic; margin-top: 4px; font-size: 15px; }
      .close-btn {
        position: absolute; top: 12px; right: 12px; width: 38px; height: 38px;
        border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
        color: var(--ink); font-size: 19px; cursor: pointer; line-height: 1;
        display: flex; align-items: center; justify-content: center;
      }
      .sheet-body { padding: 20px 22px 0; }
      .menu-note {
        border: 1px solid var(--gold); color: var(--ink);
        background: color-mix(in srgb, var(--gold) 10%, transparent);
        border-radius: 10px; padding: 10px 13px; font-size: 14px; margin-bottom: 18px;
      }
      .menu-note strong { color: var(--gold); }
      .glance {
        display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
        background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
      }
      .glance div { background: var(--surface); padding: 10px 13px; }
      .glance dt { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; margin: 0; }
      .glance dd { margin: 3px 0 0; font-size: 14.5px; font-weight: 600; line-height: 1.35; }
      .glance .wide { grid-column: 1 / -1; }
      .sheet-body h3 {
        margin: 26px 0 10px; font-size: 21px; font-weight: 700;
        border-bottom: 1px solid var(--line); padding-bottom: 5px;
      }
      .profile-scale { display: flex; align-items: center; gap: 12px; margin: 9px 0; }
      .profile-scale .lbl { width: 74px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
      .profile-scale .dots .dot { width: 11px; height: 11px; }
      .profile-scale .val { font-weight: 700; font-size: 14.5px; }
      .sheet-body p { margin: 0 0 12px; font-size: 15.5px; line-height: 1.6; color: var(--ink); }
      .sheet-body p.tasting { font-size: 17px; font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 600; line-height: 1.45; }
      .also-in { display: flex; flex-wrap: wrap; gap: 8px; }
      .also-in button {
        font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
        border: 1px solid var(--accent); color: var(--accent); background: transparent;
        border-radius: 999px; padding: 6px 13px;
      }
      .also-in button:hover { background: var(--accent-soft); }
      .photo-credit { color: var(--ink-3); font-size: 12.5px; margin-top: 24px; }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .sheet, .scrim, .card { transition: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div class="brand-row">
          <h1>Riviera Wine List</h1>
          <span class="sub" id="brand-sub"></span>
        </div>
        <div class="search-row">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="search" type="search" placeholder="Search wines, cocktails, amari, spirits, beer…" autocomplete="off" aria-label="Search everything" />
            <button id="clear-search" aria-label="Clear search">×</button>
          </div>
          <span class="result-count" id="result-count" role="status"></span>
        </div>
      </div>
    </header>

    <main id="main"></main>

    <footer id="footer"></footer>

    <div class="scrim" id="scrim"></div>
    <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <div id="sheet-content"></div>
    </aside>

    <script>
      "use strict";
      var WINES = [{"id":1,"number":"01","section":"White — France","subsection":null,"title":"Piquepoul Blanc 'Poule de Pic' — Domaine la Grangette, Picpoul de Pinet 2024","price":"Bottle $100 (Riviera)","menu_note":"","region":"Picpoul de Pinet AOP, Languedoc","grape":"100% Piquepoul Blanc","producer":"Domaine la Grangette (Christelle & Matthieu Caron)","style":"Crisp, saline, refreshing white","alcohol":"13.5%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"lemon zest, tangerine, apple blossom, white orchard fruit, saline and briny thread, fleshy texture, ripe finish","story":"Picpoul de Pinet is a Languedoc appellation named for its grape, grown around the coastal lagoon of Étang de Thau, where the sea breeze gives the wines their salty edge and keeps the acidity bright. The Caron family farms sustainably between the pine forest and the sea. This bottling sees a little more skin contact than usual for the appellation, giving it extra texture and a touch more richness than the typical lip-stinging, oyster-ready Picpoul — the name is a tongue-in-cheek play on the grape's name, a pecking hen.","pairings":"Oysters and shellfish first of all — that is what it is built for — plus grilled octopus, ceviche, fried calamari, or simply as an aperitif.","producer_note":"Domaine la Grangette is run by Christelle and Matthieu Caron between the pine forest and the Mediterranean, applying sustainable practices across their vineyards and other crops. Their wines are imported into Ontario by Nicholas Pearce Wines of Toronto.","photo_credit":"Photo: Vinaglobo (vinaglobo.de).","has_photo":true,"also_in":[]},{"id":2,"number":"02","section":"White — France","subsection":null,"title":"Sémillon+ 'Hirsute' — Les Équilibristes, Bergerac 2023","price":"Bottle $100 (Riviera)","menu_note":"","region":"Bergerac AOC, Dordogne, south-west France","grape":"Sémillon 70%, Sauvignon Blanc 20%, Chenin Blanc 10% (a field blend — the menu's '+')","producer":"Les Équilibristes (François de Monval & Florent Girou)","style":"Natural, textured white","alcohol":"13.5%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"golden apple, pear, lemon zest, long subtle tartness, rich texture, slight tannic grip, lemon drop, cashew","story":"'Hirsute' means hairy in French — a nod to the wild character the makers get by letting the Sauvignon Blanc portion soak on its skins for 48 hours before pressing. Les Équilibristes is a small project by François de Monval and Florent Girou, who buy grapes from select growers each year and make tiny organic cuvées with native yeasts and minimal intervention. This one is a Sémillon-led field blend from Bergerac, bottled unfined and unfiltered — medium-bodied, fresh, and built for food.","pairings":"Seafood of all kinds, poultry, pastas, salads, and richer white-wine sauces.","producer_note":"Essentially a négoce operation: each year they purchase select grapes and make small, terroir-driven organic cuvées 'in complete synergy with the winegrower'. Their rules are simple — indigenous grapes, organic farming, native yeasts, minimal sulphur, minimal intervention in the cellar.","photo_credit":"Photo: Williams Corner (williamscorner.com; label shown is an earlier vintage).","has_photo":true,"also_in":[]},{"id":3,"number":"03","section":"White — France","subsection":null,"title":"Sylvaner 'Originel' — René Muré, Alsace 2023","price":"As printed on the menu: SYLVANNER, 'ORIGINEL' MURE, ALSACE (2023)","menu_note":"Bottle $100 (Riviera)","region":"Alsace AOC, north-eastern France","grape":"100% Sylvaner","producer":"René Muré (Famille Muré)","style":"Dry, light, fresh white","alcohol":"12.5%","body":2,"body_label":"Light","acidity":3,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"green apple, citrus, quince, honey, peach, a touch of petrol, bitter zest, apple-seed edge on the finish","story":"Sylvaner is one of Alsace's historic grapes, though plantings have shrunk as growers favoured Riesling and Pinot Gris; what remains is increasingly in the hands of estates like René Muré, who farm it organically. The 'Originel' is the domaine's entry-level Sylvaner: dry, light and unoaked, made for freshness. It is a quiet, honest white — apple, citrus and a little smokiness — more food-friendly than its modest reputation suggests.","pairings":"A lovely apéritif; a must with shellfish and asparagus dishes, and good with poultry and hard cheeses.","producer_note":"René Muré is an Alsace estate — Famille Muré — imported into Quebec by Dame-Jeanne Inc. and into Ontario by Nicholas Pearce Wines. The 'Originel' cuvée is certified organic; earlier vintages show a consistent profile of green apple, citrus and a pleasing bitter edge on the finish.","photo_credit":"Photo: Orveaux (orveaux.co.jp; label shown is the 2017 vintage).","has_photo":true,"also_in":[]},{"id":4,"number":"04","section":"White — France","subsection":null,"title":"Sauvignon Blanc — Domaine de Mauperthuis, Saint-Bris 2023","price":"Bottle $115 (Riviera)","menu_note":"","region":"Saint-Bris AOP, northern Burgundy","grape":"100% Sauvignon Blanc","producer":"Domaine de Mauperthuis","style":"Poised, mineral Burgundian Sauvignon","alcohol":"≈ 13.5%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"grapefruit, juniper, pine needle, gooseberry, peach, apricot, iodine-tinged finish, juicy citrus acids","story":"Marie-Noëlle and Laurent Ternynck have run their small domaine eight kilometres south of Chablis for about twenty years, farming with natural yeasts, small yields and a light hand. Saint-Bris is the only Burgundy appellation dedicated to Sauvignon Blanc, and it shares the Kimmeridgian limestone-marl soils of neighbouring Chablis — which is why this Sauvignon has a chalky, iodine-tinged minerality rather than a punch of New World fruit. It is a poised, citrus-driven white that drinks beautifully as an apéritif.","pairings":"Oysters and shellfish, sushi and spring rolls, gougères (cheese choux pastry), parsleyed ham, and mild cheeses — or simply as an apéritif.","producer_note":"The Ternyncks recently bought vineyards in Chablis itself (Domaine des Marronniers), rounding out a range that also includes a Chablis bottling. Their wines are imported into Ontario by Nicholas Pearce Wines.","photo_credit":"Photo: Slijterij Weijs (slijterijweijs.nl).","has_photo":true,"also_in":[]},{"id":5,"number":"05","section":"White — France","subsection":null,"title":"Aligoté — Sylvain Pataille, Bourgogne 2022","price":"As printed on the menu: 'ALIGOTE' (correct spelling: 'Aligoté')","menu_note":"Bottle $120 (Riviera)","region":"Bourgogne Aligoté AOC, Marsannay-la-Côte, Côte de Nuits","grape":"Aligoté, 100%","producer":"Domaine Sylvain Pataille","style":"Dry, precise, mineral","alcohol":"12.5%","body":2,"body_label":"Light-Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"lemon, green apple, white flowers, quince, ginger, chalky minerality, saline finish","story":"The fruit comes from two plots in Marsannay, including old vines planted in 1955 and 1961 by Pataille's own grandfather, averaging about 50 years old. The grapes are pressed directly, without sitting on their skins, and ferment on natural yeasts — two-thirds in old oak barrels (7–8 years old, so they add texture but no woody flavour) and one-third in steel tank. After about a year of ageing, a tiny amount of sulphur is added only at bottling. The domaine is farmed organically, moving toward biodynamics, with the soils worked by horse. The result is a dry, energetic white with real tension and surprising depth.","pairings":"Oysters, shellfish, ceviche and fresh goat cheese; also grilled fish, roast poultry and salads. Serve well chilled, 8–10°C.","producer_note":"Sylvain Pataille founded his domaine in Marsannay-la-Côte in 1999 with a single hectare; it now covers about 15 hectares. A respected consulting oenologist who still advises more than fifteen Burgundy domaines, he has become one of the leading figures in the revival of Aligoté as a serious wine — Jancis Robinson gave this 2022 a 17/20, calling it 'really exciting and fine'.","photo_credit":"Photo: iDealwine","has_photo":true,"also_in":[]},{"id":6,"number":"06","section":"White — France","subsection":null,"title":"Chenin Blanc 'Les Parcelles' — Arnaud Lambert, Saumur 2022","price":"Bottle $120 (Riviera)","menu_note":"","region":"Saumur AOC, Loire Valley, France","grape":"100% Chenin Blanc","producer":"Arnaud Lambert, Saint-Cyr-en-Bourg","style":"Pure, dry, mineral Chenin","alcohol":"≈ 11.5%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"tart peach, lemon and lime, quince, green apple, wet stone, chalk, honey flowers, minty herbs, clove spice","story":"Arnaud Lambert is one of the young growers who brought Saumur back to life, farming organically and keeping things simple in the cellar. This wine comes from small plots on the limestone hills around Brézé and Saint-Cyr-en-Bourg; the grapes are pressed whole, and the juice ferments on its own in stainless-steel tanks, then rests on its fine lees for about five months. It is a pure, dry Chenin — all citrus, apple and chalk — built for the table rather than the cellar. (One note: some markets sell this bottling as Vin de France rather than Saumur, so check the label on arrival.)","pairings":"Seafood, falafel sandwiches, soft cheeses and lighter poultry — and the home-turf match, Loire goat cheese.","producer_note":"Arnaud Lambert, based in Saint-Cyr-en-Bourg, is one of the driving forces behind Saumur's revival — rediscovering individual vineyard sites through organic farming and minimal-intervention winemaking. He is the son of Yves Lambert of Domaine Saint-Just, and his single-vineyard Brézé whites rank among the most celebrated Chenins of the Loire.","photo_credit":"Photo: La Cave Clandestine (lacaveclandestine.fr).","has_photo":true,"also_in":[]},{"id":7,"number":"07","section":"White — France","subsection":null,"title":"Melon de Bourgogne 'Orthogneiss' — Domaine de l'Ecu, Muscadet Sèvre et Maine 2023","price":"Bottle $125 (Riviera)","menu_note":"","region":"Muscadet Sèvre et Maine AOC, Loire Valley","grape":"100% Melon de Bourgogne","producer":"Domaine de l'Ecu (Claire & Fred Niger)","style":"Serious, saline, age-worthy Muscadet","alcohol":"≈ 12%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"citrus, iodine, pink grapefruit, white flowers, exotic fruit, toasted almond, pronounced saline finish","story":"Domaine de l'Ecu was built by Guy Bossard, one of the pioneers of organic and biodynamic farming in Muscadet — no chemicals since 1975 — and is now run by Claire and Fred Niger. The 'Orthogneiss' is named for the stony, poor rock the vines grow on; the grapes move by gravity without pumping, ferment on their own in underground concrete vats, and the wine ages on its lees before being bottled unfiltered. It is Muscadet at its most serious — saline, structured, built for the raw bar and for the cellar.","pairings":"Oysters above all — a plateau of Belons — plus fresh anchovies with oil, garlic, lemon and parsley, and seafood generally.","producer_note":"Guy Bossard was famous for few words, horse-ploughed vineyards, and biodynamic preparations; the domaine is now managed by Claire and Fred Niger. Its signature is single-soil Muscadets — Gneiss, Orthogneiss and Granite — vinified separately to express each rock.","photo_credit":"Photo: Costa dei Vini (costadeivini.com).","has_photo":true,"also_in":[]},{"id":8,"number":"08","section":"White — France","subsection":null,"title":"Grenache Blanc+ 'Comtesse Madeleine' — Château de Montfaucon, Lirac 2023","price":"As printed on the menu: GRENACHE BLANC+, CHATEAU DE MONTAUCON, LIRAC (2023)","menu_note":"Bottle $130 (Riviera)","region":"Lirac AOP, southern Rhône","grape":"Marsanne-led blend — Marsanne, Clairette, Grenache Blanc, Picpoul","producer":"Château de Montfaucon","style":"Full-bodied, creamy white","alcohol":"13–13.5%","body":4,"body_label":"Full","acidity":2,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"waxy apricot, orange peel, honey, wood spice, tangerine, melon, lime, flinty opening, herbal savouriness","story":"Château de Montfaucon sits just across the Rhône from Châteauneuf-du-Pape, run by Rodolphe de Pins — a UC Davis graduate who trained in Australia's Barossa and at Domaine du Vieux Télégraphe. The 'Comtesse Madeleine' is named for his grandmother, who ran the estate for over 70 years; it is a hand-picked, Marsanne-led blend of southern varieties, fermented partly in oak barrels and aged on its lees for eight to nine months. It is a full, creamy white — 'the meatiest of white wines,' one critic wrote — that wants rich food: think bouillabaisse or lemon-lavender roast chicken.","pairings":"Bouillabaisse is the super match, or lemon-lavender roast chicken, porchetta, and other rich savoury dishes.","producer_note":"Rodolphe de Pins owns and runs this 88-acre estate directly across the river from Châteauneuf-du-Pape; succession is underway via his son Léon, who studied agronomy and worked harvests on four continents. Everything the family owns has been certified organic since 2010.","photo_credit":"Photo: Applejack Wine & Spirits (applejack.com).","has_photo":true,"also_in":[]},{"id":9,"number":"09","section":"White — France","subsection":null,"title":"Chenin Blanc 'Chemin des Murs' — Château de Parnay, Saumur 2023","price":"As printed on the menu: 'CHEMIN DE MURS' (the producer spells it 'Chemin des Murs')","menu_note":"Bottle $130 (Riviera)","region":"Saumur Blanc AOC, Loire Valley","grape":"Chenin Blanc, 100%","producer":"Château de Parnay","style":"Rich, textured dry Chenin","alcohol":"13–13.5%","body":4,"body_label":"Medium-Full","acidity":4,"acidity_label":"Medium-High","tannins":0,"tannins_label":"None","tasting_notes":"ripe apricot, peach, spring blossom, honeysuckle, ginger, gentle honey, woody hint, caramel touch","story":"The wine comes from the estate's most famous parcel: the Clos du Chemin des Murs, a half-hectare walled vineyard created in 1886 and listed as a historic monument. Its construction is unique in the world — eleven parallel stone walls, with each vine's roots on the cool north face and its fruiting canopy on the sun-facing side, so the vine has its 'foot in the cool and belly in the sun'. That contrast is what gives the wine both richness and freshness. It ferments in barrels and ages on the fine spent yeast; the whole estate is certified organic with very limited sulphur use.","pairings":"Cured and grilled fish, langoustines, crayfish and lobster; hard cheeses such as Comté and Mimolette. Rich enough to stand in for fine white Burgundy.","producer_note":"A historic Saumur estate on the Loire, taken over in 2006 by Mathias Levron and Régis Vincenot, who set out to restore its reputation — inspired by their predecessor Antoine Cristal, the 19th-century philosopher-vigneron who opposed chemical treatments. Certified organic since 2013, on the chalky clay-limestone (tuffeau) hillsides of Saumur.","photo_credit":"Photo: Whiskysite","has_photo":true,"also_in":[]},{"id":10,"number":"10","section":"White — France","subsection":null,"title":"Auxerrois 'Pur Vin' — Pierre Frick, Alsace 2023","price":"Bottle $135 (Riviera)","menu_note":"","region":"Alsace AOC","grape":"Auxerrois, 100%","producer":"Domaine Pierre Frick","style":"Dry, textural, gently savoury natural white","alcohol":"","body":3,"body_label":"Medium","acidity":4,"acidity_label":"Medium-High","tannins":0,"tannins_label":"None","tasting_notes":"stone fruit, almond, cream, faint florals, savoury edge, bright acidity, slight natural cloudiness","story":"'Pur Vin' is Frick's range bottled with no added sulphites at all — sulphur is the standard preservative in winemaking, and leaving it out is a deliberate, riskier choice that gives a livelier, more textured wine; a slight cloudiness in the glass is normal for this style. The estate has farmed organically since 1970 and biodynamically since 1981, among the earliest in Alsace. Grapes are hand-picked, ferment on natural yeasts, and see no added sugar, no acidity tweaks and only light filtration. Expect a dry, textured, savoury white rather than a pristine fruit-bomb — classic natural Alsace.","pairings":"Scallops, tarte flambée and charcuterie; also white fish, soft cheeses and vegetarian dishes. Serve cool, not ice-cold (10–12°C).","producer_note":"Twelve generations of the Frick family have worked in Alsace; today Jean-Pierre Frick runs the 12-hectare estate with his wife Chantal and son Thomas. They made their first sulphur-free wines in 1999 and now bottle about 90% of production that way, and the domaine is cited by importers as one of the best examples of natural winemaking in Alsace.","photo_credit":"Photo: Holdenwein (pictured bottle is the 2017 'Pur Vin' Auxerrois; the menu lists 2023)","has_photo":true,"also_in":[]},{"id":11,"number":"11","section":"White — France","subsection":null,"title":"Sauvignon Blanc — Domaine Bailly-Reverdy, Sancerre 2024","price":"Bottle $135 (Riviera)","menu_note":"","region":"Sancerre AOP, Upper Loire","grape":"100% Sauvignon Blanc","producer":"Domaine Bailly-Reverdy, Bué-en-Sancerre","style":"Classic crisp Sancerre","alcohol":"12.5–13%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"citrus, white flowers, flint, ripe peach, spring blossom, saline finish","story":"Domaine Bailly-Reverdy has been in the same family since the 1950s, based in Bué-en-Sancerre, with about 23 hectares across the appellation's three great soil types: chalky marl, flint and pebbly limestone. The classic white is a blend of fruit from all three soils — hand-harvested, gently pressed and fermented with natural yeasts in temperature-controlled steel tanks, then aged on its fine lees. It is textbook Sancerre: citrus, white flowers and flint, with a long saline finish.","pairings":"Fresh chèvre or goat curd — the benchmark Sancerre match — plus oysters, grilled seabass with lemon, smoked trout, and asparagus risotto.","producer_note":"Established in the 1950s by Bernard Reverdy and now run by the third generation from Bué-en-Sancerre, farming about 23 hectares; the domaine holds some of the oldest Pinot Noir vines in Sancerre. Robert Parker singled the estate out as 'One of Sancerre's Best Producers (Outstanding).'","photo_credit":"Photo: Proidee.ch (label shown is the 2021 vintage).","has_photo":true,"also_in":[]},{"id":12,"number":"12","section":"White — France","subsection":null,"title":"Chardonnay 'Les Bruchots' — Louis Chenu (Père & Filles), Bourgogne 2022","price":"Bottle $140 (Riviera)","menu_note":"","region":"Bourgogne AOC, Savigny-lès-Beaune (Hautes Côtes)","grape":"Chardonnay, 100%","producer":"Domaine Louis Chenu Père & Filles","style":"Refined, textured organic white Burgundy","alcohol":"12.5%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"baked apple, lemon flesh, hazelnut, toast, white flowers, citrus, energetic mineral finish","story":"'Les Bruchots' is a 30-year-old Chardonnay plot toward the Hautes Côtes de Beaune, at slight altitude overlooking Savigny-lès-Beaune — a cool site more often associated with reds, which is part of the wine's interest. Certified organic and hand-harvested, it ferments on natural yeasts in old oak barrels (already used two to four times, so they give texture without adding woody flavour) and rests about a year on the spent yeast, which is never stirred — that's what keeps it fresh rather than creamy. Only about 2,500 bottles are made a year.","pairings":"Shellfish, fatty fish, soft and mild cheeses, cold meats. Serve at 10–12°C; open 15–30 minutes before serving.","producer_note":"The estate bought its first vineyard in Savigny-lès-Beaune in 1914; today it is run by Louis Chenu's great-granddaughters Juliette and Caroline Chenu, who have raised quality with an explicit focus on preserving the vineyard's ecosystem. Certified organic, working with natural yeasts throughout, and better known for its Savigny-lès-Beaune reds.","photo_credit":"Photo: Shopify-hosted wine listing (pictured bottle is the 2020; the menu lists 2022)","has_photo":true,"also_in":[]},{"id":13,"number":"13","section":"White — France","subsection":null,"title":"Clairette+ 'La Rouvière' — Martin Texier, Rhône 2024","price":"As printed on the menu: CLAIRETTE+, 'LA ROUVIERE' MARTIN TEXIER, RHONE (2024)","menu_note":"Bottle $140 (Riviera)","region":"Vin de France — northern Rhône / Ardèche border","grape":"50% Clairette, 50% Roussanne (the menu's '+')","producer":"Martin Texier","style":"Aromatic, textured natural white","alcohol":"≈ 12.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"fennel, dried grapefruit peel, quince, rose, melon rind, pistachio, riverside pebbles","story":"Martin Texier is the son of Eric Texier, the well-known northern-Rhône producer, and started his own domaine on the Ardèche border in 2014 from about five hectares of granitic slopes. This is a blend of Clairette and Roussanne — hence the '+' on the menu — fermented with natural yeasts and bottled without fining, filtration or added sulphur. It is an aromatic, textured white with a savoury, stony finish, made the way a new generation of natural winemakers makes wine.","pairings":"Roast chicken, grilled white fish, fennel- or citrus-driven dishes, and goat or sheep cheeses — flexible by the glass too.","producer_note":"Martin Texier tried other professions before settling as a winemaker on the Ardèche/northern-Rhône border in 2014. He farms about five hectares organically and also tends his father's vineyards nearby; father and son work together replanting traditional varieties better suited to a warming climate.","photo_credit":"Photo: Cellars.com.au.","has_photo":true,"also_in":[]},{"id":14,"number":"14","section":"White — France","subsection":null,"title":"Sauvignon Blanc — Daniel Chotard, Sancerre 2023","price":"As printed on the menu: SAUVIGNON BLANC, DANIEL CHOTARD, SANCERRE (2023)","menu_note":"Bottle $140 (Riviera)","region":"Sancerre AOP, Upper Loire","grape":"100% Sauvignon Blanc","producer":"Domaine Brigitte et Daniel Chotard","style":"Generous, textured Sancerre","alcohol":"12.5–13%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"tomato leaf, flint, grass, blossom, stone fruit, citrus, saline notes, long finish","story":"The Chotard family makes white, red and rosé Sancerre from their hillside vineyards in the appellation. This base cuvée gets a rounder treatment than the leanest Sancerres — about seven months partly in acacia and old oak barrels, the rest in stainless steel — which gives it extra texture and a gentle spice framing. It is still classic Sancerre at heart: grassy, citrus and stone-fruit flavours over flinty, salty minerals.","pairings":"Crottin de Chavignol and other goat cheeses, oysters and shellfish, simply grilled fish, and herb-driven dishes like asparagus or peas.","producer_note":"Domaine Brigitte et Daniel Chotard is a family estate working the Sancerre slopes with a range of lieu-dit and cuvée bottlings — whites, reds and rosés — with a strong following among drinkers (4.1/5 across 5,300+ Vivino ratings).","photo_credit":"Photo: TWDC Singapore (twdc.com.sg).","has_photo":true,"also_in":[]},{"id":15,"number":"15","section":"White — France","subsection":null,"title":"Aligoté — Alice & Olivier de Moor, Bourgogne (NV)","price":"As printed on the menu: ALIGOTE, ALICE & OLIVIER DE MOOR, CHABLIS (NV)","menu_note":"Bottle $140 (Riviera)","region":"Bourgogne Aligoté AOC, Chablis area, Burgundy","grape":"Aligoté, 100%","producer":"Domaine Alice & Olivier de Moor","style":"Vivid, high-acid, mineral natural white","alcohol":"12%","body":2,"body_label":"Light-Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"dried apricot, citrus, white flowers, mint, spice, chalky minerality, saline finish","story":"Two flags on the menu line: the menu says 'Chablis', but Chablis allows only Chardonnay, so this Aligoté is bottled as Bourgogne Aligoté from vineyards around Courgis in the Chablis area. The menu also says NV (non-vintage), but the de Moors normally release vintage-dated Aligotés, so an NV bottling is unverified. Certified organic since 2005, they farm for ripeness and do almost nothing in the cellar: the grapes are destemmed, gently pressed and left to ferment on their own natural yeasts in tank with no added sulphur, then aged about a year on the spent yeast (lees), which rounds out the texture. Expect a bright, mouthwatering white with citrus and orchard fruit — nothing like the thin Aligotés of the past.","pairings":"A superb aperitif and shellfish wine: oysters, simply prepared seafood, charcuterie, goat cheese, light salads.","producer_note":"Alice and Olivier de Moor, both trained oenologists, farm about 7 hectares around Courgis, where Olivier grew up. They chose a low-intervention direction opposite to their Chablis neighbours — Olivier mostly in the vines, Alice in the cellar. The estate makes about 30,000 bottles a year, all certified organic, and the wines are famously hard to find; many labels are drawn by Olivier himself.","photo_credit":"Photo: Flatiron Wines (pictured bottle is the 2023; the menu lists an NV bottling)","has_photo":true,"also_in":[]},{"id":16,"number":"16","section":"White — France","subsection":null,"title":"Terret Blanc+ 'Le Régal' — Le Loup Blanc, Minervois 2020","price":"As printed on the menu: TERRET BLANC+, 'LE REGAL' LE LOUP BLANC, MINERVOIS (2020)","menu_note":"Bottle $145 (Riviera)","region":"Bize-Minervois, Languedoc (bottled as Vin de France)","grape":"Terret, Grenache and Carignan blancs (and gris) — old-vine field blend","producer":"Le Loup Blanc","style":"Crisp, mineral Mediterranean white","alcohol":"13–14%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"fennel, lemon, verbena, subtle smoke, herbal essences, crystalline structure, delicately salty finish","story":"Le Loup Blanc — 'The White Wolf' — is a project begun in 2003 by four partners, including two Montrealers who run restaurants and bars back home, and winemaker Nicolas Gaignon from the Loire. They started with an old cellar with no electricity and 17 hectares of old Mediterranean vines on the edge of the Minervois, farming organically and biodynamically. 'Régal' means 'treat' in French, and this old-vine blend of Terret, Grenache and Carignan whites is exactly that: crisp, fennel-and-lemon fresh, with a delicately salty finish.","pairings":"Cod fillet with steamed vegetables, poultry with a creamy chanterelle sauce — fish, shellfish and white meats generally. Serve at 10–12°C.","producer_note":"The partners started with no electricity and 17 hectares of old vineyards, building a new winery in time for the 2015 vintage. All plots are farmed organically and biodynamically; the approach is native yeasts, little sulphur and light handling so each site shows clearly.","photo_credit":"Photo: LQRS (lqrs.com).","has_photo":true,"also_in":[]},{"id":17,"number":"17","section":"White — France","subsection":null,"title":"Chardonnay 'Les Sardines' — Domaine Robert-Denogent, Mâcon-Villages 2023","price":"Bottle $150 (Riviera)","menu_note":"","region":"Mâcon-Villages AOC, Mâconnais, southern Burgundy","grape":"Chardonnay, 100%","producer":"Domaine Robert-Denogent","style":"Mineral, textured natural white","alcohol":"13%","body":4,"body_label":"Medium-Full","acidity":4,"acidity_label":"Medium-High","tannins":0,"tannins_label":"None","tasting_notes":"candied lemon, white flowers, hazelnut, ripe peach, golden apple, lemon curd, flint, saline finish","story":"The Chardonnay comes from vines averaging about 35 years old in Verzé and Charnay-lès-Mâcon, on clay-limestone and silty clay. It then spends 20 to 25 months — nearly two years — resting on the spent yeast left over from fermentation, in a mix of old barrels, steel tanks and concrete egg vats. That long rest is what gives the wine its creamy weight and savoury depth, while the steel and concrete keep it fresh. Sulphur use is limited and the wine is never filtered. It's a natural wine that reads as serious white Burgundy rather than funky.","pairings":"Grilled fish, shellfish and oysters, roast chicken, charcuterie. A Raisin user found it perfect with padron peppers.","producer_note":"The same Fuissé family estate as the 'La Croix' Pouilly-Fuissé — Jean-Jacques, Antoine and Nicolas Robert — with 13 hectares across 30 plots. The stated aim is 'peasant' wines: respect for biodiversity, few interventions, limited sulphur, no filtration.","photo_credit":"Photo: Vins Nature","has_photo":true,"also_in":[]},{"id":18,"number":"18","section":"White — France","subsection":null,"title":"Chardonnay 'La Regalade' — Domaine Ratte, Arbois 2023","price":"Bottle $170 (Riviera)","menu_note":"","region":"Arbois AOC, Jura","grape":"Chardonnay, 100%","producer":"Domaine Ratte","style":"Pristine, mineral Jura Chardonnay in a fresh, topped-up style","alcohol":"~14%","body":4,"body_label":"Medium-Full","acidity":4,"acidity_label":"Medium-High","tannins":0,"tannins_label":"None","tasting_notes":"flint, Granny Smith apple, lemon, lime, grapefruit, white flowers, mineral, round yet elegant","story":"The Jura is famous for two styles of white: the nutty, oxidative 'sous voile' style and the fresh, Burgundian-leaning 'ouillé' style — this is the latter. 'Ouillé' simply means the barrels are kept filled to the brim the whole time, so air can't reach the wine; that's what keeps it bright, clean and fruity instead of nutty. The cuvée comes from a single biodynamically farmed parcel on fossil-rich chalk and grey marl, hand-harvested, fermented on natural yeasts with nothing added, and bottled without filtration or fining. The warm 2023 vintage makes it generous, but it keeps the domaine's trademark verve.","pairings":"Fish and seafood including oysters, roast poultry, mild cheeses and mushroom dishes. Serve at 10–12°C.","producer_note":"A 9-hectare family estate in Arbois run by Michel-Henri and Françoise Ratte with their son Quentin. The family works all its own vines, farms biodynamically (certified both AB organic and Demeter), and uses the least possible intervention in the cellar, adjusted to each vintage.","photo_credit":"Photo: Le Vin Qui Parle","has_photo":true,"also_in":[]},{"id":19,"number":"19","section":"White — France","subsection":null,"title":"Pinot Auxerrois+ 'Pinots Réserve Perpétuelle' — La Rogerie, Alsace NV","price":"As printed on the menu: PINOT AUXERROIS+, 'PINOTS PERPETUELLE' LA ROGERIE, ALSACE (NV)","menu_note":"Bottle $200 (Riviera)","region":"Alsace AOC, Niedermorschwihr","grape":"Pinot Auxerrois, Pinot Blanc + a touch of Pinot Noir, co-fermented (the menu's '+')","producer":"Domaine La Rogerie","style":"Dry, crystalline, multi-vintage white","alcohol":"","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"crystalline citrus, fine acidity, stony minerals, linear and precise, added depth from the multi-vintage reserve","story":"La Rogerie is the joint project of Justine Boxler (from the celebrated Boxler family in Alsace) and François Petit (from a Champagne growers' family) — a young domaine farming organically in both regions since 2018. This wine is built on a perpetual reserve: a large oak barrel started in 2018 that is topped up with each new vintage, with a portion drawn off for bottling — so every bottle holds several vintages. The three Pinot varieties are picked early for freshness, then allowed to go through a second, softening fermentation that most Alsace producers avoid.","pairings":"Washed-rind cheeses, roast white meats and white-sauce dishes, and fried foods — the acidity handles richness. Serve well chilled, 10–12°C.","producer_note":"Justine Boxler and François Petit built cellars in both Alsace and Champagne rather than one partner moving to the other's region, officially launching La Rogerie as a dual-region domaine in 2018. It is certified organic in both regions and closely watched — their Riesling Village 2021 scored 94/100 from Jamie Goode.","photo_credit":"Photo: Achetez du Vin (achetezduvin.fr).","has_photo":true,"also_in":[]},{"id":20,"number":"20","section":"White — France","subsection":null,"title":"Chardonnay 'La Croix' — Domaine Robert-Denogent, Pouilly-Fuissé 2023","price":"Bottle $200 (Riviera)","menu_note":"","region":"Pouilly-Fuissé AOC, Mâconnais, southern Burgundy","grape":"Chardonnay, 100%","producer":"Domaine Robert-Denogent","style":"Serious, long-aged old-vine white Burgundy","alcohol":"12.5%","body":4,"body_label":"Medium-Full","acidity":4,"acidity_label":"Medium-High","tannins":0,"tannins_label":"None","tasting_notes":"candied lemon, flint, white flowers, yellow peach, butter, honey, smoke, long mineral finish","story":"'La Croix' comes from roughly 50-year-old vines on volcanic silt and schist in Fuissé and Solutré-Pouilly, and is aged for 32 to 34 months — nearly three years — in large oak casks, barrels and egg-shaped vats. The barrels are deliberately not topped up as the wine slowly evaporates, a hands-off method that concentrates the flavour, and the spent yeast is never stirred, keeping the wine precise. It's released about three years after harvest. Pouilly-Fuissé has been entitled to Premier Cru status for its classified climats since 2020, a first for the Mâconnais. Expect a serious, age-worthy white rather than a simple Mâcon.","pairings":"Poultry and white meats, cured meats and charcuterie, pasta and creamy dishes, firm cheeses such as Comté. Serve at 12–14°C.","producer_note":"A family estate in Fuissé run by Jean-Jacques, Antoine and Nicolas Robert. It belongs to the generation of Mâconnais domaines that lifted Pouilly-Fuissé beyond its old commercial reputation through old vines, natural fermentations and patient ageing, and its wines circulate mainly through natural-wine specialists — the 2023 is rationed to six bottles per customer at one French retailer.","photo_credit":"Photo: Petites Caves (pictured bottle is the 2022; the menu lists 2023)","has_photo":true,"also_in":[]},{"id":21,"number":"21","section":"White — France","subsection":null,"title":"Chardonnay 'Les Graviers' — Bénédicte & Stéphane Tissot, Arbois 2022","price":"Bottle $235 (Riviera)","menu_note":"","region":"Arbois AOC, Jura (Montigny-lès-Arsures)","grape":"Chardonnay, 100%","producer":"Domaine André & Mireille Tissot","style":"Rich, textural, age-worthy Jura Chardonnay","alcohol":"14%","body":4,"body_label":"Medium-Full","acidity":3,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"ripe lemon, pear, yellow apple, brioche, almond, roasted hazelnut, toast, salty mineral finish","story":"'Les Graviers' means 'the gravels' — a single gravelly parcel whose stones give the wine its textural richness and minerality. It is released only in vintages where the site performs well. Fermentation and ageing happen in a mix of small and larger oak vessels, but the oak is never new and never dominant: used barrels let the wine breathe and build texture without tasting woody. Farming is biodynamic, fermentations are on natural yeasts, and tasters advise giving the wine air before serving. Like white Burgundy, but a little saltier and more savoury.","pairings":"Roast chicken (the classic match), creamy fish dishes, pasta with truffle, aged Comté. Serve at 10–12°C in a broad glass.","producer_note":"The family that defined modern Jura wine. Stéphane Tissot took over from his parents in 1990, converted the whole estate to biodynamics by 2004, and built it to roughly fifty hectares across the finest terroirs of Arbois. The range is famously deep: parcel-specific Chardonnays and Savagnins, plus Trousseau, Poulsard and Pinot Noir.","photo_credit":"Photo: Carriere Distribution","has_photo":true,"also_in":[]},{"id":22,"number":"22","section":"White — France","subsection":null,"title":"Chardonnay 'Coteau de Rosette' — Alice & Olivier de Moor, Chablis 2023","price":"As printed on the menu: 'ROSETTE' (the full cuvée name is 'Coteau de Rosette')","menu_note":"Bottle $280 (Riviera)","region":"Chablis AOC, single parcel, Courgis","grape":"Chardonnay, 100%","producer":"Domaine Alice & Olivier de Moor","style":"Rich, textured mineral Chablis","alcohol":"13.5%","body":4,"body_label":"Medium-Full","acidity":4,"acidity_label":"Medium-High","tannins":0,"tannins_label":"None","tasting_notes":"oyster shell, flint, orchard fruit, citrus, steely minerality, textured mid-palate","story":"'Coteau de Rosette' is a single steep, one-hectare, southeast-facing slope in the de Moors' home village of Courgis, with very little topsoil over Kimmeridgian marl; they planted it themselves starting in 1989, so these are among their oldest vines. The heavy clay in the soil gives a richer, more textured wine than the domaine's other Chablis. After natural-yeast fermentation in steel, it ages one year in 500-litre demi-muids (large old barrels) and a second year in foudre, is bottled unfiltered with a small addition of sulphur, and benefits from a decant if opened young.","pairings":"Oysters and shellfish (the extra texture suits richer preparations), seared scallops, roast chicken with jus, firm alpine cheeses. Serve at 12–14°C.","producer_note":"The same small, organically certified Courgis estate as the 'L'Humeur du Temps' — Alice and Olivier de Moor are leading figures in the natural-leaning Chablis movement, and their single-parcel wines sell out quickly through specialist importers in the US and Australia.","photo_credit":"Photo: Parcelle Wine (pictured bottle is the 2020; the menu lists 2023)","has_photo":true,"also_in":[]},{"id":23,"number":"23","section":"White — France","subsection":null,"title":"Gringet 'Chez Édouard' — Domaine du Gringet, Vin de Savoie 2022","price":"As printed on the menu: GRINGET, 'CHEZ EDOUARD' DOMAINE DU GRINGET, AYZE, VIN DE SAVOIE (2022)","menu_note":"Bottle $285 (Riviera)","region":"Vin de Savoie AOC, Ayze, Haute-Savoie","grape":"100% Gringet","producer":"Domaine du Gringet","style":"Taut, mineral mountain white","alcohol":"12.5–13%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"herbal notes, white-pulp fruit, floral aromatics, striking minerality, savoury bitters, very long finish","story":"Gringet is a rare white grape grown almost only around the village of Ayze in Savoie, and this wine comes from the oldest and highest vineyard there, planted in 1914 at 620 metres. Domaine du Gringet carries on the work of Dominique Belluard, the vigneron who almost single-handedly proved Gringet could make great still wine before his death in 2021. The grapes are pressed slowly over hours and aged for nine months in sandstone amphoras — big egg-shaped stone vessels — then bottled with almost no added sulphur. It is a taut, mineral mountain white with herbal notes and a very long finish.","pairings":"Raw-bar preparations, white and freshwater fish, mountain cheeses like Beaufort and Abondance, and dishes with fresh herbs. Serve at 10–12°C.","producer_note":"After Dominique Belluard's death in 2021, his partner Valérie and fellow growers — including Franck Balthazar and Jean-François Ganevat — saved the domaine; winemaking is now led by Vincent Ruiz, farming biodynamically with no chemical treatments in two decades. Production is tiny and the wines are allocated.","photo_credit":"Photo: Vino.com (label shown is the 2022 vintage).","has_photo":true,"also_in":[]},{"id":24,"number":"24","section":"White — France","subsection":null,"title":"Chenin Blanc 'Coulée de Serrant' — Famille Joly, Savennières, Loire 2023","price":"As printed on the menu: CHENIN BLANC, 'COULEE DE SERRANT' FAMILLE JOLY, SAVENNIERES, LOIRE (2023)","menu_note":"Bottle $375 (Riviera)","region":"Savennières Coulée de Serrant AOC, Loire Valley, France","grape":"100% Chenin Blanc","producer":"Famille Joly (Vignobles de la Coulée de Serrant)","style":"Dry, textured, age-worthy Chenin","alcohol":"≈ 13%","body":4,"body_label":"Full","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"conference pears, quince, fennel, honeyed wax, beeswax, orchard fruit, herbs, minerals, saline finish","story":"The vineyard behind this wine was planted by Cistercian monks nearly 900 years ago, and it is one of the very few single-vineyard appellations in France. Nicolas Joly, who runs the estate, became the world's most famous champion of biodynamic farming — the vines grow without synthetic chemicals, and the wine ferments on its own with the natural yeasts from the vineyard, ageing in large oak casks. It is a slow, serious white that needs time: open it well in advance, or better yet give it a few years in the cellar.","pairings":"Foie gras above all — the classic match — or lobster in sauce, chicken in a cream sauce, and mature cheeses. Serve at 14°C from a carafe, opened well ahead.","producer_note":"The Joly family has farmed the Coulée de Serrant for generations; Nicolas Joly, who took over in 1977, became the world's most famous champion of biodynamic winemaking. The estate has used no synthetic chemicals since the early 1980s, and produces only about 25,000 bottles a year from the seven-hectare walled vineyard.","photo_credit":"Photo: Vin Malin (vin-malin.fr).","has_photo":true,"also_in":[]},{"id":25,"number":"25","section":"White — France","subsection":null,"title":"Chardonnay — Domaine des Terres de Velle, Corton-Charlemagne Grand Cru 2021","price":"As printed on the menu: 'TERRES DE VELLE' (the estate's verified name is 'Domaine des Terres de Velle')","menu_note":"Bottle $550 (Riviera)","region":"Corton-Charlemagne Grand Cru AOC, Burgundy","grape":"Chardonnay, 100%","producer":"Domaine des Terres de Velle","style":"Mineral, age-worthy grand cru","alcohol":"13%","body":4,"body_label":"Medium-Full","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"white flowers, apple, citrus, stone fruit, salty, precise, lively, harmonious","story":"Corton-Charlemagne is the white Grand Cru of the hill of Corton — red wines from the same hill are labelled Corton — spanning three communes on clay-silt and limestone soils. 2021 was a small, frost-hit vintage that produced fresh, classical whites; the domaine leaned mostly on its Pernand-Vergelesses plots after frost hit its Aloxe-Corton parcel. Fermentation uses natural yeasts and the wine ages up to 18 months in cask — only one new barrel in five, so the oak stays quiet — and is bottled unfiltered. Jasper Morris gave the 2021 a 94/100 from barrel, with a drinking window of 2026–2032; decanting is advisable while it's young.","pairings":"Lobster and crab, foie gras with brioche, blue cheeses, monkfish with citrus cream. Serve at 12–14°C.","producer_note":"The estate of Sophie and Fabrice Laronce in Auxey-Duresses. After learning their trade with Alex Gambal in Beaune, they built up about 6 hectares across some 14 prestigious appellations, practising sustainable viticulture and fermenting with natural yeasts. A rising name rather than an old grand-cru house — which is why this Corton-Charlemagne remains (relatively) attainable.","photo_credit":"Photo: Mon Vin Français (pictured bottle is the 2019; the menu lists 2021)","has_photo":true,"also_in":[]},{"id":26,"number":"26","section":"White — France","subsection":null,"title":"Chardonnay 'Les Chambrées' — Caroline Morey, Chassagne-Montrachet 2022","price":"As printed on the menu: 'CHAMBREES' (the cuvée is properly named 'Les Chambrées')","menu_note":"Bottle $575 (Riviera)","region":"Chassagne-Montrachet AOC, Côte de Beaune","grape":"Chardonnay, 100%","producer":"Domaine Caroline Morey","style":"Precise, mineral white Burgundy, restrained oak","alcohol":"13–13.5%","body":4,"body_label":"Medium-Full","acidity":4,"acidity_label":"Medium-High","tannins":0,"tannins_label":"None","tasting_notes":"citrus, white-fleshed fruit, fine texture, saline minerality, chalky finish","story":"'Les Chambrées' is a village-level Chassagne-Montrachet blended from three vineyard plots, with vines averaging over 40 years old. Fermentation uses natural yeasts in 350-litre barrels, and the wine rests on its spent yeast for 15–20 months; only about a quarter of the barrels are new, so the oak stays in the background and the mineral character leads. It is bottled unfiltered. Expect a classic, age-worthy white Burgundy — precise and saline — at well below premier-cru pricing. No published critic score was found for the 2022, but the cuvée holds a strong 4.4/5 community rating on Vivino.","pairings":"Sea bream with lemon, seared scallops with cauliflower purée, grilled red mullet, roast poultry with cream sauces. Serve at 13°C.","producer_note":"Domaine Caroline Morey is Caroline Morey's own label, started in 2014 in Chassagne-Montrachet. She is married to star winemaker Pierre-Yves Colin-Morey and the two share a winery; her wines are known for a touch less oak and even more minerality than his. The domaine farms about 7 hectares sustainably, and the wines are among the Côte de Beaune's most closely watched.","photo_credit":"Photo: The Wine Wave (pictured bottle is the 2023; the menu lists 2022)","has_photo":true,"also_in":[]},{"id":27,"number":"27","section":"White — France","subsection":null,"title":"Melon de Bourgogne 'Orthogneiss' — Domaine de l'Ecu, Muscadet 2023","price":"As printed on the menu: MELON DE BOURGOGNE, 'ORTHOGNEISS' DOMAINE DE L'ECU, LOIRE VALLEY (2023). The wine's appellation is Muscadet Sèvre et Maine (one retailer lists the 2023 as Vin de France — the estate appears to have declassified recent vintages; the wine and its terroir are the same).","menu_note":"By the glass · $25  /  Bottle $125 (Riviera)","region":"Muscadet Sèvre et Maine, Loire Valley, France","grape":"100% Melon de Bourgogne","producer":"Domaine de l'Ecu (Guy Bossard)","style":"Biodynamic, aged on lees in concrete","alcohol":"12%","body":3,"body_label":"Medium","acidity":5,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"citrus zest, white flowers, ginger, flint, sea salt, chalk, dried almond","story":"This is Muscadet as a terroir wine, not the thin stereotype. Guy Bossard vinifies three cuvées from three different rocks — gneiss, orthogneiss and granite — with identical winemaking so the stone shows through. The grapes are picked by hand, pressed gently, fermented with native yeasts in cool underground concrete vats and left to rest on their lees for months, unfiltered. Salty, tense and elegant, with the structure to age.","pairings":"Oysters, seafood, sole meunière, scallops, spicy prawns, fish curry.","producer_note":"Domaine de l'Ecu is Guy Bossard's estate — a pioneer of organic farming since 1975 and biodynamics since 1998, ploughing by horse and using no chemical products. His rock-separated Muscadets redefined what the appellation can do.","photo_credit":"Photo: Ardor Natural Wines (label shown is the 2018 vintage).","has_photo":true,"also_in":[157]},{"id":28,"number":"28","section":"White — France","subsection":null,"title":"Vin Jaune 'En Spois' — Tissot, Arbois 2012","price":"As printed on the menu: Chardonnay, 'En Spois' Benedict & Stéphane Tissot, Arbois, Jura (2012). Note: the menu's grape listing is an error — vin jaune is made only from Savagnin.","menu_note":"By the glass · $26 (2 oz pour) (Riviera)","region":"Arbois AOC, Jura, France","grape":"100% Savagnin","producer":"Bénédicte & Stéphane Tissot, Arbois","style":"Vin jaune — 6 years 3 months oxidative ageing","alcohol":"","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"walnut, curry powder, fenugreek, dried citrus peel, beeswax, toasted almond, saline","story":"The menu lists this as Chardonnay, but that's an error: vin jaune can by law only be made from Savagnin, the Jura's signature white grape. After fermentation the wine goes into old barrels that are deliberately left unfilled; a natural yeast veil forms on the surface and the wine ages that way — slowly exchanging air — for six years and three months. That's where the unmistakable walnut-and-curry character comes from. Tissot's En Spois is widely regarded as the estate's most elegant. It's bottled in the traditional squat 620 ml clavelin.","pairings":"Comté aged 24 months or more, roast chicken in vin jaune and morel sauce, mushroom risotto, walnut-based dishes, charcuterie, blue cheeses.","producer_note":"Domaine André et Mireille Tissot is now run by Bénédicte and Stéphane Tissot — the family that did more than any other to define modern Jura wine. Stéphane took over in 1990, converted the estate to biodynamics, and built the single-vineyard range of which En Spois, from Arbois' warmest slope, is the most complete vin jaune.","photo_credit":"Photo: Toppers Drinks (label shown is the 2012 vintage).","has_photo":true,"also_in":[167]},{"id":29,"number":"01","section":"White — Italy & Spain","subsection":null,"title":"Grenache Blanc 'Luno Blanc' — Portal del Priorat, Montsant 2024","price":"As printed on the menu: GRENACHE BLANC, 'LUNO BLANC' PORTAL DEL PRIORAT, CATALUNY, SPAIN (2024)","menu_note":"Bottle $100 (Riviera)","region":"Montsant DO, Catalunya, Spain","grape":"Grenache Blanc with Macabeu (2024 blend not published)","producer":"Portal del Priorat","style":"Creamy, lees-aged Mediterranean white; organic/biodynamic","alcohol":"around 13%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"lemon curd, lime zest, white honey, toasted spice, ripe yellow fruit, grainy texture, long brisk finish","story":"Despite the producer's name, the Luno wines come from Montsant — the zone that rings the famous Priorat hills — where high-altitude vineyards on chalky-clay soils keep the whites fresh. Portal del Priorat farms organically and biodynamically and ferments with native yeasts in the cellar, with minimal sulphur. The wine ages on its lees (the spent yeast), which is what builds its creamy, grainy texture without any oak. Note: no published tasting note for the 2024 was found — the profile here reflects the cuvée's established style in earlier vintages.","pairings":"Rich seafood — shellfish, white fish, seafood pasta — spring risottos, roast chicken, grilled pork, hard cheeses and Mediterranean vegetable dishes.","producer_note":"Portal del Priorat is the wine project of Alfredo Arribas, a well-known Spanish architect who turned to farming and winemaking. The estate holds about 150 acres in Priorat and 50 in southern Montsant, with many vines on original rootstock and some parcels approaching a century old. Luno is the entry tier: honest, Mediterranean wines made for the table.","photo_credit":"Photo: 75cl Vins i Més","has_photo":true,"also_in":[]},{"id":30,"number":"02","section":"White — Italy & Spain","subsection":null,"title":"Carricante 'Etna Bianco' — Tornatore, Etna 2023","price":"Bottle $100 (Riviera)","menu_note":"","region":"Etna DOC, Sicily, Italy","grape":"100% Carricante","producer":"Tornatore","style":"Volcanic, mineral, high-acid white; no oak","alcohol":"13.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"green apple, grapefruit, white peach, Mediterranean herbs, menthol lift, pronounced saline minerality, clean mouthwatering finish","story":"Carricante is Etna's signature white grape — late-ripening and naturally high in acid, at its best on the volcano's high, black-lava terraces. Tornatore picks it by hand in mid-October, very late by Italian standards, at about 650 metres above sea level. The grapes are gently pressed, the juice is clarified by chilling it (which lets the sediment settle out), and it ferments slowly at a cool 15–16°C in stainless steel. Three months resting on the fine lees builds texture, and there is no oak at all — the wine is all acidity, sapidity and volcanic minerality.","pairings":"Oysters, raw fish, grilled prawns, seafood risotto, fish pasta, burrata and soft cheeses.","producer_note":"Azienda Agricola Tornatore is a family estate that has been making wine on Mount Etna since 1865 — over 150 years. Based in Castiglione di Sicilia, it farms about 72 hectares of terraced vineyards under winemaker Angelo Di Grazia, with a reputation for faithful, terroir-driven Etna wines at fair prices.","photo_credit":"Photo: Etilika (label shows the 2023 vintage)","has_photo":true,"also_in":[]},{"id":31,"number":"03","section":"White — Italy & Spain","subsection":null,"title":"Verdicchio 'Di Gino' — Fattoria San Lorenzo, Marche 2024","price":"Bottle $100 (Riviera)","menu_note":"","region":"Marche IGT (Castelli di Jesi hills), Marche, Italy","grape":"100% Verdicchio Bianco","producer":"Fattoria San Lorenzo","style":"Natural-leaning, honest, unoaked; organic/biodynamic","alcohol":"13.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"pear, apple, acacia, wisteria, toasted almond, white pepper, buttery lees texture, savoury, mineral","story":"Verdicchio is the signature white grape of the Marche — orchard fruit, bitter-almond notes, a firm mineral spine, and unusual ageability for an Italian white. The Di Gino comes from biodynamically farmed estate vineyards of about 20-year-old vines. It ferments spontaneously with only the grapes' own wild yeasts, goes through malolactic fermentation without ever seeing wood, and ages about six months in steel or concrete (sources differ on the vessel; the point is there is no oak), followed by a short bottle rest. Total sulphur is kept low, under 70 mg/l, and the wine is vegan — no oak, no selected yeasts, nothing to hide behind.","pairings":"Cured meats, savoury pies, fresh cheeses, oily fish, white fish, roast chicken, light salads and vegetable dishes.","producer_note":"Fattoria San Lorenzo is a third-generation family estate in Montecarotto, run by Natalino Crognaletti. He inherited the land from his father Gino — this cuvée's namesake — who inherited it from his father Enrico, a master cooper who spent his life selecting old clones of Verdicchio from ancient vineyards. The estate is fully organic and biodynamic across about 24 hectares, and Natalino's Verdicchios are widely regarded as benchmarks for the natural-leaning side of the Marche, often compared to fine Chablis in their ability to develop.","photo_credit":"Photo: Bernabei","has_photo":true,"also_in":[]},{"id":32,"number":"04","section":"White — Italy & Spain","subsection":null,"title":"Ribolla Gialla+ 'Ribella' — Venchiarezza, Friuli 2024","price":"Bottle $100 (Riviera)","menu_note":"","region":"Venezia Giulia IGT, Collio, Friuli Venezia Giulia, Italy","grape":"Ribolla Gialla + Chardonnay (roughly 50/50)","producer":"Venchiarezza","style":"Natural-leaning, steel, lees-stirred; dry and sapid","alcohol":"12–12.5%","body":2,"body_label":"Light-medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"white flowers, pear, apple, white peach, mineral, faint salinity, dry, fresh and sapid","story":"The menu's '+' is doing real work: this is not a varietal Ribolla Gialla but a blend of the indigenous Ribolla Gialla with Chardonnay, adjusted each year for consistency. The two varieties ripen at different times, so they are harvested and fermented separately. Each is gently crushed and fermented for about 15 days at 18–20°C in stainless steel with its own wild yeasts, then rests on its fine lees for six months with weekly stirring — stirring the settled yeast back into the wine adds texture — before blending. There is no fining, only light filtration, no oak and minimal sulphur.","pairings":"Sushi, crudo, ceviche, shellfish, aperitivo white with antipasti, fresh cheeses, salads and light vegetable dishes.","producer_note":"Venchiarezza is a small estate in Capriva del Friuli in the Collio hills, run in an avowedly natural, low-intervention spirit — its materials speak of an 'integral wine concept' and the branding is playful and anti-establishment. 'Ribella' — a riff on 'ribolla' and 'bella' — is its still white flagship, a glocal blend of a Friuli native with Chardonnay.","photo_credit":"Photo: LQRS","has_photo":true,"also_in":[48,156]},{"id":33,"number":"05","section":"White — Italy & Spain","subsection":null,"title":"Viura+ 'La Nave' — Laventura (MacRobert & Canals), Rioja 2023","price":"As printed on the menu: VIURA+, 'LA NAVE' LAVENTURA, MAC ROBERT & CANALS, RIOJA, SPAIN (2023)","menu_note":"Bottle $105 (Riviera)","region":"Rioja DOCa, Spain","grape":"65% Viura, 35% Garnacha Blanca","producer":"Laventura (MacRobert & Canals)","style":"Unoaked, lees-aged new-wave Rioja Blanco","alcohol":"12.73%","body":2,"body_label":"Light-medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"citrus, green fruit, roasted nuts, orchard fruit, lively acidity, savoury lees texture, clean mouthwatering finish","story":"Rioja's whites have quietly been reinvented in the last decade, moving away from heavily oaked, oxidative styles toward fresher, vineyard-driven wines — and La Nave is made in that new-wave spirit. Viura (Rioja's classic white workhorse) brings freshness and citrus; Garnacha Blanca adds weight and texture. The wine ages on its lees, which gives it breadth and a slight savoury grip with no oak influence at all. The estate's philosophy is clean and fresh: less extraction, less contact with air, larger vessels to minimise oak impact. Menu note: the producer styles the name 'MacRobert & Canals' — the family name of founder Bryan MacRobert.","pairings":"White fish, seafood and steamed shellfish, risottos and rice dishes, pasta, salads and cured cheeses.","producer_note":"Laventura is the Rioja project of Bryan MacRobert — a former 'Young Gun' of the South African wine scene — and his wife Clara Canals, making new-wave wines from very old, organically and dry-farmed vines. The range is unusual for Rioja in focusing on single-varietal bottlings, with La Nave ('the ship') as the white blend of the range. Their style is praised by The Wine Advocate's Luis Gutiérrez: old vines, minimal intervention, letting Rioja's traditional varieties speak without the heavy oak of the old school.","photo_credit":"Photo: BodeBoca (label shows the 2020 vintage)","has_photo":true,"also_in":[]},{"id":34,"number":"06","section":"White — Italy & Spain","subsection":null,"title":"Trebbiano — Tenuta di Capezzana, Toscana 2023","price":"Bottle $110 (Riviera)","menu_note":"","region":"Toscana IGT, Carmignano, Tuscany, Italy","grape":"100% Trebbiano Toscano","producer":"Tenuta di Capezzana","style":"Textured, serious Trebbiano; steel ferment, malolactic and ageing in large French oak tonneaux","alcohol":"≈ 14%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"almond, yellow flowers, vanilla, ripe orchard fruit, subtle spice, harmonious and soft, long clean finish","story":"Trebbiano is often dismissed as a neutral blending grape, but Capezzana has been proving since 2000 that it can make a serious, ageworthy white. The must comes from strict vineyard selection: short pruning, thinning out unripe bunches while still green (green harvesting), and a late harvest in mid-October to concentrate flavour. Fermentation runs about 10 days in stainless steel at 18°C; then the wine goes through malolactic fermentation — the second fermentation that softens sharp acidity into a rounder texture — in large French oak tonneaux. The wood is used for texture, not flavour: this is not an oaky white. The wine is certified organic.","pairings":"Soups, rice dishes, Parmigiana di Melanzane, creamy pasta, risotto, roast poultry, soft and medium cheeses, vegetable gratins.","producer_note":"Tenuta di Capezzana is one of the historic estates of Carmignano, owned by the Contini Bonacossi family and known above all for its Carmignano DOCG reds and Vin Santo, with bottles in the estate cellars going back to 1925. The decision in 2000 to bottle a varietal Trebbiano was a statement of intent: that the estate's white grape, farmed with the same seriousness as its Sangiovese, deserved its own label.","photo_credit":"Photo: Oltrevino (source photo from a 2019 vintage listing)","has_photo":true,"also_in":[]},{"id":35,"number":"07","section":"White — Italy & Spain","subsection":null,"title":"Vermentino+ 'Casamatta Bianco' — Bibi Graetz, Toscana 2023","price":"Bottle $115 (Riviera)","menu_note":"","region":"Toscana IGT (Maremma coast), Tuscany, Italy","grape":"Vermentino-led blend (about 60% Vermentino, 30% Trebbiano, 10% Ansonica per the importer)","producer":"Bibi Graetz","style":"Bright, crunchy, saline easy-drinking white; steel only","alcohol":"12.5–13.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"pineapple, citrus, Mediterranean herbs, fresh flowers, salty, pear, exotic fruit, clean refreshing finish","story":"This is the coastal Maremma bottling — warm, maritime country between Monte Argentario and Capalbio — though note Bibi Graetz also m
