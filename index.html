' is Vietti's 'Barolo classico' — a blend from small vineyards across several Barolo municipalities rather than a single cru. Blending across communes is actually the old Barolo tradition, predating the single-vineyard craze, and Vietti treats it with full seriousness: each parcel is fermented and aged separately for around 30 months in oak casks and barriques before the final blend, which gives the harmony and completeness that only blending can. Two things to know: 2021 is a near-perfect, classic Barolo vintage (reviewers found the Castiglione 'approaching the level of the crus'), and from this vintage the name 'Castiglione' moves to the back label — the front simply reads 'Vietti Barolo'. The wine in the bottle is the same Castiglione blend.","pairings":"Braised beef, brasato al Barolo, agnolotti del plin, tajarin with porcini or truffle, roasted game, osso buco, and mature cheeses. Give it air — decant 1–2 hours — and serve at 16–18°C.","producer_note":"Vietti is one of Barolo's historic and most decorated estates, based in Castiglione Falletto. Founded in 1919 by Mario Vietti, it was shaped over decades by Alfredo Currado and Luciana Vietti — pioneers of single-vineyard Barolo and of the artist-label series — and today the winemaking is led by Luca Currado. In 2016 the estate was acquired by the American Krause family, with the family and team continuing. Vietti's single-cru Barolos are among the Langhe's most collected wines; Castiglione is the multi-vineyard calling card of the range.","photo_credit":"Photo: ArtiVin","has_photo":true,"also_in":[]},{"id":123,"number":"25","section":"Red — Italy","subsection":null,"title":"Sangiovese 'Le Trame' — Le Boncie, Toscana 2021","price":"Bottle $245 (Riviera)","menu_note":"","region":"Toscana IGT (Chianti Classico zone — Castelnuovo Berardenga), Italy","grape":"Sangiovese with historic Tuscan varieties (Colorino, Mammolo, Foglia Tonda, Ciliegiolo)","producer":"Podere Le Boncie (Giovanna Morganti)","style":"Pure, no-new-oak Sangiovese — “ferociously elegant”","alcohol":"14%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":4,"tannins_label":"High","tasting_notes":"Morello cherry, black tea, liquorice, dry earth, leather, iron-y nuance, fresh acidity","story":"From a three-hectare artisan estate in the Berardenga, the southern, warmer corner of Chianti Classico. Giovanna Morganti deliberately bottles it as IGT Toscana rather than Chianti Classico — declassified in the “Super Tuscan” tradition — with no new oak, so it’s Sangiovese in its purest form. Hand-harvested, fermented in open-top wooden vats, farmed biodynamically. The 2021 scored 98 from Antonio Galloni and landed at #11 in Vinous’s first-ever Top 100 Wines of the Year. “Le Trame” means “the intrigues” — a nod to the wheeling and dealing it took to buy the land.","pairings":"Pappardelle with wild-boar ragù, grilled goose or duck, bistecca, tomato-based pastas, aged pecorino, cured meats. Decant before serving.","producer_note":"Run by Giovanna Morganti with her husband Giorgio Serao — one of Tuscany’s most talked-about young vignerons, championing historic Tuscan varieties. About 1,000 cases a year; Galloni calls it potentially “Italy’s next superstar estate”.","photo_credit":"Photo: Bevingrosso, Italian wine retailer. Pictured label shows the 2021 vintage.","has_photo":true,"also_in":[]},{"id":124,"number":"26","section":"Red — Italy","subsection":null,"title":"Nebbiolo 'La Tartufaia' — Giulia Negri, La Morra, Barolo 2021","price":"Bottle $250 (Riviera)","menu_note":"","region":"Barolo DOCG, commune of La Morra (Brunate + Serradenari parcels, ~460 m)","grape":"100% Nebbiolo","producer":"Giulia Negri ('Barolo Girl' / 'Barologirl')","style":"Contemporary-traditional: 40-day maceration, 24 months in large Slavonian oak casks","alcohol":"14.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"rose petal, red currant, blood orange, ripe cherry, raspberry, sandalwood, mocha, liquorice, white pepper, forest floor","story":"'La Tartufaia' means 'the truffle ground' — the vineyard lies between the historic Barolo slopes and the forests where white truffles are hunted each autumn. The wine blends two La Morra parcels: Brunate, with 40-year-old vines in one of Barolo's great historic crus, and the younger Serradenari vines. La Morra sits on the western, sandy side of the Barolo zone, whose wines are typically the most perfumed and elegant — rose, red fruit and silk rather than power. Giulia Negri calls this her 'most La Morra' Barolo: supple, precise and fruit-driven, with her Burgundian sense of perfume and transparency over extraction. Decanter called it the best value and most approachable wine in the range (93 points).","pairings":"Made for the table: truffle dishes (tagliolini al tartufo bianco in season), mushroom risotto, roasted or braised meats, rack of lamb, pigeon, herb-seasoned veal, and aged cheeses. Decant an hour; serve at 16–18°C.","producer_note":"Giulia Negri — 'Barolo Girl' — farms six hectares at Serradenari ('silver hill') in La Morra, where her family has made wine for 150 years. After working in Burgundy she returned home to make her own wines, starting the estate in 2004, and built a reputation for elegance and precision; her Barolos are imported to the US by Kermit Lynch Wine Merchant. Production is about 40,000 bottles a year.","photo_credit":"Photo: Primal Wine","has_photo":true,"also_in":[]},{"id":125,"number":"27","section":"Red — Italy","subsection":null,"title":"Sangiovese — Máté, Brunello di Montalcino 2020","price":"As printed on the menu: \"MATE\" — the producer’s correct name is Máté (with the accent).","menu_note":"Bottle $250 (Riviera)","region":"Brunello di Montalcino DOCG, Tuscany, Italy","grape":"100% Sangiovese (old vines, 4.5 hectares)","producer":"Máté (Ferenc Máté), south-west Montalcino","style":"Opulent, rounded, polished Brunello; 36 months in tonneaux","alcohol":"14.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"sweet cherry, blackcurrant, pomegranate, mint, balsamic, wild herbs, liquorice","story":"The Montalcino estate of Hungarian-born, Canadian-raised writer Ferenc Máté — author of the bestselling Tuscan memoirs “The Hills of Tuscany” and “A Vineyard in Tuscany” — who bought and restored a crumbling 13th-century friary in south-west Montalcino in the early 2000s. The vineyards are farmed organically at high density with severe pruning for low yields. The Brunello comes from the oldest Sangiovese parcels and spends 36 months maturing in tonneaux (large oak casks), giving an opulent, rounded, polished style. 94 points from James Suckling for the 2020.","pairings":"Grilled lamb or beef, bistecca, rich stews, wild-boar ragù, mushroom risotto, aged pecorino, dark-chocolate desserts. Serve at 18–20°C; decant if opened before 2028.","producer_note":"A small, fully organic, family-run property of Ferenc Máté and his artist wife Candace — about 7 hectares of vines amid Mediterranean woods, with Merlot, Cabernet Sauvignon and Syrah alongside Sangiovese. The single-vineyard “Veltha” tête de cuvée comes from just two hectares in tiny quantities (about 2,000 bottles).","photo_credit":"Photo: Berry Bros. & Rudd Japan.","has_photo":true,"also_in":[]},{"id":126,"number":"28","section":"Red — Italy","subsection":null,"title":"Nebbiolo 'Campo Quadro' — Punset, Barbaresco Riserva 2016","price":"Bottle $250 (Riviera)","menu_note":"","region":"Barbaresco Riserva DOCG, Neive — Campo Quadro parcel within the San Cristoforo cru","grape":"100% Nebbiolo (14–14.5%)","producer":"Punset — Marina Marcarino, biodynamic; Italy's first certified-organic winery","style":"Riserva: min. 50 months ageing; this wine in French barriques and tonneaux","alcohol":"≈ 14%","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":4,"tannins_label":"High","tasting_notes":"crushed wild strawberry, smoky cherry, rose petal, dark chocolate, sweet spice, leather, tobacco, truffle","story":"'Campo Quadro' — the squared field — is a single one-hectare parcel within the San Cristoforo cru at Neive, one of the highest and rockiest plots in the area, producing only about 12,000 bottles. Because it is a Riserva, the wine aged for over four years before release (Barbaresco Riserva rules demand a minimum of 50 months). The winemaking is deliberately hands-off: wild yeasts, over three weeks on the skins, no pressing of the skins. Punset's biodynamics are unusually thorough — the vineyards are kept permanently green with minimal machinery and tiny doses of copper and sulphur, so wildflowers, insects and small animals have returned to the vineyard. The estate believes that living ecosystem is what gives the wines their energy. The 2016 is a benchmark vintage: structured, fresh and long-lived.","pairings":"Slow-braised beef shanks, roasted wild boar, black-truffle risotto, grilled ribeye, osso buco, and mature hard cheeses such as aged Parmigiano-Reggiano. Serve at 18–20°C; decant well — this is a structured Riserva still unfolding.","producer_note":"Punset is the Neive estate of Marina Marcarino, whose family has farmed these vineyards for generations. 'Punset' is Piedmontese dialect for 'beautiful hill'. In the 1980s Marina converted the estate to organic farming, making Punset the first certified-organic winery in Italy, and later embraced biodynamics. The 17-hectare vineyard is kept green with minimal mechanisation. The wines are imported to the US by Regal Wine Imports and to Ontario by Nicholas Pearce Wines.","photo_credit":"Photo: Tannico","has_photo":true,"also_in":[]},{"id":127,"number":"29","section":"Red — Italy","subsection":null,"title":"Nebbiolo — Giovanni Canonica, Barolo del Comune di Grinzane Cavour 2022","price":"As printed on the menu: \"BAROLO DEL COMMUNE DI GRINZANE CAVOUR\" — the correct spelling is Comune.","menu_note":"Bottle $400 (Riviera)","region":"Barolo DOCG — Grinzane Cavour, Piedmont, Italy","grape":"100% Nebbiolo","producer":"Giovanni Canonica, village of Barolo","style":"Radically traditional, hands-off Barolo: long skin contact, aged in large old oak vats","alcohol":"≈ 14–14.5%","body":4,"body_label":"Full","acidity":4,"acidity_label":"High","tannins":4,"tannins_label":"High","tasting_notes":"dark cherry, blackberry, plum, rose, violet, spice, earth, blood orange","story":"This is the darker, more powerful of Canonica’s two single-vineyard Barolos, from the eastern side of the zone. The grapes ferment with wild yeasts and no temperature control, sitting on their skins for 30–40 days, then the wine ages up to four years in large old Slovenian oak casks. He avoids added sulphur and never filters or fines, and in the vineyard he doesn’t even plough. The result is ultra-pure, aromatic Nebbiolo in the old peasant style — and only a few thousand bottles are made, which is what the price reflects.","pairings":"Roasted and braised red meats, game, truffle and mushroom dishes, aged cheeses. A wine this concentrated wants hearty food and a long decant.","producer_note":"Giovanni Canonica is a cult figure of traditional Barolo, working from a tiny cellar beneath his family’s bed and breakfast in the village of Barolo. Under four hectares in total, about 10,000 bottles a year — half of it spoken for by Japan, and it sells out on release. His no-sulphur, big-cask traditionalism has made him legendary among Piedmont obsessives.","photo_credit":"Photo: Kawata Saketen, Japanese wine retailer. Pictured label shows the 2020 vintage; the listed wine is 2022.","has_photo":true,"also_in":[]},{"id":128,"number":"30","section":"Red — Italy","subsection":null,"title":"Merlot 'Galatrona' — Petrolo, Val d'Arno di Sopra, Toscana 2021","price":"Bottle $550 (Riviera)","menu_note":"","region":"Val d'Arno di Sopra DOC, Tuscany (cool, forested Galatrona vineyard)","grape":"100% Merlot","producer":"Fattoria Petrolo — Luca Sanjust, certified organic","style":"18–20 months in French oak tonneaux and barriques (~25–40% new)","alcohol":"14%","body":5,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":4,"tannins_label":"High","tasting_notes":"blueberry, blackberry, black cherry, lavender, fresh flowers, sandalwood, chocolate, tobacco, leather, spice","story":"Often called the 'Pétrus of Tuscany', Galatrona is one of Italy's most celebrated wines. It comes from a cool, elevated, forested vineyard where Merlot ripens slowly, developing floral lift and mineral tension that the variety rarely shows — polished and powerful without any heaviness. The 2021 was reviewed at 98 points (James Suckling) and 97 (Wine Advocate): 'an especially understated, refined edition of Galatrona'. It is built for decades — drinkers suggest best from 2027 onward — and it helped put its little-known appellation on the map.","pairings":"Grilled and roasted red meats, wild-boar ragù, beef tenderloin, game, mushroom dishes, aged hard cheeses, and dark-chocolate desserts. Decant 1–2 hours; serve at 18°C.","producer_note":"Fattoria Petrolo, near Arezzo, is the definition of a cult Tuscan winery. Owner and winemaker Luca Sanjust created Galatrona in 1994 — and in the estate's formative years worked with the late Denis Durantou of Pomerol's L'Eglise Clinet, whose schooling shows in the wine's creamy, finely-knit tannins. The estate is certified organic and its wines are imported to the US by Vintus; library vintages are highly sought-after at auction.","photo_credit":"Photo: Winefully (pictures a 2015 magnum; the listed vintage is 2021, 750 ml)","has_photo":true,"also_in":[]},{"id":129,"number":"31","section":"Red — Italy","subsection":null,"title":"Sangiovese — Biondi-Santi, Tenuta Greppo, Brunello di Montalcino 2018","price":"Bottle $700 (Riviera)","menu_note":"","region":"Brunello di Montalcino DOCG, Tuscany, Italy","grape":"100% Sangiovese Grosso (historic Biondi-Santi clone)","producer":"Biondi-Santi, Tenuta Greppo, Montalcino","style":"The estate that invented Brunello — aged 3 years in Slavonian oak; Burgundian in elegance","alcohol":"13.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":4,"tannins_label":"High","tasting_notes":"wild rose, dark spice, eucalyptus, red cherry, blood orange, cranberry, dried herbs, saline mineral","story":"The legendary estate that created Brunello di Montalcino: Clemente Santi pioneered the Sangiovese Grosso selection in the 1800s, and his grandson bottled the first wine ever called “Brunello” from the 1888 vintage. The 2018 Annata ages three years in Slavonian oak barrels, and comes from a cooler, rainier vintage — reviewers call it Burgundian in its elegance and aromatic lift. The estate stayed in family hands for nearly two centuries until the French group EPI (owners of Charles Heidsieck Champagne) acquired it in 2016. 96 points from both Wine Advocate and Jeb Dunnuck; the list’s prestige Brunello.","pairings":"Slow-braised wild-boar ragù over pappardelle, roasted game, bistecca, osso buco, porcini preparations, mature cheeses. Decant an hour; serve at 18–20°C.","producer_note":"Tenuta Greppo sits at about 500 metres in Montalcino; total estate production is around 70,000 bottles a year, including the Brunello Riserva (only in great vintages) and a Rosso di Montalcino “Facelles”. The 2018 is the first vintage made entirely by the new team under CEO Giampiero Bertolini and technical director Federico Radi, with the house finesse scrupulously preserved.","photo_credit":"Photo: Tuscany and Taste, UK wine retailer.","has_photo":true,"also_in":[]},{"id":130,"number":"32","section":"Red — Italy","subsection":null,"title":"Nebbiolo — Viberti, Langhe 2023","price":"By the glass · $28  /  Bottle $140 (Riviera)","menu_note":"","region":"Langhe DOC, Piedmont, Italy","grape":"100% Nebbiolo","producer":"Viberti Giovanni, Barolo","style":"Fresh, early-drinking “baby Barolo”","alcohol":"≈ 14%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"red cherry, raspberry, dried rose, tar, anise, dried herbs, a touch of earth","story":"This is Nebbiolo made for drinking now, not cellaring. The grapes grow on hills around the village of Vergne, in Barolo country. Instead of the long oak ageing Barolo gets, this wine ferments cool and rests in stainless steel and big neutral vats, keeping its fresh red fruit and floral aromas. You still get classic Nebbiolo character — rose, cherry, bright acidity, firm tannins — at a fraction of Barolo's price.","pairings":"Mushroom risotto, tomato pasta, grilled meats, hard cheeses — anything savoury with enough richness to meet the tannin.","producer_note":"Family estate in the village of Barolo since the early 1900s — innkeeper Antonio Viberti bought the Al Buon Padre inn with its farm and poured his own wine in the trattoria. Third generation today; the trattoria still runs.","photo_credit":"Photo: Nicks Wine Merchants (label shown is the 2015 vintage).","has_photo":true,"also_in":[108,163]},{"id":131,"number":"01","section":"Red — Rest of Europe","subsection":null,"title":"Tempranillo 'Biberius' — Bodegas Comenge, Ribera del Duero 2023","price":"Bottle $90 (Riviera)","menu_note":"","region":"D.O. Ribera del Duero, Castilla y León, Spain","grape":"100% Tempranillo","producer":"Bodegas Comenge, Curiel de Duero","style":"Young, juicy, lightly oaked “roble”","alcohol":"14–14.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":2,"tannins_label":"Low","tasting_notes":"cherries, raspberries, blueberries, vanilla, chocolate, caramel, liquorice, scrubland herbs","story":"Biberius is the estate's youngest wine (first made 2008) and a “roble” — just three to five months in used French and American oak, rather than a full crianza, so the fruit stays front and centre. The name honours Emperor Tiberius, who campaigned on the Duero and was nicknamed “Biberius” — “drinker of wines” — by his troops for his passion for the region's wines. Fermented with the winery's own yeast, isolated from their vineyards: bright, juicy and lively, built for immediate drinking — tapas territory.","pairings":"Made for tapas and casual dining: charcuterie, white meats, roast chicken, empanadas and cured or semi-cured cheeses; its juicy acidity handles tomato dishes and grilled vegetables.","producer_note":"Comenge is a family winery in Curiel de Duero working its own organically farmed estate vineyards plus selected traditional growers, fermenting with a house yeast isolated from their vines in 2004. Beyond Biberius, the range includes the Comenge El Origen crianza and a Rueda Verdejo.","photo_credit":"Photo: Luxury Shop Wines.","has_photo":true,"also_in":[]},{"id":132,"number":"02","section":"Red — Rest of Europe","subsection":null,"title":"Garnacha 'Botijo Rojo' — Bodegas Frontonio, Valdejalón 2023","price":"Bottle $90 (Riviera)","menu_note":"","region":"IGP Valdejalón, Aragón, Spain (Épila)","grape":"100% Garnacha, old bush vines","producer":"Bodegas Frontonio","style":"Young, unoaked, fresh “joven”","alcohol":"13.5–14%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"cherries, blackberries, strawberries, black pepper, Mediterranean herbs, floral touch, chalky mineral finish","story":"This is a “joven” — a young wine — but made from serious old vines, 20 to 50 years old, on clay-limestone above 400 metres near Épila. The grapes are hand-picked, fermented in steel and rested for months in concrete vats; no oak touches it, and the farm is certified organic. A botijo is the traditional Spanish clay drinking jug — this is positioned as an honest everyday red, excellent with a light chill.","pairings":"Steak tartare, roast and grilled meats, charcuterie, rice dishes and tapas; its freshness also suits smoked salmon. Serve at 14–16°C, lightly chilled.","producer_note":"Bodegas Frontonio is led by Fernando Mora, one of Spain's few Masters of Wine, with Mario López and Francisco Latasa; their project is widely credited with the Garnacha renaissance in Aragón, and their single-vineyard wines regularly earn 94–99 Parker points. Botijo Rojo (and its white sibling Botijo Blanco) is the friendly entry point.","photo_credit":"Photo: Fine Wines, Switzerland (label pictured is the 2015 vintage; listed vintage is 2023).","has_photo":true,"also_in":[]},{"id":133,"number":"03","section":"Red — Rest of Europe","subsection":null,"title":"Listán Negro — Viñátigo, Tenerife 2024","price":"As printed on the menu: LISTAN NEGRO, VINATIGO, TENERIFE, CANARY ISLANDS (2024). The correct spellings are Listán Negro — Viñátigo.","menu_note":"By the glass · $20  /  Bottle $100 (Riviera)","region":"Tenerife, Canary Islands, Spain","grape":"100% Listán Negro","producer":"Bodegas Viñátigo (Juan Jesús Méndez)","style":"Volcanic red, lightly oak-seasoned","alcohol":"","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":2,"tannins_label":"Low","tasting_notes":"black pepper, dark berries, volcanic mineral, spice, juicy","story":"Listán Negro is the Canaries' own red grape, and the vines here are over 100 years old, ungrafted on their own roots — phylloxera never reached the islands. Grown in ancient lava and ash at 300–700 metres, the grapes are hand-harvested, fermented with native yeasts in tank, then aged three months in old French oak barrels (old enough to season, not flavour). Fresh, spicy and vivid — serve it cool, not warm.","pairings":"Charcuterie, beef stew with boiled potatoes, spicy Asian dishes, seafood paella.","producer_note":"Bodegas Viñátigo was founded in 1990 by Juan Jesús Méndez, a fourth-generation Tenerife winegrower who has spent over 30 years identifying and rescuing the Canary Islands' endangered native grape varieties.","photo_credit":"Photo: Bodega Abierta (label shown is the 2019 vintage).","has_photo":true,"also_in":[159]},{"id":134,"number":"04","section":"Red — Rest of Europe","subsection":null,"title":"Xinomavro 'Shadow Play' — Kamara Estate, Thessaloniki 2020","price":"As printed on the menu: XINOMAVRO, 'SHADOWPLAY', GREECE (2020) — the menu gives no producer; research identifies it as Kamara Estate (Ktima Kamara), Oraiokastro, Thessaloniki.","menu_note":"Bottle $110 (Riviera)","region":"PGI Thessaloniki, Macedonia, Greece","grape":"100% Xinomavro","producer":"Kamara Estate (Ktima Kamara)","style":"Natural, low-intervention, savoury","alcohol":"13.5%","body":4,"body_label":"Full","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"red fruits, plums, black olive, tomato, tobacco, cassis, anise, long finish","story":"Xinomavro is often called the Nebbiolo of Greece — high acidity, firm tannins, and a real capacity to age (its name means roughly “sour black”). This is part of the estate's “Kamara Pure” natural range: organic vineyards, wild-yeast fermentation, no additives, 12 months in old barrels with the spent yeast stirred in, bottled unfiltered with no added sulphites. The label shows Karagiozis, the hero of traditional Greek shadow theatre — the “shadow play” behind the name, chosen as a symbol of authenticity and simplicity.","pairings":"Hunting dishes, rib eye, pork on the spit, grilled lamb, moussaka and aged hard cheeses. Decant.","producer_note":"Kamara Estate was founded in 2010 by Dimitrios Kioutsoukis, a chemical engineer who left the medical field to fulfil his family's winemaking dream, later studying oenology. About 11 hectares near Thessaloniki are farmed organically from the start with old-school methods — hand work, herbal sprays, compost; “Kamara” is the famous Thessaloniki arch.","photo_credit":"Photo: More Natural Wine, UK.","has_photo":true,"also_in":[]},{"id":135,"number":"05","section":"Red — Rest of Europe","subsection":null,"title":"Pinot Noir — Weingut Fred Loimer, Niederösterreich 2023","price":"As printed on the menu: PINOT NOIR, LOIMER, NIEDEROSTERREICH, AUSTRIA (2023) — the producer is Weingut Fred Loimer.","menu_note":"Bottle $115 (Riviera)","region":"Niederösterreich, Austria (Gumpoldskirchen & Langenlois)","grape":"100% Pinot Noir","producer":"Weingut Fred Loimer","style":"Cool-climate, whole-bunch, biodynamic","alcohol":"12.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":2,"tannins_label":"Low","tasting_notes":"raspberry, cherry, wild herbs, damp forest, moss, stony, saline, medicinal-cherry finish","story":"The fruit comes from two cool Austrian sites: Gumpoldskirchen in the Thermenregion (limestone, ripeness) and Langenlois in the Kamptal (cooler, spicy-mineral) — blended for both richness and freshness. The grapes ferment whole-bunch (stems and all) with wild yeasts over three weeks, then rest a year in small oak, six months in big oak and four in steel; bottled unfined, unfiltered, with minimal sulphur — certified organic and vegan. A pure, herbal, red-fruited cool-climate Pinot: give it a brief decant and a cool glass.","pairings":"Roast duck and poultry, mushroom risotto, cured or cedar-plank salmon, charcuterie and soft washed-rind cheeses. Serve at 14–16°C.","producer_note":"Fred Loimer took over the family estate in Langenlois in 1998 and converted it to biodynamics, becoming a founding member of the respekt-BIODYN association. The estate is best known for its Kamptal Grüner Veltliners and Rieslings, but Loimer was also an early champion of serious Austrian Pinot Noir and traditional-method Sekt.","photo_credit":"Photo: Lebendige Weine, Germany (pictured label is the 2023 vintage).","has_photo":true,"also_in":[]},{"id":136,"number":"06","section":"Red — Rest of Europe","subsection":null,"title":"Sousão 'Letra' — ABC Maçanita, Douro 2024","price":"As printed on the menu: SOUSAO+, 'LETRA' ABC MACANITA, DOURO, PORTUGAL (2024) — the producer name “ABC Maçanita” could not be verified against any public source; the wine appears connected to Maçanita Vinhos of the Douro. Correct spelling of the grape is Sousão.","menu_note":"Bottle $120 (Riviera)","region":"Douro DOC, Portugal","grape":"Sousão (menu “+” marks a blend; composition unverified)","producer":"ABC Maçanita (unverified — see note)","style":"Fresh, terroir-driven Douro red (by association)","alcohol":"12.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"deep colour, vivid red and black fruit, peppery spice, firm acidity, velvety, persistent","story":"Sousão is a teinturier grape — its flesh is red, not just its skin — planted widely across the Douro in the late 1700s for deep colour, and prized today because it keeps its acidity even in the valley's hottest years. No technical details could be verified for this 2024 cuvée; by association with the Maçanita cellar style — hand-picked fruit, wild yeasts, gentle handling, old oak — expect a fresh, terroir-driven red rather than an oaky blockbuster. Please check details against the bottle or supplier; this is the thinnest file in the batch.","pairings":"General guidance only: Sousão-based Douro reds typically suit grilled red meats, game and hard cheeses. Verify against the bottle or supplier.","producer_note":"The name “ABC Maçanita” could not be verified against any winery site, retailer or Vivino; the wine appears to belong to the orbit of Maçanita Vinhos, the Douro project founded in 2011 by siblings and winemakers Joana and António Maçanita at Quinta Senhora do Carmo in Covas do Douro. Who or what “ABC” denotes on this label remains unverified and should be checked against the bottle.","photo_credit":"Photo: Astor Wines & Spirits, New York (pictured is Maçanita's “É Sousão ou será Vinhão”, the cuvée this wine is believed to correspond to).","has_photo":true,"also_in":[]},{"id":137,"number":"07","section":"Red — Rest of Europe","subsection":null,"title":"Blaufränkisch — Umathum, Burgenland 2022","price":"As printed on the menu: BLAUFRANKISCH, UMATHUM, BERGENLAND, AUSTRIA (2022) — the correct spelling of the Austrian state is Burgenland.","menu_note":"Bottle $120 (Riviera)","region":"Burgenland, Austria (Lake Neusiedl)","grape":"100% Blaufränkisch","producer":"Weingut Umathum, Frauenkirchen","style":"Classic, biodynamic, savoury red","alcohol":"≈ 13%","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":3,"tannins_label":"Medium","tasting_notes":"dark cherry, blackberry, peppery spice, mineral, earthy depth, firm polished tannins","story":"Burgenland, along Lake Neusiedl, is Austria's most important red-wine region — the shallow lake stores summer heat and ripens reds fully while breezes keep nights cool. Umathum farms biodynamically with hand-picked fruit, ages the wines in wooden barrels, and only releases its top reds after more than three years of cellaring. This is the estate's regional Blaufränkisch: a savoury, mineral-driven wine built for the table, not the ripe, heavily oaked style once fashionable here.","pairings":"Roast game and beef, braised red meats, mushroom dishes and aged hard cheeses; spice suits pepper-crusted preparations.","producer_note":"Weingut Umathum in Frauenkirchen is run by Josef Umathum, a Falstaff Winemaker of the Year and a member of the Renowned Wineries of Burgenland. About 85% of its 30 hectares are planted to Austria's red trio — Zweigelt, St. Laurent and Blaufränkisch — and its wines are known for long, patient ageing before release.","photo_credit":"Photo: Weinimport Korn, Germany.","has_photo":true,"also_in":[]},{"id":138,"number":"08","section":"Red — Rest of Europe","subsection":null,"title":"Garnacha 'Las Uvas de la Ira' — Vitícola Mentridana, D.O. Méntrida 2021","price":"As printed on the menu: GARNACHA, 'UVAS DE LA IRA' VITICOLA MENTRIDANA, SIERRA DE GREDOS, SPAIN (2021) — the cuvée's full name is 'Las Uvas de la Ira' (“the grapes of wrath”), and the wine is D.O. Méntrida, on the eastern edge of the Sierra de Gredos.","menu_note":"Bottle $145 (Riviera)","region":"D.O. Méntrida, Toledo, Spain (El Real de San Vicente)","grape":"100% Garnacha, old bush vines","producer":"Vitícola Mentridana (Curro Barreño)","style":"Precise, mineral mountain Garnacha","alcohol":"14.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"wild strawberries, violets, oregano, cranberry, herbaceous notes, chalky grip, mineral, fine and fresh","story":"The fruit comes from six old bush-vine vineyards on poor granite soils in the Alberche valley, each fermented separately with wild yeasts, then aged 11 months in concrete and big oak. This high, cool corner of Toledo gives Gredos-area Garnacha its celebrated precision — a “Burgundian” poise unusual for the grape: fruity and juicy, but with a chalky mineral grip. 2021 is the first vintage made under Curro Barreño, who took over these vineyards from Comando G's Dani Landi, the estate that put Gredos Garnacha on the map (93 Parker points).","pairings":"Roast lamb, grilled pork and beef, mushroom dishes and charcuterie; its acidity and mineral grip suit tomato-based braises and aged sheep cheeses.","producer_note":"Vitícola Mentridana is the project of Curro Barreño, a Galician native who also co-founded Fedellos do Couto in Ribeira Sacra (see the 'Lomba dos Ares' brief). He took over the Las Uvas de la Ira vineyards in 2021 with the stated aim of capturing maximum freshness, working with native yeasts and a light hand.","photo_credit":"Photo: GVS Weine, Switzerland.","has_photo":true,"also_in":[]},{"id":139,"number":"09","section":"Red — Rest of Europe","subsection":null,"title":"Mencía field blend 'Lomba dos Ares' — Fedellos do Couto, Ribeira Sacra 2021","price":"As printed on the menu: MENCIA, 'LOMBA DOS ARES' FIDELLOS DO COUTO, RIBERA SACRA, SPAIN (2021) — the producer is Fedellos do Couto, and the wine is a co-fermented field blend, not pure Mencía.","menu_note":"Bottle $145 (Riviera)","region":"D.O. Ribeira Sacra, Galicia, Spain (Sil/Bibei canyons)","grape":"Mencía-led field blend (Merenzao, Caiño Tinto & others)","producer":"Fedellos do Couto","style":"Lifted, perfumed, fresh canyon red","alcohol":"≈ 12.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":2,"tannins_label":"Low","tasting_notes":"tart cherry, iron, floral lift, savoury, spice, refreshing acidity, light on its feet, vibrant","story":"The vines grow on vertiginous hand-worked slate terraces in the Sil and Bibei river canyons — “heroic viticulture”, because no machinery can fit on these slopes. All the co-planted grapes (Mencía plus Merenzao, Caiño Tinto and others) are picked and fermented together with wild yeasts; the skins stay in the ferment for 60 days, long but gentle, so extraction stays silky. Then 10 months in big oak foudre, concrete and old barrels, bottled unfiltered with little sulphur: a lifted, perfumed, fresh red — “the essence of Ribeira Sacra” (94+ Parker points).","pairings":"Grilled mushrooms, roast poultry, rice with meat, charcuterie and dishes of contrasting flavours. Serve cool, around 14–16°C.","producer_note":"Fedellos do Couto is the project of Curro Barreño and Jesús Olivares, working old mixed-vineyard terraces across two areas of Ribeira Sacra with resolutely low-intervention methods. Barreño is also behind Vitícola Mentridana's 'Las Uvas de la Ira' (see that brief in this batch).","photo_credit":"Photo: European Cellars (US importer).","has_photo":true,"also_in":[]},{"id":140,"number":"10","section":"Red — Rest of Europe","subsection":null,"title":"Mencía & Palomino 'Beâtum' — Goyo García Viadero, Valle de Liébana 2019","price":"As printed on the menu: MENCIA, 'BEATUM' GOYO GARCIA, VALLE DE LIEBANA, SPAIN (2019) — the cuvée is 'Beâtum' by Goyo García Viadero, and it is a Mencía–Palomino blend, not pure Mencía as the menu line implies.","menu_note":"Bottle $190 (Riviera)","region":"Valle de Liébana, Cantabria, Spain (no D.O.)","grape":"Mencía (~70%) & Palomino Fino (~30%), co-fermented","producer":"Goyo García Viadero","style":"Dark, savoury mountain red; no added sulphites","alcohol":"13.5%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":3,"tannins_label":"Medium","tasting_notes":"cherries in liqueur, blackberries, violets, licorice, rosemary, eucalyptus, mineral, long finish","story":"From 2 hectares of 100-plus-year-old vines in a Cantabrian mountain valley, planted the old northern-Spanish way: red and white grapes mixed together and picked and fermented together. Everything is done delicately and old-fashionedly — hand harvest, wild-yeast ferment, three months' gentle skin contact, then 18 months in decade-old barrels that add texture but no oak flavour. Bottled with no fining, no filtration and no added sulphites: a dark, herbal, slate-inflected mountain red.","pairings":"Roast and braised meats, game, hearty stews and aged cheeses; its earthy, herbal character also suits mushroom dishes and charcuterie. Decant.","producer_note":"Goyo García Viadero — whose family owns Bodegas Valduero in Ribera del Duero — recovers forgotten old vineyards in Cantabria, his mother's home region, working them by hand with no herbicides and no added sulphur. The Beâtum wines (previously called “Cobero”) are imported to the US by José Pastor Selections and sit firmly in the natural-wine world.","photo_credit":"Photo: PrivateCeller.","has_photo":true,"also_in":[]},{"id":141,"number":"11","section":"Red — Rest of Europe","subsection":null,"title":"Garnacha 'Laurel' — Clos Erasmus, Priorat 2021","price":"As printed on the menu: GARNACHA+, 'LAUREL' CLOS ERASMUS, PRIORAT, SPAIN (2021) — the “+” marks a blend: 80% Garnacha, 11% Syrah, 9% Cabernet Sauvignon.","menu_note":"Bottle $265 (Riviera)","region":"DOCa Priorat, Catalonia, Spain (Gratallops)","grape":"80% Garnacha, 11% Syrah, 9% Cabernet Sauvignon","producer":"Clos i Terrasses (Daphne Glorian)","style":"Powerful, mineral, velvety Priorat","alcohol":"14.5%","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":3,"tannins_label":"Medium","tasting_notes":"floral, orange peel, cherry, blueberry, cedar, smoky spice, meaty depth, velvety, long finish","story":"Priorat is one of only two Spanish regions at the top DOCa tier: steep slate terraces, poor soils and old vines give reds of power, minerality and freshness. Laurel is the second wine of the celebrated Clos Erasmus estate, from younger vines farmed biodynamically. The grapes ferment naturally with wild yeasts, then the wine rests 18 months across big oak vats, old French barrels and clay amphorae — built for purity rather than oak — giving a wine the Wine Advocate called super aromatic, floral, delicate and seamless (96 points).","pairings":"Roast lamb, game (venison, wild boar), mushroom and truffle dishes, and aged Manchego. Decant an hour or two.","producer_note":"Daphne Glorian spent her savings on Priorat vineyards in 1988, when the region was a backwater; her flagship Clos Erasmus became one of Spain's most celebrated wines (100 Parker points for the 2020). Laurel is its own wine — a more supple, youthfully expressive take on Priorat from the same biodynamic vineyards.","photo_credit":"Photo: BottleStork.","has_photo":true,"also_in":[]},{"id":142,"number":"12","section":"Red — Rest of Europe","subsection":null,"title":"Tempranillo Reserva — Remírez de Ganuza, Rioja Alavesa 2016","price":"As printed on the menu: TEMPRANILLO+, 'REMEREZ DE GANUZA' REMIREZ DE GANUZA, RIOJA ALAVESA RESERVA, SPAIN (2016) — the menu prints “REMEREZ”; the correct spelling is Remírez de Ganuza. The “+” marks a blend: 89% Tempranillo, 9% Graciano, 2% Mazuelo.","menu_note":"Bottle $300 (Riviera)","region":"DOCa Rioja, Rioja Alavesa, Spain (Samaniego)","grape":"89% Tempranillo, 9% Graciano, 2% Mazuelo","producer":"Bodegas Fernando Remírez de Ganuza","style":"Modern, polished, long-lived Reserva","alcohol":"14.5%","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":3,"tannins_label":"Medium","tasting_notes":"ripe black fruits, red berries, smoky oak, rose petals, creamy caramel, spice, polished, long","story":"The estate's signature trick, used since 1998: they cut off the tips of every bunch and vinify only the riper, more concentrated “shoulders” for the reserva and gran reserva. They were also the first winery in Rioja to use a sorting table (1991) — radical at the time. The Reserva then spends 26 months in French oak barrels, giving a modern, polished, full-bodied Rioja built for the long haul; 2016 was a very good vintage in Rioja.","pairings":"Roast lamb (the classic Rioja pairing), grilled red meats, game and aged cheeses; its polished tannins also suit mushroom and truffle dishes. Decant.","producer_note":"Fernando Remírez de Ganuza founded the winery in 1989 with no winemaking background — he had been a vineyard broker, with an insider's knowledge of Rioja's best terroirs, which he used to assemble top holdings across the Sierra Cantabria foothills. Restless experimentation has made it one of Rioja's most decorated modern estates; enologist Jesús Mendoza was named Best Winemaker in Rioja 2024.","photo_credit":"Photo: BottleHero (pictured label is the 2016 Reserva).","has_photo":true,"also_in":[]},{"id":143,"number":"01","section":"Red — Canada & Rest of World","subsection":null,"title":"Cabernet Franc — Lighthall Vineyards, Prince Edward County 2022","price":"Bottle $100 (Riviera)","menu_note":"","region":"VQA Prince Edward County, Ontario","grape":"100% Cabernet Franc","producer":"Lighthall Vineyards, Milford","style":"Savory, medium-bodied cool-climate red","alcohol":"13.5%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"black cherry, cherry cola, raspberry, blackberry, menthol, eucalyptus, sweet spice","story":"A brooding but fun cool-climate red from one of the County's smallest quality-focused wineries. Lighthall keeps winemaking simple — minimal manipulation, guided by what the vintage gives — and the strong, warm late summer of 2022 let the late-ripening Cabernet Franc reach full ripeness. It is bottled without filtering, so don't be surprised by a little sediment.","pairings":"Roasted chicken, charcuterie, rack of lamb; also duck, mushroom dishes, and aged or blue cheeses.","producer_note":"Small family-run winery in Milford, Prince Edward County, built around low volumes and hands-off winemaking. It is the only winery in the County that makes its own cheese on site — a range of sheep's-milk cheeses designed to pair with the wines.","photo_credit":"Photo: Lighthall Vineyards (label shown is the 2021 vintage).","has_photo":true,"also_in":[]},{"id":144,"number":"02","section":"Red — Canada & Rest of World","subsection":null,"title":"Malbec 'Auténtico' — Bodega Colomé, Valle Calchaquí 2023","price":"As printed on the menu: MALBEC, 'AUTENTICO' COLOME, CALCHAQUI VALLEY, ARGENTINA (2023) — filed under “Rest of Europe” on the menu, as printed here; correct spellings Colomé, 'Auténtico'.","menu_note":"Bottle $115 (Riviera)","region":"Valle Calchaquí, Salta, Argentina (2,300 m)","grape":"100% Malbec","producer":"Bodega Colomé","style":"Big, unoaked, terroir-driven Malbec","alcohol":"14.5%","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":4,"tannins_label":"High","tasting_notes":"black plum, black olive, clove, wild thyme, bramble, salty, smoky, deep and compact","story":"This is a single-vineyard Malbec from 2,300 metres above sea level — among the highest vineyards on earth. The extreme altitude means intense sun (thick skins, deep colour, firm tannins) and cold nights (fresh acidity), with the vines irrigated by Andean snowmelt. It is deliberately made with no wood at all: hand-picked fruit, old-style punch-downs, then 10 months in steel tanks and concrete eggs plus 10 in bottle — a homage to the old owner, who hated oaked wines. 'Auténtico' is meant to be Malbec with no oak makeup (94 points from Suckling and Atkin).","pairings":"Grilled and roasted red meats, stews and venison — a natural partner for Argentina's asado culture. Its concentration also stands up to aged hard cheeses and mushrooms. Decant.","producer_note":"Bodega Colomé, in the upper Calchaquí Valleys of Salta, was established in 1831 and is one of Argentina's oldest working wineries; its vineyards, planted as early as 1854, include some of the country's first Malbec vines brought from France. Today the estate farms from 1,700 to 3,100 metres, and Auténtico is presented as a tribute to the pioneers who planted them.","photo_credit":"Photo: K&L Wine Merchants (label pictured is the 2022 vintage; listed vintage is 2023).","has_photo":true,"also_in":[]},{"id":145,"number":"03","section":"Red — Canada & Rest of World","subsection":null,"title":"Cabernet Sauvignon 'Furie' — Pearl Morissette, Niagara 2023","price":"As printed on the menu: Cabernet Sauvignon — but the 2023 Furie is a red blend of Cabernet Sauvignon, Merlot and Cabernet Franc. The official appellation is VQA Lincoln Lakeshore.","menu_note":"Bottle $120 (Riviera)","region":"VQA Lincoln Lakeshore (Jordan Station), Niagara","grape":"Cabernet Sauvignon, Merlot, Cabernet Franc (red blend)","producer":"Pearl Morissette, Jordan Station","style":"Savory, earthy low-intervention red","alcohol":"13%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"blackcurrant, cherry, tomato leaf, balsamic, game, graphite, clove","story":"One of Ontario's most talked-about low-intervention estates: the fruit ferments with the wild yeasts from the vineyard, sees no new oak, and is bottled without fining or filtering — so expect a little sediment. The result is savory and earthy rather than glossy, more old Bordeaux than Napa. Jamie Goode scored the 2023 93/100. Decant it and serve it with food.","pairings":"Guinea hen, grilled bone-in ribeye, roast game birds, duck, lamb, mushroom dishes, aged hard cheeses.","producer_note":"The Niagara estate of François Morissette, founded on the idea that good winemaking starts in the field, not the cellar. Around 40 organically farmed hectares fermented in concrete and large oak vats with minimal sulfur. Small, allocation-driven production with a cult sommelier following.","photo_credit":"Photo: Opimian (label shows the 2023 vintage).","has_photo":true,"also_in":[]},{"id":146,"number":"04","section":"Red — Canada & Rest of World","subsection":null,"title":"Malbec 'Old Vines' — Versado, Mendoza 2019","price":"As printed on the menu: producer unconfirmed (verified as Versado — the Argentine project of Canadian winemakers Ann Sperling and Peter Gamble).","menu_note":"Bottle $135 (Riviera)","region":"Luján de Cuyo, Mendoza, Argentina","grape":"100% Malbec, own-rooted vines planted 1920","producer":"Versado","style":"Elegant, savory — a Malbec for Bordeaux drinkers","alcohol":"","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"ripe black fruit, violets, cedar, leather, brambleberry, licorice, dried herbs","story":"After a two-year search of more than 200 vineyards, Sperling and Gamble settled on a three-hectare, certified-organic estate on Calle Cobos with Malbec vines planted in 1920 on their own roots — increasingly rare and the source of the wine's finesse. The winemaking is deliberately restrained: elegance and lift over sheer power. VineRoutes ranked the 2019 its #4 red wine of 2024.","pairings":"Grilled ribeye or strip loin, lamb chops, venison, beef empanadas, mushroom dishes, Manchego or aged Cheddar.","producer_note":"The Mendoza project of celebrated Canadian wine couple Ann Sperling — the former longtime winemaker at Niagara's Southbrook Vineyards — and viticulturist Peter Gamble. Production is minuscule, sold in Canada through agents such as Select Wine Merchants.","photo_credit":"Photo: Wines in Niagara.","has_photo":true,"also_in":[]},{"id":147,"number":"05","section":"Red — Canada & Rest of World","subsection":null,"title":"Cabernet Sauvignon 'Blacksmith' — Langmeil, Barossa Valley 2022","price":"Bottle $140 (Riviera)","menu_note":"","region":"Barossa Valley, South Australia","grape":"100% Cabernet Sauvignon","producer":"Langmeil (Lindner family), Tanunda","style":"Generous, polished full-bodied red","alcohol":"14.5%","body":4,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":3,"tannins_label":"Medium","tasting_notes":"blackcurrant, blackberry, plum, black olive, cedar, liquorice, sweet spice","story":"Named for Christian Auricht, the Prussian blacksmith whose forge founded the village of Langmeil in the 1840s. The wine spends two years in French oak (a fifth of it new), then rests under screwcap. It is the Barossa's 'unsung hero' variety done properly — generous and velvety, drinking well now but with the structure to cellar toward 2033.","pairings":"Mushroom risotto, braised beef ribs or cheeks, duck, chargrilled steak, slow-cooked ragù, hard cheeses.","producer_note":"One of the Barossa's heritage wineries, owned by the Lindner family — six generations of Barossa farming. A five-red-star Halliday winery, and home of the famous Freedom vineyard, believed to be the world's oldest surviving Shiraz vineyard (planted 1843).","photo_credit":"Photo: Wijnbroeders (no vintage visible on the label shown).","has_photo":true,"also_in":[]},{"id":148,"number":"06","section":"Red — Canada & Rest of World","subsection":null,"title":"Pinot Noir — Sato Wines, Central Otago 2021","price":"The menu gives no cuvée — this covers the producer and house style; the exact cuvée should be confirmed with the restaurant.","menu_note":"Bottle $150 (Riviera)","region":"Central Otago, New Zealand","grape":"100% Pinot Noir (clone 667, Abel, 115)","producer":"Sato Wines","style":"Delicate, fresh, low-intervention Pinot","alcohol":"Under 14%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":2,"tannins_label":"Low","tasting_notes":"red cherry, raspberry, subtle earth, spice, fresh savory finish","story":"Yoshiaki and Kyoko Sato left twelve-year banking careers to study winemaking, apprenticing at Felton Road and Mount Edward and with vignerons in Burgundy and Alsace. Their Central Otago wines push against the region's usual ripe-and-powerful style: organic farming, no added yeasts, minimal sulfur, almost no new oak, and early picking for freshness. Tiny production — around 2,000 cases — with a quiet cult following. Serve cool.","pairings":"Roast duck, salmon and oily fish, mushroom risotto, roast chicken, Japanese-influenced dishes (dashi, miso, soy).","producer_note":"Founded in 2009 by the Japanese couple Yoshiaki and Kyoko Sato, settled in Central Otago in 2006, now farming their own Mount Pisa vineyard above the cloud layer at 300 metres. Yoshiaki is ambivalent about the 'natural wine' label — the goal is clean, fault-free wine, not funk.","photo_credit":"Photo: Lyndhurst Wine (label shows the 2021 vintage).","has_photo":true,"also_in":[]},{"id":149,"number":"07","section":"Red — Canada & Rest of World","subsection":null,"title":"Cabernet Sauvignon+ 'Poetica' — Southbrook Vineyards, Niagara 2020","price":"As printed on the menu: 'SOUTHBOOK' (the correct spelling is Southbrook Vineyards). The '+' denotes a Cabernet-led Bordeaux blend.","menu_note":"Bottle $155 (Riviera)","region":"Four Mile Creek, Niagara-on-the-Lake, Ontario","grape":"Cabernet-led Bordeaux blend (Cabernet Sauvignon, Cabernet Franc, Petit Verdot)","producer":"Southbrook Vineyards","style":"Savory, structured reserve red","alcohol":"≈13% (community data)","body":4,"body_label":"Full","acidity":4,"acidity_label":"High","tannins":4,"tannins_label":"High","tasting_notes":"blackcurrant, plum, clove, cedar, smoke, dried herbs, mineral streak","story":"Southbrook is Canada's first certified biodynamic winery — its estate is farmed organically, without synthetic sprays, using compost and cover crops, and the reds ferment on their own wild yeasts. Poetica is the winery's top tier, a reserve-level Bordeaux blend built for structure and longevity. It is a food wine, not a cocktail pour: decant it, and give it time in the glass.","pairings":"Ribeye or strip loin, lamb rack or shoulder, venison, beef short ribs; also mushroom dishes and aged hard cheeses.","producer_note":"Founded by Bill and Marilyn Redelmeier in Niagara-on-the-Lake and built around a striking modern winery. Canada's first biodynamic-certified estate; the longtime winemaker behind its rise is Ann Sperling. Wines are tiered Triomphe, Whimsy! and the top Poetica line.","photo_credit":"Photo: WineAlign (label shown is the 2013 vintage).","has_photo":true,"also_in":[]},{"id":150,"number":"08","section":"Red — Canada & Rest of World","subsection":null,"title":"Cabernet Sauvignon — Burrowing Owl, Okanagan Valley 2023","price":"Bottle $155 (Riviera)","menu_note":"","region":"South Okanagan, British Columbia","grape":"Cabernet Sauvignon (small amounts of Merlot, Cabernet Franc)","producer":"Burrowing Owl Estate Winery, Oliver","style":"Powerful, structured, age-demanding red","alcohol":"≈13–14.5%","body":5,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":4,"tannins_label":"High","tasting_notes":"cassis, blackberry, graphite, smoke, dark chocolate, coffee, sagebrush, cedar","story":"One of Canada's cult reds, from the warm desert-like South Okanagan. The cooler 2023 vintage made a more restrained version than usual — both critics agree this needs cellar time (Natalie MacLean, 93 points, suggests 2025–2035) and a two-hour decant if poured now. The wine spends about 18 months in a mix of French, American and Hungarian oak.","pairings":"Prime rib, grilled strip loin or ribeye, venison loin, braised beef short ribs, hard cheeses.","producer_note":"Founded by Jim Wyse — first wines in 1997 — and built by longtime winemaker Bill Dyer into one of British Columbia's original cult wineries. A tight range led by this flagship Cabernet, with a restaurant and guest house on the Oliver estate.","photo_credit":"Photo: Marquis Wines (label shows the 2017 vintage).","has_photo":true,"also_in":[]},{"id":151,"number":"09","section":"Red — Canada & Rest of World","subsection":null,"title":"Pinot Noir 'Haven' — Kooyong, Mornington Peninsula 2019","price":"Bottle $170 (Riviera)","menu_note":"","region":"Mornington Peninsula, Victoria, Australia","grape":"100% Pinot Noir, single Haven block","producer":"Kooyong, Tuerong","style":"Powerful, savory, age-worthy Pinot","alcohol":"13.5%","body":4,"body_label":"Full","acidity":4,"acidity_label":"High","tannins":4,"tannins_label":"High","tasting_notes":"red and black cherry, raspberry, plum, rosemary, mint, cardamom, anise, citrus","story":"Haven is Kooyong's most sheltered vineyard — protected from the peninsula's strong winds, the grapes hang longer and make the estate's richest, most muscular Pinot. Fermented with native yeasts over 18 days and aged 14 months in French oak (a quarter new), bottled without fining or filtering. Serious and savory, built to evolve for years — decant if opening now. Tastingbook gave the 2019 94 points.","pairings":"Roast duck, squab, venison, mushroom and truffle dishes, richer fish (salmon, tuna), charcuterie.","producer_note":"Founded in 1996 at Tuerong and quickly established as one of Australia's leading cool-climate Pinot Noir and Chardonnay producers. Single-block vineyards — Haven, Meres, Ferrous, Faultline, Farrago — are each bottled separately to show their site.","photo_credit":"Photo: Kooyong (via CNA Luxury; no vintage visible on the label shown).","has_photo":true,"also_in":[]},{"id":152,"number":"10","section":"Red — Canada & Rest of World","subsection":null,"title":"Shiraz 'The Freedom 1843' — Langmeil, Barossa Valley 2022","price":"Bottle $260 (Riviera)","menu_note":"","region":"Barossa Valley, South Australia","grape":"100% Shiraz, own-rooted vines planted 1843","producer":"Langmeil (Lindner family), Tanunda","style":"Monumental yet balanced icon red","alcohol":"14.5–15%","body":5,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":4,"tannins_label":"High","tasting_notes":"Satsuma plum, mocha, vanilla, cedar, sweet spice, briary spice, allspice","story":"From a single acre planted in 1843 by founder Christian Auricht — believed to be the oldest surviving Shiraz vineyard in the world. The 2022 Barossa vintage was one of the smallest in fifty years, and the tiny crop gave juice of exceptional concentration. Aged about two years in French oak, this is a wine built for decades, officially recognized in Langton's Classification as 'Outstanding'. Decant well in advance — this is a special-occasion bottle.","pairings":"Dry-aged ribeye or T-bone, venison, lamb shanks, slow-braised beef cheeks, barbecue and smoked meats, aged Cheddar or Parmigiano.","producer_note":"Langmeil sits on the 1842 trading village founded by Prussian blacksmith Christian Auricht; three local families bought and restored the property in 1996 (the Lindner family leads today). A five-red-star Halliday winery, and the Freedom vineyard is the cornerstone of its Old Vine Garden wines.","photo_credit":"Photo: Wine.com (no vintage visible on the label shown).","has_photo":true,"also_in":[]},{"id":153,"number":"11","section":"Red — Canada & Rest of World","subsection":null,"title":"Cabernet Sauvignon 'Sandown' — Clarendon Hills, McLaren Vale 2020","price":"Bottle $265 (Riviera)","menu_note":"","region":"Blewitt Springs, McLaren Vale, South Australia","grape":"100% Cabernet Sauvignon, 1930s-planted own-rooted vines","producer":"Clarendon Hills","style":"Powerful yet refined old-vine single-site red","alcohol":"14%","body":5,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":4,"tannins_label":"High","tasting_notes":"blackcurrant, graphite, slate, earl grey tea, sage, cedar, baking spice, roast meat","story":"A single-site wine from an old-vine patch planted in the 1930s on its own roots — never grafted — and never irrigated. The fruit is hand-picked, fermented with wild yeasts, and aged 18 months in older French oak before bottling without fining or filtering. Deep, savory, and built to cellar; decant if pouring young. The Wine Front gave the 2020 95 points.","pairings":"Dry-aged beef, venison loin, roast lamb, lamb shoulder with fruit, aged hard cheeses.","producer_note":"Founded in 1990 by Roman Bratasiuk, Clarendon Hills pioneered the single-vineyard, old-vine movement in Australia. Minimal-intervention winemaking and tiny production; an early Robert Parker champion. Wines are released with significant bottle age.","photo_credit":"Photo: Clarendon Hills (label shows the 2014 vintage).","has_photo":true,"also_in":[]},{"id":154,"number":"01","section":"By the Glass","subsection":"White","title":"Pinot Gris+ 'Bohem' — Robert Gilvesy, Lake Balaton 2024","price":"As printed on the menu: Pinot Gris+, 'Bohem' Robert Gilvesy, Lake Balaton, Hungary (2024). The '+' is menu shorthand: Bohem is a four-variety blend, not a single-varietal Pinot Gris.","menu_note":"By the glass · $18  /  Bottle $90 (Riviera)","region":"Badacsony, Lake Balaton, Hungary","grape":"Olaszrizling, Riesling, Pinot Gris, Sauvignon Blanc","producer":"Róbert Gilvesy, Szent György Hill","style":"Volcanic white blend, spontaneous ferment","alcohol":"","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"lemon, green apple, white peach, mint, cucumber, caraway, tonic-like edge, sea salt","story":"Despite the menu shorthand, this isn't a single-varietal Pinot Gris — it's a blend of four white grapes grown on Szent György Hill, an ancient dormant volcano with six-million-year-old basalt soils. Fermentation starts spontaneously with native yeasts, then the wine rests six months on its lees in stainless steel — no oak. Light, zesty and a little saline, with a faint spritz and a pleasant bitter edge.","pairings":"Grilled white fish with lemon and herbs, zesty ceviche, fresh garden salads, creamy goat cheese. Serve well chilled.","producer_note":"Róbert Gilvesy founded the winery in 2012 after returning from Canada to his ancestral homeland, building it around the former Esterházy estate on Szent György Hill. Organic cultivation and minimal intervention, aiming to express volcanic soils and native varieties.","photo_credit":"Photo: Gilvesy winery (label shown is the 2024 vintage).","has_photo":true,"also_in":[51]},{"id":155,"number":"02","section":"By the Glass","subsection":"White","title":"Grüner Veltliner — Matthias Hager, Kamptal 2024","price":"As printed on the menu: GRUNER VELTLINER, MATTHIAS HAGER, KAMPTAL, AUSTRIA (2024). The correct spelling is Grüner Veltliner.","menu_note":"By the glass · $20  /  Bottle $100 (Riviera)","region":"Kamptal DAC, Lower Austria","grape":"100% Grüner Veltliner","producer":"Weingut Doris und Matthias Hager, Mollands","style":"Dry, biodynamic, stainless-steel","alcohol":"12.5%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"Granny Smith apple, lime, citrus, white pepper, stone fruit, mineral","story":"This comes from the natural-wine corner of the Kamptal: 30- to 50-year-old vines around the village of Mollands, farmed organically and biodynamically. Fermentation starts on its own with the yeasts that came in from the vineyard, the wine rests in stainless-steel tanks, and no oak touches it. The result is a light, dry, peppery white — best drunk young with food.","pairings":"Freshwater and sea fish, seafood, salads, schnitzel, roast pork, sushi — or on its own as an aperitif.","producer_note":"Weingut Doris und Matthias Hager is a small family estate in Mollands. Where many Kamptal estates keep to tradition, Matthias Hager's mark is biodynamics, hand work and spontaneous fermentations — certified organic and Demeter.","photo_credit":"Photo: Wine-At Japan (label shown is the 2024 vintage).","has_photo":true,"also_in":[55]},{"id":156,"number":"03","section":"By the Glass","subsection":"White","title":"Ribolla Gialla+ 'Ribella' — Venchiarezza, Friuli 2024","price":"As printed on the menu: RIBOLLA GIALLA+, 'RIBELLA' VENCHIAREZZA, FRIULI VENEZIA GIULIA, ITALY (2024). The '+' signals the blend with Chardonnay.","menu_note":"By the glass · $20  /  Bottle $100 (Riviera)","region":"Friuli Venezia Giulia, Italy (IGT Venezia Giulia)","grape":"50/50 Ribolla Gialla + Chardonnay","producer":"Azienda Agricola Venchiarezza","style":"Stainless-steel blend, aged on lees","alcohol":"12%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"white flowers, white peach, citrus, mineral, savory, delicate","story":"'Ribella' is the estate's 'Glocal Blend': Ribolla Gialla, Friuli's own grape documented since the 1200s, married to Chardonnay for body. Each variety is harvested and fermented separately in stainless steel with native yeasts, then the wine rests on its fine lees until spring with weekly stirring — that's what gives this 12%-alcohol white its texture and savoury depth. Not to be confused with 'Ribella & la Bestia', the estate's separate sparkling wine.","pairings":"Sushi, seafood, shellfish, crudo, light pasta, vegetable dishes, fresh cheeses.","producer_note":"Azienda Agricola Venchiarezza is a Friulian estate working in an organic, low-intervention register — indigenous yeasts, minimal additives — and part of the generation reviving Ribolla Gialla from near-extinction.","photo_credit":"Photo: LQRS.","has_photo":true,"also_in":[32,48]},{"id":157,"number":"04","section":"By the Glass","subsection":"White","title":"Melon de Bourgogne 'Orthogneiss' — Domaine de l'Ecu, Muscadet 2023","price":"As printed on the menu: MELON DE BOURGOGNE, 'ORTHOGNEISS' DOMAINE DE L'ECU, LOIRE VALLEY (2023). The wine's appellation is Muscadet Sèvre et Maine (one retailer lists the 2023 as Vin de France — the estate appears to have declassified recent vintages; the wine and its terroir are the same).","menu_note":"By the glass · $25  /  Bottle $125 (Riviera)","region":"Muscadet Sèvre et Maine, Loire Valley, France","grape":"100% Melon de Bourgogne","producer":"Domaine de l'Ecu (Guy Bossard)","style":"Biodynamic, aged on lees in concrete","alcohol":"12%","body":3,"body_label":"Medium","acidity":5,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"citrus zest, white flowers, ginger, flint, sea salt, chalk, dried almond","story":"This is Muscadet as a terroir wine, not the thin stereotype. Guy Bossard vinifies three cuvées from three different rocks — gneiss, orthogneiss and granite — with identical winemaking so the stone shows through. The grapes are picked by hand, pressed gently, fermented with native yeasts in cool underground concrete vats and left to rest on their lees for months, unfiltered. Salty, tense and elegant, with the structure to age.","pairings":"Oysters, seafood, sole meunière, scallops, spicy prawns, fish curry.","producer_note":"Domaine de l'Ecu is Guy Bossard's estate — a pioneer of organic farming since 1975 and biodynamics since 1998, ploughing by horse and using no chemical products. His rock-separated Muscadets redefined what the appellation can do.","photo_credit":"Photo: Ardor Natural Wines (label shown is the 2018 vintage).","has_photo":true,"also_in":[27]},{"id":158,"number":"05","section":"By the Glass","subsection":"White","title":"Chardonnay 'Les Bruchots' — Louis Chenu (Père & Filles), Bourgogne 2023","price":"By the glass · $28  /  Bottle $140 (Riviera)","menu_note":"","region":"Bourgogne AOC, Savigny-lès-Beaune (Hautes Côtes)","grape":"Chardonnay, 100%","producer":"Domaine Louis Chenu Père & Filles","style":"Refined, textured organic white Burgundy","alcohol":"12.5%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"baked apple, lemon flesh, hazelnut, toast, white flowers, citrus, energetic mineral finish","story":"'Les Bruchots' is a 30-year-old Chardonnay plot toward the Hautes Côtes de Beaune, at slight altitude overlooking Savigny-lès-Beaune — a cool site more often associated with reds, which is part of the wine's interest. Certified organic and hand-harvested, it ferments on natural yeasts in old oak barrels (already used two to four times, so they give texture without adding woody flavour) and rests about a year on the spent yeast, which is never stirred — that's what keeps it fresh rather than creamy. Only about 2,500 bottles are made a year.","pairings":"Shellfish, fatty fish, soft and mild cheeses, cold meats. Serve at 10–12°C; open 15–30 minutes before serving.","producer_note":"The estate bought its first vineyard in Savigny-lès-Beaune in 1914; today it is run by Louis Chenu's great-granddaughters Juliette and Caroline Chenu, who have raised quality with an explicit focus on preserving the vineyard's ecosystem. Certified organic, working with natural yeasts throughout, and better known for its Savigny-lès-Beaune reds.","photo_credit":"Photo: Shopify-hosted wine listing (pictured bottle is the 2020; the menu lists 2022)","has_photo":true,"also_in":[]},{"id":159,"number":"01","section":"By the Glass","subsection":"Red","title":"Listán Negro — Viñátigo, Tenerife 2024","price":"As printed on the menu: LISTAN NEGRO, VINATIGO, TENERIFE, CANARY ISLANDS (2024). The correct spellings are Listán Negro — Viñátigo.","menu_note":"By the glass · $20  /  Bottle $100 (Riviera)","region":"Tenerife, Canary Islands, Spain","grape":"100% Listán Negro","producer":"Bodegas Viñátigo (Juan Jesús Méndez)","style":"Volcanic red, lightly oak-seasoned","alcohol":"","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":2,"tannins_label":"Low","tasting_notes":"black pepper, dark berries, volcanic mineral, spice, juicy","story":"Listán Negro is the Canaries' own red grape, and the vines here are over 100 years old, ungrafted on their own roots — phylloxera never reached the islands. Grown in ancient lava and ash at 300–700 metres, the grapes are hand-harvested, fermented with native yeasts in tank, then aged three months in old French oak barrels (old enough to season, not flavour). Fresh, spicy and vivid — serve it cool, not warm.","pairings":"Charcuterie, beef stew with boiled potatoes, spicy Asian dishes, seafood paella.","producer_note":"Bodegas Viñátigo was founded in 1990 by Juan Jesús Méndez, a fourth-generation Tenerife winegrower who has spent over 30 years identifying and rescuing the Canary Islands' endangered native grape varieties.","photo_credit":"Photo: Bodega Abierta (label shown is the 2019 vintage).","has_photo":true,"also_in":[133]},{"id":160,"number":"02","section":"By the Glass","subsection":"Red","title":"Grenache — Domaine du Séminaire, Côtes du Rhône 2024","price":"As printed on the menu: GRENACHE, DOMAINE DU SÉMINAIRE, CÔTES DU RHONE, FRANCE (2024). The appellation is spelled Côtes du Rhône.","menu_note":"By the glass · $22  /  Bottle $110 (Riviera)","region":"Côtes du Rhône AOC, southern Rhône, France (Valréas)","grape":"80% Grenache, 10% Syrah, 10% Carignan","producer":"Domaine du Séminaire (Hervé and Mathilde Pouizin)","style":"Organic, unoaked, concrete-aged red","alcohol":"14%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":2,"tannins_label":"Low","tasting_notes":"raspberry, juicy plum, damson, black pepper, bramble, spice","story":"A deliberately old-fashioned red from Valréas, on the northern edge of the southern Rhône. No oak is used: the wine ferments in the big concrete tanks installed by the family's forebears in 1938, ages 6–9 months in concrete, and is bottled early and unfined with minimal sulfur. The Grenache vines are old, the farming is certified organic — the result is a juicy, peppery, everyday red from a fresher-than-usual vintage.","pairings":"Roast lamb, tagine, lentils with chorizo, charcuterie, barbecued meats, pizza. Serve at 15–17°C.","producer_note":"Domaine du Séminaire is owned by Hervé and Mathilde Pouizin, the fourth generation to farm the slopes above Valréas. The 100-hectare property mixes vines with olive and truffle-oak trees, lavender and forest; Hervé converted the vineyards to organic while keeping the winemaking traditional.","photo_credit":"","has_photo":false,"also_in":[75]},{"id":161,"number":"03","section":"By the Glass","subsection":"Red","title":"Malbec 'Auténtico' — Bodega Colomé, Calchaquí Valley 2023","price":"As printed on the menu: MALBEC, 'AUTENTICO' COLOME, CALCHAQUI VALLEY, ARGENTINA (2023). Correct spellings: 'Auténtico' — Colomé.","menu_note":"Bottle $115 (Riviera)","region":"Valle Calchaquí, Salta, Argentina (2,300 m)","grape":"100% Malbec","producer":"Bodega Colomé","style":"High-altitude, completely unoaked","alcohol":"14.5%","body":5,"body_label":"Full","acidity":3,"acidity_label":"Medium","tannins":4,"tannins_label":"High","tasting_notes":"black plum, black olive, clove, wild thyme, smoky, salty","story":"This is a single-vineyard Malbec grown at 2,300 metres — among the highest vineyards in the world. The intense sunlight and huge day-night temperature swings give thick skins: deep colour, firm tannins, fresh acidity. And there's no oak at all, by design: the fruit is hand-harvested, punched down the old way, aged 10 months in stainless steel and concrete eggs, then 10 months in bottle — a homage to the estate's former owner, who disliked oaked wines.","pairings":"Grilled and roasted red meats, Argentina's asado, stews, venison, aged hard cheeses, mushroom dishes. Decant and serve at 16–18°C.","producer_note":"Bodega Colomé was established in 1831 in the upper Calchaquí Valleys and is one of Argentina's oldest working wineries; its vines, planted from the 1850s, include some of the country's first Malbec and Cabernet Sauvignon brought from France. The estate now farms from 1,700 to 3,100 metres.","photo_credit":"Photo: 8Wines.pl (label shown is the 2020 vintage).","has_photo":true,"also_in":[]},{"id":162,"number":"04","section":"By the Glass","subsection":"Red","title":"Merlot+ 'Le Pievi' — Fabio Motta, Bolgheri, Toscana 2023","price":"As printed on the menu: 'PIEVI' — the label reads 'Le Pievi'. The '+' signals a Merlot-led blend.","menu_note":"By the glass · $27  /  By the glass · $27  /  Bottle $135 (Riviera)","region":"Bolgheri Rosso DOC, Tuscany (single 'Le Pievi' vineyard near the Tyrrhenian sea)","grape":"50% Merlot, 20% Cabernet Sauvignon, 20% Sangiovese, 10% Syrah","producer":"Fabio Motta — small quality-focused estate, founded 2009","style":"Concrete-aged, unfined and unfiltered; fruit and freshness over oak","alcohol":"13.5–14%","body":3,"body_label":"Medium","acidity":3,"acidity_label":"Medium","tannins":2,"tannins_label":"Low","tasting_notes":"cherry, redcurrant, orange zest, red rose, hibiscus, violet, Mediterranean herbs, myrtle, eucalyptus","story":"A Merlot-led blend from Bolgheri, the home of the Super Tuscan, in the warm, sea-breezed corner of the Tuscan coast. Fabio Motta's philosophy is simple — 'the two main ingredients of my wines are fruit and freshness' — and the cellar work follows it: natural yeasts, ageing in unglazed concrete vats rather than new oak, no fining or filtering. What you taste is ripe Mediterranean fruit and savoury herbs, not toast and vanilla. The 2023 scored 96 points from Decanter and 92 from James Suckling — exceptional critical consensus for the price.","pairings":"Grilled red meats, bistecca alla fiorentina, wild boar ragù (pappardelle al cinghiale), roast lamb, aged pecorino and Tuscan salumi, mushroom dishes and hearty tomato-based pasta. Serve at 16–18°C.","producer_note":"Fabio Motta founded his winery in 2009 with four hectares of vines planted in 1997 within the Bolgheri DOC — but he was no newcomer, having spent years working alongside Michele Satta, one of Bolgheri's esteemed pioneering producers, who is both his mentor and his father-in-law. The estate remains small and quality-focused; 'Le Pievi' is its flagship Bolgheri Rosso.","photo_credit":"Photo: Bottle of Italy (pictures the 2022 vintage; the listed vintage is 2023)","has_photo":true,"also_in":[106]},{"id":163,"number":"05","section":"By the Glass","subsection":"Red","title":"Nebbiolo — Viberti, Langhe 2023","price":"By the glass · $28  /  Bottle $140 (Riviera)","menu_note":"","region":"Langhe DOC, Piedmont, Italy","grape":"100% Nebbiolo","producer":"Viberti Giovanni, Barolo","style":"Fresh, early-drinking “baby Barolo”","alcohol":"≈ 14%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":3,"tannins_label":"Medium","tasting_notes":"red cherry, raspberry, dried rose, tar, anise, dried herbs, a touch of earth","story":"This is Nebbiolo made for drinking now, not cellaring. The grapes grow on hills around the village of Vergne, in Barolo country. Instead of the long oak ageing Barolo gets, this wine ferments cool and rests in stainless steel and big neutral vats, keeping its fresh red fruit and floral aromas. You still get classic Nebbiolo character — rose, cherry, bright acidity, firm tannins — at a fraction of Barolo's price.","pairings":"Mushroom risotto, tomato pasta, grilled meats, hard cheeses — anything savoury with enough richness to meet the tannin.","producer_note":"Family estate in the village of Barolo since the early 1900s — innkeeper Antonio Viberti bought the Al Buon Padre inn with its farm and poured his own wine in the trattoria. Third generation today; the trattoria still runs.","photo_credit":"Photo: Nicks Wine Merchants (label shown is the 2015 vintage).","has_photo":true,"also_in":[108,130]},{"id":164,"number":"01","section":"By the Glass","subsection":"Sparkling & Champagne","title":"Xarel·lo 'Mirgin' — Alta Alella, Cava Gran Reserva 2021","price":"As printed on the menu: Xarel-lo, 'Mirgin' Alta Alella, Gran Reserva, Catalunya, Spain (2021). Correct spelling: Xarel·lo. The menu names the lead grape, not the whole blend.","menu_note":"By the glass · $21  /  Bottle $120 (Riviera)","region":"DO Alella / Cava, Catalonia, Spain","grape":"Xarel·lo-led: Xarel·lo, Macabeu, Parellada","producer":"Alta Alella (Pujol-Busquets family)","style":"Brut Nature, 30+ months on lees","alcohol":"12%","body":2,"body_label":"Light","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"green apple, grapefruit, citrus peel, white peach, roasted almond, pastry, sea salt","story":"The menu's 'Xarel-lo' is shorthand for the blend: Xarel·lo leads, with Macabeu and Parellada. The organic grapes are picked by hand and pressed lightly so only the first-press juice is used, then the wine ferments a second time in the bottle. It rests on its lees at least 30 months — the Gran Reserva minimum — and gets no added sugar at the end, so it's bone dry (Brut Nature), with a salty, mineral edge from the estate's sandy granite soils two kilometres from the sea.","pairings":"Oysters, tapas, sushi, lean fish, shellfish, fried foods, salted snacks.","producer_note":"Alta Alella is a family winery founded in 1991 by winemaker Josep Maria Pujol-Busquets and his wife Cristina Guillén, built on organic farming and estate-grown fruit from the start. In 2024 it joined Grandes Pagos de España, the association of Spain's great single estates.","photo_credit":"Photo: Club de Vins (label shown is the 2015 vintage).","has_photo":true,"also_in":[]},{"id":165,"number":"02","section":"By the Glass","subsection":"Sparkling & Champagne","title":"Pinot Noir+ 'Le Chemin du Chemin' — Fresne Ducret, Champagne NV","price":"As printed on the menu: Pinot Noir+, Chemin du Chemin — Fresne Ducret Champagne NV. The cuvée is commonly styled 'Le Chemin du Chemin'; the '+' signals the three-grape blend.","menu_note":"By the glass · $36  /  Bottle $180 (Riviera)","region":"Champagne, France (Premier Cru, Montagne de Reims)","grape":"40–45% Pinot Noir, 30–35% Chardonnay, 25% Meunier","producer":"Champagne Fresne Ducret (Pierre Fresne), Villedommange","style":"Extra Brut grower Champagne","alcohol":"≈ 12%","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"apricot, fresh bread, brioche, hazelnut, pineapple, citrus zest, jasmine tea","story":"This is a grower Champagne — made by the family that grew the grapes, not a big house — from four Premier Cru parcels on the Montagne de Reims. Pinot Noir leads the blend, but Chardonnay and Meunier complete it; the '+' on the menu marks exactly that. Only the first-press juice is used, the wine rests on its lees for at least five years, and it gets a low dose of sugar at the end (that's what Extra Brut means). Ripe and toasty, yet precise and energetic.","pairings":"Oysters, sea urchins, razor clams, seared scallops, white fish in cream sauce, green asparagus with Parmesan — or as an aperitif.","producer_note":"Champagne Fresne Ducret is a récoltant-manipulant — a grower-producer making Champagne from its own fruit — based in Villedommange, where the family has lived for generations. Pierre Fresne has led the house since 2007 with his wife, farming about six hectares of Premier Cru vines with indigenous yeasts.","photo_credit":"Photo: Liner & Elsen.","has_photo":true,"also_in":[]},{"id":166,"number":"01","section":"By the Glass","subsection":"Rosé","title":"Cinsault+ 'Love' — Léoube, Côtes de Provence 2025","price":"As printed on the menu: Cinsault+, 'Love' Leoube, Cotes de Provence, France (2025). The '+' signals a four-grape blend led by Grenache.","menu_note":"By the glass · $20  /  Bottle $100 (Riviera)","region":"Côtes de Provence AOC, France (Mediterranean coast)","grape":"53% Grenache, 40% Cinsault, 5% Syrah, 2% Mourvèdre","producer":"Château Léoube (winemaker Romain Ott)","style":"Pale, dry, organic rosé","alcohol":"12.5%","body":2,"body_label":"Light","acidity":3,"acidity_label":"Medium","tannins":0,"tannins_label":"None","tasting_notes":"red berries, mandarin, white peach, citrus, white flowers, saline","story":"The 'Cinsault+' on the menu is shorthand: the 2025 blend is actually led by Grenache, with Cinsault as the second-largest share. The estate is certified organic; the grapes are hand-harvested, pressed directly and fermented in temperature-controlled stainless-steel tanks — dry, pale and unoaked. From a coastal estate cooled by sea breezes, so the finish has a lightly salty edge.","pairings":"Tuna tataki, ceviche, grilled prawns, oysters, seafood tower, burrata with peach and basil, antipasti — or on its own as an aperitif.","producer_note":"Château Léoube is a prestigious organic estate on the Var coast owned by the Bamford family. Winemaker Romain Ott, of the renowned Ott family of Provence, created Love by Léoube as a modern, youthful expression of classic Provence rosé.","photo_credit":"Photo: Centaurus International.","has_photo":true,"also_in":[193]},{"id":167,"number":"01","section":"By the Glass","subsection":"Vin Jaune","title":"Vin Jaune 'En Spois' — Tissot, Arbois 2012","price":"As printed on the menu: Chardonnay, 'En Spois' Benedict & Stéphane Tissot, Arbois, Jura (2012). Note: the menu's grape listing is an error — vin jaune is made only from Savagnin.","menu_note":"By the glass · $26 (2 oz pour) (Riviera)","region":"Arbois AOC, Jura, France","grape":"100% Savagnin","producer":"Bénédicte & Stéphane Tissot, Arbois","style":"Vin jaune — 6 years 3 months oxidative ageing","alcohol":"","body":3,"body_label":"Medium","acidity":4,"acidity_label":"High","tannins":0,"tannins_label":"None","tasting_notes":"walnut, curry powder, fenugreek, dried citrus peel, beeswax, toasted almond, saline","story":"The menu lists this as Chardonnay, but that's an error: vin jaune can by law only be made from Savagnin, the Jura's signature white grape.
